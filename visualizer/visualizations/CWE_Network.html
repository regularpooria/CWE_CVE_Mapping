 with Inconsistent Implementations"],["url","https://cwe.mitre.org/data/definitions/474.html"],["type","child"],["description","The code uses a function that has inconsistent implementations across operating systems and versions."],["extended_description","The use of inconsistent implementations can cause changes in behavior when the code is ported or built under a different environment than the programmer expects, which can lead to security problems in some cases.\nThe implementation of many functions varies by platform, and at times, even by different versions of the same platform. Implementation differences can include:\n\nSlight differences in the way parameters are interpreted leading to inconsistent results.\nSome implementations of the function carry significant security risks.\nThe function might not be defined on all platforms.\nThe function might change which return codes it can provide, or change the meaning of its return codes."]]}],["475",{"type":"map","entries":[["id",475],["title","Undefined Behavior for Input to API"],["url","https://cwe.mitre.org/data/definitions/475.html"],["type","child"],["description","The behavior of this function is undefined unless its control parameter is set to a specific value."],["extended_description",null]]}],["477",{"type":"map","entries":[["id",477],["title","Use of Obsolete Function"],["url","https://cwe.mitre.org/data/definitions/477.html"],["type","child"],["description","The code uses deprecated or obsolete functions, which suggests that the code has not been actively reviewed or maintained."],["extended_description","As programming languages evolve, functions occasionally become obsolete due to:\n\nAdvances in the language\nImproved understanding of how operations should be performed effectively and securely\nChanges in the conventions that govern certain operations\n\nFunctions that are removed are usually replaced by newer counterparts that perform the same task in some different and hopefully improved way."]]}],["676",{"type":"map","entries":[["id",676],["title","Use of Potentially Dangerous Function"],["url","https://cwe.mitre.org/data/definitions/676.html"],["type","child"],["description","The product invokes a potentially dangerous function that could introduce a vulnerability if it is used incorrectly, but the function can also be used safely."],["extended_description",null]]}],["695",{"type":"map","entries":[["id",695],["title","Use of Low-Level Functionality"],["url","https://cwe.mitre.org/data/definitions/695.html"],["type","child"],["description","The product uses low-level functionality that is explicitly prohibited by the framework or specification under which the product is supposed to operate."],["extended_description","The use of low-level functionality can violate the specification in unexpected ways that effectively disable built-in protection mechanisms, introduce exploitable inconsistencies, or otherwise expose the functionality to attack."]]}],["749",{"type":"map","entries":[["id",749],["title","Exposed Dangerous Method or Function"],["url","https://cwe.mitre.org/data/definitions/749.html"],["type","child"],["description","The product provides an Applications Programming Interface (API) or similar interface for interaction with external actors, but the interface includes a dangerous method or function that is not properly restricted."],["extended_description","This weakness can lead to a wide variety of resultant weaknesses, depending on the behavior of the exposed method. It can apply to any number of technologies and approaches, such as ActiveX controls, Java functions, IOCTLs, and so on.\nThe exposure can occur in a few different ways:\n\nThe function/method was never intended to be exposed to outside actors.\nThe function/method was only intended to be accessible to a limited set of actors, such as Internet-based access from a single web site."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the use of built-in functions or external APIs."]]},{"type":"map","entries":[["id",242],["title","Use of Inherently Dangerous Function"],["url","https://cwe.mitre.org/data/definitions/242.html"],["type","child"],["description","The product calls a function that can never be guaranteed to work safely."],["extended_description","Certain functions behave in dangerous ways regardless of how they are used. Functions in this category were often implemented without taking security concerns into account. The gets() function is unsafe because it does not perform bounds checking on the size of its input. An attacker can easily send arbitrarily-sized input to gets() and overflow the destination buffer. Similarly, the &gt;&gt; operator is unsafe to use when reading into a statically-allocated character array because it does not perform bounds checking on the size of its input. An attacker can easily send arbitrarily-sized input to the &gt;&gt; operator and overflow the destination buffer."]]},{"type":"map","entries":[["id",474],["title","Use of Function with Inconsistent Implementations"],["url","https://cwe.mitre.org/data/definitions/474.html"],["type","child"],["description","The code uses a function that has inconsistent implementations across operating systems and versions."],["extended_description","The use of inconsistent implementations can cause changes in behavior when the code is ported or built under a different environment than the programmer expects, which can lead to security problems in some cases.\nThe implementation of many functions varies by platform, and at times, even by different versions of the same platform. Implementation differences can include:\n\nSlight differences in the way parameters are interpreted leading to inconsistent results.\nSome implementations of the function carry significant security risks.\nThe function might not be defined on all platforms.\nThe function might change which return codes it can provide, or change the meaning of its return codes."]]},{"type":"map","entries":[["id",475],["title","Undefined Behavior for Input to API"],["url","https://cwe.mitre.org/data/definitions/475.html"],["type","child"],["description","The behavior of this function is undefined unless its control parameter is set to a specific value."],["extended_description",null]]},{"type":"map","entries":[["id",477],["title","Use of Obsolete Function"],["url","https://cwe.mitre.org/data/definitions/477.html"],["type","child"],["description","The code uses deprecated or obsolete functions, which suggests that the code has not been actively reviewed or maintained."],["extended_description","As programming languages evolve, functions occasionally become obsolete due to:\n\nAdvances in the language\nImproved understanding of how operations should be performed effectively and securely\nChanges in the conventions that govern certain operations\n\nFunctions that are removed are usually replaced by newer counterparts that perform the same task in some different and hopefully improved way."]]},{"type":"map","entries":[["id",676],["title","Use of Potentially Dangerous Function"],["url","https://cwe.mitre.org/data/definitions/676.html"],["type","child"],["description","The product invokes a potentially dangerous function that could introduce a vulnerability if it is used incorrectly, but the function can also be used safely."],["extended_description",null]]},{"type":"map","entries":[["id",695],["title","Use of Low-Level Functionality"],["url","https://cwe.mitre.org/data/definitions/695.html"],["type","child"],["description","The product uses low-level functionality that is explicitly prohibited by the framework or specification under which the product is supposed to operate."],["extended_description","The use of low-level functionality can violate the specification in unexpected ways that effectively disable built-in protection mechanisms, introduce exploitable inconsistencies, or otherwise expose the functionality to attack."]]},{"type":"map","entries":[["id",749],["title","Exposed Dangerous Method or Function"],["url","https://cwe.mitre.org/data/definitions/749.html"],["type","child"],["description","The product provides an Applications Programming Interface (API) or similar interface for interaction with external actors, but the interface includes a dangerous method or function that is not properly restricted."],["extended_description","This weakness can lead to a wide variety of resultant weaknesses, depending on the behavior of the exposed method. It can apply to any number of technologies and approaches, such as ActiveX controls, Java functions, IOCTLs, and so on.\nThe exposure can occur in a few different ways:\n\nThe function/method was never intended to be exposed to outside actors.\nThe function/method was only intended to be accessible to a limited set of actors, such as Internet-based access from a single web site."]]},{"type":"map","entries":[["id",1210],["title","Audit / Logging Errors"],["url","https://cwe.mitre.org/data/definitions/1210.html"],["children",{"type":"map","entries":[["117",{"type":"map","entries":[["id",117],["title","Improper Output Neutralization for Logs"],["url","https://cwe.mitre.org/data/definitions/117.html"],["type","child"],["description","The product constructs a log message from external input, but it does not neutralize or incorrectly neutralizes special elements when the message is written to a log file."],["extended_description",null]]}],["222",{"type":"map","entries":[["id",222],["title","Truncation of Security-relevant Information"],["url","https://cwe.mitre.org/data/definitions/222.html"],["type","child"],["description","The product truncates the display, recording, or processing of security-relevant information in a way that can obscure the source or nature of an attack."],["extended_description",null]]}],["223",{"type":"map","entries":[["id",223],["title","Omission of Security-relevant Information"],["url","https://cwe.mitre.org/data/definitions/223.html"],["type","child"],["description","The product does not record or display information that would be important for identifying the source or nature of an attack, or determining if an action is safe."],["extended_description",null]]}],["224",{"type":"map","entries":[["id",224],["title","Obscured Security-relevant Information by Alternate Name"],["url","https://cwe.mitre.org/data/definitions/224.html"],["type","child"],["description","The product records security-relevant information according to an alternate name of the affected entity, instead of the canonical name."],["extended_description",null]]}],["778",{"type":"map","entries":[["id",778],["title","Insufficient Logging"],["url","https://cwe.mitre.org/data/definitions/778.html"],["type","child"],["description","When a security-critical event occurs, the product either does not record the event or omits important details about the event when logging it."],["extended_description","When security-critical events are not logged properly, such as a failed login attempt, this can make malicious behavior more difficult to detect and may hinder forensic analysis after an attack succeeds.\nAs organizations adopt cloud storage resources, these technologies often require configuration changes to enable detailed logging information, since detailed logging can incur additional costs. This could lead to telemetry gaps in critical audit logs. For example, in Azure, the default value for logging is disabled."]]}],["779",{"type":"map","entries":[["id",779],["title","Logging of Excessive Data"],["url","https://cwe.mitre.org/data/definitions/779.html"],["type","child"],["description","The product logs too much information, making log files hard to process and possibly hindering recovery efforts or forensic analysis after an attack."],["extended_description","While logging is a good practice in general, and very high levels of logging are appropriate for debugging stages of development, too much logging in a production environment might hinder a system administrator's ability to detect anomalous conditions. This can provide cover for an attacker while attempting to penetrate a system, clutter the audit trail for forensic analysis, or make it more difficult to debug problems in a production environment."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to audit-based components of a software system. Frequently these deal with logging user activities in order to identify undesired access and modifications to the system. The weaknesses in this category could lead to a degradation of the quality of the audit capability if they are not addressed."]]},{"type":"map","entries":[["id",117],["title","Improper Output Neutralization for Logs"],["url","https://cwe.mitre.org/data/definitions/117.html"],["type","child"],["description","The product constructs a log message from external input, but it does not neutralize or incorrectly neutralizes special elements when the message is written to a log file."],["extended_description",null]]},{"type":"map","entries":[["id",222],["title","Truncation of Security-relevant Information"],["url","https://cwe.mitre.org/data/definitions/222.html"],["type","child"],["description","The product truncates the display, recording, or processing of security-relevant information in a way that can obscure the source or nature of an attack."],["extended_description",null]]},{"type":"map","entries":[["id",223],["title","Omission of Security-relevant Information"],["url","https://cwe.mitre.org/data/definitions/223.html"],["type","child"],["description","The product does not record or display information that would be important for identifying the source or nature of an attack, or determining if an action is safe."],["extended_description",null]]},{"type":"map","entries":[["id",224],["title","Obscured Security-relevant Information by Alternate Name"],["url","https://cwe.mitre.org/data/definitions/224.html"],["type","child"],["description","The product records security-relevant information according to an alternate name of the affected entity, instead of the canonical name."],["extended_description",null]]},{"type":"map","entries":[["id",778],["title","Insufficient Logging"],["url","https://cwe.mitre.org/data/definitions/778.html"],["type","child"],["description","When a security-critical event occurs, the product either does not record the event or omits important details about the event when logging it."],["extended_description","When security-critical events are not logged properly, such as a failed login attempt, this can make malicious behavior more difficult to detect and may hinder forensic analysis after an attack succeeds.\nAs organizations adopt cloud storage resources, these technologies often require configuration changes to enable detailed logging information, since detailed logging can incur additional costs. This could lead to telemetry gaps in critical audit logs. For example, in Azure, the default value for logging is disabled."]]},{"type":"map","entries":[["id",779],["title","Logging of Excessive Data"],["url","https://cwe.mitre.org/data/definitions/779.html"],["type","child"],["description","The product logs too much information, making log files hard to process and possibly hindering recovery efforts or forensic analysis after an attack."],["extended_description","While logging is a good practice in general, and very high levels of logging are appropriate for debugging stages of development, too much logging in a production environment might hinder a system administrator's ability to detect anomalous conditions. This can provide cover for an attacker while attempting to penetrate a system, clutter the audit trail for forensic analysis, or make it more difficult to debug problems in a production environment."]]},{"type":"map","entries":[["id",1211],["title","Authentication Errors"],["url","https://cwe.mitre.org/data/definitions/1211.html"],["children",{"type":"map","entries":[["289",{"type":"map","entries":[["id",289],["title","Authentication Bypass by Alternate Name"],["url","https://cwe.mitre.org/data/definitions/289.html"],["type","child"],["description","The product performs authentication based on the name of a resource being accessed, or the name of the actor performing the access, but it does not properly check all possible names for that resource or actor."],["extended_description",null]]}],["290",{"type":"map","entries":[["id",290],["title","Authentication Bypass by Spoofing"],["url","https://cwe.mitre.org/data/definitions/290.html"],["type","child"],["description","This attack-focused weakness is caused by incorrectly implemented authentication schemes that are subject to spoofing attacks."],["extended_description",null]]}],["294",{"type":"map","entries":[["id",294],["title","Authentication Bypass by Capture-replay"],["url","https://cwe.mitre.org/data/definitions/294.html"],["type","child"],["description","A capture-replay flaw exists when the design of the product makes it possible for a malicious user to sniff network traffic and bypass authentication by replaying it to the server in question to the same effect as the original message (or with minor changes)."],["extended_description","Capture-replay attacks are common and can be difficult to defeat without cryptography. They are a subset of network injection attacks that rely on observing previously-sent valid commands, then changing them slightly if necessary and resending the same commands to the server."]]}],["295",{"type":"map","entries":[["id",295],["title","Improper Certificate Validation"],["url","https://cwe.mitre.org/data/definitions/295.html"],["type","child"],["description","The product does not validate, or incorrectly validates, a certificate."],["extended_description",null]]}],["301",{"type":"map","entries":[["id",301],["title","Reflection Attack in an Authentication Protocol"],["url","https://cwe.mitre.org/data/definitions/301.html"],["type","child"],["description","Simple authentication protocols are subject to reflection attacks if a malicious user can use the target machine to impersonate a trusted user."],["extended_description","A mutual authentication protocol requires each party to respond to a random challenge by the other party by encrypting it with a pre-shared key. Often, however, such protocols employ the same pre-shared key for communication with a number of different entities. A malicious user or an attacker can easily compromise this protocol without possessing the correct key by employing a reflection attack on the protocol.\nReflection attacks capitalize on mutual authentication schemes in order to trick the target into revealing the secret shared between it and another valid user. In a basic mutual-authentication scheme, a secret is known to both the valid user and the server; this allows them to authenticate. In order that they may verify this shared secret without sending it plainly over the wire, they utilize a Diffie-Hellman-style scheme in which they each pick a value, then request the hash of that value as keyed by the shared secret. In a reflection attack, the attacker claims to be a valid user and requests the hash of a random value from the server. When the server returns this value and requests its own value to be hashed, the attacker opens another connection to the server. This time, the hash requested by the attacker is the value which the server requested in the first connection. When the server returns this hashed value, it is used in the first connection, authenticating the attacker successfully as the impersonated valid user."]]}],["303",{"type":"map","entries":[["id",303],["title","Incorrect Implementation of Authentication Algorithm"],["url","https://cwe.mitre.org/data/definitions/303.html"],["type","child"],["description","The requirements for the product dictate the use of an established authentication algorithm, but the implementation of the algorithm is incorrect."],["extended_description","This incorrect implementation may allow authentication to be bypassed."]]}],["305",{"type":"map","entries":[["id",305],["title","Authentication Bypass by Primary Weakness"],["url","https://cwe.mitre.org/data/definitions/305.html"],["type","child"],["description","The authentication algorithm is sound, but the implemented mechanism can be bypassed as the result of a separate weakness that is primary to the authentication error."],["extended_description",null]]}],["306",{"type":"map","entries":[["id",306],["title","Missing Authentication for Critical Function"],["url","https://cwe.mitre.org/data/definitions/306.html"],["type","child"],["description","The product does not perform any authentication for functionality that requires a provable user identity or consumes a significant amount of resources."],["extended_description",null]]}],["307",{"type":"map","entries":[["id",307],["title","Improper Restriction of Excessive Authentication Attempts"],["url","https://cwe.mitre.org/data/definitions/307.html"],["type","child"],["description","The product does not implement sufficient measures to prevent multiple failed authentication attempts within a short time frame."],["extended_description",null]]}],["308",{"type":"map","entries":[["id",308],["title","Use of Single-factor Authentication"],["url","https://cwe.mitre.org/data/definitions/308.html"],["type","child"],["description","The product uses an authentication algorithm that uses a single factor (e.g., a password) in a security context that should require more than one factor."],["extended_description",null]]}],["309",{"type":"map","entries":[["id",309],["title","Use of Password System for Primary Authentication"],["url","https://cwe.mitre.org/data/definitions/309.html"],["type","child"],["description","The use of password systems as the primary means of authentication may be subject to several flaws or shortcomings, each reducing the effectiveness of the mechanism."],["extended_description",null]]}],["322",{"type":"map","entries":[["id",322],["title","Key Exchange without Entity Authentication"],["url","https://cwe.mitre.org/data/definitions/322.html"],["type","child"],["description","The product performs a key exchange with an actor without verifying the identity of that actor."],["extended_description","Performing a key exchange will preserve the integrity of the information sent between two entities, but this will not guarantee that the entities are who they claim they are. This may enable an attacker to impersonate an actor by modifying traffic between the two entities.  Typically, this involves a victim client that contacts a malicious server that is impersonating a trusted server. If the client skips authentication or ignores an authentication failure, the malicious server may request authentication information from the user. The malicious server can then use this authentication information to log in to the trusted server using the victim's credentials, sniff traffic between the victim and trusted server, etc."]]}],["603",{"type":"map","entries":[["id",603],["title","Use of Client-Side Authentication"],["url","https://cwe.mitre.org/data/definitions/603.html"],["type","child"],["description","A client/server product performs authentication within client code but not in server code, allowing server-side authentication to be bypassed via a modified client that omits the authentication check."],["extended_description","Client-side authentication is extremely weak and may be breached easily. Any attacker may read the source code and reverse-engineer the authentication mechanism to access parts of the application which would otherwise be protected."]]}],["645",{"type":"map","entries":[["id",645],["title","Overly Restrictive Account Lockout Mechanism"],["url","https://cwe.mitre.org/data/definitions/645.html"],["type","child"],["description","The product contains an account lockout protection mechanism, but the mechanism is too restrictive and can be triggered too easily, which allows attackers to deny service to legitimate users by causing their accounts to be locked out."],["extended_description","Account lockout is a security feature often present in applications as a countermeasure to the brute force attack on the password based authentication mechanism of the system. After a certain number of failed login attempts, the users' account may be disabled for a certain period of time or until it is unlocked by an administrator. Other security events may also possibly trigger account lockout. However, an attacker may use this very security feature to deny service to legitimate system users. It is therefore important to ensure that the account lockout security mechanism is not overly restrictive."]]}],["804",{"type":"map","entries":[["id",804],["title","Guessable CAPTCHA"],["url","https://cwe.mitre.org/data/definitions/804.html"],["type","child"],["description","The product uses a CAPTCHA challenge, but the challenge can be guessed or automatically recognized by a non-human actor."],["extended_description","An automated attacker could bypass the intended protection of the CAPTCHA challenge and perform actions at a higher frequency than humanly possible, such as launching spam attacks.\nThere can be several different causes of a guessable CAPTCHA:\n\nAn audio or visual image that does not have sufficient distortion from the unobfuscated source image.\nA question is generated with a format that can be automatically recognized, such as a math question.\nA question for which the number of possible answers is limited, such as birth years or favorite sports teams.\nA general-knowledge or trivia question for which the answer can be accessed using a data base, such as country capitals or popular entertainers.\nOther data associated with the CAPTCHA may provide hints about its contents, such as an image whose filename contains the word that is used in the CAPTCHA."]]}],["836",{"type":"map","entries":[["id",836],["title","Use of Password Hash Instead of Password for Authentication"],["url","https://cwe.mitre.org/data/definitions/836.html"],["type","child"],["description","The product records password hashes in a data store, receives a hash of a password from a client, and compares the supplied hash to the hash obtained from the data store."],["extended_description","Some authentication mechanisms rely on the client to generate the hash for a password, possibly to reduce load on the server or avoid sending the password across the network. However, when the client is used to generate the hash, an attacker can bypass the authentication by obtaining a copy of the hash, e.g. by using SQL injection to compromise a database of authentication credentials, or by exploiting an information exposure. The attacker could then use a modified client to replay the stolen hash without having knowledge of the original password.\nAs a result, the server-side comparison against a client-side hash does not provide any more security than the use of passwords without hashing."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to authentication components of a system. Frequently these deal with the ability to verify that an entity is indeed who it claims to be. If not addressed when designing or implementing a software system, these weaknesses could lead to a degradation of the quality of the authentication capability."]]},{"type":"map","entries":[["id",289],["title","Authentication Bypass by Alternate Name"],["url","https://cwe.mitre.org/data/definitions/289.html"],["type","child"],["description","The product performs authentication based on the name of a resource being accessed, or the name of the actor performing the access, but it does not properly check all possible names for that resource or actor."],["extended_description",null]]},{"type":"map","entries":[["id",290],["title","Authentication Bypass by Spoofing"],["url","https://cwe.mitre.org/data/definitions/290.html"],["type","child"],["description","This attack-focused weakness is caused by incorrectly implemented authentication schemes that are subject to spoofing attacks."],["extended_description",null]]},{"type":"map","entries":[["id",294],["title","Authentication Bypass by Capture-replay"],["url","https://cwe.mitre.org/data/definitions/294.html"],["type","child"],["description","A capture-replay flaw exists when the design of the product makes it possible for a malicious user to sniff network traffic and bypass authentication by replaying it to the server in question to the same effect as the original message (or with minor changes)."],["extended_description","Capture-replay attacks are common and can be difficult to defeat without cryptography. They are a subset of network injection attacks that rely on observing previously-sent valid commands, then changing them slightly if necessary and resending the same commands to the server."]]},{"type":"map","entries":[["id",295],["title","Improper Certificate Validation"],["url","https://cwe.mitre.org/data/definitions/295.html"],["type","child"],["description","The product does not validate, or incorrectly validates, a certificate."],["extended_description",null]]},{"type":"map","entries":[["id",301],["title","Reflection Attack in an Authentication Protocol"],["url","https://cwe.mitre.org/data/definitions/301.html"],["type","child"],["description","Simple authentication protocols are subject to reflection attacks if a malicious user can use the target machine to impersonate a trusted user."],["extended_description","A mutual authentication protocol requires each party to respond to a random challenge by the other party by encrypting it with a pre-shared key. Often, however, such protocols employ the same pre-shared key for communication with a number of different entities. A malicious user or an attacker can easily compromise this protocol without possessing the correct key by employing a reflection attack on the protocol.\nReflection attacks capitalize on mutual authentication schemes in order to trick the target into revealing the secret shared between it and another valid user. In a basic mutual-authentication scheme, a secret is known to both the valid user and the server; this allows them to authenticate. In order that they may verify this shared secret without sending it plainly over the wire, they utilize a Diffie-Hellman-style scheme in which they each pick a value, then request the hash of that value as keyed by the shared secret. In a reflection attack, the attacker claims to be a valid user and requests the hash of a random value from the server. When the server returns this value and requests its own value to be hashed, the attacker opens another connection to the server. This time, the hash requested by the attacker is the value which the server requested in the first connection. When the server returns this hashed value, it is used in the first connection, authenticating the attacker successfully as the impersonated valid user."]]},{"type":"map","entries":[["id",303],["title","Incorrect Implementation of Authentication Algorithm"],["url","https://cwe.mitre.org/data/definitions/303.html"],["type","child"],["description","The requirements for the product dictate the use of an established authentication algorithm, but the implementation of the algorithm is incorrect."],["extended_description","This incorrect implementation may allow authentication to be bypassed."]]},{"type":"map","entries":[["id",305],["title","Authentication Bypass by Primary Weakness"],["url","https://cwe.mitre.org/data/definitions/305.html"],["type","child"],["description","The authentication algorithm is sound, but the implemented mechanism can be bypassed as the result of a separate weakness that is primary to the authentication error."],["extended_description",null]]},{"type":"map","entries":[["id",306],["title","Missing Authentication for Critical Function"],["url","https://cwe.mitre.org/data/definitions/306.html"],["type","child"],["description","The product does not perform any authentication for functionality that requires a provable user identity or consumes a significant amount of resources."],["extended_description",null]]},{"type":"map","entries":[["id",307],["title","Improper Restriction of Excessive Authentication Attempts"],["url","https://cwe.mitre.org/data/definitions/307.html"],["type","child"],["description","The product does not implement sufficient measures to prevent multiple failed authentication attempts within a short time frame."],["extended_description",null]]},{"type":"map","entries":[["id",308],["title","Use of Single-factor Authentication"],["url","https://cwe.mitre.org/data/definitions/308.html"],["type","child"],["description","The product uses an authentication algorithm that uses a single factor (e.g., a password) in a security context that should require more than one factor."],["extended_description",null]]},{"type":"map","entries":[["id",309],["title","Use of Password System for Primary Authentication"],["url","https://cwe.mitre.org/data/definitions/309.html"],["type","child"],["description","The use of password systems as the primary means of authentication may be subject to several flaws or shortcomings, each reducing the effectiveness of the mechanism."],["extended_description",null]]},{"type":"map","entries":[["id",322],["title","Key Exchange without Entity Authentication"],["url","https://cwe.mitre.org/data/definitions/322.html"],["type","child"],["description","The product performs a key exchange with an actor without verifying the identity of that actor."],["extended_description","Performing a key exchange will preserve the integrity of the information sent between two entities, but this will not guarantee that the entities are who they claim they are. This may enable an attacker to impersonate an actor by modifying traffic between the two entities.  Typically, this involves a victim client that contacts a malicious server that is impersonating a trusted server. If the client skips authentication or ignores an authentication failure, the malicious server may request authentication information from the user. The malicious server can then use this authentication information to log in to the trusted server using the victim's credentials, sniff traffic between the victim and trusted server, etc."]]},{"type":"map","entries":[["id",603],["title","Use of Client-Side Authentication"],["url","https://cwe.mitre.org/data/definitions/603.html"],["type","child"],["description","A client/server product performs authentication within client code but not in server code, allowing server-side authentication to be bypassed via a modified client that omits the authentication check."],["extended_description","Client-side authentication is extremely weak and may be breached easily. Any attacker may read the source code and reverse-engineer the authentication mechanism to access parts of the application which would otherwise be protected."]]},{"type":"map","entries":[["id",645],["title","Overly Restrictive Account Lockout Mechanism"],["url","https://cwe.mitre.org/data/definitions/645.html"],["type","child"],["description","The product contains an account lockout protection mechanism, but the mechanism is too restrictive and can be triggered too easily, which allows attackers to deny service to legitimate users by causing their accounts to be locked out."],["extended_description","Account lockout is a security feature often present in applications as a countermeasure to the brute force attack on the password based authentication mechanism of the system. After a certain number of failed login attempts, the users' account may be disabled for a certain period of time or until it is unlocked by an administrator. Other security events may also possibly trigger account lockout. However, an attacker may use this very security feature to deny service to legitimate system users. It is therefore important to ensure that the account lockout security mechanism is not overly restrictive."]]},{"type":"map","entries":[["id",804],["title","Guessable CAPTCHA"],["url","https://cwe.mitre.org/data/definitions/804.html"],["type","child"],["description","The product uses a CAPTCHA challenge, but the challenge can be guessed or automatically recognized by a non-human actor."],["extended_description","An automated attacker could bypass the intended protection of the CAPTCHA challenge and perform actions at a higher frequency than humanly possible, such as launching spam attacks.\nThere can be several different causes of a guessable CAPTCHA:\n\nAn audio or visual image that does not have sufficient distortion from the unobfuscated source image.\nA question is generated with a format that can be automatically recognized, such as a math question.\nA question for which the number of possible answers is limited, such as birth years or favorite sports teams.\nA general-knowledge or trivia question for which the answer can be accessed using a data base, such as country capitals or popular entertainers.\nOther data associated with the CAPTCHA may provide hints about its contents, such as an image whose filename contains the word that is used in the CAPTCHA."]]},{"type":"map","entries":[["id",836],["title","Use of Password Hash Instead of Password for Authentication"],["url","https://cwe.mitre.org/data/definitions/836.html"],["type","child"],["description","The product records password hashes in a data store, receives a hash of a password from a client, and compares the supplied hash to the hash obtained from the data store."],["extended_description","Some authentication mechanisms rely on the client to generate the hash for a password, possibly to reduce load on the server or avoid sending the password across the network. However, when the client is used to generate the hash, an attacker can bypass the authentication by obtaining a copy of the hash, e.g. by using SQL injection to compromise a database of authentication credentials, or by exploiting an information exposure. The attacker could then use a modified client to replay the stolen hash without having knowledge of the original password.\nAs a result, the server-side comparison against a client-side hash does not provide any more security than the use of passwords without hashing."]]},{"type":"map","entries":[["id",1212],["title","Authorization Errors"],["url","https://cwe.mitre.org/data/definitions/1212.html"],["children",{"type":"map","entries":[["425",{"type":"map","entries":[["id",425],["title","Direct Request ('Forced Browsing')"],["url","https://cwe.mitre.org/data/definitions/425.html"],["type","child"],["description","The web application does not adequately enforce appropriate authorization on all restricted URLs, scripts, or files."],["extended_description",null]]}],["551",{"type":"map","entries":[["id",551],["title","Incorrect Behavior Order: Authorization Before Parsing and Canonicalization"],["url","https://cwe.mitre.org/data/definitions/551.html"],["type","child"],["description","If a web server does not fully parse requested URLs before it examines them for authorization, it may be possible for an attacker to bypass authorization protection."],["extended_description","For instance, the character strings /./ and / both mean current directory. If /SomeDirectory is a protected directory and an attacker requests /./SomeDirectory, the attacker may be able to gain access to the resource if /./ is not converted to / before the authorization check is performed."]]}],["552",{"type":"map","entries":[["id",552],["title","Files or Directories Accessible to External Parties"],["url","https://cwe.mitre.org/data/definitions/552.html"],["type","child"],["description","The product makes files or directories accessible to unauthorized actors, even though they should not be."],["extended_description","Web servers, FTP servers, and similar servers may store a set of files underneath a \"root\" directory that is accessible to the server's users.  Applications may store sensitive files underneath this root without also using access control to limit which users may request those files, if any.  Alternately, an application might package multiple files or directories into an archive file (e.g., ZIP or tar), but the application might not exclude sensitive files that are underneath those directories.\nIn cloud technologies and containers, this weakness might present itself in the form of misconfigured storage accounts that can be read or written by a public or anonymous user."]]}],["639",{"type":"map","entries":[["id",639],["title","Authorization Bypass Through User-Controlled Key"],["url","https://cwe.mitre.org/data/definitions/639.html"],["type","child"],["description","The system's authorization functionality does not prevent one user from gaining access to another user's data or record by modifying the key value identifying the data."],["extended_description","Retrieval of a user record occurs in the system based on some key value that is under user control. The key would typically identify a user-related record stored in the system and would be used to lookup that record for presentation to the user. It is likely that an attacker would have to be an authenticated user in the system. However, the authorization process would not properly check the data access operation to ensure that the authenticated user performing the operation has sufficient entitlements to perform the requested data access, hence bypassing any other authorization checks present in the system.\nFor example, attackers can look at places where user specific data is retrieved (e.g. search screens) and determine whether the key for the item being looked up is controllable externally. The key may be a hidden field in the HTML form field, might be passed as a URL parameter or as an unencrypted cookie variable, then in each of these cases it will be possible to tamper with the key value.\nOne manifestation of this weakness is when a system uses sequential or otherwise easily-guessable session IDs that would allow one user to easily switch to another user's session and read/modify their data."]]}],["653",{"type":"map","entries":[["id",653],["title","Improper Isolation or Compartmentalization"],["url","https://cwe.mitre.org/data/definitions/653.html"],["type","child"],["description","The product does not properly compartmentalize or isolate functionality, processes, or resources that require different privilege levels, rights, or permissions."],["extended_description","When a weakness occurs in functionality that is accessible by lower-privileged users, then without strong boundaries, an attack might extend the scope of the damage to higher-privileged users."]]}],["939",{"type":"map","entries":[["id",939],["title","Improper Authorization in Handler for Custom URL Scheme"],["url","https://cwe.mitre.org/data/definitions/939.html"],["type","child"],["description","The product uses a handler for a custom URL scheme, but it does not properly restrict which actors can invoke the handler using the scheme."],["extended_description","Mobile platforms and other architectures allow the use of custom URL schemes to facilitate communication between applications. In the case of iOS, this is the only method to do inter-application communication. The implementation is at the developer's discretion which may open security flaws in the application. An example could be potentially dangerous functionality such as modifying files through a custom URL scheme."]]}],["842",{"type":"map","entries":[["id",842],["title","Placement of User into Incorrect Group"],["url","https://cwe.mitre.org/data/definitions/842.html"],["type","child"],["description","The product or the administrator places a user into an incorrect group."],["extended_description","If the incorrect group has more access or privileges than the intended group, the user might be able to bypass intended security policy to access unexpected resources or perform unexpected actions. The access-control system might not be able to detect malicious usage of this group membership."]]}],["1220",{"type":"map","entries":[["id",1220],["title","Insufficient Granularity of Access Control"],["url","https://cwe.mitre.org/data/definitions/1220.html"],["type","child"],["description","The product implements access controls via a policy or other feature with the intention to disable or restrict accesses (reads and/or writes) to assets in a system from untrusted agents. However, implemented access controls lack required granularity, which renders the control policy too broad because it allows accesses from unauthorized agents to the security-sensitive assets."],["extended_description","Integrated circuits and hardware engines can expose accesses to assets (device configuration, keys, etc.) to trusted firmware or a software module (commonly set by BIOS/bootloader). This access is typically access-controlled. Upon a power reset, the hardware or system usually starts with default values in registers, and the trusted firmware (Boot firmware) configures the necessary access-control protection.\nA common weakness that can exist in such protection schemes is that access controls or policies are not granular enough. This condition allows agents beyond trusted agents to access assets and could lead to a loss of functionality or the ability to set up the device securely. This further results in security risks from leaked, sensitive, key material to modification of device configuration."]]}],["1230",{"type":"map","entries":[["id",1230],["title","Exposure of Sensitive Information Through Metadata"],["url","https://cwe.mitre.org/data/definitions/1230.html"],["type","child"],["description","The product prevents direct access to a resource containing sensitive information, but it does not sufficiently limit access to metadata that is derived from the original, sensitive information."],["extended_description","Developers might correctly prevent unauthorized access to a database or other resource containing sensitive information, but they might not consider that portions of the original information might also be recorded in metadata, search indices, statistical reports, or other resources.  If these resources are not also restricted, then attackers might be able to extract some or all of the original information, or otherwise infer some details.  For example, an attacker could specify search terms that are known to be unique to a particular person, or view metadata such as activity or creation dates in order to identify usage patterns."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to authorization components of a system. Frequently these deal with the ability to enforce that agents have the required permissions before performing certain operations, such as modifying data. If not addressed when designing or implementing a software system, these weaknesses could lead to a degradation of the quality of the authorization capability."]]},{"type":"map","entries":[["id",425],["title","Direct Request ('Forced Browsing')"],["url","https://cwe.mitre.org/data/definitions/425.html"],["type","child"],["description","The web application does not adequately enforce appropriate authorization on all restricted URLs, scripts, or files."],["extended_description",null]]},{"type":"map","entries":[["id",551],["title","Incorrect Behavior Order: Authorization Before Parsing and Canonicalization"],["url","https://cwe.mitre.org/data/definitions/551.html"],["type","child"],["description","If a web server does not fully parse requested URLs before it examines them for authorization, it may be possible for an attacker to bypass authorization protection."],["extended_description","For instance, the character strings /./ and / both mean current directory. If /SomeDirectory is a protected directory and an attacker requests /./SomeDirectory, the attacker may be able to gain access to the resource if /./ is not converted to / before the authorization check is performed."]]},{"type":"map","entries":[["id",552],["title","Files or Directories Accessible to External Parties"],["url","https://cwe.mitre.org/data/definitions/552.html"],["type","child"],["description","The product makes files or directories accessible to unauthorized actors, even though they should not be."],["extended_description","Web servers, FTP servers, and similar servers may store a set of files underneath a \"root\" directory that is accessible to the server's users.  Applications may store sensitive files underneath this root without also using access control to limit which users may request those files, if any.  Alternately, an application might package multiple files or directories into an archive file (e.g., ZIP or tar), but the application might not exclude sensitive files that are underneath those directories.\nIn cloud technologies and containers, this weakness might present itself in the form of misconfigured storage accounts that can be read or written by a public or anonymous user."]]},{"type":"map","entries":[["id",639],["title","Authorization Bypass Through User-Controlled Key"],["url","https://cwe.mitre.org/data/definitions/639.html"],["type","child"],["description","The system's authorization functionality does not prevent one user from gaining access to another user's data or record by modifying the key value identifying the data."],["extended_description","Retrieval of a user record occurs in the system based on some key value that is under user control. The key would typically identify a user-related record stored in the system and would be used to lookup that record for presentation to the user. It is likely that an attacker would have to be an authenticated user in the system. However, the authorization process would not properly check the data access operation to ensure that the authenticated user performing the operation has sufficient entitlements to perform the requested data access, hence bypassing any other authorization checks present in the system.\nFor example, attackers can look at places where user specific data is retrieved (e.g. search screens) and determine whether the key for the item being looked up is controllable externally. The key may be a hidden field in the HTML form field, might be passed as a URL parameter or as an unencrypted cookie variable, then in each of these cases it will be possible to tamper with the key value.\nOne manifestation of this weakness is when a system uses sequential or otherwise easily-guessable session IDs that would allow one user to easily switch to another user's session and read/modify their data."]]},{"type":"map","entries":[["id",653],["title","Improper Isolation or Compartmentalization"],["url","https://cwe.mitre.org/data/definitions/653.html"],["type","child"],["description","The product does not properly compartmentalize or isolate functionality, processes, or resources that require different privilege levels, rights, or permissions."],["extended_description","When a weakness occurs in functionality that is accessible by lower-privileged users, then without strong boundaries, an attack might extend the scope of the damage to higher-privileged users."]]},{"type":"map","entries":[["id",939],["title","Improper Authorization in Handler for Custom URL Scheme"],["url","https://cwe.mitre.org/data/definitions/939.html"],["type","child"],["description","The product uses a handler for a custom URL scheme, but it does not properly restrict which actors can invoke the handler using the scheme."],["extended_description","Mobile platforms and other architectures allow the use of custom URL schemes to facilitate communication between applications. In the case of iOS, this is the only method to do inter-application communication. The implementation is at the developer's discretion which may open security flaws in the application. An example could be potentially dangerous functionality such as modifying files through a custom URL scheme."]]},{"type":"map","entries":[["id",842],["title","Placement of User into Incorrect Group"],["url","https://cwe.mitre.org/data/definitions/842.html"],["type","child"],["description","The product or the administrator places a user into an incorrect group."],["extended_description","If the incorrect group has more access or privileges than the intended group, the user might be able to bypass intended security policy to access unexpected resources or perform unexpected actions. The access-control system might not be able to detect malicious usage of this group membership."]]},{"type":"map","entries":[["id",1220],["title","Insufficient Granularity of Access Control"],["url","https://cwe.mitre.org/data/definitions/1220.html"],["type","child"],["description","The product implements access controls via a policy or other feature with the intention to disable or restrict accesses (reads and/or writes) to assets in a system from untrusted agents. However, implemented access controls lack required granularity, which renders the control policy too broad because it allows accesses from unauthorized agents to the security-sensitive assets."],["extended_description","Integrated circuits and hardware engines can expose accesses to assets (device configuration, keys, etc.) to trusted firmware or a software module (commonly set by BIOS/bootloader). This access is typically access-controlled. Upon a power reset, the hardware or system usually starts with default values in registers, and the trusted firmware (Boot firmware) configures the necessary access-control protection.\nA common weakness that can exist in such protection schemes is that access controls or policies are not granular enough. This condition allows agents beyond trusted agents to access assets and could lead to a loss of functionality or the ability to set up the device securely. This further results in security risks from leaked, sensitive, key material to modification of device configuration."]]},{"type":"map","entries":[["id",1230],["title","Exposure of Sensitive Information Through Metadata"],["url","https://cwe.mitre.org/data/definitions/1230.html"],["type","child"],["description","The product prevents direct access to a resource containing sensitive information, but it does not sufficiently limit access to metadata that is derived from the original, sensitive information."],["extended_description","Developers might correctly prevent unauthorized access to a database or other resource containing sensitive information, but they might not consider that portions of the original information might also be recorded in metadata, search indices, statistical reports, or other resources.  If these resources are not also restricted, then attackers might be able to extract some or all of the original information, or otherwise infer some details.  For example, an attacker could specify search terms that are known to be unique to a particular person, or view metadata such as activity or creation dates in order to identify usage patterns."]]},{"type":"map","entries":[["id",1006],["title","Bad Coding Practices"],["url","https://cwe.mitre.org/data/definitions/1006.html"],["children",{"type":"map","entries":[["358",{"type":"map","entries":[["id",358],["title","Improperly Implemented Security Check for Standard"],["url","https://cwe.mitre.org/data/definitions/358.html"],["type","child"],["description","The product does not implement or incorrectly implements one or more security-relevant checks as specified by the design of a standardized algorithm, protocol, or technique."],["extended_description",null]]}],["360",{"type":"map","entries":[["id",360],["title","Trust of System Event Data"],["url","https://cwe.mitre.org/data/definitions/360.html"],["type","child"],["description","Security based on event locations are insecure and can be spoofed."],["extended_description","Events are a messaging system which may provide control data to programs listening for events. Events often do not have any type of authentication framework to allow them to be verified from a trusted source. Any application, in Windows, on a given desktop can send a message to any window on the same desktop. There is no authentication framework for these messages. Therefore, any message can be used to manipulate any process on the desktop if the process does not check the validity and safeness of those messages."]]}],["478",{"type":"map","entries":[["id",478],["title","Missing Default Case in Multiple Condition Expression"],["url","https://cwe.mitre.org/data/definitions/478.html"],["type","child"],["description","The code does not have a default case in an expression with multiple conditions, such as a switch statement."],["extended_description","If a multiple-condition expression (such as a switch in C) omits the default case but does not consider or handle all possible values that could occur, then this might lead to complex logical errors and resultant weaknesses. Because of this, further decisions are made based on poor information, and cascading failure results. This cascading failure may result in any number of security issues, and constitutes a significant failure in the system."]]}],["487",{"type":"map","entries":[["id",487],["title","Reliance on Package-level Scope"],["url","https://cwe.mitre.org/data/definitions/487.html"],["type","child"],["description","Java packages are not inherently closed; therefore, relying on them for code security is not a good practice."],["extended_description","The purpose of package scope is to prevent accidental access by other parts of a program. This is an ease-of-software-development feature but not a security feature."]]}],["489",{"type":"map","entries":[["id",489],["title","Active Debug Code"],["url","https://cwe.mitre.org/data/definitions/489.html"],["type","child"],["description","The product is released with debugging code still enabled or active."],["extended_description",null]]}],["547",{"type":"map","entries":[["id",547],["title","Use of Hard-coded, Security-relevant Constants"],["url","https://cwe.mitre.org/data/definitions/547.html"],["type","child"],["description","The product uses hard-coded constants instead of symbolic names for security-critical values, which increases the likelihood of mistakes during code maintenance or security policy change."],["extended_description","If the developer does not find all occurrences of the hard-coded constants, an incorrect policy decision may be made if one of the constants is not changed. Making changes to these values will require code changes that may be difficult or impossible once the system is released to the field. In addition, these hard-coded values may become available to attackers if the code is ever disclosed."]]}],["561",{"type":"map","entries":[["id",561],["title","Dead Code"],["url","https://cwe.mitre.org/data/definitions/561.html"],["type","child"],["description","The product contains dead code, which can never be executed."],["extended_description","Dead code is code that can never be executed in a running program. The surrounding code makes it impossible for a section of code to ever be executed."]]}],["562",{"type":"map","entries":[["id",562],["title","Return of Stack Variable Address"],["url","https://cwe.mitre.org/data/definitions/562.html"],["type","child"],["description","A function returns the address of a stack variable, which will cause unintended program behavior, typically in the form of a crash."],["extended_description","Because local variables are allocated on the stack, when a program returns a pointer to a local variable, it is returning a stack address. A subsequent function call is likely to re-use this same stack address, thereby overwriting the value of the pointer, which no longer corresponds to the same variable since a function's stack frame is invalidated when it returns. At best this will cause the value of the pointer to change unexpectedly. In many cases it causes the program to crash the next time the pointer is dereferenced."]]}],["563",{"type":"map","entries":[["id",563],["title","Assignment to Variable without Use"],["url","https://cwe.mitre.org/data/definitions/563.html"],["type","child"],["description","The variable's value is assigned but never used, making it a dead store."],["extended_description","After the assignment, the variable is either assigned another value or goes out of scope. It is likely that the variable is simply vestigial, but it is also possible that the unused variable points out a bug."]]}],["581",{"type":"map","entries":[["id",581],["title","Object Model Violation: Just One of Equals and Hashcode Defined"],["url","https://cwe.mitre.org/data/definitions/581.html"],["type","child"],["description","The product does not maintain equal hashcodes for equal objects."],["extended_description","Java objects are expected to obey a number of invariants related to equality. One of these invariants is that equal objects must have equal hashcodes. In other words, if a.equals(b) == true then a.hashCode() == b.hashCode()."]]}],["586",{"type":"map","entries":[["id",586],["title","Explicit Call to Finalize()"],["url","https://cwe.mitre.org/data/definitions/586.html"],["type","child"],["description","The product makes an explicit call to the finalize() method from outside the finalizer."],["extended_description","While the Java Language Specification allows an object's finalize() method to be called from outside the finalizer, doing so is usually a bad idea. For example, calling finalize() explicitly means that finalize() will be called more than once: the first time will be the explicit call and the last time will be the call that is made after the object is garbage collected."]]}],["605",{"type":"map","entries":[["id",605],["title","Multiple Binds to the Same Port"],["url","https://cwe.mitre.org/data/definitions/605.html"],["type","child"],["description","When multiple sockets are allowed to bind to the same port, other services on that port may be stolen or spoofed."],["extended_description","On most systems, a combination of setting the SO_REUSEADDR socket option, and a call to bind() allows any process to bind to a port to which a previous process has bound with INADDR_ANY. This allows a user to bind to the specific address of a server bound to INADDR_ANY on an unprivileged port, and steal its UDP packets/TCP connection."]]}],["628",{"type":"map","entries":[["id",628],["title","Function Call with Incorrectly Specified Arguments"],["url","https://cwe.mitre.org/data/definitions/628.html"],["type","child"],["description","The product calls a function, procedure, or routine with arguments that are not correctly specified, leading to always-incorrect behavior and resultant weaknesses."],["extended_description","There are multiple ways in which this weakness can be introduced, including:\n\nthe wrong variable or reference;\nan incorrect number of arguments;\nincorrect order of arguments;\nwrong type of arguments; or\nwrong value."]]}],["654",{"type":"map","entries":[["id",654],["title","Reliance on a Single Factor in a Security Decision"],["url","https://cwe.mitre.org/data/definitions/654.html"],["type","child"],["description","A protection mechanism relies exclusively, or to a large extent, on the evaluation of a single condition or the integrity of a single object or entity in order to make a decision about granting access to restricted resources or functionality."],["extended_description",null]]}],["656",{"type":"map","entries":[["id",656],["title","Reliance on Security Through Obscurity"],["url","https://cwe.mitre.org/data/definitions/656.html"],["type","child"],["description","The product uses a protection mechanism whose strength depends heavily on its obscurity, such that knowledge of its algorithms or key data is sufficient to defeat the mechanism."],["extended_description","This reliance on \"security through obscurity\" can produce resultant weaknesses if an attacker is able to reverse engineer the inner workings of the mechanism. Note that obscurity can be one small part of defense in depth, since it can create more work for an attacker; however, it is a significant risk if used as the primary means of protection."]]}],["694",{"type":"map","entries":[["id",694],["title","Use of Multiple Resources with Duplicate Identifier"],["url","https://cwe.mitre.org/data/definitions/694.html"],["type","child"],["description","The product uses multiple resources that can have the same identifier, in a context in which unique identifiers are required."],["extended_description","If the product assumes that each resource has a unique identifier, the product could operate on the wrong resource if attackers can cause multiple resources to be associated with the same identifier."]]}],["807",{"type":"map","entries":[["id",807],["title","Reliance on Untrusted Inputs in a Security Decision"],["url","https://cwe.mitre.org/data/definitions/807.html"],["type","child"],["description","The product uses a protection mechanism that relies on the existence or values of an input, but the input can be modified by an untrusted actor in a way that bypasses the protection mechanism."],["extended_description","Developers may assume that inputs such as cookies, environment variables, and hidden form fields cannot be modified. However, an attacker could change these inputs using customized clients or other attacks. This change might not be detected. When security decisions such as authentication and authorization are made based on the values of these inputs, attackers can bypass the security of the software.\nWithout sufficient encryption, integrity checking, or other mechanism, any input that originates from an outsider cannot be trusted."]]}],["1041",{"type":"map","entries":[["id",1041],["title","Use of Redundant Code"],["url","https://cwe.mitre.org/data/definitions/1041.html"],["type","child"],["description","The product has multiple functions, methods, procedures, macros, etc. that\n\t\t\t\t\tcontain the same code."],["extended_description",null]]}],["1043",{"type":"map","entries":[["id",1043],["title","Data Element Aggregating an Excessively Large Number of Non-Primitive Elements"],["url","https://cwe.mitre.org/data/definitions/1043.html"],["type","child"],["description","The product uses a data element that has an excessively large\n\t\t\t\t\tnumber of sub-elements with non-primitive data types such as structures or aggregated objects."],["extended_description","While the interpretation of \"excessively large\" may vary for each product or developer, CISQ recommends a default of 5 sub-elements."]]}],["1044",{"type":"map","entries":[["id",1044],["title","Architecture with Number of Horizontal Layers Outside of Expected Range"],["url","https://cwe.mitre.org/data/definitions/1044.html"],["type","child"],["description","The product's architecture contains too many - or too few -\n\t\t\t\t\thorizontal layers."],["extended_description","While the interpretation of \"expected range\" may vary for each product or developer, CISQ recommends a default minimum of 4 layers and maximum of 8 layers."]]}],["1045",{"type":"map","entries":[["id",1045],["title","Parent Class with a Virtual Destructor and a Child Class without a Virtual Destructor"],["url","https://cwe.mitre.org/data/definitions/1045.html"],["type","child"],["description","A parent class has a virtual destructor method, but the parent has a child class that does not have a virtual destructor."],["extended_description",null]]}],["1046",{"type":"map","entries":[["id",1046],["title","Creation of Immutable Text Using String Concatenation"],["url","https://cwe.mitre.org/data/definitions/1046.html"],["type","child"],["description","The product creates an immutable text string using string concatenation operations."],["extended_description","When building a string via a looping feature (e.g., a FOR or WHILE loop), the use of += to append to the existing string will result in the creation of a new object with each iteration, which can be inefficient in comparison with use of text buffer data elements."]]}],["1048",{"type":"map","entries":[["id",1048],["title","Invokable Control Element with Large Number of Outward Calls"],["url","https://cwe.mitre.org/data/definitions/1048.html"],["type","child"],["description","The code contains callable control elements that\n         contain an excessively large number of references to other\n         application objects external to the context of the callable,\n         i.e. a Fan-Out value that is excessively large."],["extended_description","While the interpretation of \"excessively large Fan-Out value\" may vary for each product or developer, CISQ recommends a default of 5 referenced objects."]]}],["1049",{"type":"map","entries":[["id",1049],["title","Excessive Data Query Operations in a Large Data Table"],["url","https://cwe.mitre.org/data/definitions/1049.html"],["type","child"],["description","The product performs a data query with a large number of joins\n\t\t\t\t\tand sub-queries on a large data table."],["extended_description","While the interpretation of \"large data table\" and \"large number of joins or sub-queries\" may vary for each product or developer, CISQ recommends a default of 1 million rows for a \"large\" data table, a default minimum of 5 joins, and a default minimum of 3 sub-queries."]]}],["1050",{"type":"map","entries":[["id",1050],["title","Excessive Platform Resource Consumption within a Loop"],["url","https://cwe.mitre.org/data/definitions/1050.html"],["type","child"],["description","The product has a loop body or loop condition that contains a control element that directly or\n\t\t\t\t\tindirectly consumes platform resources, e.g. messaging, sessions, locks, or file\n\t\t\t\t\tdescriptors."],["extended_description",""]]}],["1063",{"type":"map","entries":[["id",1063],["title","Creation of Class Instance within a Static Code Block"],["url","https://cwe.mitre.org/data/definitions/1063.html"],["type","child"],["description","A static code block creates an instance of a class."],["extended_description","This pattern identifies situations where a storable data element or member data element is initialized with a value in a block of code which is declared as static."]]}],["1065",{"type":"map","entries":[["id",1065],["title","Runtime Resource Management Control Element in a Component Built to Run on Application Servers"],["url","https://cwe.mitre.org/data/definitions/1065.html"],["type","child"],["description","The product uses deployed components from application servers, but it also uses low-level functions/methods for management of resources, instead of the API provided by the application server."],["extended_description",null]]}],["1066",{"type":"map","entries":[["id",1066],["title","Missing Serialization Control Element"],["url","https://cwe.mitre.org/data/definitions/1066.html"],["type","child"],["description","The product contains a serializable data element that does not\n\t\t\t\t\thave an associated serialization method."],["extended_description",null]]}],["1067",{"type":"map","entries":[["id",1067],["title","Excessive Execution of Sequential Searches of Data Resource"],["url","https://cwe.mitre.org/data/definitions/1067.html"],["type","child"],["description","The product contains a data query against an SQL table or view\n\t\t\t\t\tthat is configured in a way that does not utilize an index and may cause\n\t\t\t\t\tsequential searches to be performed."],["extended_description",null]]}],["1070",{"type":"map","entries":[["id",1070],["title","Serializable Data Element Containing non-Serializable Item Elements"],["url","https://cwe.mitre.org/data/definitions/1070.html"],["type","child"],["description","The product contains a serializable, storable data element such as a field or member,\n\t\t\t\t\tbut the data element contains member elements that are not\n\t\t\t\t\tserializable."],["extended_description",null]]}],["1071",{"type":"map","entries":[["id",1071],["title","Empty Code Block"],["url","https://cwe.mitre.org/data/definitions/1071.html"],["type","child"],["description","The source code contains a block that does not contain any code, i.e., the block is empty."],["extended_description","Empty code blocks can occur in the bodies of conditionals, function or method definitions, exception handlers, etc.  While an empty code block might be intentional, it might also indicate incomplete implementation, accidental code deletion, unexpected macro expansion, etc.  For some programming languages and constructs, an empty block might be allowed by the syntax, but the lack of any behavior within the block might violate a convention or API in such a way that it is an error."]]}],["1072",{"type":"map","entries":[["id",1072],["title","Data Resource Access without Use of Connection Pooling"],["url","https://cwe.mitre.org/data/definitions/1072.html"],["type","child"],["description","The product accesses a data resource through a database without using a\n\t\t\t\t\tconnection pooling capability."],["extended_description",null]]}],["1073",{"type":"map","entries":[["id",1073],["title","Non-SQL Invokable Control Element with Excessive Number of Data Resource Accesses"],["url","https://cwe.mitre.org/data/definitions/1073.html"],["type","child"],["description","The product contains a client with a function or method that contains a large number of data accesses/queries that are sent through a data manager, i.e., does not use efficient database capabilities."],["extended_description","While the interpretation of \"large number of data accesses/queries\" may vary for each product or developer, CISQ recommends a default maximum of 2 data accesses per function/method."]]}],["1079",{"type":"map","entries":[["id",1079],["title","Parent Class without Virtual Destructor Method"],["url","https://cwe.mitre.org/data/definitions/1079.html"],["type","child"],["description","A parent class contains one or more child classes, but the parent class does not have a virtual destructor method."],["extended_description",null]]}],["1082",{"type":"map","entries":[["id",1082],["title","Class Instance Self Destruction Control Element"],["url","https://cwe.mitre.org/data/definitions/1082.html"],["type","child"],["description","The code contains a class instance that calls the method or function to delete or destroy itself."],["extended_description","For example, in C++, \"delete this\" will cause the object to delete itself."]]}],["1084",{"type":"map","entries":[["id",1084],["title","Invokable Control Element with Excessive File or Data Access Operations"],["url","https://cwe.mitre.org/data/definitions/1084.html"],["type","child"],["description","A function or method contains too many\n\t\t\t\t\toperations that utilize a data manager or file resource."],["extended_description","While the interpretation of \"too many operations\" may vary for each product or developer, CISQ recommends a default maximum of 7 operations for the same data manager or file."]]}],["1085",{"type":"map","entries":[["id",1085],["title","Invokable Control Element with Excessive Volume of Commented-out Code"],["url","https://cwe.mitre.org/data/definitions/1085.html"],["type","child"],["description","A function, method, procedure, etc. contains an excessive amount of code that has been\n\t\t\t\t\tcommented out within its body."],["extended_description","While the interpretation of \"excessive volume\" may vary for each product or developer, CISQ recommends a default threshold of 2% of commented code."]]}],["1087",{"type":"map","entries":[["id",1087],["title","Class with Virtual Method without a Virtual Destructor"],["url","https://cwe.mitre.org/data/definitions/1087.html"],["type","child"],["description","A class contains a virtual method, but the method does not have an associated virtual destructor."],["extended_description",null]]}],["1089",{"type":"map","entries":[["id",1089],["title","Large Data Table with Excessive Number of Indices"],["url","https://cwe.mitre.org/data/definitions/1089.html"],["type","child"],["description","The product uses a large data table that contains an excessively large number of\n\t\t\t\t\tindices."],["extended_description","While the interpretation of \"large data table\" and \"excessively large number of indices\" may vary for each product or developer, CISQ recommends a default threshold of 1000000 rows for a \"large\" table and a default threshold of 3 indices."]]}],["1092",{"type":"map","entries":[["id",1092],["title","Use of Same Invokable Control Element in Multiple Architectural Layers"],["url","https://cwe.mitre.org/data/definitions/1092.html"],["type","child"],["description","The product uses the same control element across multiple\n\t\t\t\t\tarchitectural layers."],["extended_description",null]]}],["1094",{"type":"map","entries":[["id",1094],["title","Excessive Index Range Scan for a Data Resource"],["url","https://cwe.mitre.org/data/definitions/1094.html"],["type","child"],["description","The product contains an index range scan for a large data table,\n\t\t\t\t\tbut the scan can cover a large number of rows."],["extended_description","While the interpretation of \"large data table\" and \"excessive index range\" may vary for each product or developer, CISQ recommends a threshold of 1000000 table rows and a threshold of 10 for the index range."]]}],["1097",{"type":"map","entries":[["id",1097],["title","Persistent Storable Data Element without Associated Comparison Control Element"],["url","https://cwe.mitre.org/data/definitions/1097.html"],["type","child"],["description","The product uses a storable data element that does not have\n\t\t\t\t\tall of the associated functions or methods that are necessary to support\n\t\t\t\t\tcomparison."],["extended_description",null]]}],["1098",{"type":"map","entries":[["id",1098],["title","Data Element containing Pointer Item without Proper Copy Control Element"],["url","https://cwe.mitre.org/data/definitions/1098.html"],["type","child"],["description","The code contains a data element with a pointer that does not have an associated copy or constructor method."],["extended_description",null]]}],["1099",{"type":"map","entries":[["id",1099],["title","Inconsistent Naming Conventions for Identifiers"],["url","https://cwe.mitre.org/data/definitions/1099.html"],["type","child"],["description","The product's code, documentation, or other artifacts do not\n\t\t\t\t\tconsistently use the same naming conventions for variables, callables, groups of\n\t\t\t\t\trelated callables, I/O capabilities, data types, file names, or similar types of\n\t\t\t\t\telements."],["extended_description",null]]}],["1101",{"type":"map","entries":[["id",1101],["title","Reliance on Runtime Component in Generated Code"],["url","https://cwe.mitre.org/data/definitions/1101.html"],["type","child"],["description","The product uses automatically-generated code that cannot be\n\t\t\t\t\texecuted without a specific runtime support component."],["extended_description",null]]}],["1102",{"type":"map","entries":[["id",1102],["title","Reliance on Machine-Dependent Data Representation"],["url","https://cwe.mitre.org/data/definitions/1102.html"],["type","child"],["description","The code uses a data representation that relies on low-level\n\t\t\t\t\tdata representation or constructs that may vary across different processors,\n\t\t\t\t\tphysical machines, OSes, or other physical components."],["extended_description",null]]}],["1103",{"type":"map","entries":[["id",1103],["title","Use of Platform-Dependent Third Party Components"],["url","https://cwe.mitre.org/data/definitions/1103.html"],["type","child"],["description","The product relies on third-party components that do\n\t\t\t\t\tnot provide equivalent functionality across all desirable\n\t\t\t\t\tplatforms."],["extended_description",null]]}],["1104",{"type":"map","entries":[["id",1104],["title","Use of Unmaintained Third Party Components"],["url","https://cwe.mitre.org/data/definitions/1104.html"],["type","child"],["description","The product relies on
