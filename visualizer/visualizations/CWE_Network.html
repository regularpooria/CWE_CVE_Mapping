ml"],["type","child"],["description","The web server receives a URL or similar request from an upstream component and retrieves the contents of this URL, but it does not sufficiently ensure that the request is being sent to the expected destination."],["extended_description",null]]},{"type":"map","entries":[["id",924],["title","Improper Enforcement of Message Integrity During Transmission in a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/924.html"],["type","child"],["description","The product establishes a communication channel with an endpoint and receives a message from that endpoint, but it does not sufficiently ensure that the message was not modified during transmission."],["extended_description","Attackers might be able to modify the message and spoof the endpoint by interfering with the data as it crosses the network or by redirecting the connection to a system under their control."]]},{"type":"map","entries":[["id",940],["title","Improper Verification of Source of a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/940.html"],["type","child"],["description","The product establishes a communication channel to handle an incoming request that has been initiated by an actor, but it does not properly verify that the request is coming from the expected origin."],["extended_description","When an attacker can successfully establish a communication channel from an untrusted origin, the attacker may be able to gain privileges and access unexpected functionality."]]},{"type":"map","entries":[["id",941],["title","Incorrectly Specified Destination in a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/941.html"],["type","child"],["description","The product creates a communication channel to initiate an outgoing request to an actor, but it does not correctly specify the intended destination for that actor."],["extended_description","Attackers at the destination may be able to spoof trusted servers to steal data or cause a denial of service.\nThere are at least two distinct weaknesses that can cause the product to communicate with an unintended destination:\n\nIf the product allows an attacker to control which destination is specified, then the attacker can cause it to connect to an untrusted or malicious destination. For example, because UDP is a connectionless protocol, UDP packets can be spoofed by specifying a false source address in the packet; when the server receives the packet and sends a reply, it will specify a destination by using the source of the incoming packet - i.e., the false source. The server can then be tricked into sending traffic to the wrong host, which is effective for hiding the real source of an attack and for conducting a distributed denial of service (DDoS). As another example, server-side request forgery (SSRF) and XML External Entity (XXE) can be used to trick a server into making outgoing requests to hosts that cannot be directly accessed by the attacker due to firewall restrictions.\nIf the product incorrectly specifies the destination, then an attacker who can control this destination might be able to spoof trusted servers. While the most common occurrence is likely due to misconfiguration by an administrator, this can be resultant from other weaknesses. For example, the product might incorrectly parse an e-mail or IP address and send sensitive data to an unintended destination. As another example, an Android application may use a \"sticky broadcast\" to communicate with a receiver for a particular application, but since sticky broadcasts can be processed by *any* receiver, this can allow a malicious application to access restricted data that was only intended for a different application."]]},{"type":"map","entries":[["id",1327],["title","Binding to an Unrestricted IP Address"],["url","https://cwe.mitre.org/data/definitions/1327.html"],["type","child"],["description","The product assigns the address 0.0.0.0 for a database server, a cloud service/instance, or any computing resource that communicates remotely."],["extended_description","When a server binds to the address 0.0.0.0, it allows connections from every IP address on the local machine, effectively exposing the server to every possible network. This might be much broader access than intended by the developer or administrator, who might only be expecting the server to be reachable from a single interface/network."]]},{"type":"map","entries":[["id",1226],["title","Complexity Issues"],["url","https://cwe.mitre.org/data/definitions/1226.html"],["children",{"type":"map","entries":[["1043",{"type":"map","entries":[["id",1043],["title","Data Element Aggregating an Excessively Large Number of Non-Primitive Elements"],["url","https://cwe.mitre.org/data/definitions/1043.html"],["type","child"],["description","The product uses a data element that has an excessively large\n\t\t\t\t\tnumber of sub-elements with non-primitive data types such as structures or aggregated objects."],["extended_description","While the interpretation of \"excessively large\" may vary for each product or developer, CISQ recommends a default of 5 sub-elements."]]}],["1047",{"type":"map","entries":[["id",1047],["title","Modules with Circular Dependencies"],["url","https://cwe.mitre.org/data/definitions/1047.html"],["type","child"],["description","The product contains modules in which one module has references that cycle back to itself, i.e., there are circular dependencies."],["extended_description","As an example, with Java, this weakness might indicate cycles between packages."]]}],["1055",{"type":"map","entries":[["id",1055],["title","Multiple Inheritance from Concrete Classes"],["url","https://cwe.mitre.org/data/definitions/1055.html"],["type","child"],["description","The product contains a class with inheritance from more than\n\t\t\t\t\tone concrete class."],["extended_description",null]]}],["1056",{"type":"map","entries":[["id",1056],["title","Invokable Control Element with Variadic Parameters"],["url","https://cwe.mitre.org/data/definitions/1056.html"],["type","child"],["description","A named-callable or method control element has a signature that\n\t\t\t\t\tsupports a variable (variadic) number of parameters or arguments."],["extended_description",null]]}],["1060",{"type":"map","entries":[["id",1060],["title","Excessive Number of Inefficient Server-Side Data Accesses"],["url","https://cwe.mitre.org/data/definitions/1060.html"],["type","child"],["description","The product performs too many data queries without using efficient data processing functionality such as stored procedures."],["extended_description","While the interpretation of \"too many data queries\" may vary for each product or developer, CISQ recommends a default maximum of 5 data queries for an inefficient function/procedure."]]}],["1064",{"type":"map","entries":[["id",1064],["title","Invokable Control Element with Signature Containing an Excessive Number of Parameters"],["url","https://cwe.mitre.org/data/definitions/1064.html"],["type","child"],["description","The product contains a function, subroutine, or method whose signature has an unnecessarily large number of\n\t\t\t\t\tparameters/arguments."],["extended_description","While the interpretation of \"large number of parameters\" may vary for each product or developer, CISQ recommends a default maximum of 7 parameters/arguments."]]}],["1074",{"type":"map","entries":[["id",1074],["title","Class with Excessively Deep Inheritance"],["url","https://cwe.mitre.org/data/definitions/1074.html"],["type","child"],["description","A class has an inheritance level that is too high, i.e., it\n\t\t\t\t\thas a large number of parent classes."],["extended_description","While the interpretation of \"large number of parent classes\" may vary for each product or developer, CISQ recommends a default maximum of 7 parent classes."]]}],["1075",{"type":"map","entries":[["id",1075],["title","Unconditional Control Flow Transfer outside of Switch Block"],["url","https://cwe.mitre.org/data/definitions/1075.html"],["type","child"],["description","The product performs unconditional control transfer (such as a\n\t\t\t\t\t\"goto\") in code outside of a branching structure such as a switch\n\t\t\t\t\tblock."],["extended_description",null]]}],["1080",{"type":"map","entries":[["id",1080],["title","Source Code File with Excessive Number of Lines of Code"],["url","https://cwe.mitre.org/data/definitions/1080.html"],["type","child"],["description","A source code file has too many lines of\n\t\t\t\t\tcode."],["extended_description","While the interpretation of \"too many lines of code\" may vary for each product or developer, CISQ recommends a default threshold value of 1000."]]}],["1086",{"type":"map","entries":[["id",1086],["title","Class with Excessive Number of Child Classes"],["url","https://cwe.mitre.org/data/definitions/1086.html"],["type","child"],["description","A class contains an unnecessarily large number of\n\t\t\t\t\tchildren."],["extended_description","While the interpretation of \"large number of children\" may vary for each product or developer, CISQ recommends a default maximum of 10 child classes."]]}],["1095",{"type":"map","entries":[["id",1095],["title","Loop Condition Value Update within the Loop"],["url","https://cwe.mitre.org/data/definitions/1095.html"],["type","child"],["description","The product uses a loop with a control flow condition based on\n\t\t\t\t\ta value that is updated within the body of the loop."],["extended_description",null]]}],["1119",{"type":"map","entries":[["id",1119],["title","Excessive Use of Unconditional Branching"],["url","https://cwe.mitre.org/data/definitions/1119.html"],["type","child"],["description","The code uses too many unconditional branches (such as\n\t\t\t\t\t\"goto\")."],["extended_description",null]]}],["1121",{"type":"map","entries":[["id",1121],["title","Excessive McCabe Cyclomatic Complexity"],["url","https://cwe.mitre.org/data/definitions/1121.html"],["type","child"],["description","The code contains McCabe cyclomatic complexity that exceeds a\n\tdesirable maximum."],["extended_description",null]]}],["1122",{"type":"map","entries":[["id",1122],["title","Excessive Halstead Complexity"],["url","https://cwe.mitre.org/data/definitions/1122.html"],["type","child"],["description","The code is structured in a way that a Halstead complexity\n\t\t\t\t\tmeasure exceeds a desirable maximum."],["extended_description","A variety of Halstead complexity measures exist, such as program vocabulary size or volume."]]}],["1123",{"type":"map","entries":[["id",1123],["title","Excessive Use of Self-Modifying Code"],["url","https://cwe.mitre.org/data/definitions/1123.html"],["type","child"],["description","The product uses too much self-modifying code."],["extended_description",null]]}],["1124",{"type":"map","entries":[["id",1124],["title","Excessively Deep Nesting"],["url","https://cwe.mitre.org/data/definitions/1124.html"],["type","child"],["description","The code contains a callable or other code grouping in which\n\t\t\t\t\tthe nesting / branching is too deep."],["extended_description",null]]}],["1125",{"type":"map","entries":[["id",1125],["title","Excessive Attack Surface"],["url","https://cwe.mitre.org/data/definitions/1125.html"],["type","child"],["description","The product has an attack surface whose quantitative\n\t\t\t\t\tmeasurement exceeds a desirable maximum."],["extended_description","Originating from software security, an \"attack surface\" measure typically reflects the number of input points and output points that can be utilized by an untrusted party, i.e. a potential attacker. A larger attack surface provides more places to attack, and more opportunities for developers to introduce weaknesses.  In some cases, this measure may reflect other aspects of quality besides security; e.g., a product with many inputs and outputs may require a large number of tests in order to improve code coverage."]]}],["1333",{"type":"map","entries":[["id",1333],["title","Inefficient Regular Expression Complexity"],["url","https://cwe.mitre.org/data/definitions/1333.html"],["type","child"],["description","The product uses a regular expression with a worst-case computational complexity that is inefficient and possibly exponential."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are associated with things being overly complex."]]},{"type":"map","entries":[["id",1047],["title","Modules with Circular Dependencies"],["url","https://cwe.mitre.org/data/definitions/1047.html"],["type","child"],["description","The product contains modules in which one module has references that cycle back to itself, i.e., there are circular dependencies."],["extended_description","As an example, with Java, this weakness might indicate cycles between packages."]]},{"type":"map","entries":[["id",1055],["title","Multiple Inheritance from Concrete Classes"],["url","https://cwe.mitre.org/data/definitions/1055.html"],["type","child"],["description","The product contains a class with inheritance from more than\n\t\t\t\t\tone concrete class."],["extended_description",null]]},{"type":"map","entries":[["id",1056],["title","Invokable Control Element with Variadic Parameters"],["url","https://cwe.mitre.org/data/definitions/1056.html"],["type","child"],["description","A named-callable or method control element has a signature that\n\t\t\t\t\tsupports a variable (variadic) number of parameters or arguments."],["extended_description",null]]},{"type":"map","entries":[["id",1060],["title","Excessive Number of Inefficient Server-Side Data Accesses"],["url","https://cwe.mitre.org/data/definitions/1060.html"],["type","child"],["description","The product performs too many data queries without using efficient data processing functionality such as stored procedures."],["extended_description","While the interpretation of \"too many data queries\" may vary for each product or developer, CISQ recommends a default maximum of 5 data queries for an inefficient function/procedure."]]},{"type":"map","entries":[["id",1064],["title","Invokable Control Element with Signature Containing an Excessive Number of Parameters"],["url","https://cwe.mitre.org/data/definitions/1064.html"],["type","child"],["description","The product contains a function, subroutine, or method whose signature has an unnecessarily large number of\n\t\t\t\t\tparameters/arguments."],["extended_description","While the interpretation of \"large number of parameters\" may vary for each product or developer, CISQ recommends a default maximum of 7 parameters/arguments."]]},{"type":"map","entries":[["id",1074],["title","Class with Excessively Deep Inheritance"],["url","https://cwe.mitre.org/data/definitions/1074.html"],["type","child"],["description","A class has an inheritance level that is too high, i.e., it\n\t\t\t\t\thas a large number of parent classes."],["extended_description","While the interpretation of \"large number of parent classes\" may vary for each product or developer, CISQ recommends a default maximum of 7 parent classes."]]},{"type":"map","entries":[["id",1075],["title","Unconditional Control Flow Transfer outside of Switch Block"],["url","https://cwe.mitre.org/data/definitions/1075.html"],["type","child"],["description","The product performs unconditional control transfer (such as a\n\t\t\t\t\t\"goto\") in code outside of a branching structure such as a switch\n\t\t\t\t\tblock."],["extended_description",null]]},{"type":"map","entries":[["id",1080],["title","Source Code File with Excessive Number of Lines of Code"],["url","https://cwe.mitre.org/data/definitions/1080.html"],["type","child"],["description","A source code file has too many lines of\n\t\t\t\t\tcode."],["extended_description","While the interpretation of \"too many lines of code\" may vary for each product or developer, CISQ recommends a default threshold value of 1000."]]},{"type":"map","entries":[["id",1086],["title","Class with Excessive Number of Child Classes"],["url","https://cwe.mitre.org/data/definitions/1086.html"],["type","child"],["description","A class contains an unnecessarily large number of\n\t\t\t\t\tchildren."],["extended_description","While the interpretation of \"large number of children\" may vary for each product or developer, CISQ recommends a default maximum of 10 child classes."]]},{"type":"map","entries":[["id",1095],["title","Loop Condition Value Update within the Loop"],["url","https://cwe.mitre.org/data/definitions/1095.html"],["type","child"],["description","The product uses a loop with a control flow condition based on\n\t\t\t\t\ta value that is updated within the body of the loop."],["extended_description",null]]},{"type":"map","entries":[["id",1119],["title","Excessive Use of Unconditional Branching"],["url","https://cwe.mitre.org/data/definitions/1119.html"],["type","child"],["description","The code uses too many unconditional branches (such as\n\t\t\t\t\t\"goto\")."],["extended_description",null]]},{"type":"map","entries":[["id",1121],["title","Excessive McCabe Cyclomatic Complexity"],["url","https://cwe.mitre.org/data/definitions/1121.html"],["type","child"],["description","The code contains McCabe cyclomatic complexity that exceeds a\n\tdesirable maximum."],["extended_description",null]]},{"type":"map","entries":[["id",1122],["title","Excessive Halstead Complexity"],["url","https://cwe.mitre.org/data/definitions/1122.html"],["type","child"],["description","The code is structured in a way that a Halstead complexity\n\t\t\t\t\tmeasure exceeds a desirable maximum."],["extended_description","A variety of Halstead complexity measures exist, such as program vocabulary size or volume."]]},{"type":"map","entries":[["id",1123],["title","Excessive Use of Self-Modifying Code"],["url","https://cwe.mitre.org/data/definitions/1123.html"],["type","child"],["description","The product uses too much self-modifying code."],["extended_description",null]]},{"type":"map","entries":[["id",1124],["title","Excessively Deep Nesting"],["url","https://cwe.mitre.org/data/definitions/1124.html"],["type","child"],["description","The code contains a callable or other code grouping in which\n\t\t\t\t\tthe nesting / branching is too deep."],["extended_description",null]]},{"type":"map","entries":[["id",1125],["title","Excessive Attack Surface"],["url","https://cwe.mitre.org/data/definitions/1125.html"],["type","child"],["description","The product has an attack surface whose quantitative\n\t\t\t\t\tmeasurement exceeds a desirable maximum."],["extended_description","Originating from software security, an \"attack surface\" measure typically reflects the number of input points and output points that can be utilized by an untrusted party, i.e. a potential attacker. A larger attack surface provides more places to attack, and more opportunities for developers to introduce weaknesses.  In some cases, this measure may reflect other aspects of quality besides security; e.g., a product with many inputs and outputs may require a large number of tests in order to improve code coverage."]]},{"type":"map","entries":[["id",1333],["title","Inefficient Regular Expression Complexity"],["url","https://cwe.mitre.org/data/definitions/1333.html"],["type","child"],["description","The product uses a regular expression with a worst-case computational complexity that is inefficient and possibly exponential."],["extended_description",null]]},{"type":"map","entries":[["id",557],["title","Concurrency Issues"],["url","https://cwe.mitre.org/data/definitions/557.html"],["children",{"type":"map","entries":[["364",{"type":"map","entries":[["id",364],["title","Signal Handler Race Condition"],["url","https://cwe.mitre.org/data/definitions/364.html"],["type","child"],["description","The product uses a signal handler that introduces a race condition."],["extended_description","Race conditions frequently occur in signal handlers, since signal handlers support asynchronous actions. These race conditions have a variety of root causes and symptoms. Attackers may be able to exploit a signal handler race condition to cause the product state to be corrupted, possibly leading to a denial of service or even code execution.\nThese issues occur when non-reentrant functions, or state-sensitive actions occur in the signal handler, where they may be called at any time. These behaviors can violate assumptions being made by the \"regular\" code that is interrupted, or by other signal handlers that may also be invoked. If these functions are called at an inopportune moment - such as while a non-reentrant function is already running - memory corruption could occur that may be exploitable for code execution. Another signal race condition commonly found occurs when free is called within a signal handler, resulting in a double free and therefore a write-what-where condition. Even if a given pointer is set to NULL after it has been freed, a race condition still exists between the time the memory was freed and the pointer was set to NULL. This is especially problematic if the same signal handler has been set for more than one signal -- since it means that the signal handler itself may be reentered.\nThere are several known behaviors related to signal handlers that have received the label of \"signal handler race condition\":\n\nShared state (e.g. global data or static variables) that are accessible to both a signal handler and \"regular\" code\nShared state between a signal handler and other signal handlers\nUse of non-reentrant functionality within a signal handler - which generally implies that shared state is being used. For example, malloc() and free() are non-reentrant because they may use global or static data structures for managing memory, and they are indirectly used by innocent-seeming functions such as syslog(); these functions could be exploited for memory corruption and, possibly, code execution.\nAssociation of the same signal handler function with multiple signals - which might imply shared state, since the same code and resources are accessed. For example, this can be a source of double-free and use-after-free weaknesses.\nUse of setjmp and longjmp, or other mechanisms that prevent a signal handler from returning control back to the original functionality\nWhile not technically a race condition, some signal handlers are designed to be called at most once, and being called more than once can introduce security problems, even when there are not any concurrent calls to the signal handler. This can be a source of double-free and use-after-free weaknesses.\n\nSignal handler vulnerabilities are often classified based on the absence of a specific protection mechanism, although this style of classification is discouraged in CWE because programmers often have a choice of several different mechanisms for addressing the weakness. Such protection mechanisms may preserve exclusivity of access to the shared resource, and behavioral atomicity for the relevant code:\n\nAvoiding shared state\nUsing synchronization in the signal handler\nUsing synchronization in the regular code\nDisabling or masking other signals, which provides atomicity (which effectively ensures exclusivity)"]]}],["366",{"type":"map","entries":[["id",366],["title","Race Condition within a Thread"],["url","https://cwe.mitre.org/data/definitions/366.html"],["type","child"],["description","If two threads of execution use a resource simultaneously, there exists the possibility that resources may be used while invalid, in turn making the state of execution undefined."],["extended_description",null]]}],["367",{"type":"map","entries":[["id",367],["title","Time-of-check Time-of-use (TOCTOU) Race Condition"],["url","https://cwe.mitre.org/data/definitions/367.html"],["type","child"],["description","The product checks the state of a resource before using that resource, but the resource's state can change between the check and the use in a way that invalidates the results of the check."],["extended_description",null]]}],["368",{"type":"map","entries":[["id",368],["title","Context Switching Race Condition"],["url","https://cwe.mitre.org/data/definitions/368.html"],["type","child"],["description","A product performs a series of non-atomic actions to switch between contexts that cross privilege or other security boundaries, but a race condition allows an attacker to modify or misrepresent the product's behavior during the switch."],["extended_description","This is commonly seen in web browser vulnerabilities in which the attacker can perform certain actions while the browser is transitioning from a trusted to an untrusted domain, or vice versa, and the browser performs the actions on one domain using the trust level and resources of the other domain."]]}],["386",{"type":"map","entries":[["id",386],["title","Symbolic Name not Mapping to Correct Object"],["url","https://cwe.mitre.org/data/definitions/386.html"],["type","child"],["description","A constant symbolic reference to an object is used, even though the reference can resolve to a different object over time."],["extended_description",null]]}],["421",{"type":"map","entries":[["id",421],["title","Race Condition During Access to Alternate Channel"],["url","https://cwe.mitre.org/data/definitions/421.html"],["type","child"],["description","The product opens an alternate channel to communicate with an authorized user, but the channel is accessible to other actors."],["extended_description","This creates a race condition that allows an attacker to access the channel before the authorized user does."]]}],["663",{"type":"map","entries":[["id",663],["title","Use of a Non-reentrant Function in a Concurrent Context"],["url","https://cwe.mitre.org/data/definitions/663.html"],["type","child"],["description","The product calls a non-reentrant function in a concurrent context in which a competing code sequence (e.g. thread or signal handler) may have an opportunity to call the same function or otherwise influence its state."],["extended_description",null]]}],["820",{"type":"map","entries":[["id",820],["title","Missing Synchronization"],["url","https://cwe.mitre.org/data/definitions/820.html"],["type","child"],["description","The product utilizes a shared resource in a concurrent manner but does not attempt to synchronize access to the resource."],["extended_description","If access to a shared resource is not synchronized, then the resource may not be in a state that is expected by the product. This might lead to unexpected or insecure behaviors, especially if an attacker can influence the shared resource."]]}],["821",{"type":"map","entries":[["id",821],["title","Incorrect Synchronization"],["url","https://cwe.mitre.org/data/definitions/821.html"],["type","child"],["description","The product utilizes a shared resource in a concurrent manner, but it does not correctly synchronize access to the resource."],["extended_description","If access to a shared resource is not correctly synchronized, then the resource may not be in a state that is expected by the product. This might lead to unexpected or insecure behaviors, especially if an attacker can influence the shared resource."]]}],["1058",{"type":"map","entries":[["id",1058],["title","Invokable Control Element in Multi-Thread Context with non-Final Static Storable or Member Element"],["url","https://cwe.mitre.org/data/definitions/1058.html"],["type","child"],["description","The code contains a function or method that\n\t\t operates in a multi-threaded environment but owns an unsafe non-final\n\t\t                     static storable or member data element."],["extended_description",null]]}],["1322",{"type":"map","entries":[["id",1322],["title","Use of Blocking Code in Single-threaded, Non-blocking Context"],["url","https://cwe.mitre.org/data/definitions/1322.html"],["type","child"],["description","The product uses a non-blocking model that relies on a single threaded process\n\t\t\tfor features such as scalability, but it contains code that can block when it is invoked."],["extended_description","When an attacker can directly invoke the blocking code, or the blocking code can be affected by environmental conditions that can be influenced by an attacker, then this can lead to a denial of service by causing unexpected hang or freeze of the code. Examples of blocking code might be an expensive computation or calling\n\t\t\t\tblocking library calls, such as those that perform exclusive file operations or require a successful network operation.\nDue to limitations in multi-thread models, single-threaded\n\t\t\t\tmodels are used to overcome the resource constraints that are caused by using\n\t\t\t\tmany threads. In such a model, all code should generally be\n\t\t\t\tnon-blocking. If blocking code is called, then the event loop will\n\t\t\t\teffectively be stopped, which can be undesirable or dangerous.  Such\n\t\t\t\tmodels are used in Python asyncio, Vert.x, and Node.js, or other\n\t\t\t\tcustom event loop code."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to concurrent use of shared resources."]]},{"type":"map","entries":[["id",364],["title","Signal Handler Race Condition"],["url","https://cwe.mitre.org/data/definitions/364.html"],["type","child"],["description","The product uses a signal handler that introduces a race condition."],["extended_description","Race conditions frequently occur in signal handlers, since signal handlers support asynchronous actions. These race conditions have a variety of root causes and symptoms. Attackers may be able to exploit a signal handler race condition to cause the product state to be corrupted, possibly leading to a denial of service or even code execution.\nThese issues occur when non-reentrant functions, or state-sensitive actions occur in the signal handler, where they may be called at any time. These behaviors can violate assumptions being made by the \"regular\" code that is interrupted, or by other signal handlers that may also be invoked. If these functions are called at an inopportune moment - such as while a non-reentrant function is already running - memory corruption could occur that may be exploitable for code execution. Another signal race condition commonly found occurs when free is called within a signal handler, resulting in a double free and therefore a write-what-where condition. Even if a given pointer is set to NULL after it has been freed, a race condition still exists between the time the memory was freed and the pointer was set to NULL. This is especially problematic if the same signal handler has been set for more than one signal -- since it means that the signal handler itself may be reentered.\nThere are several known behaviors related to signal handlers that have received the label of \"signal handler race condition\":\n\nShared state (e.g. global data or static variables) that are accessible to both a signal handler and \"regular\" code\nShared state between a signal handler and other signal handlers\nUse of non-reentrant functionality within a signal handler - which generally implies that shared state is being used. For example, malloc() and free() are non-reentrant because they may use global or static data structures for managing memory, and they are indirectly used by innocent-seeming functions such as syslog(); these functions could be exploited for memory corruption and, possibly, code execution.\nAssociation of the same signal handler function with multiple signals - which might imply shared state, since the same code and resources are accessed. For example, this can be a source of double-free and use-after-free weaknesses.\nUse of setjmp and longjmp, or other mechanisms that prevent a signal handler from returning control back to the original functionality\nWhile not technically a race condition, some signal handlers are designed to be called at most once, and being called more than once can introduce security problems, even when there are not any concurrent calls to the signal handler. This can be a source of double-free and use-after-free weaknesses.\n\nSignal handler vulnerabilities are often classified based on the absence of a specific protection mechanism, although this style of classification is discouraged in CWE because programmers often have a choice of several different mechanisms for addressing the weakness. Such protection mechanisms may preserve exclusivity of access to the shared resource, and behavioral atomicity for the relevant code:\n\nAvoiding shared state\nUsing synchronization in the signal handler\nUsing synchronization in the regular code\nDisabling or masking other signals, which provides atomicity (which effectively ensures exclusivity)"]]},{"type":"map","entries":[["id",366],["title","Race Condition within a Thread"],["url","https://cwe.mitre.org/data/definitions/366.html"],["type","child"],["description","If two threads of execution use a resource simultaneously, there exists the possibility that resources may be used while invalid, in turn making the state of execution undefined."],["extended_description",null]]},{"type":"map","entries":[["id",367],["title","Time-of-check Time-of-use (TOCTOU) Race Condition"],["url","https://cwe.mitre.org/data/definitions/367.html"],["type","child"],["description","The product checks the state of a resource before using that resource, but the resource's state can change between the check and the use in a way that invalidates the results of the check."],["extended_description",null]]},{"type":"map","entries":[["id",368],["title","Context Switching Race Condition"],["url","https://cwe.mitre.org/data/definitions/368.html"],["type","child"],["description","A product performs a series of non-atomic actions to switch between contexts that cross privilege or other security boundaries, but a race condition allows an attacker to modify or misrepresent the product's behavior during the switch."],["extended_description","This is commonly seen in web browser vulnerabilities in which the attacker can perform certain actions while the browser is transitioning from a trusted to an untrusted domain, or vice versa, and the browser performs the actions on one domain using the trust level and resources of the other domain."]]},{"type":"map","entries":[["id",386],["title","Symbolic Name not Mapping to Correct Object"],["url","https://cwe.mitre.org/data/definitions/386.html"],["type","child"],["description","A constant symbolic reference to an object is used, even though the reference can resolve to a different object over time."],["extended_description",null]]},{"type":"map","entries":[["id",421],["title","Race Condition During Access to Alternate Channel"],["url","https://cwe.mitre.org/data/definitions/421.html"],["type","child"],["description","The product opens an alternate channel to communicate with an authorized user, but the channel is accessible to other actors."],["extended_description","This creates a race condition that allows an attacker to access the channel before the authorized user does."]]},{"type":"map","entries":[["id",663],["title","Use of a Non-reentrant Function in a Concurrent Context"],["url","https://cwe.mitre.org/data/definitions/663.html"],["type","child"],["description","The product calls a non-reentrant function in a concurrent context in which a competing code sequence (e.g. thread or signal handler) may have an opportunity to call the same function or otherwise influence its state."],["extended_description",null]]},{"type":"map","entries":[["id",820],["title","Missing Synchronization"],["url","https://cwe.mitre.org/data/definitions/820.html"],["type","child"],["description","The product utilizes a shared resource in a concurrent manner but does not attempt to synchronize access to the resource."],["extended_description","If access to a shared resource is not synchronized, then the resource may not be in a state that is expected by the product. This might lead to unexpected or insecure behaviors, especially if an attacker can influence the shared resource."]]},{"type":"map","entries":[["id",821],["title","Incorrect Synchronization"],["url","https://cwe.mitre.org/data/definitions/821.html"],["type","child"],["description","The product utilizes a shared resource in a concurrent manner, but it does not correctly synchronize access to the resource."],["extended_description","If access to a shared resource is not correctly synchronized, then the resource may not be in a state that is expected by the product. This might lead to unexpected or insecure behaviors, especially if an attacker can influence the shared resource."]]},{"type":"map","entries":[["id",1058],["title","Invokable Control Element in Multi-Thread Context with non-Final Static Storable or Member Element"],["url","https://cwe.mitre.org/data/definitions/1058.html"],["type","child"],["description","The code contains a function or method that\n\t\t operates in a multi-threaded environment but owns an unsafe non-final\n\t\t                     static storable or member data element."],["extended_description",null]]},{"type":"map","entries":[["id",1322],["title","Use of Blocking Code in Single-threaded, Non-blocking Context"],["url","https://cwe.mitre.org/data/definitions/1322.html"],["type","child"],["description","The product uses a non-blocking model that relies on a single threaded process\n\t\t\tfor features such as scalability, but it contains code that can block when it is invoked."],["extended_description","When an attacker can directly invoke the blocking code, or the blocking code can be affected by environmental conditions that can be influenced by an attacker, then this can lead to a denial of service by causing unexpected hang or freeze of the code. Examples of blocking code might be an expensive computation or calling\n\t\t\t\tblocking library calls, such as those that perform exclusive file operations or require a successful network operation.\nDue to limitations in multi-thread models, single-threaded\n\t\t\t\tmodels are used to overcome the resource constraints that are caused by using\n\t\t\t\tmany threads. In such a model, all code should generally be\n\t\t\t\tnon-blocking. If blocking code is called, then the event loop will\n\t\t\t\teffectively be stopped, which can be undesirable or dangerous.  Such\n\t\t\t\tmodels are used in Python asyncio, Vert.x, and Node.js, or other\n\t\t\t\tcustom event loop code."]]},{"type":"map","entries":[["id",255],["title","Credentials Management Errors"],["url","https://cwe.mitre.org/data/definitions/255.html"],["children",{"type":"map","entries":[["256",{"type":"map","entries":[["id",256],["title","Plaintext Storage of a Password"],["url","https://cwe.mitre.org/data/definitions/256.html"],["type","child"],["description","The product stores a password in plaintext within resources such as memory or files."],["extended_description",null]]}],["257",{"type":"map","entries":[["id",257],["title","Storing Passwords in a Recoverable Format"],["url","https://cwe.mitre.org/data/definitions/257.html"],["type","child"],["description","The storage of passwords in a recoverable format makes them subject to password reuse attacks by malicious users. In fact, it should be noted that recoverable encrypted passwords provide no significant benefit over plaintext passwords since they are subject not only to reuse by malicious attackers but also by malicious insiders. If a system administrator can recover a password directly, or use a brute force search on the available information, the administrator can use the password on other accounts."],["extended_description",null]]}],["260",{"type":"map","entries":[["id",260],["title","Password in Configuration File"],["url","https://cwe.mitre.org/data/definitions/260.html"],["type","child"],["description","The product stores a password in a configuration file that might be accessible to actors who do not know the password."],["extended_description","This can result in compromise of the system for which the password is used. An attacker could gain access to this file and learn the stored password or worse yet, change the password to one of their choosing."]]}],["261",{"type":"map","entries":[["id",261],["title","Weak Encoding for Password"],["url","https://cwe.mitre.org/data/definitions/261.html"],["type","child"],["description","Obscuring a password with a trivial encoding does not protect the password."],["extended_description","Password management issues occur when a password is stored in plaintext in an application's properties or configuration file. A programmer can attempt to remedy the password management problem by obscuring the password with an encoding function, such as base 64 encoding, but this effort does not adequately protect the password."]]}],["262",{"type":"map","entries":[["id",262],["title","Not Using Password Aging"],["url","https://cwe.mitre.org/data/definitions/262.html"],["type","child"],["description","The product does not have a mechanism in place for managing password aging."],["extended_description","Password aging (or password rotation) is a policy that forces users to change their passwords after a defined time period passes, such as every 30 or 90 days. Without mechanisms such as aging, users might not change their passwords in a timely manner.\nNote that while password aging was once considered an important security feature, it has since fallen out of favor by many, because it is not as effective against modern threats compared to other mechanisms such as slow hashes. In addition, forcing frequent changes can unintentionally encourage users to select less-secure passwords. However, password aging is still in use due to factors such as compliance requirements, e.g., Payment Card Industry Data Security Standard (PCI DSS)."]]}],["263",{"type":"map","entries":[["id",263],["title","Password Aging with Long Expiration"],["url","https://cwe.mitre.org/data/definitions/263.html"],["type","child"],["description","The product supports password aging, but the expiration period is too long."],["extended_description","Password aging (or password rotation) is a policy that forces users to change their passwords after a defined time period passes, such as every 30 or 90 days. A long expiration provides more time for attackers to conduct password cracking before users are forced to change to a new password.\nNote that while password aging was once considered an important security feature, it has since fallen out of favor by many, because it is not as effective against modern threats compared to other mechanisms such as slow hashes. In addition, forcing frequent changes can unintentionally encourage users to select less-secure passwords. However, password aging is still in use due to factors such as compliance requirements, e.g., Payment Card Industry Data Security Standard (PCI DSS)."]]}],["324",{"type":"map","entries":[["id",324],["title","Use of a Key Past its Expiration Date"],["url","https://cwe.mitre.org/data/definitions/324.html"],["type","child"],["description","The product uses a cryptographic key or password past its expiration date, which diminishes its safety significantly by increasing the timing window for cracking attacks against that key."],["extended_description","While the expiration of keys does not necessarily ensure that they are compromised, it is a significant concern that keys which remain in use for prolonged periods of time have a decreasing probability of integrity. For this reason, it is important to replace keys within a period of time proportional to their strength."]]}],["521",{"type":"map","entries":[["id",521],["title","Weak Password Requirements"],["url","https://cwe.mitre.org/data/definitions/521.html"],["type","child"],["description","The product does not require that users should have strong passwords."],["extended_description",null]]}],["523",{"type":"map","entries":[["id",523],["title","Unprotected Transport of Credentials"],["url","https://cwe.mitre.org/data/definitions/523.html"],["type","child"],["description","Login pages do not use adequate measures to protect the user name and password while they are in transit from the client to the server."],["extended_description",null]]}],["549",{"type":"map","entries":[["id",549],["title","Missing Password Field Masking"],["url","https://cwe.mitre.org/data/definitions/549.html"],["type","child"],["description","The product does not mask passwords during entry, increasing the potential for attackers to observe and capture passwords."],["extended_description",null]]}],["620",{"type":"map","entries":[["id",620],["title","Unverified Password Change"],["url","https://cwe.mitre.org/data/definitions/620.html"],["type","child"],["description","When setting a new password for a user, the product does not require knowledge of the original password, or using another form of authentication."],["extended_description","This could be used by an attacker to change passwords for another user, thus gaining the privileges associated with that user."]]}],["640",{"type":"map","entries":[["id",640],["title","Weak Password Recovery Mechanism for Forgotten Password"],["url","https://cwe.mitre.org/data/definitions/640.html"],["type","child"],["description","The product contains a mechanism for users to recover or change their passwords without knowing the original password, but the mechanism is weak."],["extended_description","It is common for an application to have a mechanism that provides a means for a user to gain access to their account in the event they forget their password. Very often the password recovery mechanism is weak, which has the effect of making it more likely that it would be possible for a person other than the legitimate system user to gain access to that user's account. Weak password recovery schemes completely undermine a strong password authentication scheme.\nThis weakness may be that the security question is too easy to guess or find an answer to (e.g. because the question is too common, or the answers can be found using social media). Or there might be an implementation weakness in the password recovery mechanism code that may for instance trick the system into e-mailing the new password to an e-mail account other than that of the user. There might be no throttling done on the rate of password resets so that a legitimate user can be denied service by an attacker if an attacker tries to recover their password in a rapid succession. The system may send the original password to the user rather than generating a new temporary password. In summary, password recovery functionality, if not carefully designed and implemented can often become the system's weakest link that can be misused in a way that would allow an attacker to gain unauthorized access to the system."]]}],["798",{"type":"map","entries":[["id",798],["title","Use of Hard-coded Credentials"],["url","https://cwe.mitre.org/data/definitions/798.html"],["type","child"],["description","The product contains hard-coded credentials, such as a password or cryptographic key."],["extended_description","There are two main variations:\n\nInbound: the product contains an authentication mechanism that checks the input credentials against a hard-coded set of credentials. In this variant, a default administration account is created, and a simple password is hard-coded into the product and associated with that account. This hard-coded password is the same for each installation of the product, and it usually cannot be changed or disabled by system administrators without manually modifying the program, or otherwise patching the product. It can also be difficult for the administrator to detect.\nOutbound: the product connects to another system or component, and it contains hard-coded credentials for connecting to that component. This variant applies to front-end systems that authenticate with a back-end service. The back-end service may require a fixed password that can be easily discovered. The programmer may simply hard-code those back-end credentials into the front-end product."]]}],["916",{"type":"map","entries":[["id",916],["title","Use of Password Hash With Insufficient Computational Effort"],["url","https://cwe.mitre.org/data/definitions/916.html"],["type","child"],["description","The product generates a hash for a password, but it uses a scheme that does not provide a sufficient level of computational effort that would make password cracking attacks infeasible or expensive."],["extended_description","Many password storage mechanisms compute a hash and store the hash, instead of storing the original password in plaintext. In this design, authentication involves accepting an incoming password, computing its hash, and comparing it to the stored hash.\nMany hash algorithms are designed to execute quickly with minimal overhead, even cryptographic hashes. However, this efficiency is a problem for password storage, because it can reduce an attacker's workload for brute-force password cracking. If an attacker can obtain the hashes through some other method (such as SQL injection on a database that stores hashes), then the attacker can store the hashes offline and use various techniques to crack the passwords by computing hashes efficiently. Without a built-in workload, modern attacks can compute large numbers of hashes, or even exhaust the entire space of all possible passwords, within a very short amount of time, using massively-parallel computing (such as cloud computing) and GPU, ASIC, or FPGA hardware. In such a scenario, an efficient hash algorithm helps the attacker.\nThere are several properties of a hash scheme that are relevant to its strength against an offline, massively-parallel attack:\n\nThe amount of CPU time required to compute the hash (\"stretching\")\nThe amount of memory required to compute the hash (\"memory-hard\" operations)\nIncluding a random value, along with the password, as input to the hash computation (\"salting\")\nGiven a hash, there is no known way of determining an input (e.g., a password) that produces this hash value, other than by guessing possible inputs (\"one-way\" hashing)\nRelative to the number of all possible hashes that can be generated by the scheme, there is a low likelihood of producing the same hash for multiple different inputs (\"collision resistance\")\n\nNote that the security requirements for the product may vary depending on the environment and the value of the passwords. Different schemes might not provide all of these properties, yet may still provide sufficient security for the environment. Conversely, a solution might be very strong in preserving one property, which still being very weak for an attack against another property, or it might not be able to significantly reduce the efficiency of a massively-parallel attack."]]}],["1392",{"type":"map","entries":[["id",1392],["title","Use of Default Credentials"],["url","https://cwe.mitre.org/data/definitions/1392.html"],["type","child"],["description","The product uses default credentials (such as passwords or cryptographic keys) for potentially critical functionality."],["extended_description","It is common practice for products to be designed to use\n\tdefault keys, passwords, or other mechanisms for\n\tauthentication.  The rationale is to simplify the\n\tmanufacturing process or the system administrator's task of\n\tinstallation and deployment into an enterprise. However, if\n\tadmins do not change the defaults, it is easier for attackers\n\tto bypass authentication quickly across multiple\n\torganizations."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the management of credentials."]]},{"type":"map","entries":[["id",256],["title","Plaintext Storage of a Password"],["url","https://cwe.mitre.org/data/definitions/256.html"],["type","child"],["description","The product stores a password in plaintext within resources such as memory or files."],["extended_description",null]]},{"type":"map","entries":[["id",257],["title","Storing Passwords in a Recoverable Format"],["url","https://cwe.mitre.org/data/definitions/257.html"],["type","child"],["description","The storage of passwords in a recoverable format makes them subject to password reuse attacks by malicious users. In fact, it should be noted that recoverable encrypted passwords provide no significant benefit over plaintext passwords since they are subject not only to reuse by malicious attackers but also by malicious insiders. If a system administrator can recover a password directly, or use a brute force search on the available information, the administrator can use the password on other accounts."],["extended_description",null]]},{"type":"map","entries":[["id",260],["title","Password in Configuration File"],["url","https://cwe.mitre.org/data/definitions/260.html"],["type","child"],["description","The product stores a password in a configuration file that might be accessible to actors who do not know the password."],["extended_description","This can result in compromise of the system for which the password is used. An attacker could gain access to this file and learn the stored password or worse yet, change the password to one of their choosing."]]},{"type":"map","entries":[["id",261],["title","Weak Encoding for Password"],["url","https://cwe.mitre.org/data/definitions/261.html"],["type","child"],["description","Obscuring a password with a trivial encoding does not protect the password."],["extended_description","Password management issues occur when a password is stored in plaintext in an application's properties or configuration file. A programmer can attempt to remedy the password management problem by obscuring the password with an encoding function, such as base 64 encoding, but this effort does not adequately protect the password."]]},{"type":"map","entries":[["id",262],["title","Not Using Password Aging"],["url","https://cwe.mitre.org/data/definitions/262.html"],["type","child"],["description","The product does not have a mechanism in place for managing password aging."],["extended_description","Password aging (or password rotation) is a policy that forces users to change their passwords after a defined time period passes, such as every 30 or 90 days. Without mechanisms such as aging, users might not change their passwords in a timely manner.\nNote that while password aging was once considered an important security feature, it has since fallen out of favor by many, because it is not as effective against modern threats compared to other mechanisms such as slow hashes. In addition, forcing frequent changes can unintentionally encourage users to select less-secure passwords. However, password aging is still in use due to factors such as compliance requirements, e.g., Payment Card Industry Data Security Standard (PCI DSS)."]]},{"type":"map","entries":[["id",263],["title","Password Aging with Long Expiration"],["url","https://cwe.mitre.org/data/definitions/263.html"],["type","child"],["description","The product supports password aging, but the expiration period is too long."],["extended_description","Password aging (or password rotation) is a policy that forces users to change their passwords after a defined time period passes, such as every 30 or 90 days. A long expiration provides more time for attackers to conduct password cracking before users are forced to change to a new password.\nNote that while password aging was once considered an important security feature, it has since fallen out of favor by many, because it is not as effective against modern threats compared to other mechanisms such as slow hashes. In addition, forcing frequent changes can unintentionally encourage users to select less-secure passwords. However, password aging is still in use due to factors such as compliance requirements, e.g., Payment Card Industry Data Security Standard (PCI DSS)."]]},{"type":"map","entries":[["id",324],["title","Use of a Key Past its Expiration Date"],["url","https://cwe.mitre.org/data/definitions/324.html"],["type","child"],["description","The product uses a cryptographic key or password past its expiration date, which diminishes its safety significantly by increasing the timing window for cracking attacks against that key."],["extended_description","While the expiration of keys does not necessarily ensure that they are compromised, it is a significant concern that keys which remain in use for prolonged periods of time have a decreasing probability of integrity. For this reason, it is important to replace keys within a period of time proportional to their strength."]]},{"type":"map","entries":[["id",521],["title","Weak Password Requirements"],["url","https://cwe.mitre.org/data/definitions/521.html"],["type","child"],["description","The product does not require that users should have strong passwords."],["extended_description",null]]},{"type":"map","entries":[["id",523],["title","Unprotected Transport of Credentials"],["url","https://cwe.mitre.org/data/definitions/523.html"],["type","child"],["description","Login pages do not use adequate measures to protect the user name and password while they are in transit from the client to the server."],["extended_description",null]]},{"type":"map","entries":[["id",549],["title","Missing Password Field Masking"],["url","https://cwe.mitre.org/data/definitions/549.html"],["type","child"],["description","The product does not mask passwords during entry, increasing the potential for attackers to observe and capture passwords."],["extended_description",null]]},{"type":"map","entries":[["id",620],["title","Unverified Password Change"],["url","https://cwe.mitre.org/data/definitions/620.html"],["type","child"],["description","When setting a new password for a user, the product does not require knowledge of the original password, or using another form of authentication."],["extended_description","This could be used by an attacker to change passwords for another user, red hash.\nMany hash algorithms are designed to execute quickly with minimal overhead, even cryptographic hashes. However, this efficiency is a problem for password storage, because it can reduce an attacker's workload for brute-force password cracking. If an attacker can obtain the hashes through some other method (such as SQL injection on a database that stores hashes), then the attacker can store the hashes offline and use various techniques to crack the passwords by computing hashes efficiently. Without a built-in workload, modern attacks can compute large numbers of hashes, or even exhaust the entire space of all possible passwords, within a very short amount of time, using massively-parallel computing (such as cloud computing) and GPU, ASIC, or FPGA hardware. In such a scenario, an efficient hash algorithm helps the attacker.\nThere are several properties of a hash scheme that are relevant to its strength against an offline, massively-parallel attack:\n\nThe amount of CPU time required to compute the hash (\"stretching\")\nThe amount of memory required to compute the hash (\"memory-hard\" operations)\nIncluding a random value, along with the password, as input to the hash computation (\"salting\")\nGiven a hash, there is no known way of determining an input (e.g., a password) that produces this hash value, other than by guessing possible inputs (\"one-way\" hashing)\nRelative to the number of all possible hashes that can be generated by the scheme, there is a low likelihood of producing the same hash for multiple different inputs (\"collision resistance\")\n\nNote that the security requirements for the product may vary depending on the environment and the value of the passwords. Different schemes might not provide all of these properties, yet may still provide sufficient security for the environment. Conversely, a solution might be very strong in preserving one property, which still being very weak for an attack against another property, or it might not be able to significantly reduce the efficiency of a massively-parallel attack."]]},{"type":"map","entries":[["id",1392],["title","Use of Default Credentials"],["url","https://cwe.mitre.org/data/definitions/1392.html"],["type","child"],["description","The product uses default credentials (such as passwords or cryptographic keys) for potentially critical functionality."],["extended_description","It is common practice for products to be designed to use\n\tdefault keys, passwords, or other mechanisms for\n\tauthentication.  The rationale is to simplify the\n\tmanufacturing process or the system administrator's task of\n\tinstallation and deployment into an enterprise. However, if\n\tadmins do not change the defaults, it is easier for attackers\n\tto bypass authentication quickly across multiple\n\torganizations."]]},{"type":"map","entries":[["id",310],["title","Cryptographic Issues"],["url","https://cwe.mitre.org/data/definitions/310.html"],["children",{"type":"map","entries":[["261",{"type":"map","entries":[["id",261],["title","Weak Encoding for Password"],["url","https://cwe.mitre.org/data/definitions/261.html"],["type","child"],["description","Obscuring a password with a trivial encoding does not protect the password."],["extended_description","Password management issues occur when a password is stored in plaintext in an application's properties or configuration file. A programmer can attempt to remedy the password management problem by obscuring the password with an encoding function, such as base 64 encoding, but this effort does not adequately protect the password."]]}],["324",{"type":"map","entries":[["id",324],["title","Use of a Key Past its Expiration Date"],["url","https://cwe.mitre.org/data/definitions/324.html"],["type","child"],["description","The product uses a cryptographic key or password past its expiration date, which diminishes its safety significantly by increasing the timing window for cracking attacks against that key."],["extended_description","While the expiration of keys does not necessarily ensure that they are compromised, it is a significant concern that keys which remain in use for prolonged periods of time have a decreasing probability of integrity. For this reason, it is important to replace keys within a period of time proportional to their strength."]]}],["325",{"type":"map","entries":[["id",325],["title","Missing Cryptographic Step"],["url","https://cwe.mitre.org/data/definitions/325.html"],["type","child"],["description","The product does not implement a required step in a cryptographic algorithm, resulting in weaker encryption than advertised by the algorithm."],["extended_description",null]]}],["328",{"type":"map","entries":[["id",328],["title","Use of Weak Hash"],["url","https://cwe.mitre.org/data/definitions/328.html"],["type","child"],["description","The product uses an algorithm that produces a digest (output value) that does not meet security expectations for a hash function that allows an adversary to reasonably determine the original input (preimage attack), find another input that can produce the same hash (2nd preimage attack), or find multiple inputs that evaluate to the same hash (birthday attack)."],["extended_description","A hash function is defined as an algorithm that maps arbitrarily sized data into a fixed-sized digest (output) such that the following properties hold:\n\nThe algorithm is not invertible (also called \"one-way\" or \"not reversible\")\nThe algorithm is deterministic; the same input produces the same digest every time\n\n\n\t     Building on this definition, a cryptographic hash function must also ensure that a malicious actor cannot leverage the hash function to have a reasonable chance of success at determining any of the following:\n\nthe original input (preimage attack), given only the digest\nanother input that can produce the same digest (2nd preimage attack), given the original input\na set of two or more inputs that evaluate to the same digest (birthday attack), given the actor can arbitrarily choose the inputs to be hashed and can do so a reasonable amount of times\n\nWhat is regarded as \"reasonable\" varies by context and threat model, but in general, \"reasonable\" could cover any attack that is more efficient than brute force (i.e., on average, attempting half of all possible combinations). Note that some attacks might be more efficient than brute force but are still not regarded as achievable in the real world.\nAny algorithm that does not meet the above conditions will generally be considered weak for general use in hashing.\nIn addition to algorithmic weaknesses, a hash function can be made weak by using the hash in a security context that breaks its security guarantees. For example, using a hash function without a salt for storing passwords (that are sufficiently short) could enable an adversary to create a \"rainbow table\" [REF-637] to recover the password under certain conditions; this attack works against such hash functions as MD5, SHA-1, and SHA-2."]]}],["331",{"type":"map","entries":[["id",331],["title","Insufficient Entropy"],["url","https://cwe.mitre.org/data/definitions/331.html"],["type","child"],["description","The product uses an algorithm or scheme that produces insufficient entropy, leaving patterns or clusters of values that are more likely to occur than others."],["extended_description",null]]}],["334",{"type":"map","entries":[["id",334],["title","Small Space of Random Values"],["url","https://cwe.mitre.org/data/definitions/334.html"],["type","child"],["description","The number of possible random values is smaller than needed by the product, making it more susceptible to brute force attacks."],["extended_description",null]]}],["335",{"type":"map","entries":[["id",335],["title","Incorrect Usage of Seeds in Pseudo-Random Number Generator (PRNG)"],["url","https://cwe.mitre.org/data/definitions/335.html"],["type","child"],["description","The product uses a Pseudo-Random Number Generator (PRNG) but does not correctly manage seeds."],["extended_description","PRNGs are deterministic and, while their output appears\n\t\t   random, they cannot actually create entropy. They rely on\n\t\t   cryptographically secure and unique seeds for entropy so\n\t\t   proper seeding is critical to the secure operation of the\n\t\t   PRNG.\n\n\t\t   Management of seeds could be broken down into two main areas:\n\t\t   \n\n\n\t\t   (1) protecting seeds as cryptographic material (such as a cryptographic key);\n\t\t\t \n\n\t\t   (2) whenever possible, using a uniquely generated seed from\n\t\t   a cryptographically secure source\n\t\t\t \n\n\n\t\t\t   PRNGs require a seed as input to generate a stream of\n\t\t\t   numbers that are functionally indistinguishable from\n\t\t\t   random numbers.  While the output is, in many cases,\n\t\t\t   sufficient for cryptographic uses, the output of any\n\t\t\t   PRNG is directly determined by the seed provided as\n\t\t\t   input. If the seed can be ascertained by a third party,\n\t\t\t   the entire output of the PRNG can be made known to\n\t\t\t   them. As such, the seed should be kept secret and\n\t\t\t   should ideally not be able to be guessed. For example,\n\t\t\t   the current time may be a poor seed. Knowing the\n\t\t\t   approximate time the PRNG was seeded greatly reduces\n\t\t\t   the possible key space.\n\t\t\t \n\n\t\t\t   Seeds do not necessarily need to be unique, but reusing seeds may open up attacks if the seed is discovered."]]}],["338",{"type":"map","entries":[["id",338],["title","Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"],["url","https://cwe.mitre.org/data/definitions/338.html"],["type","child"],["description","The product uses a Pseudo-Random Number Generator (PRNG) in a security context, but the PRNG's algorithm is not cryptographically strong."],["extended_description","When a non-cryptographic PRNG is used in a cryptographic context, it can expose the cryptography to certain types of attacks.\nOften a pseudo-random number generator (PRNG) is not designed for cryptography. Sometimes a mediocre source of randomness is sufficient or preferable for algorithms that use random numbers. Weak generators generally take less processing power and/or do not use the precious, finite, entropy sources on a system. While such PRNGs might have very useful features, these same features could be used to break the cryptography."]]}],["347",{"type":"map","entries":[["id",347],["title","Improper Verification of Cryptographic Signature"],["url","https://cwe.mitre.org/data/definitions/347.html"],["type","child"],["description","The product does not verify, or incorrectly verifies, the cryptographic signature for data."],["extended_description",null]]}],["916",{"type":"map","entries":[["id",916],["title","Use of Password Hash With Insufficient Computational Effort"],["url","https://cwe.mitre.org/data/definitions/916.html"],["type","child"],["description","The product generates a hash for a password, but it uses a scheme that does not provide a sufficient level of computational effort that would make password cracking attacks infeasible or expensive."],["extended_description","Many password storage mechanisms compute a hash and store the hash, instead of storing the original password in plaintext. In this design, authentication involves accepting an incoming password, computing its hash, and comparing it to the stored hash.\nMany hash algorithms are designed to execute quickly with minimal overhead, even cryptographic hashes. However, this efficiency is a problem for password storage, because it can reduce an attacker's workload for brute-force password cracking. If an attacker can obtain the hashes through some other method (such as SQL injection on a database that stores hashes), then the attacker can store the hashes offline and use various techniques to crack the passwords by computing hashes efficiently. Without a built-in workload, modern attacks can compute large numbers of hashes, or even exhaust the entire space of all possible passwords, within a very short amount of time, using massively-parallel computing (such as cloud computing) and GPU, ASIC, or FPGA hardware. In such a scenario, an efficient hash algorithm helps the attacker.\nThere are several properties of a hash scheme that are relevant to its strength against an offline, massively-parallel attack:\n\nThe amount of CPU time required to compute the hash (\"stretching\")\nThe amount of memory required to compute the hash (\"memory-hard\" operations)\nIncluding a random value, along with the password, as input to the hash computation (\"salting\")\nGiven a hash, there is no known way of determining an input (e.g., a password) that produces this hash value, other than by guessing possible inputs (\"one-way\" hashing)\nRelative to the number of all possible hashes that can be generated by the scheme, there is a low likelihood of producing the same hash for multiple different inputs (\"collision resistance\")\n\nNote that the security requirements for the product may vary depending on the environment and the value of the passwords. Different schemes might not provide all of these properties, yet may still provide sufficient security for the environment. Conversely, a solution might be very strong in preserving one property, which still being very weak for an attack against another property, or it might not be able to significantly reduce the efficiency of a massively-parallel attack."]]}],["1204",{"type":"map","entries":[["id",1204],["title","Generation of Weak Initialization Vector (IV)"],["url","https://cwe.mitre.org/data/definitions/1204.html"],["type","child"],["description","The product uses a cryptographic primitive that uses an Initialization\n\t\t\tVector (IV), but the product does not generate IVs that are\n\t\t\tsufficiently unpredictable or unique according to the expected\n\t\t\tcryptographic requirements for that primitive."],["extended_description","By design, some cryptographic primitives\n\t\t\t  (such as block ciphers) require that IVs\n\t\t\t  must have certain properties for the\n\t\t\t  uniqueness and/or unpredictability of an\n\t\t\t  IV. Primitives may vary in how important\n\t\t\t  these properties are. If these properties\n\t\t\t  are not maintained, e.g. by a bug in the\n\t\t\t  code, then the cryptography may be weakened\n\t\t\t  or broken by attacking the IVs themselves."]]}],["1240",{"type":"map","entries":[["id",1240],["title","Use of a Cryptographic Primitive with a Risky Implementation"],["url","https://cwe.mitre.org/data/definitions/1240.html"],["type","child"],["description","To fulfill the need for a cryptographic primitive, the product implements a cryptographic algorithm using a non-standard, unproven, or disallowed/non-compliant cryptographic implementation."],["extended_description","Cryptographic protocols and systems depend on cryptographic primitives (and associated algorithms) as their basic building blocks. Some common examples of primitives are digital signatures, one-way hash functions, ciphers, and public key cryptography; however, the notion of \"primitive\" can vary depending on point of view. See \"Terminology Notes\" for further explanation of some concepts.\nCryptographic primitives are defined to accomplish one very specific task in a precisely defined and mathematically reliable fashion. For example, suppose that for a specific cryptographic primitive (such as an encryption routine), the consensus is that the primitive can only be broken after trying out N different inputs (where the larger the value of N, the stronger the cryptography). For an encryption scheme like AES-256, one would expect N to be so large as to be infeasible to execute in a reasonable amount of time.\nIf a vulnerability is ever found that shows that one can break a cryptographic primitive in significantly less than the expected number of attempts, then that primitive is considered weakened (or sometimes in extreme cases, colloquially it is \"broken\"). As a result, anything using this cryptographic primitive would now be considered insecure or risky. Thus, even breaking or weakening a seemingly small cryptographic primitive has the potential to render the whole system vulnerable, due to its reliance on the primitive. A historical example can be found in TLS when using DES. One would colloquially call DES the cryptographic primitive for transport encryption in this version of TLS. In the past, DES was considered strong, because no weaknesses were found in it; importantly, DES has a key length of 56 bits. Trying N=2^56 keys was considered impractical for most actors. Unfortunately, attacking a system with 56-bit keys is now practical via brute force, which makes defeating DES encryption practical. It is now practical for an adversary to read any information sent under this version of TLS and use this information to attack the system. As a result, it can be claimed that this use of TLS is weak, and that any system depending on TLS with DES could potentially render the entire system vulnerable to attack.\nCryptographic primitives and associated algorithms are only considered safe after extensive research and review from experienced cryptographers from academia, industry, and government entities looking for any possible flaws. Furthermore, cryptographic primitives and associated algorithms are frequently reevaluated for safety when new mathematical and attack techniques are discovered.  As a result and over time, even well-known cryptographic primitives can lose their compliance status with the discovery of novel attacks that might either defeat the algorithm or reduce its robustness significantly.\nIf ad-hoc cryptographic primitives are implemented, it is almost certain that the implementation will be vulnerable to attacks that are well understood by cryptographers, resulting in the exposure of sensitive information and other consequences.\nThis weakness is even more difficult to manage for hardware-implemented deployment of cryptographic algorithms. First, because hardware is not patchable as easily as software, any flaw discovered after release and production typically cannot be fixed without a recall of the product. Secondly, the hardware product is often expected to work for years, during which time computation power available to the attacker only increases. Therefore, for hardware implementations of cryptographic primitives, it is absolutely essential that only strong, proven cryptographic primitives are used."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the design and implementation of data confidentiality and integrity. Frequently these deal with the use of encoding techniques, encryption libraries, and hashing algorithms. The weaknesses in this category could lead to a degradation of the quality data if they are not addressed."]]},{"type":"map","entries":[["id",325],["title","Missing Cryptographic Step"],["url","https://cwe.mitre.org/data/definitions/325.html"],["type","child"],["description","The product does not implement a required step in a cryptographic algorithm, resulting in weaker encryption than advertised by the algorithm."],["extended_description",null]]},{"type":"map","entries":[["id",328],["title","Use of Weak Hash"],["url","https://cwe.mitre.org/data/definitions/328.html"],["type","child"],["description","The product uses an algorithm that produces a digest (output value) that does not meet security expectations for a hash function that allows an adversary to reasonably determine the original input (preimage attack), find another input that can produce the same hash (2nd preimage attack), or find multiple inputs that evaluate to the same hash (birthday attack)."],["extended_description","A hash function is defined as an algorithm that maps arbitrarily sized data into a fixed-sized digest (output) such that the following properties hold:\n\nThe algorithm is not invertible (also called \"one-way\" or \"not reversible\")\nThe algorithm is deterministic; the same input produces the same digest every time\n\n\n\t     Building on this definition, a cryptographic hash function must also ensure that a malicious actor cannot leverage the hash function to have a reasonable chance of success at determining any of the following:\n\nthe original input (preimage attack), given only the digest\nanother input that can produce the same digest (2nd preimage attack), given the original input\na set of two or more inputs that evaluate to the same digest (birthday attack), given the actor can arbitrarily choose the inputs to be hashed and can do so a reasonable amount of times\n\nWhat is regarded as \"reasonable\" varies by context and threat model, but in general, \"reasonable\" could cover any attack that is more efficient than brute force (i.e., on average, attempting half of all possible combinations). Note that some attacks might be more efficient than brute force but are still not regarded as achievable in the real world.\nAny algorithm that does not meet the above conditions will generally be considered weak for general use in hashing.\nIn addition to algorithmic weaknesses, a hash function can be made weak by using the hash in a security context that breaks its security guarantees. For example, using a hash function without a salt for storing passwords (that are sufficiently short) could enable an adversary to create a \"rainbow table\" [REF-637] to recover the password under certain conditions; this attack works against such hash functions as MD5, SHA-1, and SHA-2."]]},{"type":"map","entries":[["id",331],["title","Insufficient Entropy"],["url","https://cwe.mitre.org/data/definitions/331.html"],["type","child"],["description","The product uses an algorithm or scheme that produces insufficient entropy, leaving patterns or clusters of values that are more likely to occur than others."],["extended_description",null]]},{"type":"map","entries":[["id",334],["title","Sma
