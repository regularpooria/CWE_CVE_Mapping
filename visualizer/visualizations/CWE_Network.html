ntrolled search path to find resources, but one or more locations in that path can be under the control of unintended actors."],["extended_description","Although this weakness can occur with any type of resource, it is frequently introduced when a product uses a directory search path to find executables or code libraries, but the path contains a directory that can be modified by an attacker, such as \"/tmp\" or the current working directory.\nIn Windows-based systems, when the LoadLibrary or LoadLibraryEx function is called with a DLL name that does not contain a fully qualified path, the function follows a search order that includes two path elements that might be uncontrolled:\n\nthe directory from which the program has been loaded\nthe current working directory\n\nIn some cases, the attack can be conducted remotely, such as when SMB or WebDAV network shares are used.\nOne or more locations in that path could include the Windows drive root or its subdirectories. This often exists in Linux-based code assuming the controlled nature of the root directory (/) or its subdirectories (/etc, etc), or a code that recursively accesses the parent directory.  In Windows, the drive root and some of its subdirectories have weak permissions by default, which makes them uncontrolled.\nIn some Unix-based systems, a PATH might be created that contains an empty element, e.g. by splicing an empty variable into the PATH. This empty element can be interpreted as equivalent to the current working directory, which might be an untrusted search element.\nIn software package management frameworks (e.g., npm, RubyGems, or PyPi), the framework may identify dependencies on third-party libraries or other packages, then consult a repository that contains the desired package. The framework may search a public repository before a private repository. This could be exploited by attackers by placing a malicious package in the public repository that has the same name as a package from the private repository. The search path might not be directly under control of the developer relying on the framework, but this search order effectively contains an untrusted element."]]}],["428",{"type":"map","entries":[["id",428],["title","Unquoted Search Path or Element"],["url","https://cwe.mitre.org/data/definitions/428.html"],["type","child"],["description","The product uses a search path that contains an unquoted element, in which the element contains whitespace or other separators. This can cause the product to access resources in a parent path."],["extended_description","If a malicious individual has access to the file system, it is possible to elevate privileges by inserting such a file as \"C:\\Program.exe\" to be run by a privileged program making use of WinExec."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the handling of files within a software system. Files, directories, and folders are so central to information technology that many different weaknesses and variants have been discovered."]]},{"type":"map","entries":[["id",22],["title","Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"],["url","https://cwe.mitre.org/data/definitions/22.html"],["type","child"],["description","The product uses external input to construct a pathname that is intended to identify a file or directory that is located underneath a restricted parent directory, but the product does not properly neutralize special elements within the pathname that can cause the pathname to resolve to a location that is outside of the restricted directory."],["extended_description","Many file operations are intended to take place within a restricted directory. By using special elements such as \"..\" and \"/\" separators, attackers can escape outside of the restricted location to access files or directories that are elsewhere on the system. One of the most common special elements is the \"../\" sequence, which in most modern operating systems is interpreted as the parent directory of the current location. This is referred to as relative path traversal. Path traversal also covers the use of absolute pathnames such as \"/usr/local/bin\" to access unexpected files. This is referred to as absolute path traversal."]]},{"type":"map","entries":[["id",41],["title","Improper Resolution of Path Equivalence"],["url","https://cwe.mitre.org/data/definitions/41.html"],["type","child"],["description","The product is vulnerable to file system contents disclosure through path equivalence. Path equivalence involves the use of special characters in file and directory names. The associated manipulations are intended to generate multiple names for the same object."],["extended_description","Path equivalence is usually employed in order to circumvent access controls expressed using an incomplete set of file name or file path representations. This is different from path traversal, wherein the manipulations are performed to generate a name for a different object."]]},{"type":"map","entries":[["id",59],["title","Improper Link Resolution Before File Access ('Link Following')"],["url","https://cwe.mitre.org/data/definitions/59.html"],["type","child"],["description","The product attempts to access a file based on the filename, but it does not properly prevent that filename from identifying a link or shortcut that resolves to an unintended resource."],["extended_description",null]]},{"type":"map","entries":[["id",66],["title","Improper Handling of File Names that Identify Virtual Resources"],["url","https://cwe.mitre.org/data/definitions/66.html"],["type","child"],["description","The product does not handle or incorrectly handles a file name that identifies a \"virtual\" resource that is not directly specified within the directory that is associated with the file name, causing the product to perform file-based operations on a resource that is not a file."],["extended_description","Virtual file names are represented like normal file names, but they are effectively aliases for other resources that do not behave like normal files. Depending on their functionality, they could be alternate entities. They are not necessarily listed in directories."]]},{"type":"map","entries":[["id",378],["title","Creation of Temporary File With Insecure Permissions"],["url","https://cwe.mitre.org/data/definitions/378.html"],["type","child"],["description","Opening temporary files without appropriate measures or controls can leave the file, its contents and any function that it impacts vulnerable to attack."],["extended_description",null]]},{"type":"map","entries":[["id",379],["title","Creation of Temporary File in Directory with Insecure Permissions"],["url","https://cwe.mitre.org/data/definitions/379.html"],["type","child"],["description","The product creates a temporary file in a directory whose permissions allow unintended actors to determine the file's existence or otherwise access that file."],["extended_description","On some operating systems, the fact that the temporary file exists may be apparent to any user with sufficient privileges to access that directory. Since the file is visible, the application that is using the temporary file could be known. If one has access to list the processes on the system, the attacker has gained information about what the user is doing at that time. By correlating this with the applications the user is running, an attacker could potentially discover what a user's actions are. From this, higher levels of security could be breached."]]},{"type":"map","entries":[["id",426],["title","Untrusted Search Path"],["url","https://cwe.mitre.org/data/definitions/426.html"],["type","child"],["description","The product searches for critical resources using an externally-supplied search path that can point to resources that are not under the product's direct control."],["extended_description","This might allow attackers to execute their own programs, access unauthorized data files, or modify configuration in unexpected ways. If the product uses a search path to locate critical resources such as programs, then an attacker could modify that search path to point to a malicious program, which the targeted product would then execute. The problem extends to any type of critical resource that the product trusts.\nSome of the most common variants of untrusted search path are:\n\nIn various UNIX and Linux-based systems, the PATH environment variable may be consulted to locate executable programs, and LD_PRELOAD may be used to locate a separate library.\nIn various Microsoft-based systems, the PATH environment variable is consulted to locate a DLL, if the DLL is not found in other paths that appear earlier in the search order."]]},{"type":"map","entries":[["id",427],["title","Uncontrolled Search Path Element"],["url","https://cwe.mitre.org/data/definitions/427.html"],["type","child"],["description","The product uses a fixed or controlled search path to find resources, but one or more locations in that path can be under the control of unintended actors."],["extended_description","Although this weakness can occur with any type of resource, it is frequently introduced when a product uses a directory search path to find executables or code libraries, but the path contains a directory that can be modified by an attacker, such as \"/tmp\" or the current working directory.\nIn Windows-based systems, when the LoadLibrary or LoadLibraryEx function is called with a DLL name that does not contain a fully qualified path, the function follows a search order that includes two path elements that might be uncontrolled:\n\nthe directory from which the program has been loaded\nthe current working directory\n\nIn some cases, the attack can be conducted remotely, such as when SMB or WebDAV network shares are used.\nOne or more locations in that path could include the Windows drive root or its subdirectories. This often exists in Linux-based code assuming the controlled nature of the root directory (/) or its subdirectories (/etc, etc), or a code that recursively accesses the parent directory.  In Windows, the drive root and some of its subdirectories have weak permissions by default, which makes them uncontrolled.\nIn some Unix-based systems, a PATH might be created that contains an empty element, e.g. by splicing an empty variable into the PATH. This empty element can be interpreted as equivalent to the current working directory, which might be an untrusted search element.\nIn software package management frameworks (e.g., npm, RubyGems, or PyPi), the framework may identify dependencies on third-party libraries or other packages, then consult a repository that contains the desired package. The framework may search a public repository before a private repository. This could be exploited by attackers by placing a malicious package in the public repository that has the same name as a package from the private repository. The search path might not be directly under control of the developer relying on the framework, but this search order effectively contains an untrusted element."]]},{"type":"map","entries":[["id",428],["title","Unquoted Search Path or Element"],["url","https://cwe.mitre.org/data/definitions/428.html"],["type","child"],["description","The product uses a search path that contains an unquoted element, in which the element contains whitespace or other separators. This can cause the product to access resources in a parent path."],["extended_description","If a malicious individual has access to the file system, it is possible to elevate privileges by inserting such a file as \"C:\\Program.exe\" to be run by a privileged program making use of WinExec."]]},{"type":"map","entries":[["id",1227],["title","Encapsulation Issues"],["url","https://cwe.mitre.org/data/definitions/1227.html"],["children",{"type":"map","entries":[["1054",{"type":"map","entries":[["id",1054],["title","Invocation of a Control Element at an Unnecessarily Deep Horizontal Layer"],["url","https://cwe.mitre.org/data/definitions/1054.html"],["type","child"],["description","The code at one architectural layer invokes code that resides\n\t\t\t\t\tat a deeper layer than the adjacent layer, i.e., the invocation skips at least one\n\t\t\t\t\tlayer, and the invoked code is not part of a vertical utility layer that can be referenced from any horizontal layer."],["extended_description",null]]}],["1057",{"type":"map","entries":[["id",1057],["title","Data Access Operations Outside of Expected Data Manager Component"],["url","https://cwe.mitre.org/data/definitions/1057.html"],["type","child"],["description","The product uses a dedicated, central data manager component as required by design, but it contains code that performs data-access operations that do not use this data manager."],["extended_description",null]]}],["1062",{"type":"map","entries":[["id",1062],["title","Parent Class with References to Child Class"],["url","https://cwe.mitre.org/data/definitions/1062.html"],["type","child"],["description","The code has a parent class that contains references to a child class, its methods, or its members."],["extended_description",null]]}],["1083",{"type":"map","entries":[["id",1083],["title","Data Access from Outside Expected Data Manager Component"],["url","https://cwe.mitre.org/data/definitions/1083.html"],["type","child"],["description","The product is intended to manage data access through a particular data manager component such as a relational or non-SQL database, but it contains code that performs data access operations without using that component."],["extended_description","When the product has a data access component, the design may be intended to handle all data access operations through that component.  If a data access operation is performed outside of that component, then this may indicate a violation of the intended design."]]}],["1090",{"type":"map","entries":[["id",1090],["title","Method Containing Access of a Member Element from Another Class"],["url","https://cwe.mitre.org/data/definitions/1090.html"],["type","child"],["description","A method for a class performs an operation that directly\n\t\t\t\t\taccesses a member element from another class."],["extended_description",""]]}],["1100",{"type":"map","entries":[["id",1100],["title","Insufficient Isolation of System-Dependent Functions"],["url","https://cwe.mitre.org/data/definitions/1100.html"],["type","child"],["description","The product or code does not isolate system-dependent\n\t\t\t\t\tfunctionality into separate standalone modules."],["extended_description",null]]}],["1105",{"type":"map","entries":[["id",1105],["title","Insufficient Encapsulation of Machine-Dependent Functionality"],["url","https://cwe.mitre.org/data/definitions/1105.html"],["type","child"],["description","The product or code uses machine-dependent functionality, but\n\t\t\t\t\tit does not sufficiently encapsulate or isolate this functionality from\n\t\t\t\t\tthe rest of the code."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to issues surrounding the bundling of data with the methods intended to operate on that data."]]},{"type":"map","entries":[["id",1054],["title","Invocation of a Control Element at an Unnecessarily Deep Horizontal Layer"],["url","https://cwe.mitre.org/data/definitions/1054.html"],["type","child"],["description","The code at one architectural layer invokes code that resides\n\t\t\t\t\tat a deeper layer than the adjacent layer, i.e., the invocation skips at least one\n\t\t\t\t\tlayer, and the invoked code is not part of a vertical utility layer that can be referenced from any horizontal layer."],["extended_description",null]]},{"type":"map","entries":[["id",1057],["title","Data Access Operations Outside of Expected Data Manager Component"],["url","https://cwe.mitre.org/data/definitions/1057.html"],["type","child"],["description","The product uses a dedicated, central data manager component as required by design, but it contains code that performs data-access operations that do not use this data manager."],["extended_description",null]]},{"type":"map","entries":[["id",1062],["title","Parent Class with References to Child Class"],["url","https://cwe.mitre.org/data/definitions/1062.html"],["type","child"],["description","The code has a parent class that contains references to a child class, its methods, or its members."],["extended_description",null]]},{"type":"map","entries":[["id",1083],["title","Data Access from Outside Expected Data Manager Component"],["url","https://cwe.mitre.org/data/definitions/1083.html"],["type","child"],["description","The product is intended to manage data access through a particular data manager component such as a relational or non-SQL database, but it contains code that performs data access operations without using that component."],["extended_description","When the product has a data access component, the design may be intended to handle all data access operations through that component.  If a data access operation is performed outside of that component, then this may indicate a violation of the intended design."]]},{"type":"map","entries":[["id",1090],["title","Method Containing Access of a Member Element from Another Class"],["url","https://cwe.mitre.org/data/definitions/1090.html"],["type","child"],["description","A method for a class performs an operation that directly\n\t\t\t\t\taccesses a member element from another class."],["extended_description",""]]},{"type":"map","entries":[["id",1100],["title","Insufficient Isolation of System-Dependent Functions"],["url","https://cwe.mitre.org/data/definitions/1100.html"],["type","child"],["description","The product or code does not isolate system-dependent\n\t\t\t\t\tfunctionality into separate standalone modules."],["extended_description",null]]},{"type":"map","entries":[["id",1105],["title","Insufficient Encapsulation of Machine-Dependent Functionality"],["url","https://cwe.mitre.org/data/definitions/1105.html"],["type","child"],["description","The product or code uses machine-dependent functionality, but\n\t\t\t\t\tit does not sufficiently encapsulate or isolate this functionality from\n\t\t\t\t\tthe rest of the code."],["extended_description",null]]},{"type":"map","entries":[["id",389],["title","Error Conditions, Return Values, Status Codes"],["url","https://cwe.mitre.org/data/definitions/389.html"],["children",{"type":"map","entries":[["209",{"type":"map","entries":[["id",209],["title","Generation of Error Message Containing Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/209.html"],["type","child"],["description","The product generates an error message that includes sensitive information about its environment, users, or associated data."],["extended_description",null]]}],["248",{"type":"map","entries":[["id",248],["title","Uncaught Exception"],["url","https://cwe.mitre.org/data/definitions/248.html"],["type","child"],["description","An exception is thrown from a function, but it is not caught."],["extended_description","When an exception is not caught, it may cause the program to crash or expose sensitive information."]]}],["252",{"type":"map","entries":[["id",252],["title","Unchecked Return Value"],["url","https://cwe.mitre.org/data/definitions/252.html"],["type","child"],["description","The product does not check the return value from a method or function, which can prevent it from detecting unexpected states and conditions."],["extended_description","Two common programmer assumptions are \"this function call can never fail\" and \"it doesn't matter if this function call fails\". If an attacker can force the function to fail or otherwise return a value that is not expected, then the subsequent program logic could lead to a vulnerability, because the product is not in a state that the programmer assumes. For example, if the program calls a function to drop privileges but does not check the return code to ensure that privileges were successfully dropped, then the program will continue to operate with the higher privileges."]]}],["253",{"type":"map","entries":[["id",253],["title","Incorrect Check of Function Return Value"],["url","https://cwe.mitre.org/data/definitions/253.html"],["type","child"],["description","The product incorrectly checks a return value from a function, which prevents it from detecting errors or exceptional conditions."],["extended_description","Important and common functions will return some value about the success of its actions. This will alert the program whether or not to handle any errors caused by that function."]]}],["390",{"type":"map","entries":[["id",390],["title","Detection of Error Condition Without Action"],["url","https://cwe.mitre.org/data/definitions/390.html"],["type","child"],["description","The product detects a specific error, but takes no actions to handle the error."],["extended_description",null]]}],["391",{"type":"map","entries":[["id",391],["title","Unchecked Error Condition"],["url","https://cwe.mitre.org/data/definitions/391.html"],["type","child"],["description","[PLANNED FOR DEPRECATION. SEE MAINTENANCE NOTES AND CONSIDER CWE-252, CWE-248, OR CWE-1069.] Ignoring exceptions and other error conditions may allow an attacker to induce unexpected behavior unnoticed."],["extended_description",null]]}],["392",{"type":"map","entries":[["id",392],["title","Missing Report of Error Condition"],["url","https://cwe.mitre.org/data/definitions/392.html"],["type","child"],["description","The product encounters an error but does not provide a status code or return value to indicate that an error has occurred."],["extended_description",null]]}],["393",{"type":"map","entries":[["id",393],["title","Return of Wrong Status Code"],["url","https://cwe.mitre.org/data/definitions/393.html"],["type","child"],["description","A function or operation returns an incorrect return value or status code that does not indicate the true result of execution, causing the product to modify its behavior based on the incorrect result."],["extended_description","This can lead to unpredictable behavior. If the function is used to make security-critical decisions or provide security-critical information, then the wrong status code can cause the product to assume that an action is safe or correct, even when it is not."]]}],["394",{"type":"map","entries":[["id",394],["title","Unexpected Status Code or Return Value"],["url","https://cwe.mitre.org/data/definitions/394.html"],["type","child"],["description","The product does not properly check when a function or operation returns a value that is legitimate for the function, but is not expected by the product."],["extended_description",null]]}],["395",{"type":"map","entries":[["id",395],["title","Use of NullPointerException Catch to Detect NULL Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/395.html"],["type","child"],["description","Catching NullPointerException should not be used as an alternative to programmatic checks to prevent dereferencing a null pointer."],["extended_description","Programmers typically catch NullPointerException under three circumstances:\n\nThe program contains a null pointer dereference. Catching the resulting exception was easier than fixing the underlying problem.\nThe program explicitly throws a NullPointerException to signal an error condition.\nThe code is part of a test harness that supplies unexpected input to the classes under test.\n\nOf these three circumstances, only the last is acceptable."]]}],["396",{"type":"map","entries":[["id",396],["title","Declaration of Catch for Generic Exception"],["url","https://cwe.mitre.org/data/definitions/396.html"],["type","child"],["description","Catching overly broad exceptions promotes complex error handling code that is more likely to contain security vulnerabilities."],["extended_description","Multiple catch blocks can get ugly and repetitive, but \"condensing\" catch blocks by catching a high-level class like Exception can obscure exceptions that deserve special treatment or that should not be caught at this point in the program. Catching an overly broad exception essentially defeats the purpose of a language's typed exceptions, and can become particularly dangerous if the program grows and begins to throw new types of exceptions. The new exception types will not receive any attention."]]}],["397",{"type":"map","entries":[["id",397],["title","Declaration of Throws for Generic Exception"],["url","https://cwe.mitre.org/data/definitions/397.html"],["type","child"],["description","The product throws or raises an overly broad exceptions that can hide important details and produce inappropriate responses to certain conditions."],["extended_description","Declaring a method to throw Exception or Throwable promotes generic error handling procedures that make it difficult for callers to perform proper error handling and error recovery. For example, Java's exception mechanism makes it easy for callers to anticipate what can go wrong and write code to handle each specific exceptional circumstance. Declaring that a method throws a generic form of exception defeats this system."]]}],["544",{"type":"map","entries":[["id",544],["title","Missing Standardized Error Handling Mechanism"],["url","https://cwe.mitre.org/data/definitions/544.html"],["type","child"],["description","The product does not use a standardized method for handling errors throughout the code, which might introduce inconsistent error handling and resultant weaknesses."],["extended_description","If the product handles error messages individually, on a one-by-one basis, this is likely to result in inconsistent error handling. The causes of errors may be lost. Also, detailed information about the causes of an error may be unintentionally returned to the user."]]}],["584",{"type":"map","entries":[["id",584],["title","Return Inside Finally Block"],["url","https://cwe.mitre.org/data/definitions/584.html"],["type","child"],["description","The code has a return statement inside a finally block, which will cause any thrown exception in the try block to be discarded."],["extended_description",null]]}],["617",{"type":"map","entries":[["id",617],["title","Reachable Assertion"],["url","https://cwe.mitre.org/data/definitions/617.html"],["type","child"],["description","The product contains an assert() or similar statement that can be triggered by an attacker, which leads to an application exit or other behavior that is more severe than necessary."],["extended_description","While assertion is good for catching logic errors and reducing the chances of reaching more serious vulnerability conditions, it can still lead to a denial of service.\nFor example, if a server handles multiple simultaneous connections, and an assert() occurs in one single connection that causes all other connections to be dropped, this is a reachable assertion that leads to a denial of service."]]}],["756",{"type":"map","entries":[["id",756],["title","Missing Custom Error Page"],["url","https://cwe.mitre.org/data/definitions/756.html"],["type","child"],["description","The product does not return custom error pages to the user, possibly exposing sensitive information."],["extended_description",null]]}]]}],["type","category"],["summary","This category includes weaknesses that occur if a function does not generate the correct return/status code, or if the application does not handle all possible return/status codes that could be generated by a function. This type of problem is most often found in conditions that are rarely encountered during the normal operation of the product. Presumably, most bugs related to common conditions are found and eliminated during development and testing. In some cases, the attacker can directly control or influence the environment to trigger the rare conditions."]]},{"type":"map","entries":[["id",209],["title","Generation of Error Message Containing Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/209.html"],["type","child"],["description","The product generates an error message that includes sensitive information about its environment, users, or associated data."],["extended_description",null]]},{"type":"map","entries":[["id",248],["title","Uncaught Exception"],["url","https://cwe.mitre.org/data/definitions/248.html"],["type","child"],["description","An exception is thrown from a function, but it is not caught."],["extended_description","When an exception is not caught, it may cause the program to crash or expose sensitive information."]]},{"type":"map","entries":[["id",252],["title","Unchecked Return Value"],["url","https://cwe.mitre.org/data/definitions/252.html"],["type","child"],["description","The product does not check the return value from a method or function, which can prevent it from detecting unexpected states and conditions."],["extended_description","Two common programmer assumptions are \"this function call can never fail\" and \"it doesn't matter if this function call fails\". If an attacker can force the function to fail or otherwise return a value that is not expected, then the subsequent program logic could lead to a vulnerability, because the product is not in a state that the programmer assumes. For example, if the program calls a function to drop privileges but does not check the return code to ensure that privileges were successfully dropped, then the program will continue to operate with the higher privileges."]]},{"type":"map","entries":[["id",253],["title","Incorrect Check of Function Return Value"],["url","https://cwe.mitre.org/data/definitions/253.html"],["type","child"],["description","The product incorrectly checks a return value from a function, which prevents it from detecting errors or exceptional conditions."],["extended_description","Important and common functions will return some value about the success of its actions. This will alert the program whether or not to handle any errors caused by that function."]]},{"type":"map","entries":[["id",390],["title","Detection of Error Condition Without Action"],["url","https://cwe.mitre.org/data/definitions/390.html"],["type","child"],["description","The product detects a specific error, but takes no actions to handle the error."],["extended_description",null]]},{"type":"map","entries":[["id",391],["title","Unchecked Error Condition"],["url","https://cwe.mitre.org/data/definitions/391.html"],["type","child"],["description","[PLANNED FOR DEPRECATION. SEE MAINTENANCE NOTES AND CONSIDER CWE-252, CWE-248, OR CWE-1069.] Ignoring exceptions and other error conditions may allow an attacker to induce unexpected behavior unnoticed."],["extended_description",null]]},{"type":"map","entries":[["id",392],["title","Missing Report of Error Condition"],["url","https://cwe.mitre.org/data/definitions/392.html"],["type","child"],["description","The product encounters an error but does not provide a status code or return value to indicate that an error has occurred."],["extended_description",null]]},{"type":"map","entries":[["id",393],["title","Return of Wrong Status Code"],["url","https://cwe.mitre.org/data/definitions/393.html"],["type","child"],["description","A function or operation returns an incorrect return value or status code that does not indicate the true result of execution, causing the product to modify its behavior based on the incorrect result."],["extended_description","This can lead to unpredictable behavior. If the function is used to make security-critical decisions or provide security-critical information, then the wrong status code can cause the product to assume that an action is safe or correct, even when it is not."]]},{"type":"map","entries":[["id",394],["title","Unexpected Status Code or Return Value"],["url","https://cwe.mitre.org/data/definitions/394.html"],["type","child"],["description","The product does not properly check when a function or operation returns a value that is legitimate for the function, but is not expected by the product."],["extended_description",null]]},{"type":"map","entries":[["id",395],["title","Use of NullPointerException Catch to Detect NULL Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/395.html"],["type","child"],["description","Catching NullPointerException should not be used as an alternative to programmatic checks to prevent dereferencing a null pointer."],["extended_description","Programmers typically catch NullPointerException under three circumstances:\n\nThe program contains a null pointer dereference. Catching the resulting exception was easier than fixing the underlying problem.\nThe program explicitly throws a NullPointerException to signal an error condition.\nThe code is part of a test harness that supplies unexpected input to the classes under test.\n\nOf these three circumstances, only the last is acceptable."]]},{"type":"map","entries":[["id",396],["title","Declaration of Catch for Generic Exception"],["url","https://cwe.mitre.org/data/definitions/396.html"],["type","child"],["description","Catching overly broad exceptions promotes complex error handling code that is more likely to contain security vulnerabilities."],["extended_description","Multiple catch blocks can get ugly and repetitive, but \"condensing\" catch blocks by catching a high-level class like Exception can obscure exceptions that deserve special treatment or that should not be caught at this point in the program. Catching an overly broad exception essentially defeats the purpose of a language's typed exceptions, and can become particularly dangerous if the program grows and begins to throw new types of exceptions. The new exception types will not receive any attention."]]},{"type":"map","entries":[["id",397],["title","Declaration of Throws for Generic Exception"],["url","https://cwe.mitre.org/data/definitions/397.html"],["type","child"],["description","The product throws or raises an overly broad exceptions that can hide important details and produce inappropriate responses to certain conditions."],["extended_description","Declaring a method to throw Exception or Throwable promotes generic error handling procedures that make it difficult for callers to perform proper error handling and error recovery. For example, Java's exception mechanism makes it easy for callers to anticipate what can go wrong and write code to handle each specific exceptional circumstance. Declaring that a method throws a generic form of exception defeats this system."]]},{"type":"map","entries":[["id",544],["title","Missing Standardized Error Handling Mechanism"],["url","https://cwe.mitre.org/data/definitions/544.html"],["type","child"],["description","The product does not use a standardized method for handling errors throughout the code, which might introduce inconsistent error handling and resultant weaknesses."],["extended_description","If the product handles error messages individually, on a one-by-one basis, this is likely to result in inconsistent error handling. The causes of errors may be lost. Also, detailed information about the causes of an error may be unintentionally returned to the user."]]},{"type":"map","entries":[["id",584],["title","Return Inside Finally Block"],["url","https://cwe.mitre.org/data/definitions/584.html"],["type","child"],["description","The code has a return statement inside a finally block, which will cause any thrown exception in the try block to be discarded."],["extended_description",null]]},{"type":"map","entries":[["id",617],["title","Reachable Assertion"],["url","https://cwe.mitre.org/data/definitions/617.html"],["type","child"],["description","The product contains an assert() or similar statement that can be triggered by an attacker, which leads to an application exit or other behavior that is more severe than necessary."],["extended_description","While assertion is good for catching logic errors and reducing the chances of reaching more serious vulnerability conditions, it can still lead to a denial of service.\nFor example, if a server handles multiple simultaneous connections, and an assert() occurs in one single connection that causes all other connections to be dropped, this is a reachable assertion that leads to a denial of service."]]},{"type":"map","entries":[["id",756],["title","Missing Custom Error Page"],["url","https://cwe.mitre.org/data/definitions/756.html"],["type","child"],["description","The product does not return custom error pages to the user, possibly exposing sensitive information."],["extended_description",null]]},{"type":"map","entries":[["id",569],["title","Expression Issues"],["url","https://cwe.mitre.org/data/definitions/569.html"],["children",{"type":"map","entries":[["480",{"type":"map","entries":[["id",480],["title","Use of Incorrect Operator"],["url","https://cwe.mitre.org/data/definitions/480.html"],["type","child"],["description","The product accidentally uses the wrong operator, which changes the logic in security-relevant ways."],["extended_description","These types of errors are generally the result of a typo by the programmer."]]}],["570",{"type":"map","entries":[["id",570],["title","Expression is Always False"],["url","https://cwe.mitre.org/data/definitions/570.html"],["type","child"],["description","The product contains an expression that will always evaluate to false."],["extended_description",null]]}],["571",{"type":"map","entries":[["id",571],["title","Expression is Always True"],["url","https://cwe.mitre.org/data/definitions/571.html"],["type","child"],["description","The product contains an expression that will always evaluate to true."],["extended_description",null]]}],["783",{"type":"map","entries":[["id",783],["title","Operator Precedence Logic Error"],["url","https://cwe.mitre.org/data/definitions/783.html"],["type","child"],["description","The product uses an expression in which operator precedence causes incorrect logic to be used."],["extended_description","While often just a bug, operator precedence logic errors can have serious consequences if they are used in security-critical code, such as making an authentication decision."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to incorrectly written expressions within code."]]},{"type":"map","entries":[["id",570],["title","Expression is Always False"],["url","https://cwe.mitre.org/data/definitions/570.html"],["type","child"],["description","The product contains an expression that will always evaluate to false."],["extended_description",null]]},{"type":"map","entries":[["id",571],["title","Expression is Always True"],["url","https://cwe.mitre.org/data/definitions/571.html"],["type","child"],["description","The product contains an expression that will always evaluate to true."],["extended_description",null]]},{"type":"map","entries":[["id",429],["title","Handler Errors"],["url","https://cwe.mitre.org/data/definitions/429.html"],["children",{"type":"map","entries":[["430",{"type":"map","entries":[["id",430],["title","Deployment of Wrong Handler"],["url","https://cwe.mitre.org/data/definitions/430.html"],["type","child"],["description","The wrong \"handler\" is assigned to process an object."],["extended_description","An example of deploying the wrong handler would be calling a servlet to reveal source code of a .JSP file, or automatically \"determining\" type of the object even if it is contradictory to an explicitly specified type."]]}],["431",{"type":"map","entries":[["id",431],["title","Missing Handler"],["url","https://cwe.mitre.org/data/definitions/431.html"],["type","child"],["description","A handler is not available or implemented."],["extended_description","When an exception is thrown and not caught, the process has given up an opportunity to decide if a given failure or event is worth a change in execution."]]}],["434",{"type":"map","entries":[["id",434],["title","Unrestricted Upload of File with Dangerous Type"],["url","https://cwe.mitre.org/data/definitions/434.html"],["type","child"],["description","The product allows the upload or transfer of dangerous file types that are automatically processed within its environment."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper management of handlers."]]},{"type":"map","entries":[["id",430],["title","Deployment of Wrong Handler"],["url","https://cwe.mitre.org/data/definitions/430.html"],["type","child"],["description","The wrong \"handler\" is assigned to process an object."],["extended_description","An example of deploying the wrong handler would be calling a servlet to reveal source code of a .JSP file, or automatically \"determining\" type of the object even if it is contradictory to an explicitly specified type."]]},{"type":"map","entries":[["id",431],["title","Missing Handler"],["url","https://cwe.mitre.org/data/definitions/431.html"],["type","child"],["description","A handler is not available or implemented."],["extended_description","When an exception is thrown and not caught, the process has given up an opportunity to decide if a given failure or event is worth a change in execution."]]},{"type":"map","entries":[["id",434],["title","Unrestricted Upload of File with Dangerous Type"],["url","https://cwe.mitre.org/data/definitions/434.html"],["type","child"],["description","The product allows the upload or transfer of dangerous file types that are automatically processed within its environment."],["extended_description",null]]},{"type":"map","entries":[["id",199],["title","Information Management Errors"],["url","https://cwe.mitre.org/data/definitions/199.html"],["children",{"type":"map","entries":[["201",{"type":"map","entries":[["id",201],["title","Insertion of Sensitive Information Into Sent Data"],["url","https://cwe.mitre.org/data/definitions/201.html"],["type","child"],["description","The code transmits data to another actor, but a portion of the data includes sensitive information that should not be accessible to that actor."],["extended_description",null]]}],["204",{"type":"map","entries":[["id",204],["title","Observable Response Discrepancy"],["url","https://cwe.mitre.org/data/definitions/204.html"],["type","child"],["description","The product provides different responses to incoming requests in a way that reveals internal state information to an unauthorized actor outside of the intended control sphere."],["extended_description",null]]}],["205",{"type":"map","entries":[["id",205],["title","Observable Behavioral Discrepancy"],["url","https://cwe.mitre.org/data/definitions/205.html"],["type","child"],["description","The product's behaviors indicate important differences that may be observed by unauthorized actors in a way that reveals (1) its internal state or decision process, or (2) differences from other products with equivalent functionality."],["extended_description","Ideally, a product should provide as little information about its internal operations as possible.  Otherwise, attackers could use knowledge of these internal operations to simplify or optimize their attack.  In some cases, behavioral discrepancies can be used by attackers to form a side channel."]]}],["208",{"type":"map","entries":[["id",208],["title","Observable Timing Discrepancy"],["url","https://cwe.mitre.org/data/definitions/208.html"],["type","child"],["description","Two separate operations in a product require different amounts of time to complete, in a way that is observable to an actor and reveals security-relevant information about the state of the product, such as whether a particular operation was successful or not."],["extended_description","In security-relevant contexts, even small variations in timing can be exploited by attackers to indirectly infer certain details about the product's internal operations.  For example, in some cryptographic algorithms, attackers can use timing differences to infer certain properties about a private key, making the key easier to guess.  Timing discrepancies effectively form a timing side channel."]]}],["209",{"type":"map","entries":[["id",209],["title","Generation of Error Message Containing Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/209.html"],["type","child"],["description","The product generates an error message that includes sensitive information about its environment, users, or associated data."],["extended_description",null]]}],["212",{"type":"map","entries":[["id",212],["title","Improper Removal of Sensitive Information Before Storage or Transfer"],["url","https://cwe.mitre.org/data/definitions/212.html"],["type","child"],["description","The product stores, transfers, or shares a resource that contains sensitive information, but it does not properly remove that information before the product makes the resource available to unauthorized actors."],["extended_description","Resources that may contain sensitive data include documents, packets, messages, databases, etc. While this data may be useful to an individual user or small set of users who share the resource, it may need to be removed before the resource can be shared outside of the trusted group. The process of removal is sometimes called cleansing or scrubbing.\nFor example, a product for editing documents might not remove sensitive data such as reviewer comments or the local pathname where the document is stored. Or, a proxy might not remove an internal IP address from headers before making an outgoing request to an Internet site."]]}],["213",{"type":"map","entries":[["id",213],["title","Exposure of Sensitive Information Due to Incompatible Policies"],["url","https://cwe.mitre.org/data/definitions/213.html"],["type","child"],["description","The product's intended functionality exposes information to certain actors in accordance with the developer's security policy, but this information is regarded as sensitive according to the intended security policies of other stakeholders such as the product's administrator, users, or others whose information is being processed."],["extended_description","When handling information, the developer must consider whether the information is regarded as sensitive by different stakeholders, such as users or administrators.  Each stakeholder effectively has its own intended security policy that the product is expected to uphold.  When a developer does not treat that information as sensitive, this can introduce a vulnerability that violates the expectations of the product's users."]]}],["214",{"type":"map","entries":[["id",214],["title","Invocation of Process Using Visible Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/214.html"],["type","child"],["description","A process is invoked with sensitive command-line arguments, environment variables, or other elements that can be seen by other processes on the operating system."],["extended_description","Many operating systems allow a user to list information about processes that are owned by other users. Other users could see information such as command line arguments or environment variable settings. When this data contains sensitive information such as credentials, it might allow other users to launch an attack against the product or related resources."]]}],["215",{"type":"map","entries":[["id",215],["title","Insertion of Sensitive Information Into Debugging Code"],["url","https://cwe.mitre.org/data/definitions/215.html"],["type","child"],["description","The product inserts sensitive information into debugging code, which could expose this information if the debugging code is not disabled in production."],["extended_description","When debugging, it may be necessary to report detailed information to the programmer.  However, if the debugging code is not disabled when the product is operating in a production environment, then this sensitive information may be exposed to attackers."]]}],["312",{"type":"map","entries":[["id",312],["title","Cleartext Storage of Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/312.html"],["type","child"],["description","The product stores sensitive information in cleartext within a resource that might be accessible to another control sphere."],["extended_description",null]]}],["319",{"type":"map","entries":[["id",319],["title","Cleartext Transmission of Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/319.html"],["type","child"],["description","The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors."],["extended_description",null]]}],["359",{"type":"map","entries":[["id",359],["title","Exposure of Private Personal Information to an Unauthorized Actor"],["url","https://cwe.mitre.org/data/definitions/359.html"],["type","child"],["description","The product does not properly prevent a person's private, personal information from being accessed by actors who either (1) are not explicitly authorized to access the information or (2) do not have the implicit consent of the person about whom the information is collected."],["extended_description",null]]}],["497",{"type":"map","entries":[["id",497],["title","Exposure of Sensitive System Information to an Unauthorized Control Sphere"],["url","https://cwe.mitre.org/data/definitions/497.html"],["type","child"],["description","The product does not properly prevent sensitive system-level information from being accessed by unauthorized actors who do not have the same level of access to the underlying system as the product does."],["extended_description","Network-based products, such as web applications, often run on top of an operating system or similar environment.  When the product communicates with outside parties, details about the underlying system are expected to remain hidden, such as path names for data files, other OS users, installed packages, the application environment, etc. This system information may be provided by the product itself, or buried within diagnostic or debugging messages. Debugging information helps an adversary learn about the system and form an attack plan.\nAn information exposure occurs when system data or debugging information leaves the program through an output stream or logging function that makes it accessible to unauthorized parties. Using other weaknesses, an attacker could cause errors to occur; the response to these errors can reveal detailed system information, along with other impacts.  An attacker can use messages that reveal technologies, operating systems, and product versions to tune the attack against known vulnerabilities in these technologies. A product may use diagnostic methods that provide significant implementation details such as stack traces as part of its error handling mechanism."]]}],["524",{"type":"map","entries":[["id",524],["title","Use of Cache Containing Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/524.html"],["type","child"],["description","The code uses a cache that contains sensitive information, but the cache can be read by an actor outside of the intended control sphere."],["extended_description","Applications may use caches to improve efficiency when communicating with remote entities or performing intensive calculations.  A cache maintains a pool of objects, threads, connections, pages, financial data, passwords, or other resources to minimize the time it takes to initialize and access these resources.  If the cache is accessible to unauthorized actors, attackers can read the cache and obtain this sensitive information."]]}],["538",{"type":"map","entries":[["id",538],["title","Insertion of Sensitive Information into Externally-Accessible File or Directory"],["url","https://cwe.mitre.org/data/definitions/538.html"],["type","child"],["description","The product places sensitive information into files or directories that are accessible to actors who are allowed to have access to the files, but not to the sensitive information."],["extended_description",null]]}],["921",{"type":"map","entries":[["id",921],["title","Storage of Sensitive Data in a Mechanism without Access Control"],["url","https://cwe.mitre.org/data/definitions/921.html"],["type","child"],["description","The product stores sensitive information in a file system or device that does not have built-in access control."],["extended_description","While many modern file systems or devices utilize some form of access control in order to restrict access to data, not all storage mechanisms have this capability. For example, memory cards, floppy disks, CDs, and USB devices are typically made accessible to any user within the system. This can become a problem when sensitive data is stored in these mechanisms in a multi-user environment, because anybody on the system can read or write this data.\nOn Android devices, external storage is typically globally readable and writable by other applications on the device. External storage may also be easily accessible through the mobile device's USB connection or physically accessible through the device's memory card port."]]}],["1230",{"type":"map","entries":[["id",1230],["title","Exposure of Sensitive Information Through Metadata"],["url","https://cwe.mitre.org/data/definitions/1230.html"],["type","child"],["description","The product prevents direct access to a resource containing sensitive information, but it does not sufficiently limit access to metadata that is derived from the original, sensitive information."],["extended_description","Developers might correctly prevent unauthorized access to a database or other resource containing sensitive information, but they might not consider that portions of the original information might also be recorded in metadata, search indices, statistical reports, or other resources.  If these resources are not also restricted, then attackers might be able to extract some or all of the original information, or otherwise infer some details.  For example, an attacker could specify search terms that are known to be unique to a particular person, or view metadata such as activity or creation dates in order to identify usage patterns."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper handling of sensitive information."]]},{"type":"map","entries":[["id",201],["title","Insertion of Sensitive Information Into Sent Data"],["url","https://cwe.mitre.org/data/definitions/201.html"],["type","child"],["description","The code transmits data to another actor, but a portion of the data includes sensitive information that should not be accessible to that actor."],["extended_description",null]]},{"type":"map","entries":[["id",204],["title","Observable Response Discrepancy"],["url","https://cwe.mitre.org/data/definitions/204.html"],["type","child"],["description","The product provides different responses to incoming requests in a way that reveals internal state information to an unauthorized actor outside of the intended control sphere."],["extended_description",null]]},{"type":"map","entries":[["id",205],["title","Observable Behavioral Discrepancy"],["url","https://cwe.mitre.org/data/definitions/205.html"],["type","child"],["description","The product's behaviors indicate important differences that may be observed by unauthorized actors in a way that reveals (1) its internal state or decision process, or (2) differences from other products with equivalent functionality."],["extended_description","Ideally, a product should provide as little information about its internal operations as possible.  Otherwise, attackers could use knowledge of these internal operations to simplify or optimize their attack.  In some cases, behavioral discrepancies can be used by attackers to form a side channel."]]},{"type":"map","entries":[["id",208],["title","Observable Timing Discrepancy"],["url","https://cwe.mitre.org/data/definitions/208.html"],["type","child"],["description","Two separate operations in a product require different amounts of time to complete, in a way that is observable to an actor and reveals security-relevant information about the state of the product, such as whether a particular operation was successful or not."],["extended_description","In security-relevant contexts, even small variations in timing can be exploited by attackers to indirectly infer certain details about the product's internal operations.  For example, in some cryptographic algorithms, attackers can use timing differences to infer certain properties about a private key, making the key easier to guess.  Timing discrepancies effectively form a timing side channel."]]},{"type":"map","entries":[["id",212],["title","Improper Removal of Sensitive Information Before Storage or Transfer"],["url","https://cwe.mitre.org/data/definitions/212.html"],["type","child"],["description","The product stores, transfers, or shares a resource that contains sensitive information, but it does not properly remove that information before the product makes the resource available to unauthorized actors."],["extended_description","Resources that may contain sensitive data include documents, packets, messages, databases, etc. While this data may be useful to an individual user or small set of users who share the resource, it may need to be removed before the resource can be shared outside of the trusted group. The process of removal is sometimes called cleansing or scrubbing.\nFor example, a product for editing documents might not remove sensitive data such as reviewer comments or the local pathname where the document is stored. Or, a proxy might not remove an internal IP address from headers before making an outgoing request to an Internet site."]]},{"type":"map","entries":[["id",213],["title","Exposure of Sensitive Information Due to Incompatible Policies"],["url","https://cwe.mitre.org/data/definitions/213.html"],["type","child"],["description","The product's intended functionality exposes information to certain actors in accordance with the developer's security policy, but this information is regarded as sensitive according to the intended security policies of other stakeholders such as the product's administrator, users, or others whose information is being processed."],["extended_description","When handling information, the developer must consider whether the information is regarded as sensitive by different stakeholders, such as users or administrators.  Each stakeholder effectively has its own intended security policy that the product is expected to uphold.  When a developer does not treat that information as sensitive, this can introduce a vulnerability that violates the expectations of the product's users."]]},{"type":"map","entries":[["id",214],["title","Invocation of Process Using Visible Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/214.html"],["type","child"],["description","A process is invoked with sensitive command-line arguments, environment variables, or other elements that can be seen by other processes on the operating system."],["extended_description","Many operating systems allow a user to list information about processes that are owned by other users. Other users could see information such as command line arguments or environment variable settings. When this data contains sensitive information such as credentials, it might allow other users to launch an attack against the product or related resources."]]},{"type":"map","entries":[["id",215],["title","Insertion of Sensitive Information Into Debugging Code"],["url","https://cwe.mitre.org/data/definitions/215.html"],["type","child"],["description","The product inserts sensitive information into debugging code, which could expose this information if the debugging code is not disabled in production."],["extended_description","When debugging, it may be necessary to report detailed information to the programmer.  However, if the debugging code is not disabled when the product is operating in a production environment, then this sensitive information may be exposed to attackers."]]},{"type":"map","entries":[["id",312],["title","Cleartext Storage of Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/312.html"],["type","child"],["description","The product stores sensitive information in cleartext within a resource that might be accessible to another control sphere."],["extended_description",null]]},{"type":"map","entries":[["id",319],["title","Cleartext Transmission of Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/319.html"],["type","child"],["description","The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors."],["extended_description",null]]},{"type":"map","entries":[["id",359],["title","Exposure of Private Personal Information to an Unauthorized Actor"],["url","https://cwe.mitre.org/data/definitions/359.html"],["type","child"],["description","The product does not properly prevent a person's private, personal information from being accessed by actors who either (1) are not explicitly authorized to access the information or (2) do not have the implicit consent of the person about whom the information is collected."],["extended_description",null]]},{"type":"map","entries":[["id",497],["title","Exposure of Sensitive System Information to an Unauthorized Control Sphere"],["url","https://cwe.mitre.org/data/definitions/497.html"],["type","child"],["description","The product does not properly prevent sensitive system-level information from being accessed by unauthorized actors who do not have the same level of access to the underlying system as the product does."],["extended_description","Network-based products, such as web applications, often run on top of an operating system or similar environment.  When the product communicates with outside parties, details about the underlying system are expected to remain hidden, such as path names for data files, other OS users, installed packages, the application environment, etc. This system information may be provided by the product itself, or buried within diagnostic or debugging messages. Debugging information helps an adversary learn about the system and form an attack plan.\nAn information exposure occurs when system data or debugging information leaves the program through an output stream or logging function that makes it accessible to unauthorized parties. Using other weaknesses, an attacker could cause errors to occur; the response to these errors can reveal detailed system information, along with other impacts.  An attacker can use messages that reveal technologies, operating systems, and product versions to tune the attack against known vulnerabilities in these technologies. A product may use diagnostic methods that provide significant implementation details such as stack traces as part of its error handling mechanism."]]},{"type":"map","entries":[["id",524],["title","Use of Cache Containing Sensitive Information"],["url","https://cwe.mitre.org/data/definitions/524.html"],["type","child"],["description","The code uses a cache that contains sensitive information, but the cache can be read by an actor outside of the intended control sphere."],["extended_description","Applications may use caches to improve efficiency when communicating with remote entities or performing intensive calculations.  A cache maintains a pool of objects, threads, connections, pages, financial data, passwords, or other resources to minimize the time it takes to initialize and access these resources.  If the cache is accessible to unauthorized actors, attackers can read the cache and obtain this sensitive information."]]},{"type":"map","entries":[["id",538],["title","Insertion of Sensitive Information into Externally-Accessible File or Directory"],["url","https://cwe.mitre.org/data/definitions/538.html"],["type","child"],["description","The product places sensitive information into files or directories that are accessible to actors who are allowed to have access to the files, but not to the sensitive information."],["extended_description",null]]},{"type":"map","entries":[["id",921],["title","Storage of Sensitive Data in a Mechanism without Access Control"],["url","https://cwe.mitre.org/data/definitions/921.html"],["type","child"],["description","The product stores sensitive information in a file system or device that does not have built-in access control."],["extended_description","While many modern file systems or devices utilize some form of access control in order to restrict access to data, not all storage mechanisms have this capability. For example, memory cards, floppy disks, CDs, and USB devices are typically made accessible to any user within the system. This can become a problem when sensitive data is stored in these mechanisms in a multi-user environment, because anybody on the system can read or write this data.\nOn Android devices, external storage is typically globally readable and writable by other applications on the device. External storage may also be easily accessible through the mobile device's USB connection or physically accessible through the device's memory card port."]]},{"type":"map","entries":[["id",452],["title","Initialization and Cleanup Errors"],["url","https://cwe.mitre.org/data/definitions/452.html"],["children",{"type":"map","entries":[["212",{"type":"map","entries":[["id",212],["title","Improper Removal of Sensitive Information Before Storage or Transfer"],["url","https://cwe.mitre.org/data/definitions/212.html"],["type","child"],["description","The product stores, transfers, or shares a resource that contains sensitive information, but it does not properly remove that information before the product makes the resource available to unauthorized actors."],["extended_description","Resources that may contain sensitive data include documents, packets, messages, databases, etc. While this data may be useful to an individual user or small set of users who share the resource, it may need to be removed before the resource can be shared outside of the trusted group. The process of removal is sometimes called cleansing or scrubbing.\nFor example, a product for editing documents might not remove sensitive data such as reviewer comments or the local pathname where the document is stored. Or, a proxy might not remove an internal IP address from headers before making an outgoing request to an Internet site."]]}],["454",{"type":"map","entries":[["id",454],["title","External Initialization of Trusted Variables or Data Stores"],["url","https://cwe.mitre.org/data/definitions/454.html"],["type","child"],["description","The product initializes critical internal variables or data stores using inputs that can be modified by untrusted actors."],["extended_description","A product system should be reluctant to trust variables that have been initialized outside of its trust boundary, especially if they are initialized by users. The variables may have been initialized incorrectly. If an attacker can initialize the variable, then they can influence what the vulnerable system will do."]]}],["455",{"type":"map","entries":[["id",455],["title","Non-exit on Failed Initialization"],["url","https://cwe.mitre.org/data/definitions/455.html"],["type","child"],["description","The product does not exit or otherwise modify its operation when security-relevant errors occur during initialization, such as when a configuration file has a format error or a hardware security module (HSM) cannot be activated, which can cause the product to execute in a less secure fashion than intended by the administrator."],["extended_description",null]]}],["459",{"type":"map","entries":[["id",459],["title","Incomplete Cleanup"],["url","https://cwe.mitre.org/data/definitions/459.html"],["type","child"],["description","The product does not properly \"clean up\" and remove temporary or supporting resources after they have been used."],["extended_description",null]]}],["1051",{"type":"map","entries":[["id",1051],["title","Initialization with Hard-Coded Network Resource Configuration Data"],["url","https://cwe.mitre.org/data/definitions/1051.html"],["type","child"],["description","The product initializes data using hard-coded values that act as network resource identifiers."],["extended_description",null]]}],["1052",{"type":"map","entries":[["id",1052],["title","Excessive Use of Hard-Coded Literals in Initialization"],["url","https://cwe.mitre.org/data/definitions/1052.html"],["type","child"],["description","The product initializes a data element using a hard-coded\n\t\t\t\t\tliteral that is not a simple integer or static constant element."],["extended_description",null]]}],["1188",{"type":"map","entries":[["id",1188],["title","Initialization of a Resource with an Insecure Default"],["url","https://cwe.mitre.org/data/definitions/1188.html"],["type","child"],["description","The product initializes or sets a resource with a default that is intended to be changed by the product's installer, administrator, or maintainer, but the default is not secure."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category occur in behaviors that are used for initialization and breakdown."]]},{"type":"map","entries":[["id",454],["title","External Initialization of Trusted Variables or Data Stores"],["url","https://cwe.mitre.org/data/definitions/454.html"],["type","child"],["description","The product initializes critical internal variables or data stores using inputs that can be modified by untrusted actors."],["extended_description","A product system should be reluctant to trust variables that have been initialized outside of its trust boundary, especially if they are initialized by users. The variables may have been initialized incorrectly. If an attacker can initialize the variable, then they can influence what the vulnerable system will do."]]},{"type":"map","entries":[["id",455],["title","Non-exit on Failed Initialization"],["url","https://cwe.mitre.org/data/definitions/455.html"],["type","child"],["description","The product does not exit or otherwise modify its operation when security-relevant errors occur during initialization, such as when a configuration file has a format error or a hardware security module (HSM) cannot be activated, which can cause the product to execute in a less secure fashion than intended by the administrator."],["extended_description",null]]},{"type":"map","entries":[["id",459],["title","Incomplete Cleanup"],["url","https://cwe.mitre.org/data/definitions/459.html"],["type","child"],["description","The product does not properly \"clean up\" and remove temporary or supporting resources after they have been used."],["extended_description",null]]},{"type":"map","entries":[["id",1051],["title","Initialization with Hard-Coded Network Resource Configuration Data"],["url","https://cwe.mitre.org/data/definitions/1051.html"],["type","child"],["description","The product initializes data using hard-coded values that act as network resource identifiers."],["extended_description",null]]},{"type":"map","entries":[["id",1052],["title","Excessive Use of Hard-Coded Literals in Initialization"],["url","https://cwe.mitre.org/data/definitions/1052.html"],["type","child"],["description","The product initializes a data element using a hard-coded\n\t\t\t\t\tliteral that is not a simple integer or static constant element."],["extended_description",null]]},{"type":"map","entries":[["id",1188],["title","Initialization of a Resource with an Insecure Default"],["url","https://cwe.mitre.org/data/definitions/1188.html"],["type","child"],["description","The product initializes or sets a resource with a default that is intended to be changed by the product's installer, administrator, or maintainer, but the default is not secure."],["extended_description",null]]},{"type":"map","entries":[["id",1215],["title","Data Validation Issues"],["url","https://cwe.mitre.org/data/definitions/1215.html"],["children",{"type":"map","entries":[["112",{"type":"map","entries":[["id",112],["title","Missing XML Validation"],["url","https://cwe.mitre.org/data/definitions/112.html"],["type","child"],["description","The product accepts XML from an untrusted source but does not validate the XML against the proper schema."],["extended_description","Most successful attacks begin with a violation of the programmer's assumptions. By accepting an XML document without validating it against a DTD or XML schema, the programmer leaves a door open for attackers to provide unexpected, unreasonable, or malicious input."]]}],["179",{"type":"map","entries":[["id",179],["title","Incorrect Behavior Order: Early Validation"],["url","https://cwe.mitre.org/data/definitions/179.html"],["type","child"],["description","The product validates input before applying protection mechanisms that modify the input, which could allow an attacker to bypass the validation via dangerous inputs that only arise after the modification."],["extended_description","Product needs to validate data at the proper time, after data has been canonicalized and cleansed. Early validation is susceptible to various manipulations that result in dangerous inputs that are produced by canonicalization and cleansing."]]}],["183",{"type":"map","entries":[["id",183],["title","Permissive List of Allowed Inputs"],["url","https://cwe.mitre.org/data/definitions/183.html"],["type","child"],["description","The product implements a protection mechanism that relies on a list of inputs (or properties of inputs) that are explicitly allowed by policy because the inputs are assumed to be safe, but the list is too permissive - that is, it allows an input that is unsafe, leading to resultant weaknesses."],["extended_description",null]]}],["184",{"type":"map","entries":[["id",184],["title","Incomplete List of Disallowed Inputs"],["url","https://cwe.mitre.org/data/definitions/184.html"],["type","child"],["description","The product implements a protection mechanism that relies on a list of inputs (or properties of inputs) that are not allowed by policy or otherwise require other action to neutralize before additional processing takes place, but the list is incomplete."],["extended_description",null]]}],["606",{"type":"map","entries":[["id",606],["title","Unchecked Input for Loop Condition"],["url","https://cwe.mitre.org/data/definitions/606.html"],["type","child"],["description","The product does not properly check inputs that are used for loop conditions, potentially leading to a denial of service or other consequences because of excessive looping."],["extended_description",null]]}],["641",{"type":"map","entries":[["id",641],["title","Improper Restriction of Names for Files and Other Resources"],["url","https://cwe.mitre.org/data/definitions/641.html"],["type","child"],["description","The product constructs the name of a file or other resource using input from an upstream component, but it does not restrict or incorrectly restricts the resulting name."],["extended_description","This may produce resultant weaknesses. For instance, if the names of these resources contain scripting characters, it is possible that a script may get executed in the client's browser if the application ever displays the name of the resource on a dynamically generated web page. Alternately, if the resources are consumed by some application parser, a specially crafted name can exploit some vulnerability internal to the parser, potentially resulting in execution of arbitrary code on the server machine. The problems will vary based on the context of usage of such malformed resource names and whether vulnerabilities are present in or assumptions are made by the targeted technology that would make code execution possible."]]}],["1173",{"type":"map","entries":[["id",1173],["title","Improper Use of Validation Framework"],["url","https://cwe.mitre.org/data/definitions/1173.html"],["type","child"],["description","The product does not use, or incorrectly uses, an input validation framework that is provided by the source language or an independent library."],["extended_description","Many modern coding languages provide developers with input validation frameworks to make the task of input validation easier and less error-prone. These frameworks will automatically check all input against specified criteria and direct execution to error handlers when invalid input is received. The improper use (i.e., an incorrect implementation or missing altogether) of these frameworks is not directly exploitable, but can lead to an exploitable condition if proper input validation is not performed later in the product. Not using provided input validation frameworks can also hurt the maintainability of code as future developers may not recognize the downstream input validation being used in the place of the validation framework."]]}],["1284",{"type":"map","entries":[["id",1284],["title","Improper Validation of Specified Quantity in Input"],["url","https://cwe.mitre.org/data/definitions/1284.html"],["type","child"],["description","The product receives input that is expected to specify a quantity (such as size or length), but it does not validate or incorrectly validates that the quantity has the required properties."],["extended_description","Specified quantities include size, length, frequency, price, rate, number of operations, time, and others. Code may rely on specified quantities to allocate resources, perform calculations, control iteration, etc."]]}],["1285",{"type":"map","entries":[["id",1285],["title","Improper Validation of Specified Index, Position, or Offset in Input"],["url","https://cwe.mitre.org/data/definitions/1285.html"],["type","child"],["description","The product receives input that is expected to specify an index, position, or offset into an indexable resource such as a buffer or file, but it does not validate or incorrectly validates that the specified index/position/offset has the required properties."],["extended_description","Often, indexable resources such as memory buffers or files can be accessed using a specific position, index, or offset, such as an index for an array or a position for a file.  When untrusted input is not properly validated before it is used as an index, attackers could access (or attempt to access) unauthorized portions of these resources.  This could be used to cause buffer overflows, excessive resource allocation, or trigger unexpected failures."]]}],["1286",{"type":"map","entries":[["id",1286],["title","Improper Validation of Syntactic Correctness of Input"],["url","https://cwe.mitre.org/data/definitions/1286.html"],["type","child"],["description","The product receives input that is expected to be well-formed - i.e., to comply with a certain syntax - but it does not validate or incorrectly validates that the input complies with the syntax."],["extended_description","Often, complex inputs are expected to follow a particular syntax, which is either assumed by the input itself, or declared within metadata such as headers. The syntax could be for data exchange formats, markup languages, or even programming languages.  When untrusted input is not properly validated for the expected syntax, attackers could cause parsing failures, trigger unexpected errors, or expose latent vulnerabilities that might not be directly exploitable if the input had conformed to the syntax."]]}],["1287",{"type":"map","entries":[["id",1287],["title","Improper Validation of Specified Type of Input"],["url","https://cwe.mitre.org/data/definitions/1287.html"],["type","child"],["description","The product receives input that is expected to be of a certain type, but it does not validate or incorrectly validates that the input is actually of the expected type."],["extended_description","When input does not comply with the expected type, attackers could trigger unexpected errors, cause incorrect
