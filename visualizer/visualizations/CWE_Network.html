 100. If the generator produces an 80, then the attacker knows that the next value will be somewhere between 81 and 100. Instead of 100 possibilities, the attacker only needs to consider 20."]]},{"type":"map","entries":[["id",344],["title","Use of Invariant Value in Dynamically Changing Context"],["url","https://cwe.mitre.org/data/definitions/344.html"],["type","child"],["description","The product uses a constant value, name, or reference, but this value can (or should) vary across different environments."],["extended_description",null]]},{"type":"map","entries":[["id",1241],["title","Use of Predictable Algorithm in Random Number Generator"],["url","https://cwe.mitre.org/data/definitions/1241.html"],["type","child"],["description","The device uses an algorithm that is predictable and generates a pseudo-random number."],["extended_description","Pseudo-random number generator algorithms are predictable because their registers have a finite number of possible states, which eventually lead to repeating patterns. As a result, pseudo-random number generators (PRNGs) can compromise their randomness or expose their internal state to various attacks, such as reverse engineering or tampering."]]},{"type":"map","entries":[["id",411],["title","Resource Locking Problems"],["url","https://cwe.mitre.org/data/definitions/411.html"],["children",{"type":"map","entries":[["412",{"type":"map","entries":[["id",412],["title","Unrestricted Externally Accessible Lock"],["url","https://cwe.mitre.org/data/definitions/412.html"],["type","child"],["description","The product properly checks for the existence of a lock, but the lock can be externally controlled or influenced by an actor that is outside of the intended sphere of control."],["extended_description","This prevents the product from acting on associated resources or performing other behaviors that are controlled by the presence of the lock. Relevant locks might include an exclusive lock or mutex, or modifying a shared resource that is treated as a lock. If the lock can be held for an indefinite period of time, then the denial of service could be permanent."]]}],["413",{"type":"map","entries":[["id",413],["title","Improper Resource Locking"],["url","https://cwe.mitre.org/data/definitions/413.html"],["type","child"],["description","The product does not lock or does not correctly lock a resource when the product must have exclusive access to the resource."],["extended_description","When a resource is not properly locked, an attacker could modify the resource while it is being operated on by the product. This might violate the product's assumption that the resource will not change, potentially leading to unexpected behaviors."]]}],["414",{"type":"map","entries":[["id",414],["title","Missing Lock Check"],["url","https://cwe.mitre.org/data/definitions/414.html"],["type","child"],["description","A product does not check to see if a lock is present before performing sensitive operations on a resource."],["extended_description",null]]}],["609",{"type":"map","entries":[["id",609],["title","Double-Checked Locking"],["url","https://cwe.mitre.org/data/definitions/609.html"],["type","child"],["description","The product uses double-checked locking to access a resource without the overhead of explicit synchronization, but the locking is insufficient."],["extended_description","Double-checked locking refers to the situation where a programmer checks to see if a resource has been initialized, grabs a lock, checks again to see if the resource has been initialized, and then performs the initialization if it has not occurred yet. This should not be done, as it is not guaranteed to work in all languages and on all architectures. In summary, other threads may not be operating inside the synchronous block and are not guaranteed to see the operations execute in the same order as they would appear inside the synchronous block."]]}],["764",{"type":"map","entries":[["id",764],["title","Multiple Locks of a Critical Resource"],["url","https://cwe.mitre.org/data/definitions/764.html"],["type","child"],["description","The product locks a critical resource more times than intended, leading to an unexpected state in the system."],["extended_description","When a product is operating in a concurrent environment and repeatedly locks a critical resource, the consequences will vary based on the type of lock, the lock's implementation, and the resource being protected. In some situations such as with semaphores, the resources are pooled and extra locking calls will reduce the size of the total available pool, possibly leading to degraded performance or a denial of service. If this can be triggered by an attacker, it will be similar to an unrestricted lock (CWE-412). In the context of a binary lock, it is likely that any duplicate locking attempts will never succeed since the lock is already held and progress may not be possible."]]}],["765",{"type":"map","entries":[["id",765],["title","Multiple Unlocks of a Critical Resource"],["url","https://cwe.mitre.org/data/definitions/765.html"],["type","child"],["description","The product unlocks a critical resource more times than intended, leading to an unexpected state in the system."],["extended_description","When the product is operating in a concurrent environment and repeatedly unlocks a critical resource, the consequences will vary based on the type of lock, the lock's implementation, and the resource being protected. In some situations such as with semaphores, the resources are pooled and extra calls to unlock will increase the count for the number of available resources, likely resulting in a crash or unpredictable behavior when the system nears capacity."]]}],["832",{"type":"map","entries":[["id",832],["title","Unlock of a Resource that is not Locked"],["url","https://cwe.mitre.org/data/definitions/832.html"],["type","child"],["description","The product attempts to unlock a resource that is not locked."],["extended_description","Depending on the locking functionality, an unlock of a non-locked resource might cause memory corruption or other modification to the resource (or its associated metadata that is used for tracking locks)."]]}],["833",{"type":"map","entries":[["id",833],["title","Deadlock"],["url","https://cwe.mitre.org/data/definitions/833.html"],["type","child"],["description","The product contains multiple threads or executable segments that are waiting for each other to release a necessary lock, resulting in deadlock."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper handling of locks that are used to control access to resources."]]},{"type":"map","entries":[["id",412],["title","Unrestricted Externally Accessible Lock"],["url","https://cwe.mitre.org/data/definitions/412.html"],["type","child"],["description","The product properly checks for the existence of a lock, but the lock can be externally controlled or influenced by an actor that is outside of the intended sphere of control."],["extended_description","This prevents the product from acting on associated resources or performing other behaviors that are controlled by the presence of the lock. Relevant locks might include an exclusive lock or mutex, or modifying a shared resource that is treated as a lock. If the lock can be held for an indefinite period of time, then the denial of service could be permanent."]]},{"type":"map","entries":[["id",413],["title","Improper Resource Locking"],["url","https://cwe.mitre.org/data/definitions/413.html"],["type","child"],["description","The product does not lock or does not correctly lock a resource when the product must have exclusive access to the resource."],["extended_description","When a resource is not properly locked, an attacker could modify the resource while it is being operated on by the product. This might violate the product's assumption that the resource will not change, potentially leading to unexpected behaviors."]]},{"type":"map","entries":[["id",414],["title","Missing Lock Check"],["url","https://cwe.mitre.org/data/definitions/414.html"],["type","child"],["description","A product does not check to see if a lock is present before performing sensitive operations on a resource."],["extended_description",null]]},{"type":"map","entries":[["id",609],["title","Double-Checked Locking"],["url","https://cwe.mitre.org/data/definitions/609.html"],["type","child"],["description","The product uses double-checked locking to access a resource without the overhead of explicit synchronization, but the locking is insufficient."],["extended_description","Double-checked locking refers to the situation where a programmer checks to see if a resource has been initialized, grabs a lock, checks again to see if the resource has been initialized, and then performs the initialization if it has not occurred yet. This should not be done, as it is not guaranteed to work in all languages and on all architectures. In summary, other threads may not be operating inside the synchronous block and are not guaranteed to see the operations execute in the same order as they would appear inside the synchronous block."]]},{"type":"map","entries":[["id",764],["title","Multiple Locks of a Critical Resource"],["url","https://cwe.mitre.org/data/definitions/764.html"],["type","child"],["description","The product locks a critical resource more times than intended, leading to an unexpected state in the system."],["extended_description","When a product is operating in a concurrent environment and repeatedly locks a critical resource, the consequences will vary based on the type of lock, the lock's implementation, and the resource being protected. In some situations such as with semaphores, the resources are pooled and extra locking calls will reduce the size of the total available pool, possibly leading to degraded performance or a denial of service. If this can be triggered by an attacker, it will be similar to an unrestricted lock (CWE-412). In the context of a binary lock, it is likely that any duplicate locking attempts will never succeed since the lock is already held and progress may not be possible."]]},{"type":"map","entries":[["id",765],["title","Multiple Unlocks of a Critical Resource"],["url","https://cwe.mitre.org/data/definitions/765.html"],["type","child"],["description","The product unlocks a critical resource more times than intended, leading to an unexpected state in the system."],["extended_description","When the product is operating in a concurrent environment and repeatedly unlocks a critical resource, the consequences will vary based on the type of lock, the lock's implementation, and the resource being protected. In some situations such as with semaphores, the resources are pooled and extra calls to unlock will increase the count for the number of available resources, likely resulting in a crash or unpredictable behavior when the system nears capacity."]]},{"type":"map","entries":[["id",832],["title","Unlock of a Resource that is not Locked"],["url","https://cwe.mitre.org/data/definitions/832.html"],["type","child"],["description","The product attempts to unlock a resource that is not locked."],["extended_description","Depending on the locking functionality, an unlock of a non-locked resource might cause memory corruption or other modification to the resource (or its associated metadata that is used for tracking locks)."]]},{"type":"map","entries":[["id",833],["title","Deadlock"],["url","https://cwe.mitre.org/data/definitions/833.html"],["type","child"],["description","The product contains multiple threads or executable segments that are waiting for each other to release a necessary lock, resulting in deadlock."],["extended_description",null]]},{"type":"map","entries":[["id",399],["title","Resource Management Errors"],["url","https://cwe.mitre.org/data/definitions/399.html"],["children",{"type":"map","entries":[["73",{"type":"map","entries":[["id",73],["title","External Control of File Name or Path"],["url","https://cwe.mitre.org/data/definitions/73.html"],["type","child"],["description","The product allows user input to control or influence paths or file names that are used in filesystem operations."],["extended_description","This could allow an attacker to access or modify system files or other files that are critical to the application.\nPath manipulation errors occur when the following two conditions are met:\n\n1. An attacker can specify a path used in an operation on the filesystem.\n2. By specifying the resource, the attacker gains a capability that would not otherwise be permitted.\n\nFor example, the program may give the attacker the ability to overwrite the specified file or run with a configuration controlled by the attacker."]]}],["403",{"type":"map","entries":[["id",403],["title","Exposure of File Descriptor to Unintended Control Sphere ('File Descriptor Leak')"],["url","https://cwe.mitre.org/data/definitions/403.html"],["type","child"],["description","A process does not close sensitive file descriptors before invoking a child process, which allows the child to perform unauthorized I/O operations using those descriptors."],["extended_description","When a new process is forked or executed, the child process inherits any open file descriptors. When the child process has fewer privileges than the parent process, this might introduce a vulnerability if the child process can access the file descriptor but does not have the privileges to access the associated file."]]}],["410",{"type":"map","entries":[["id",410],["title","Insufficient Resource Pool"],["url","https://cwe.mitre.org/data/definitions/410.html"],["type","child"],["description","The product's resource pool is not large enough to handle peak demand, which allows an attacker to prevent others from accessing the resource by using a (relatively) large number of requests for resources."],["extended_description","Frequently the consequence is a \"flood\" of connection or sessions."]]}],["470",{"type":"map","entries":[["id",470],["title","Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"],["url","https://cwe.mitre.org/data/definitions/470.html"],["type","child"],["description","The product uses external input with reflection to select which classes or code to use, but it does not sufficiently prevent the input from selecting improper classes or code."],["extended_description","If the product uses external inputs to determine which class to instantiate or which method to invoke, then an attacker could supply values to select unexpected classes or methods. If this occurs, then the attacker could create control flow paths that were not intended by the developer. These paths could bypass authentication or access control checks, or otherwise cause the product to behave in an unexpected manner. This situation becomes a doomsday scenario if the attacker can upload files into a location that appears on the product's classpath (CWE-427) or add new entries to the product's classpath (CWE-426). Under either of these conditions, the attacker can use reflection to introduce new, malicious behavior into the product."]]}],["502",{"type":"map","entries":[["id",502],["title","Deserialization of Untrusted Data"],["url","https://cwe.mitre.org/data/definitions/502.html"],["type","child"],["description","The product deserializes untrusted data without sufficiently ensuring that the resulting data will be valid."],["extended_description",null]]}],["619",{"type":"map","entries":[["id",619],["title","Dangling Database Cursor ('Cursor Injection')"],["url","https://cwe.mitre.org/data/definitions/619.html"],["type","child"],["description","If a database cursor is not closed properly, then it could become accessible to other users while retaining the same privileges that were originally assigned, leaving the cursor \"dangling.\""],["extended_description","For example, an improper dangling cursor could arise from unhandled exceptions. The impact of the issue depends on the cursor's role, but SQL injection attacks are commonly possible."]]}],["641",{"type":"map","entries":[["id",641],["title","Improper Restriction of Names for Files and Other Resources"],["url","https://cwe.mitre.org/data/definitions/641.html"],["type","child"],["description","The product constructs the name of a file or other resource using input from an upstream component, but it does not restrict or incorrectly restricts the resulting name."],["extended_description","This may produce resultant weaknesses. For instance, if the names of these resources contain scripting characters, it is possible that a script may get executed in the client's browser if the application ever displays the name of the resource on a dynamically generated web page. Alternately, if the resources are consumed by some application parser, a specially crafted name can exploit some vulnerability internal to the parser, potentially resulting in execution of arbitrary code on the server machine. The problems will vary based on the context of usage of such malformed resource names and whether vulnerabilities are present in or assumptions are made by the targeted technology that would make code execution possible."]]}],["694",{"type":"map","entries":[["id",694],["title","Use of Multiple Resources with Duplicate Identifier"],["url","https://cwe.mitre.org/data/definitions/694.html"],["type","child"],["description","The product uses multiple resources that can have the same identifier, in a context in which unique identifiers are required."],["extended_description","If the product assumes that each resource has a unique identifier, the product could operate on the wrong resource if attackers can cause multiple resources to be associated with the same identifier."]]}],["763",{"type":"map","entries":[["id",763],["title","Release of Invalid Pointer or Reference"],["url","https://cwe.mitre.org/data/definitions/763.html"],["type","child"],["description","The product attempts to return a memory resource to the system, but it calls the wrong release function or calls the appropriate release function incorrectly."],["extended_description","This weakness can take several forms, such as:\n\nThe memory was allocated, explicitly or implicitly, via one memory management method and deallocated using a different, non-compatible function (CWE-762).\nThe function calls or memory management routines chosen are appropriate, however they are used incorrectly, such as in CWE-761."]]}],["770",{"type":"map","entries":[["id",770],["title","Allocation of Resources Without Limits or Throttling"],["url","https://cwe.mitre.org/data/definitions/770.html"],["type","child"],["description","The product allocates a reusable resource or group of resources on behalf of an actor without imposing any intended restrictions on the size or number of resources that can be allocated."],["extended_description",null]]}],["771",{"type":"map","entries":[["id",771],["title","Missing Reference to Active Allocated Resource"],["url","https://cwe.mitre.org/data/definitions/771.html"],["type","child"],["description","The product does not properly maintain a reference to a resource that has been allocated, which prevents the resource from being reclaimed."],["extended_description","This does not necessarily apply in languages or frameworks that automatically perform garbage collection, since the removal of all references may act as a signal that the resource is ready to be reclaimed."]]}],["772",{"type":"map","entries":[["id",772],["title","Missing Release of Resource after Effective Lifetime"],["url","https://cwe.mitre.org/data/definitions/772.html"],["type","child"],["description","The product does not release a resource after its effective lifetime has ended, i.e., after the resource is no longer needed."],["extended_description",null]]}],["826",{"type":"map","entries":[["id",826],["title","Premature Release of Resource During Expected Lifetime"],["url","https://cwe.mitre.org/data/definitions/826.html"],["type","child"],["description","The product releases a resource that is still intended to be used by itself or another actor."],["extended_description","This weakness focuses on errors in which the product should not release a resource, but performs the release anyway. This is different than a weakness in which the product releases a resource at the appropriate time, but it maintains a reference to the resource, which it later accesses. For this weakness, the resource should still be valid upon the subsequent access.\nWhen a product releases a resource that is still being used, it is possible that operations will still be taken on this resource, which may have been repurposed in the meantime, leading to issues similar to CWE-825. Consequences may include denial of service, information exposure, or code execution."]]}],["908",{"type":"map","entries":[["id",908],["title","Use of Uninitialized Resource"],["url","https://cwe.mitre.org/data/definitions/908.html"],["type","child"],["description","The product uses or accesses a resource that has not been initialized."],["extended_description","When a resource has not been properly initialized, the product may behave unexpectedly. This may lead to a crash or invalid memory access, but the consequences vary depending on the type of resource and how it is used within the product."]]}],["909",{"type":"map","entries":[["id",909],["title","Missing Initialization of Resource"],["url","https://cwe.mitre.org/data/definitions/909.html"],["type","child"],["description","The product does not initialize a critical resource."],["extended_description","Many resources require initialization before they can be properly used. If a resource is not initialized, it could contain unpredictable or expired data, or it could be initialized to defaults that are invalid. This can have security implications when the resource is expected to have certain properties or values."]]}],["910",{"type":"map","entries":[["id",910],["title","Use of Expired File Descriptor"],["url","https://cwe.mitre.org/data/definitions/910.html"],["type","child"],["description","The product uses or accesses a file descriptor after it has been closed."],["extended_description","After a file descriptor for a particular file or device has been released, it can be reused. The code might not write to the original file, since the reused file descriptor might reference a different file or device."]]}],["911",{"type":"map","entries":[["id",911],["title","Improper Update of Reference Count"],["url","https://cwe.mitre.org/data/definitions/911.html"],["type","child"],["description","The product uses a reference count to manage a resource, but it does not update or incorrectly updates the reference count."],["extended_description","Reference counts can be used when tracking how many objects contain a reference to a particular resource, such as in memory management or garbage collection. When the reference count reaches zero, the resource can be de-allocated or reused because there are no more objects that use it. If the reference count accidentally reaches zero, then the resource might be released too soon, even though it is still in use. If all objects no longer use the resource, but the reference count is not zero, then the resource might not ever be released."]]}],["914",{"type":"map","entries":[["id",914],["title","Improper Control of Dynamically-Identified Variables"],["url","https://cwe.mitre.org/data/definitions/914.html"],["type","child"],["description","The product does not properly restrict reading from or writing to dynamically-identified variables."],["extended_description","Many languages offer powerful features that allow the programmer to access arbitrary variables that are specified by an input string. While these features can offer significant flexibility and reduce development time, they can be extremely dangerous if attackers can modify unintended variables that have security implications."]]}],["915",{"type":"map","entries":[["id",915],["title","Improperly Controlled Modification of Dynamically-Determined Object Attributes"],["url","https://cwe.mitre.org/data/definitions/915.html"],["type","child"],["description","The product receives input from an upstream component that specifies multiple attributes, properties, or fields that are to be initialized or updated in an object, but it does not properly control which attributes can be modified."],["extended_description","If the object contains attributes that were only intended for internal use, then their unexpected modification could lead to a vulnerability.\nThis weakness is sometimes known by the language-specific mechanisms that make it possible, such as mass assignment, autobinding, or object injection."]]}],["920",{"type":"map","entries":[["id",920],["title","Improper Restriction of Power Consumption"],["url","https://cwe.mitre.org/data/definitions/920.html"],["type","child"],["description","The product operates in an environment in which power is a limited resource that cannot be automatically replenished, but the product does not properly restrict the amount of power that its operation consumes."],["extended_description","In environments such as embedded or mobile devices, power can be a limited resource such as a battery, which cannot be automatically replenished by the product itself, and the device might not always be directly attached to a reliable power source. If the product uses too much power too quickly, then this could cause the device (and subsequently, the product) to stop functioning until power is restored, or increase the financial burden on the device owner because of increased power costs.\nNormal operation of an application will consume power. However, in some cases, an attacker could cause the application to consume more power than intended, using components such as:\n\nDisplay\nCPU\nDisk I/O\nGPS\nSound\nMicrophone\nUSB interface"]]}],["1188",{"type":"map","entries":[["id",1188],["title","Initialization of a Resource with an Insecure Default"],["url","https://cwe.mitre.org/data/definitions/1188.html"],["type","child"],["description","The product initializes or sets a resource with a default that is intended to be changed by the product's installer, administrator, or maintainer, but the default is not secure."],["extended_description",null]]}],["1341",{"type":"map","entries":[["id",1341],["title","Multiple Releases of Same Resource or Handle"],["url","https://cwe.mitre.org/data/definitions/1341.html"],["type","child"],["description","The product attempts to close or release a resource or handle more than once, without any successful open between the close operations."],["extended_description","Code typically requires \"opening\" handles or references to resources such as memory, files, devices, socket connections, services, etc. When the code is finished with using the resource, it is typically expected to \"close\" or \"release\" the resource, which indicates to the environment (such as the OS) that the resource can be re-assigned or reused by unrelated processes or actors - or in some cases, within the same process. API functions or other abstractions are often used to perform this release, such as free() or delete() within C/C++, or file-handle close() operations that are used in many languages.\nUnfortunately, the implementation or design of such APIs might expect the developer to be responsible for ensuring that such APIs are only called once per release of the resource. If the developer attempts to release the same resource/handle more than once, then the API's expectations are not met, resulting in undefined and/or insecure behavior. This could lead to consequences such as memory corruption, data corruption, execution path corruption, or other consequences.\nNote that while the implementation for most (if not all) resource reservation allocations involve a unique identifier/pointer/symbolic reference, then if this identifier is reused, checking the identifier for resource closure may result in a false state of openness and closing of the wrong resource. For this reason, reuse of identifiers is discouraged."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper management of system resources."]]},{"type":"map","entries":[["id",73],["title","External Control of File Name or Path"],["url","https://cwe.mitre.org/data/definitions/73.html"],["type","child"],["description","The product allows user input to control or influence paths or file names that are used in filesystem operations."],["extended_description","This could allow an attacker to access or modify system files or other files that are critical to the application.\nPath manipulation errors occur when the following two conditions are met:\n\n1. An attacker can specify a path used in an operation on the filesystem.\n2. By specifying the resource, the attacker gains a capability that would not otherwise be permitted.\n\nFor example, the program may give the attacker the ability to overwrite the specified file or run with a configuration controlled by the attacker."]]},{"type":"map","entries":[["id",403],["title","Exposure of File Descriptor to Unintended Control Sphere ('File Descriptor Leak')"],["url","https://cwe.mitre.org/data/definitions/403.html"],["type","child"],["description","A process does not close sensitive file descriptors before invoking a child process, which allows the child to perform unauthorized I/O operations using those descriptors."],["extended_description","When a new process is forked or executed, the child process inherits any open file descriptors. When the child process has fewer privileges than the parent process, this might introduce a vulnerability if the child process can access the file descriptor but does not have the privileges to access the associated file."]]},{"type":"map","entries":[["id",410],["title","Insufficient Resource Pool"],["url","https://cwe.mitre.org/data/definitions/410.html"],["type","child"],["description","The product's resource pool is not large enough to handle peak demand, which allows an attacker to prevent others from accessing the resource by using a (relatively) large number of requests for resources."],["extended_description","Frequently the consequence is a \"flood\" of connection or sessions."]]},{"type":"map","entries":[["id",470],["title","Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"],["url","https://cwe.mitre.org/data/definitions/470.html"],["type","child"],["description","The product uses external input with reflection to select which classes or code to use, but it does not sufficiently prevent the input from selecting improper classes or code."],["extended_description","If the product uses external inputs to determine which class to instantiate or which method to invoke, then an attacker could supply values to select unexpected classes or methods. If this occurs, then the attacker could create control flow paths that were not intended by the developer. These paths could bypass authentication or access control checks, or otherwise cause the product to behave in an unexpected manner. This situation becomes a doomsday scenario if the attacker can upload files into a location that appears on the product's classpath (CWE-427) or add new entries to the product's classpath (CWE-426). Under either of these conditions, the attacker can use reflection to introduce new, malicious behavior into the product."]]},{"type":"map","entries":[["id",502],["title","Deserialization of Untrusted Data"],["url","https://cwe.mitre.org/data/definitions/502.html"],["type","child"],["description","The product deserializes untrusted data without sufficiently ensuring that the resulting data will be valid."],["extended_description",null]]},{"type":"map","entries":[["id",619],["title","Dangling Database Cursor ('Cursor Injection')"],["url","https://cwe.mitre.org/data/definitions/619.html"],["type","child"],["description","If a database cursor is not closed properly, then it could become accessible to other users while retaining the same privileges that were originally assigned, leaving the cursor \"dangling.\""],["extended_description","For example, an improper dangling cursor could arise from unhandled exceptions. The impact of the issue depends on the cursor's role, but SQL injection attacks are commonly possible."]]},{"type":"map","entries":[["id",771],["title","Missing Reference to Active Allocated Resource"],["url","https://cwe.mitre.org/data/definitions/771.html"],["type","child"],["description","The product does not properly maintain a reference to a resource that has been allocated, which prevents the resource from being reclaimed."],["extended_description","This does not necessarily apply in languages or frameworks that automatically perform garbage collection, since the removal of all references may act as a signal that the resource is ready to be reclaimed."]]},{"type":"map","entries":[["id",772],["title","Missing Release of Resource after Effective Lifetime"],["url","https://cwe.mitre.org/data/definitions/772.html"],["type","child"],["description","The product does not release a resource after its effective lifetime has ended, i.e., after the resource is no longer needed."],["extended_description",null]]},{"type":"map","entries":[["id",908],["title","Use of Uninitialized Resource"],["url","https://cwe.mitre.org/data/definitions/908.html"],["type","child"],["description","The product uses or accesses a resource that has not been initialized."],["extended_description","When a resource has not been properly initialized, the product may behave unexpectedly. This may lead to a crash or invalid memory access, but the consequences vary depending on the type of resource and how it is used within the product."]]},{"type":"map","entries":[["id",909],["title","Missing Initialization of Resource"],["url","https://cwe.mitre.org/data/definitions/909.html"],["type","child"],["description","The product does not initialize a critical resource."],["extended_description","Many resources require initialization before they can be properly used. If a resource is not initialized, it could contain unpredictable or expired data, or it could be initialized to defaults that are invalid. This can have security implications when the resource is expected to have certain properties or values."]]},{"type":"map","entries":[["id",910],["title","Use of Expired File Descriptor"],["url","https://cwe.mitre.org/data/definitions/910.html"],["type","child"],["description","The product uses or accesses a file descriptor after it has been closed."],["extended_description","After a file descriptor for a particular file or device has been released, it can be reused. The code might not write to the original file, since the reused file descriptor might reference a different file or device."]]},{"type":"map","entries":[["id",911],["title","Improper Update of Reference Count"],["url","https://cwe.mitre.org/data/definitions/911.html"],["type","child"],["description","The product uses a reference count to manage a resource, but it does not update or incorrectly updates the reference count."],["extended_description","Reference counts can be used when tracking how many objects contain a reference to a particular resource, such as in memory management or garbage collection. When the reference count reaches zero, the resource can be de-allocated or reused because there are no more objects that use it. If the reference count accidentally reaches zero, then the resource might be released too soon, even though it is still in use. If all objects no longer use the resource, but the reference count is not zero, then the resource might not ever be released."]]},{"type":"map","entries":[["id",914],["title","Improper Control of Dynamically-Identified Variables"],["url","https://cwe.mitre.org/data/definitions/914.html"],["type","child"],["description","The product does not properly restrict reading from or writing to dynamically-identified variables."],["extended_description","Many languages offer powerful features that allow the programmer to access arbitrary variables that are specified by an input string. While these features can offer significant flexibility and reduce development time, they can be extremely dangerous if attackers can modify unintended variables that have security implications."]]},{"type":"map","entries":[["id",915],["title","Improperly Controlled Modification of Dynamically-Determined Object Attributes"],["url","https://cwe.mitre.org/data/definitions/915.html"],["type","child"],["description","The product receives input from an upstream component that specifies multiple attributes, properties, or fields that are to be initialized or updated in an object, but it does not properly control which attributes can be modified."],["extended_description","If the object contains attributes that were only intended for internal use, then their unexpected modification could lead to a vulnerability.\nThis weakness is sometimes known by the language-specific mechanisms that make it possible, such as mass assignment, autobinding, or object injection."]]},{"type":"map","entries":[["id",920],["title","Improper Restriction of Power Consumption"],["url","https://cwe.mitre.org/data/definitions/920.html"],["type","child"],["description","The product operates in an environment in which power is a limited resource that cannot be automatically replenished, but the product does not properly restrict the amount of power that its operation consumes."],["extended_description","In environments such as embedded or mobile devices, power can be a limited resource such as a battery, which cannot be automatically replenished by the product itself, and the device might not always be directly attached to a reliable power source. If the product uses too much power too quickly, then this could cause the device (and subsequently, the product) to stop functioning until power is restored, or increase the financial burden on the device owner because of increased power costs.\nNormal operation of an application will consume power. However, in some cases, an attacker could cause the application to consume more power than intended, using components such as:\n\nDisplay\nCPU\nDisk I/O\nGPS\nSound\nMicrophone\nUSB interface"]]},{"type":"map","entries":[["id",1341],["title","Multiple Releases of Same Resource or Handle"],["url","https://cwe.mitre.org/data/definitions/1341.html"],["type","child"],["description","The product attempts to close or release a resource or handle more than once, without any successful open between the close operations."],["extended_description","Code typically requires \"opening\" handles or references to resources such as memory, files, devices, socket connections, services, etc. When the code is finished with using the resource, it is typically expected to \"close\" or \"release\" the resource, which indicates to the environment (such as the OS) that the resource can be re-assigned or reused by unrelated processes or actors - or in some cases, within the same process. API functions or other abstractions are often used to perform this release, such as free() or delete() within C/C++, or file-handle close() operations that are used in many languages.\nUnfortunately, the implementation or design of such APIs might expect the developer to be responsible for ensuring that such APIs are only called once per release of the resource. If the developer attempts to release the same resource/handle more than once, then the API's expectations are not met, resulting in undefined and/or insecure behavior. This could lead to consequences such as memory corruption, data corruption, execution path corruption, or other consequences.\nNote that while the implementation for most (if not all) resource reservation allocations involve a unique identifier/pointer/symbolic reference, then if this identifier is reused, checking the identifier for resource closure may result in a false state of openness and closing of the wrong resource. For this reason, reuse of identifiers is discouraged."]]},{"type":"map","entries":[["id",387],["title","Signal Errors"],["url","https://cwe.mitre.org/data/definitions/387.html"],["children",{"type":"map","entries":[["364",{"type":"map","entries":[["id",364],["title","Signal Handler Race Condition"],["url","https://cwe.mitre.org/data/definitions/364.html"],["type","child"],["description","The product uses a signal handler that introduces a race condition."],["extended_description","Race conditions frequently occur in signal handlers, since signal handlers support asynchronous actions. These race conditions have a variety of root causes and symptoms. Attackers may be able to exploit a signal handler race condition to cause the product state to be corrupted, possibly leading to a denial of service or even code execution.\nThese issues occur when non-reentrant functions, or state-sensitive actions occur in the signal handler, where they may be called at any time. These behaviors can violate assumptions being made by the \"regular\" code that is interrupted, or by other signal handlers that may also be invoked. If these functions are called at an inopportune moment - such as while a non-reentrant function is already running - memory corruption could occur that may be exploitable for code execution. Another signal race condition commonly found occurs when free is called within a signal handler, resulting in a double free and therefore a write-what-where condition. Even if a given pointer is set to NULL after it has been freed, a race condition still exists between the time the memory was freed and the pointer was set to NULL. This is especially problematic if the same signal handler has been set for more than one signal -- since it means that the signal handler itself may be reentered.\nThere are several known behaviors related to signal handlers that have received the label of \"signal handler race condition\":\n\nShared state (e.g. global data or static variables) that are accessible to both a signal handler and \"regular\" code\nShared state between a signal handler and other signal handlers\nUse of non-reentrant functionality within a signal handler - which generally implies that shared state is being used. For example, malloc() and free() are non-reentrant because they may use global or static data structures for managing memory, and they are indirectly used by innocent-seeming functions such as syslog(); these functions could be exploited for memory corruption and, possibly, code execution.\nAssociation of the same signal handler function with multiple signals - which might imply shared state, since the same code and resources are accessed. For example, this can be a source of double-free and use-after-free weaknesses.\nUse of setjmp and longjmp, or other mechanisms that prevent a signal handler from returning control back to the original functionality\nWhile not technically a race condition, some signal handlers are designed to be called at most once, and being called more than once can introduce security problems, even when there are not any concurrent calls to the signal handler. This can be a source of double-free and use-after-free weaknesses.\n\nSignal handler vulnerabilities are often classified based on the absence of a specific protection mechanism, although this style of classification is discouraged in CWE because programmers often have a choice of several different mechanisms for addressing the weakness. Such protection mechanisms may preserve exclusivity of access to the shared resource, and behavioral atomicity for the relevant code:\n\nAvoiding shared state\nUsing synchronization in the signal handler\nUsing synchronization in the regular code\nDisabling or masking other signals, which provides atomicity (which effectively ensures exclusivity)"]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the improper handling of signals."]]},{"type":"map","entries":[["id",371],["title","State Issues"],["url","https://cwe.mitre.org/data/definitions/371.html"],["children",{"type":"map","entries":[["15",{"type":"map","entries":[["id",15],["title","External Control of System or Configuration Setting"],["url","https://cwe.mitre.org/data/definitions/15.html"],["type","child"],["description","One or more system settings or configuration elements can be externally controlled by a user."],["extended_description","Allowing external control of system settings can disrupt service or cause an application to behave in unexpected, and potentially malicious ways."]]}],["372",{"type":"map","entries":[["id",372],["title","Incomplete Internal State Distinction"],["url","https://cwe.mitre.org/data/definitions/372.html"],["type","child"],["description","The product does not properly determine which state it is in, causing it to assume it is in state X when in fact it is in state Y, causing it to perform incorrect operations in a security-relevant manner."],["extended_description",null]]}],["374",{"type":"map","entries":[["id",374],["title","Passing Mutable Objects to an Untrusted Method"],["url","https://cwe.mitre.org/data/definitions/374.html"],["type","child"],["description","The product sends non-cloned mutable data as an argument to a method or function."],["extended_description","The function or method that has been called can alter or delete the mutable data. This could violate assumptions that the calling function has made about its state. In situations where unknown code is called with references to mutable data, this external code could make changes to the data sent. If this data was not previously cloned, the modified data might not be valid in the context of execution."]]}],["375",{"type":"map","entries":[["id",375],["title","Returning a Mutable Object to an Untrusted Caller"],["url","https://cwe.mitre.org/data/definitions/375.html"],["type","child"],["description","Sending non-cloned mutable data as a return value may result in that data being altered or deleted by the calling function."],["extended_description","In situations where functions return references to mutable data, it is possible that the external code which called the function may make changes to the data sent. If this data was not previously cloned, the class will then be using modified data which may violate assumptions about its internal state."]]}],["1265",{"type":"map","entries":[["id",1265],["title","Unintended Reentrant Invocation of Non-reentrant Code Via Nested Calls"],["url","https://cwe.mitre.org/data/definitions/1265.html"],["type","child"],["description","The product invokes code that is believed to be reentrant, but the code performs a call that unintentionally produces a nested invocation of the non-reentrant code."],["extended_description","In a complex product, a single function call may lead to many different possible code paths, some of which may involve deeply nested calls. It may be difficult to foresee all possible code paths that could emanate from a given function call, even if that call is assumed to be reentrant. In some systems, an external actor can manipulate inputs to the system and thereby achieve a wide range of possible control flows. This is frequently a concern in products that execute scripts from untrusted sources. Examples of such products are web browsers and PDF readers. A weakness is present when one of the possible code paths resulting from a function call alters program state that the original caller assumes to be unchanged during the call."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper management of system state."]]},{"type":"map","entries":[["id",15],["title","External Control of System or Configuration Setting"],["url","https://cwe.mitre.org/data/definitions/15.html"],["type","child"],["description","One or more system settings or configuration elements can be externally controlled by a user."],["extended_description","Allowing external control of system settings can disrupt service or cause an application to behave in unexpected, and potentially malicious ways."]]},{"type":"map","entries":[["id",372],["title","Incomplete Internal State Distinction"],["url","https://cwe.mitre.org/data/definitions/372.html"],["type","child"],["description","The product does not properly determine which state it is in, causing it to assume it is in state X when in fact it is in state Y, causing it to perform incorrect operations in a security-relevant manner."],["extended_description",null]]},{"type":"map","entries":[["id",374],["title","Passing Mutable Objects to an Untrusted Method"],["url","https://cwe.mitre.org/data/definitions/374.html"],["type","child"],["description","The product sends non-cloned mutable data as an argument to a method or function."],["extended_description","The function or method that has been called can alter or delete the mutable data. This could violate assumptions that the calling function has made about its state. In situations where unknown code is called with references to mutable data, this external code could make changes to the data sent. If this data was not previously cloned, the modified data might not be valid in the context of execution."]]},{"type":"map","entries":[["id",375],["title","Returning a Mutable Object to an Untrusted Caller"],["url","https://cwe.mitre.org/data/definitions/375.html"],["type","child"],["description","Sending non-cloned mutable data as a return value may result in that data being altered or deleted by the calling function."],["extended_description","In situations where functions return references to mutable data, it is possible that the external code which called the function may make changes to the data sent. If this data was not previously cloned, the class will then be using modified data which may violate assumptions about its internal state."]]},{"type":"map","entries":[["id",1265],["title","Unintended Reentrant Invocation of Non-reentrant Code Via Nested Calls"],["url","https://cwe.mitre.org/data/definitions/1265.html"],["type","child"],["description","The product invokes code that is believed to be reentrant, but the code performs a call that unintentionally produces a nested invocation of the non-reentrant code."],["extended_description","In a complex product, a single function call may lead to many different possible code paths, some of which may involve deeply nested calls. It may be difficult to foresee all possible code paths that could emanate from a given function call, even if that call is assumed to be reentrant. In some systems, an external actor can manipulate inputs to the system and thereby achieve a wide range of possible control flows. This is frequently a concern in products that execute scripts from untrusted sources. Examples of such products are web browsers and PDF readers. A weakness is present when one of the possible code paths resulting from a function call alters program state that the original caller assumes to be unchanged during the call."]]},{"type":"map","entries":[["id",133],["title","String Errors"],["url","https://cwe.mitre.org/data/definitions/133.html"],["children",{"type":"map","entries":[["134",{"type":"map","entries":[["id",134],["title","Use of Externally-Controlled Format String"],["url","https://cwe.mitre.org/data/definitions/134.html"],["type","child"],["description","The product uses a function that accepts a format string as an argument, but the format string originates from an external source."],["extended_description",null]]}],["135",{"type":"map","entries":[["id",135],["title","Incorrect Calculation of Multi-Byte String Length"],["url","https://cwe.mitre.org/data/definitions/135.html"],["type","child"],["description","The product does not correctly calculate the length of strings that can contain wide or multi-byte characters."],["extended_description",null]]}],["480",{"type":"map","entries":[["id",480],["title","Use of Incorrect Operator"],["url","https://cwe.mitre.org/data/definitions/480.html"],["type","child"],["description","The product accidentally uses the wrong operator, which changes the logic in security-relevant ways."],["extended_description","These types of errors are generally the result of a typo by the programmer."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the creation and modification of strings."]]},{"type":"map","entries":[["id",134],["title","Use of Externally-Controlled Format String"],["url","https://cwe.mitre.org/data/definitions/134.html"],["type","child"],["description","The product uses a function that accepts a format string as an argument, but the format string originates from an external source."],["extended_description",null]]},{"type":"map","entries":[["id",135],["title","Incorrect Calculation of Multi-Byte String Length"],["url","https://cwe.mitre.org/data/definitions/135.html"],["type","child"],["description","The product does not correctly calculate the length of strings that can contain wide or multi-byte characters."],["extended_description",null]]},{"type":"map","entries":[["id",136],["title","Type Errors"],["url","https://cwe.mitre.org/data/definitions/136.html"],["children",{"type":"map","entries":[["681",{"type":"map","entries":[["id",681],["title","Incorrect Conversion between Numeric Types"],["url","https://cwe.mitre.org/data/definitions/681.html"],["type","child"],["description","When converting from one data type to another, such as long to integer, data can be omitted or translated in a way that produces unexpected values. If the resulting values are used in a sensitive context, then dangerous behaviors may occur."],["extended_description",null]]}],["843",{"type":"map","entries":[["id",843],["title","Access of Resource Using Incompatible Type ('Type Confusion')"],["url","https://cwe.mitre.org/data/definitions/843.html"],["type","child"],["description","The product allocates or initializes a resource such as a pointer, object, or variable using one type, but it later accesses that resource using a type that is incompatible with the original type."],["extended_description","When the product accesses the resource using an incompatible type, this could trigger logical errors because the resource does not have expected properties. In languages without memory safety, such as C and C++, type confusion can lead to out-of-bounds memory access.\nWhile this weakness is frequently associated with unions when parsing data with many different embedded object types in C, it can be present in any application that can interpret the same variable or memory location in multiple ways.\nThis weakness is not unique to C and C++. For example, errors in PHP applications can be triggered by providing array parameters when scalars are expected, or vice versa. Languages such as Perl, which perform automatic conversion of a variable of one type when it is accessed as if it were another type, can also contain these issues."]]}],["1287",{"type":"map","entries":[["id",1287],["title","Improper Validation of Specified Type of Input"],["url","https://cwe.mitre.org/data/definitions/1287.html"],["type","child"],["description","The product receives input that is expected to be of a certain type, but it does not validate or incorrectly validates that the input is actually of the expected type."],["extended_description","When input does not comply with the expected type, attackers could trigger unexpected errors, cause incorrect actions to take place, or exploit latent vulnerabilities that would not be possible if the input conformed with the expected type.\nThis weakness can appear in type-unsafe programming languages, or in programming languages that support casting or conversion of an input to another type."]]}]]}],["type","category"],["summary","Weaknesses in this category are caused by improper data type transformation or improper handling of multiple data types."]]},{"type":"map","entries":[["id",843],["title","Access of Resource Using Incompatible Type ('Type Confusion')"],["url","https://cwe.mitre.org/data/definitions/843.html"],["type","child"],["description","The product allocates or initializes a resource such as a pointer, object, or variable using one type, but it later accesses that resource using a type that is incompatible with the original type."],["extended_description","When the product accesses the resource using an incompatible type, this could trigger logical errors because the resource does not have expected properties. In languages without memory safety, such as C and C++, type confusion can lead to out-of-bounds memory access.\nWhile this weakness is frequently associated with unions when parsing data with many different embedded object types in C, it can be present in any application that can interpret the same variable or memory location in multiple ways.\nThis weakness is not unique to C and C++. For example, errors in PHP applications can be triggered by providing array parameters when scalars are expected, or vice versa. Languages such as Perl, which perform automatic conversion of a variable of one type when it is accessed as if it were another type, can also contain these issues."]]},{"type":"map","entries":[["id",355],["title","User Interface Security Issues"],["url","https://cwe.mitre.org/data/definitions/355.html"],["children",{"type":"map","entries":[["356",{"type":"map","entries":[["id",356],["title","Product UI does not Warn User of Unsafe Actions"],["url","https://cwe.mitre.org/data/definitions/356.html"],["type","child"],["description","The product's user interface does not warn the user before undertaking an unsafe action on behalf of that user. This makes it easier for attackers to trick users into inflicting damage to their system."],["extended_description","Product systems should warn users that a potentially dangerous action may occur if the user proceeds. For example, if the user downloads a file from an unknown source and attempts to execute the file on their machine, then the application's GUI can indicate that the file is unsafe."]]}],["357",{"type":"map","entries":[["id",357],["title","Insufficient UI Warning of Dangerous Operations"],["url","https://cwe.mitre.org/data/definitions/357.html"],["type","child"],["description","The user interface provides a warning to a user regarding dangerous or sensitive operations, but the warning is not noticeable enough to warrant attention."],["extended_description",null]]}],["447",{"type":"map","entries":[["id",447],["title","Unimplemented or Unsupported Feature in UI"],["url","https://cwe.mitre.org/data/definitions/447.html"],["type","child"],["description","A UI function for a security feature appears to be supported and gives feedback to the user that suggests that it is supported, but the underlying functionality is not implemented."],["extended_description",null]]}],["448",{"type":"map","entries":[["id",448],["title","Obsolete Feature in UI"],["url","https://cwe.mitre.org/data/definitions/448.html"],["type","child"],["description","A UI function is obsolete and the product does not warn the user."],["extended_description",null]]}],["449",{"type":"map","entries":[["id",449],["title","The UI Performs the Wrong Action"],["url","https://cwe.mitre.org/data/definitions/449.html"],["type","child"],["description","The UI performs the wrong action with respect to the user's request."],["extended_description",null]]}],["549",{"type":"map","entries":[["id",549],["title","Missing Password Field Masking"],["url","https://cwe.mitre.org/data/definitions/549.html"],["type","child"],["description","The product does not mask passwords during entry, increasing the potential for attackers to observe and capture passwords."],["extended_description",null]]}],["1007",{"type":"map","entries":[["id",1007],["title","Insufficient Visual Distinction of Homoglyphs Presented to User"],["url","https://cwe.mitre.org/data/definitions/1007.html"],["type","child"],["description","The product displays information or identifiers to a user, but the display mechanism does not make it easy for the user to distinguish between visually similar or identical glyphs (homoglyphs), which may cause the user to misinterpret a glyph and perform an unintended, insecure action."],["extended_description","Some glyphs, pictures, or icons can be semantically distinct to a program, while appearing very similar or identical to a human user. These are referred to as homoglyphs. For example, the lowercase \"l\" (ell) and uppercase \"I\" (eye) have different character codes, but these characters can be displayed in exactly the same way to a user, depending on the font. This can also occur between different character sets. For example, the Latin capital letter \"A\" and the Greek capital letter \"\u0391\" (Alpha) are treated as distinct by programs, but may be displayed in exactly the same way to a user. Accent marks may also cause letters to appear very similar, such as the Latin capital letter grave mark \"\u00c0\" and its equivalent \"\u00c1\" with the acute accent.\nAdversaries can exploit this visual similarity for attacks such as phishing, e.g. by providing a link to an attacker-controlled hostname that looks like a hostname that the victim trusts. In a different use of homoglyphs, an adversary may create a back door username that is visually similar to the username of a regular user, which then makes it more difficult for a system administrator to detect the malicious username while reviewing logs."]]}],["1021",{"type":"map","entries":[["id",1021],["title","Improper Restriction of Rendered UI Layers or Frames"],["url","https://cwe.mitre.org/data/definitions/1021.html"],["type","child"],["description","The web application does not restrict or incorrectly restricts frame objects or UI layers that belong to another application or domain."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to or introduced in the User Interface (UI)."]]},{"type":"map","entries":[["id",356],["title","Product UI does not Warn User of Unsafe Actions"],["url","https://cwe.mitre.org/data/definitions/356.html"],["type","child"],["description","The product's user interface does not warn the user before undertaking an unsafe action on behalf of that user. This makes it easier for attackers to trick users into inflicting damage to their system."],["extended_description","Product systems should warn users that a potentially dangerous action may occur if the user proceeds. For example, if the user downloads a file from an unknown source and attempts to execute the file on their machine, then the application's GUI can indicate that the file is unsafe."]]},{"type":"map","entries":[["id",357],["title","Insufficient UI Warning of Dangerous Operations"],["url","https://cwe.mitre.org/data/definitions/357.html"],["type","child"],["description","The user interface provides a warning to a user regarding dangerous or sensitive operations, but the warning is not noticeable enough to warrant attention."],["extended_description",null]]},{"type":"map","entries":[["id",447],["title","Unimplemented or Unsupported Feature in UI"],["url","https://cwe.mitre.org/data/definitions/447.html"],["type","child"],["description","A UI function for a security feature appears to be supported and gives feedback to the user that suggests that it is supported, but the underlying functionality is not implemented."],["extended_description",null]]},{"type":"map","entries":[["id",448],["title","Obsolete Feature in UI"],["url","https://cwe.mitre.org/data/definitions/448.html"],["type","child"],["description","A UI function is obsolete and the product does not warn the user."],["extended_description",null]]},{"type":"map","entries":[["id",449],["title","The UI Performs the Wrong Action"],["url","https://cwe.mitre.org/data/definitions/449.html"],["type","child"],["description","The UI performs the wrong action with respect to the user's request."],["extended_description",null]]},{"type":"map","entries":[["id",1007],["title","Insufficient Visual Distinction of Homoglyphs Presented to User"],["url","https://cwe.mitre.org/data/definitions/1007.html"],["type","child"],["description","The product displays information or identifiers to a user, but the display mechanism does not make it easy for the user to distinguish between visually similar or identical glyphs (homoglyphs), which may cause the user to misinterpret a glyph and perform an unintended, insecure action."],["extended_description","Some glyphs, pictures, or icons can be semantically distinct to a program, while appearing very similar or identical to a human user. These are referred to as homoglyphs. For example, the lowercase \"l\" (ell) and uppercase \"I\" (eye) have different character codes, but these characters can be displayed in exactly the same way to a user, depending on the font. This can also occur between different character sets. For example, the Latin capital letter \"A\" and the Greek capital letter \"\u0391\" (Alpha) are treated as distinct by programs, but may be displayed in exactly the same way to a user. Accent marks may also cause letters to appear very similar, such as the Latin capital letter grave mark \"\u00c0\" and its equivalent \"\u00c1\" with the acute accent.\nAdversaries can exploit this visual similarity for attacks such as phishing, e.g. by providing a link to an attacker-controlled hostname that looks like a hostname that the victim trusts. In a different use of homoglyphs, an adversary may create a back door username that is visually similar to the username of a regular user, which then makes it more difficult for a system administrator to detect the malicious username while reviewing logs."]]},{"type":"map","entries":[["id",1021],["title","Improper Restriction of Rendered UI Layers or Frames"],["url","https://cwe.mitre.org/data/definitions/1021.html"],["type","child"],["description","The web application does not restrict or incorrectly restricts frame objects or UI layers that belong to another application or domain."],["extended_description",null]]},{"type":"map","entries":[["id",1217],["title","User Session Errors"],["url","https://cwe.mitre.org/data/definitions/1217.html"],["children",{"type":"map","entries":[["488",{"type":"map","entries":[["id",488],["title","Exposure of Data Element to Wrong Session"],["url","https://cwe.mitre.org/data/definitions/488.html"],["type","child"],["description","The product does not sufficiently enforce boundaries between the states of different sessions, causing data to be provided to, or used by, the wrong session."],["extended_description","Data can \"bleed\" from one session to another through member variables of singleton objects, such as Servlets, and objects from a shared pool.\nIn the case of Servlets, developers sometimes do not understand that, unless a Servlet implements the SingleThreadModel interface, the Servlet is a singleton; there is only one instance of the Servlet, and that single instance is used and re-used to handle multiple requests that are processed simultaneously by different threads. A common result is that developers use Servlet member fields in such a way that one user may inadvertently see another user's data. In other words, storing user data in Servlet member fields introduces a data access race condition."]]}],["613",{"type":"map","entries":[["id",613],["title","Insufficient Session Expiration"],["url","https://cwe.mitre.org/data/definitions/613.html"],["type","child"],["description","According to WASC, \"Insufficient Session Expiration is when a web site permits an attacker to reuse old session credentials or session IDs for authorization.\""],["extended_description",null]]}],["841",{"type":"map","entries":[["id",841],["title","Improper Enforcement of Behavioral Workflow"],["url","https://cwe.mitre.org/data/definitions/841.html"],["type","child"],["description","The product supports a session in which more than one behavior must be performed by an actor, but it does not properly ensure that the actor performs the behaviors in the required sequence."],["extended_description","By performing actions in an unexpected order, or by omitting steps, an attacker could manipulate the business logic of the product or cause it to enter an invalid state. In some cases, this can also expose resultant weaknesses.\nFor example, a file-sharing protocol might require that an actor perform separate steps to provide a username, then a password, before being able to transfer files. If the file-sharing server accepts a password command followed by a transfer command, without any username being provided, the product might still perform the transfer.\nNote that this is different than CWE-696, which focuses on when the product performs actions in the wrong sequence; this entry is closely related, but it is focused on ensuring that the actor performs actions in the correct sequence.\nWorkflow-related behaviors include:\n\nSteps are performed in the expected order.\nRequired steps are not omitted.\nSteps are not interrupted.\nSteps are performed in a timely fashion."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to session management. Frequently these deal with the information or status about each user and their access rights for the duration of multiple requests. The weaknesses in this category could lead to a degradation of the quality of session management if they are not addressed."]]},{"type":"map","entries":[["id",488],["title","Exposure of Data Element to Wrong Session"],["url","https://cwe.mitre.org/data/definitions/488.html"],["type","child"],["description","The product does not sufficiently enforce boundaries between the states of different sessions, causing data to be provided to, or used by, the wrong session."],["extended_description","Data can \"bleed\" from one session to another through member variables of singleton objects, such as Servlets, and objects from a shared pool.\nIn the case of Servlets, developers sometimes do not understand that, unless a Servlet implements the SingleThreadModel interface, the Servlet is a singleton; there is only one instance of the Servlet, and that single instance is used and re-used to handle multiple requests that are processed simultaneously by different threads. A common result is that developers use Servlet member fields in such a way that one user may inadvertently see another user's data. In other words, storing user data in Servlet member fields introduces a data access race condition."]]},{"type":"map","entries":[["id",613],["title","Insufficient Session Expiration"],["url","https://cwe.mitre.org/data/definitions/613.html"],["type","child"],["description","According to WASC, \"Insufficient Session Expiration is when a web site permits an attacker to reuse old session credentials or session IDs for authorization.\""],["extended_description",null]]}]],["node_id",["Main","CWE-1228","CWE-242","CWE-474","CWE-475","CWE-477","CWE-676","CWE-695","CWE-749","CWE-1210","CWE-117","CWE-222","CWE-223","CWE-224","CWE-778","CWE-779","CWE-1211","CWE-289","CWE-290","CWE-294","CWE-295","CWE-301","CWE-303","CWE-305","CWE-306","CWE-307","CWE-308","CWE-309","CWE-322","CWE-603","CWE-645","CWE-804","CWE-836","CWE-1212","CWE-425","CWE-551","CWE-552","CWE-639","CWE-653","CWE-939","CWE-842","CWE-1220","CWE-1230","CWE-1006","CWE-358","CWE-360","CWE-478","CWE-487","CWE-489","CWE-547","CWE-561","CWE-562","CWE-563","CWE-581","CWE-586","CWE-605","CWE-628","CWE-654","CWE-656","CWE-694","CWE-807","CWE-1041","CWE-1043","CWE-1044","CWE-1045","CWE-1046","CWE-1048","CWE-1049","CWE-1050","CWE-1063","CWE-1065","CWE-1066","CWE-1067","CWE-1070","CWE-1071","CWE-1072","CWE-1073","CWE-1079","CWE-1082","CWE-1084","CWE-1085","CWE-1087","CWE-1089","CWE-1092","CWE-1094","CWE-1097","CWE-1098","CWE-1099","CWE-1101","CWE-1102","CW
