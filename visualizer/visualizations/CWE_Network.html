third-party components that are not\n\t\t\t\t\tactively supported or maintained by the original developer or a trusted proxy\n\t\t\t\t\tfor the original developer."],["extended_description",null]]}],["1106",{"type":"map","entries":[["id",1106],["title","Insufficient Use of Symbolic Constants"],["url","https://cwe.mitre.org/data/definitions/1106.html"],["type","child"],["description","The source code uses literal constants that may need to change\n\t\t\t\t\tor evolve over time, instead of using symbolic constants."],["extended_description",null]]}],["1107",{"type":"map","entries":[["id",1107],["title","Insufficient Isolation of Symbolic Constant Definitions"],["url","https://cwe.mitre.org/data/definitions/1107.html"],["type","child"],["description","The source code uses symbolic constants, but it does not\n\t\t\t\t\tsufficiently place the definitions of these constants into a more centralized or\n\t\t\t\t\tisolated location."],["extended_description",null]]}],["1108",{"type":"map","entries":[["id",1108],["title","Excessive Reliance on Global Variables"],["url","https://cwe.mitre.org/data/definitions/1108.html"],["type","child"],["description","The code is structured in a way that relies too much on using\n\t\t\t\t\tor setting global variables throughout various points in the code, instead of\n\t\t\t\t\tpreserving the associated information in a narrower, more local\n\t\t\t\t\tcontext."],["extended_description",null]]}],["1109",{"type":"map","entries":[["id",1109],["title","Use of Same Variable for Multiple Purposes"],["url","https://cwe.mitre.org/data/definitions/1109.html"],["type","child"],["description","The code contains a callable, block, or other code element in\n\t\t\t\t\twhich the same variable is used to control more than one unique task or store\n\t\t\t\t\tmore than one instance of data."],["extended_description",null]]}],["1113",{"type":"map","entries":[["id",1113],["title","Inappropriate Comment Style"],["url","https://cwe.mitre.org/data/definitions/1113.html"],["type","child"],["description","The source code uses comment styles or formats that are\n\t\t\t\t\tinconsistent or do not follow expected standards for the\n\t\t\t\t\tproduct."],["extended_description",null]]}],["1114",{"type":"map","entries":[["id",1114],["title","Inappropriate Whitespace Style"],["url","https://cwe.mitre.org/data/definitions/1114.html"],["type","child"],["description","The source code contains whitespace that is inconsistent across\n\t\t\t\t\tthe code or does not follow expected standards for the\n\t\t\t\t\tproduct."],["extended_description",null]]}],["1115",{"type":"map","entries":[["id",1115],["title","Source Code Element without Standard Prologue"],["url","https://cwe.mitre.org/data/definitions/1115.html"],["type","child"],["description","The source code contains elements such as source files \n\t\t\t\t\tthat do not consistently provide a prologue or header that has been\n\t\t\t\t\tstandardized for the project."],["extended_description","Standard prologues or headers may contain information such as module name, version number, author, date, purpose, function, assumptions, limitations, accuracy considerations, etc."]]}],["1116",{"type":"map","entries":[["id",1116],["title","Inaccurate Source Code Comments"],["url","https://cwe.mitre.org/data/definitions/1116.html"],["type","child"],["description","The source code contains comments that do not accurately\n\t\t\t\t\tdescribe or explain aspects of the portion of the code with which the comment is\n\t\t\t\t\tassociated."],["extended_description",""]]}],["1117",{"type":"map","entries":[["id",1117],["title","Callable with Insufficient Behavioral Summary"],["url","https://cwe.mitre.org/data/definitions/1117.html"],["type","child"],["description","The code contains a function or method whose signature and/or associated\n\t\t\t\t\tinline documentation does not sufficiently describe the callable's inputs, outputs,\n\t\t\t\t\tside effects, assumptions, or return codes."],["extended_description",null]]}],["1126",{"type":"map","entries":[["id",1126],["title","Declaration of Variable with Unnecessarily Wide Scope"],["url","https://cwe.mitre.org/data/definitions/1126.html"],["type","child"],["description","The source code declares a variable in one scope, but the\n\t\t\t\t\tvariable is only used within a narrower scope."],["extended_description",null]]}],["1127",{"type":"map","entries":[["id",1127],["title","Compilation with Insufficient Warnings or Errors"],["url","https://cwe.mitre.org/data/definitions/1127.html"],["type","child"],["description","The code is compiled without sufficient warnings enabled, which\n\t\t\t\t\tmay prevent the detection of subtle bugs or quality\n\t\t\t\t\tissues."],["extended_description",null]]}],["1235",{"type":"map","entries":[["id",1235],["title","Incorrect Use of Autoboxing and Unboxing for Performance Critical Operations"],["url","https://cwe.mitre.org/data/definitions/1235.html"],["type","child"],["description","The code uses boxed primitives, which may introduce inefficiencies into performance-critical operations."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to coding practices that are deemed unsafe and increase the chances that an exploitable vulnerability will be present in the application. These weaknesses do not directly introduce a vulnerability, but indicate that the product has not been carefully developed or maintained. If a program is complex, difficult to maintain, not portable, or shows evidence of neglect, then there is a higher likelihood that weaknesses are buried in the code."]]},{"type":"map","entries":[["id",358],["title","Improperly Implemented Security Check for Standard"],["url","https://cwe.mitre.org/data/definitions/358.html"],["type","child"],["description","The product does not implement or incorrectly implements one or more security-relevant checks as specified by the design of a standardized algorithm, protocol, or technique."],["extended_description",null]]},{"type":"map","entries":[["id",360],["title","Trust of System Event Data"],["url","https://cwe.mitre.org/data/definitions/360.html"],["type","child"],["description","Security based on event locations are insecure and can be spoofed."],["extended_description","Events are a messaging system which may provide control data to programs listening for events. Events often do not have any type of authentication framework to allow them to be verified from a trusted source. Any application, in Windows, on a given desktop can send a message to any window on the same desktop. There is no authentication framework for these messages. Therefore, any message can be used to manipulate any process on the desktop if the process does not check the validity and safeness of those messages."]]},{"type":"map","entries":[["id",478],["title","Missing Default Case in Multiple Condition Expression"],["url","https://cwe.mitre.org/data/definitions/478.html"],["type","child"],["description","The code does not have a default case in an expression with multiple conditions, such as a switch statement."],["extended_description","If a multiple-condition expression (such as a switch in C) omits the default case but does not consider or handle all possible values that could occur, then this might lead to complex logical errors and resultant weaknesses. Because of this, further decisions are made based on poor information, and cascading failure results. This cascading failure may result in any number of security issues, and constitutes a significant failure in the system."]]},{"type":"map","entries":[["id",487],["title","Reliance on Package-level Scope"],["url","https://cwe.mitre.org/data/definitions/487.html"],["type","child"],["description","Java packages are not inherently closed; therefore, relying on them for code security is not a good practice."],["extended_description","The purpose of package scope is to prevent accidental access by other parts of a program. This is an ease-of-software-development feature but not a security feature."]]},{"type":"map","entries":[["id",489],["title","Active Debug Code"],["url","https://cwe.mitre.org/data/definitions/489.html"],["type","child"],["description","The product is released with debugging code still enabled or active."],["extended_description",null]]},{"type":"map","entries":[["id",547],["title","Use of Hard-coded, Security-relevant Constants"],["url","https://cwe.mitre.org/data/definitions/547.html"],["type","child"],["description","The product uses hard-coded constants instead of symbolic names for security-critical values, which increases the likelihood of mistakes during code maintenance or security policy change."],["extended_description","If the developer does not find all occurrences of the hard-coded constants, an incorrect policy decision may be made if one of the constants is not changed. Making changes to these values will require code changes that may be difficult or impossible once the system is released to the field. In addition, these hard-coded values may become available to attackers if the code is ever disclosed."]]},{"type":"map","entries":[["id",561],["title","Dead Code"],["url","https://cwe.mitre.org/data/definitions/561.html"],["type","child"],["description","The product contains dead code, which can never be executed."],["extended_description","Dead code is code that can never be executed in a running program. The surrounding code makes it impossible for a section of code to ever be executed."]]},{"type":"map","entries":[["id",562],["title","Return of Stack Variable Address"],["url","https://cwe.mitre.org/data/definitions/562.html"],["type","child"],["description","A function returns the address of a stack variable, which will cause unintended program behavior, typically in the form of a crash."],["extended_description","Because local variables are allocated on the stack, when a program returns a pointer to a local variable, it is returning a stack address. A subsequent function call is likely to re-use this same stack address, thereby overwriting the value of the pointer, which no longer corresponds to the same variable since a function's stack frame is invalidated when it returns. At best this will cause the value of the pointer to change unexpectedly. In many cases it causes the program to crash the next time the pointer is dereferenced."]]},{"type":"map","entries":[["id",563],["title","Assignment to Variable without Use"],["url","https://cwe.mitre.org/data/definitions/563.html"],["type","child"],["description","The variable's value is assigned but never used, making it a dead store."],["extended_description","After the assignment, the variable is either assigned another value or goes out of scope. It is likely that the variable is simply vestigial, but it is also possible that the unused variable points out a bug."]]},{"type":"map","entries":[["id",581],["title","Object Model Violation: Just One of Equals and Hashcode Defined"],["url","https://cwe.mitre.org/data/definitions/581.html"],["type","child"],["description","The product does not maintain equal hashcodes for equal objects."],["extended_description","Java objects are expected to obey a number of invariants related to equality. One of these invariants is that equal objects must have equal hashcodes. In other words, if a.equals(b) == true then a.hashCode() == b.hashCode()."]]},{"type":"map","entries":[["id",586],["title","Explicit Call to Finalize()"],["url","https://cwe.mitre.org/data/definitions/586.html"],["type","child"],["description","The product makes an explicit call to the finalize() method from outside the finalizer."],["extended_description","While the Java Language Specification allows an object's finalize() method to be called from outside the finalizer, doing so is usually a bad idea. For example, calling finalize() explicitly means that finalize() will be called more than once: the first time will be the explicit call and the last time will be the call that is made after the object is garbage collected."]]},{"type":"map","entries":[["id",605],["title","Multiple Binds to the Same Port"],["url","https://cwe.mitre.org/data/definitions/605.html"],["type","child"],["description","When multiple sockets are allowed to bind to the same port, other services on that port may be stolen or spoofed."],["extended_description","On most systems, a combination of setting the SO_REUSEADDR socket option, and a call to bind() allows any process to bind to a port to which a previous process has bound with INADDR_ANY. This allows a user to bind to the specific address of a server bound to INADDR_ANY on an unprivileged port, and steal its UDP packets/TCP connection."]]},{"type":"map","entries":[["id",628],["title","Function Call with Incorrectly Specified Arguments"],["url","https://cwe.mitre.org/data/definitions/628.html"],["type","child"],["description","The product calls a function, procedure, or routine with arguments that are not correctly specified, leading to always-incorrect behavior and resultant weaknesses."],["extended_description","There are multiple ways in which this weakness can be introduced, including:\n\nthe wrong variable or reference;\nan incorrect number of arguments;\nincorrect order of arguments;\nwrong type of arguments; or\nwrong value."]]},{"type":"map","entries":[["id",654],["title","Reliance on a Single Factor in a Security Decision"],["url","https://cwe.mitre.org/data/definitions/654.html"],["type","child"],["description","A protection mechanism relies exclusively, or to a large extent, on the evaluation of a single condition or the integrity of a single object or entity in order to make a decision about granting access to restricted resources or functionality."],["extended_description",null]]},{"type":"map","entries":[["id",656],["title","Reliance on Security Through Obscurity"],["url","https://cwe.mitre.org/data/definitions/656.html"],["type","child"],["description","The product uses a protection mechanism whose strength depends heavily on its obscurity, such that knowledge of its algorithms or key data is sufficient to defeat the mechanism."],["extended_description","This reliance on \"security through obscurity\" can produce resultant weaknesses if an attacker is able to reverse engineer the inner workings of the mechanism. Note that obscurity can be one small part of defense in depth, since it can create more work for an attacker; however, it is a significant risk if used as the primary means of protection."]]},{"type":"map","entries":[["id",694],["title","Use of Multiple Resources with Duplicate Identifier"],["url","https://cwe.mitre.org/data/definitions/694.html"],["type","child"],["description","The product uses multiple resources that can have the same identifier, in a context in which unique identifiers are required."],["extended_description","If the product assumes that each resource has a unique identifier, the product could operate on the wrong resource if attackers can cause multiple resources to be associated with the same identifier."]]},{"type":"map","entries":[["id",807],["title","Reliance on Untrusted Inputs in a Security Decision"],["url","https://cwe.mitre.org/data/definitions/807.html"],["type","child"],["description","The product uses a protection mechanism that relies on the existence or values of an input, but the input can be modified by an untrusted actor in a way that bypasses the protection mechanism."],["extended_description","Developers may assume that inputs such as cookies, environment variables, and hidden form fields cannot be modified. However, an attacker could change these inputs using customized clients or other attacks. This change might not be detected. When security decisions such as authentication and authorization are made based on the values of these inputs, attackers can bypass the security of the software.\nWithout sufficient encryption, integrity checking, or other mechanism, any input that originates from an outsider cannot be trusted."]]},{"type":"map","entries":[["id",1041],["title","Use of Redundant Code"],["url","https://cwe.mitre.org/data/definitions/1041.html"],["type","child"],["description","The product has multiple functions, methods, procedures, macros, etc. that\n\t\t\t\t\tcontain the same code."],["extended_description",null]]},{"type":"map","entries":[["id",1043],["title","Data Element Aggregating an Excessively Large Number of Non-Primitive Elements"],["url","https://cwe.mitre.org/data/definitions/1043.html"],["type","child"],["description","The product uses a data element that has an excessively large\n\t\t\t\t\tnumber of sub-elements with non-primitive data types such as structures or aggregated objects."],["extended_description","While the interpretation of \"excessively large\" may vary for each product or developer, CISQ recommends a default of 5 sub-elements."]]},{"type":"map","entries":[["id",1044],["title","Architecture with Number of Horizontal Layers Outside of Expected Range"],["url","https://cwe.mitre.org/data/definitions/1044.html"],["type","child"],["description","The product's architecture contains too many - or too few -\n\t\t\t\t\thorizontal layers."],["extended_description","While the interpretation of \"expected range\" may vary for each product or developer, CISQ recommends a default minimum of 4 layers and maximum of 8 layers."]]},{"type":"map","entries":[["id",1045],["title","Parent Class with a Virtual Destructor and a Child Class without a Virtual Destructor"],["url","https://cwe.mitre.org/data/definitions/1045.html"],["type","child"],["description","A parent class has a virtual destructor method, but the parent has a child class that does not have a virtual destructor."],["extended_description",null]]},{"type":"map","entries":[["id",1046],["title","Creation of Immutable Text Using String Concatenation"],["url","https://cwe.mitre.org/data/definitions/1046.html"],["type","child"],["description","The product creates an immutable text string using string concatenation operations."],["extended_description","When building a string via a looping feature (e.g., a FOR or WHILE loop), the use of += to append to the existing string will result in the creation of a new object with each iteration, which can be inefficient in comparison with use of text buffer data elements."]]},{"type":"map","entries":[["id",1048],["title","Invokable Control Element with Large Number of Outward Calls"],["url","https://cwe.mitre.org/data/definitions/1048.html"],["type","child"],["description","The code contains callable control elements that\n         contain an excessively large number of references to other\n         application objects external to the context of the callable,\n         i.e. a Fan-Out value that is excessively large."],["extended_description","While the interpretation of \"excessively large Fan-Out value\" may vary for each product or developer, CISQ recommends a default of 5 referenced objects."]]},{"type":"map","entries":[["id",1049],["title","Excessive Data Query Operations in a Large Data Table"],["url","https://cwe.mitre.org/data/definitions/1049.html"],["type","child"],["description","The product performs a data query with a large number of joins\n\t\t\t\t\tand sub-queries on a large data table."],["extended_description","While the interpretation of \"large data table\" and \"large number of joins or sub-queries\" may vary for each product or developer, CISQ recommends a default of 1 million rows for a \"large\" data table, a default minimum of 5 joins, and a default minimum of 3 sub-queries."]]},{"type":"map","entries":[["id",1050],["title","Excessive Platform Resource Consumption within a Loop"],["url","https://cwe.mitre.org/data/definitions/1050.html"],["type","child"],["description","The product has a loop body or loop condition that contains a control element that directly or\n\t\t\t\t\tindirectly consumes platform resources, e.g. messaging, sessions, locks, or file\n\t\t\t\t\tdescriptors."],["extended_description",""]]},{"type":"map","entries":[["id",1063],["title","Creation of Class Instance within a Static Code Block"],["url","https://cwe.mitre.org/data/definitions/1063.html"],["type","child"],["description","A static code block creates an instance of a class."],["extended_description","This pattern identifies situations where a storable data element or member data element is initialized with a value in a block of code which is declared as static."]]},{"type":"map","entries":[["id",1065],["title","Runtime Resource Management Control Element in a Component Built to Run on Application Servers"],["url","https://cwe.mitre.org/data/definitions/1065.html"],["type","child"],["description","The product uses deployed components from application servers, but it also uses low-level functions/methods for management of resources, instead of the API provided by the application server."],["extended_description",null]]},{"type":"map","entries":[["id",1066],["title","Missing Serialization Control Element"],["url","https://cwe.mitre.org/data/definitions/1066.html"],["type","child"],["description","The product contains a serializable data element that does not\n\t\t\t\t\thave an associated serialization method."],["extended_description",null]]},{"type":"map","entries":[["id",1067],["title","Excessive Execution of Sequential Searches of Data Resource"],["url","https://cwe.mitre.org/data/definitions/1067.html"],["type","child"],["description","The product contains a data query against an SQL table or view\n\t\t\t\t\tthat is configured in a way that does not utilize an index and may cause\n\t\t\t\t\tsequential searches to be performed."],["extended_description",null]]},{"type":"map","entries":[["id",1070],["title","Serializable Data Element Containing non-Serializable Item Elements"],["url","https://cwe.mitre.org/data/definitions/1070.html"],["type","child"],["description","The product contains a serializable, storable data element such as a field or member,\n\t\t\t\t\tbut the data element contains member elements that are not\n\t\t\t\t\tserializable."],["extended_description",null]]},{"type":"map","entries":[["id",1071],["title","Empty Code Block"],["url","https://cwe.mitre.org/data/definitions/1071.html"],["type","child"],["description","The source code contains a block that does not contain any code, i.e., the block is empty."],["extended_description","Empty code blocks can occur in the bodies of conditionals, function or method definitions, exception handlers, etc.  While an empty code block might be intentional, it might also indicate incomplete implementation, accidental code deletion, unexpected macro expansion, etc.  For some programming languages and constructs, an empty block might be allowed by the syntax, but the lack of any behavior within the block might violate a convention or API in such a way that it is an error."]]},{"type":"map","entries":[["id",1072],["title","Data Resource Access without Use of Connection Pooling"],["url","https://cwe.mitre.org/data/definitions/1072.html"],["type","child"],["description","The product accesses a data resource through a database without using a\n\t\t\t\t\tconnection pooling capability."],["extended_description",null]]},{"type":"map","entries":[["id",1073],["title","Non-SQL Invokable Control Element with Excessive Number of Data Resource Accesses"],["url","https://cwe.mitre.org/data/definitions/1073.html"],["type","child"],["description","The product contains a client with a function or method that contains a large number of data accesses/queries that are sent through a data manager, i.e., does not use efficient database capabilities."],["extended_description","While the interpretation of \"large number of data accesses/queries\" may vary for each product or developer, CISQ recommends a default maximum of 2 data accesses per function/method."]]},{"type":"map","entries":[["id",1079],["title","Parent Class without Virtual Destructor Method"],["url","https://cwe.mitre.org/data/definitions/1079.html"],["type","child"],["description","A parent class contains one or more child classes, but the parent class does not have a virtual destructor method."],["extended_description",null]]},{"type":"map","entries":[["id",1082],["title","Class Instance Self Destruction Control Element"],["url","https://cwe.mitre.org/data/definitions/1082.html"],["type","child"],["description","The code contains a class instance that calls the method or function to delete or destroy itself."],["extended_description","For example, in C++, \"delete this\" will cause the object to delete itself."]]},{"type":"map","entries":[["id",1084],["title","Invokable Control Element with Excessive File or Data Access Operations"],["url","https://cwe.mitre.org/data/definitions/1084.html"],["type","child"],["description","A function or method contains too many\n\t\t\t\t\toperations that utilize a data manager or file resource."],["extended_description","While the interpretation of \"too many operations\" may vary for each product or developer, CISQ recommends a default maximum of 7 operations for the same data manager or file."]]},{"type":"map","entries":[["id",1085],["title","Invokable Control Element with Excessive Volume of Commented-out Code"],["url","https://cwe.mitre.org/data/definitions/1085.html"],["type","child"],["description","A function, method, procedure, etc. contains an excessive amount of code that has been\n\t\t\t\t\tcommented out within its body."],["extended_description","While the interpretation of \"excessive volume\" may vary for each product or developer, CISQ recommends a default threshold of 2% of commented code."]]},{"type":"map","entries":[["id",1087],["title","Class with Virtual Method without a Virtual Destructor"],["url","https://cwe.mitre.org/data/definitions/1087.html"],["type","child"],["description","A class contains a virtual method, but the method does not have an associated virtual destructor."],["extended_description",null]]},{"type":"map","entries":[["id",1089],["title","Large Data Table with Excessive Number of Indices"],["url","https://cwe.mitre.org/data/definitions/1089.html"],["type","child"],["description","The product uses a large data table that contains an excessively large number of\n\t\t\t\t\tindices."],["extended_description","While the interpretation of \"large data table\" and \"excessively large number of indices\" may vary for each product or developer, CISQ recommends a default threshold of 1000000 rows for a \"large\" table and a default threshold of 3 indices."]]},{"type":"map","entries":[["id",1092],["title","Use of Same Invokable Control Element in Multiple Architectural Layers"],["url","https://cwe.mitre.org/data/definitions/1092.html"],["type","child"],["description","The product uses the same control element across multiple\n\t\t\t\t\tarchitectural layers."],["extended_description",null]]},{"type":"map","entries":[["id",1094],["title","Excessive Index Range Scan for a Data Resource"],["url","https://cwe.mitre.org/data/definitions/1094.html"],["type","child"],["description","The product contains an index range scan for a large data table,\n\t\t\t\t\tbut the scan can cover a large number of rows."],["extended_description","While the interpretation of \"large data table\" and \"excessive index range\" may vary for each product or developer, CISQ recommends a threshold of 1000000 table rows and a threshold of 10 for the index range."]]},{"type":"map","entries":[["id",1097],["title","Persistent Storable Data Element without Associated Comparison Control Element"],["url","https://cwe.mitre.org/data/definitions/1097.html"],["type","child"],["description","The product uses a storable data element that does not have\n\t\t\t\t\tall of the associated functions or methods that are necessary to support\n\t\t\t\t\tcomparison."],["extended_description",null]]},{"type":"map","entries":[["id",1098],["title","Data Element containing Pointer Item without Proper Copy Control Element"],["url","https://cwe.mitre.org/data/definitions/1098.html"],["type","child"],["description","The code contains a data element with a pointer that does not have an associated copy or constructor method."],["extended_description",null]]},{"type":"map","entries":[["id",1099],["title","Inconsistent Naming Conventions for Identifiers"],["url","https://cwe.mitre.org/data/definitions/1099.html"],["type","child"],["description","The product's code, documentation, or other artifacts do not\n\t\t\t\t\tconsistently use the same naming conventions for variables, callables, groups of\n\t\t\t\t\trelated callables, I/O capabilities, data types, file names, or similar types of\n\t\t\t\t\telements."],["extended_description",null]]},{"type":"map","entries":[["id",1101],["title","Reliance on Runtime Component in Generated Code"],["url","https://cwe.mitre.org/data/definitions/1101.html"],["type","child"],["description","The product uses automatically-generated code that cannot be\n\t\t\t\t\texecuted without a specific runtime support component."],["extended_description",null]]},{"type":"map","entries":[["id",1102],["title","Reliance on Machine-Dependent Data Representation"],["url","https://cwe.mitre.org/data/definitions/1102.html"],["type","child"],["description","The code uses a data representation that relies on low-level\n\t\t\t\t\tdata representation or constructs that may vary across different processors,\n\t\t\t\t\tphysical machines, OSes, or other physical components."],["extended_description",null]]},{"type":"map","entries":[["id",1103],["title","Use of Platform-Dependent Third Party Components"],["url","https://cwe.mitre.org/data/definitions/1103.html"],["type","child"],["description","The product relies on third-party components that do\n\t\t\t\t\tnot provide equivalent functionality across all desirable\n\t\t\t\t\tplatforms."],["extended_description",null]]},{"type":"map","entries":[["id",1104],["title","Use of Unmaintained Third Party Components"],["url","https://cwe.mitre.org/data/definitions/1104.html"],["type","child"],["description","The product relies on third-party components that are not\n\t\t\t\t\tactively supported or maintained by the original developer or a trusted proxy\n\t\t\t\t\tfor the original developer."],["extended_description",null]]},{"type":"map","entries":[["id",1106],["title","Insufficient Use of Symbolic Constants"],["url","https://cwe.mitre.org/data/definitions/1106.html"],["type","child"],["description","The source code uses literal constants that may need to change\n\t\t\t\t\tor evolve over time, instead of using symbolic constants."],["extended_description",null]]},{"type":"map","entries":[["id",1107],["title","Insufficient Isolation of Symbolic Constant Definitions"],["url","https://cwe.mitre.org/data/definitions/1107.html"],["type","child"],["description","The source code uses symbolic constants, but it does not\n\t\t\t\t\tsufficiently place the definitions of these constants into a more centralized or\n\t\t\t\t\tisolated location."],["extended_description",null]]},{"type":"map","entries":[["id",1108],["title","Excessive Reliance on Global Variables"],["url","https://cwe.mitre.org/data/definitions/1108.html"],["type","child"],["description","The code is structured in a way that relies too much on using\n\t\t\t\t\tor setting global variables throughout various points in the code, instead of\n\t\t\t\t\tpreserving the associated information in a narrower, more local\n\t\t\t\t\tcontext."],["extended_description",null]]},{"type":"map","entries":[["id",1109],["title","Use of Same Variable for Multiple Purposes"],["url","https://cwe.mitre.org/data/definitions/1109.html"],["type","child"],["description","The code contains a callable, block, or other code element in\n\t\t\t\t\twhich the same variable is used to control more than one unique task or store\n\t\t\t\t\tmore than one instance of data."],["extended_description",null]]},{"type":"map","entries":[["id",1113],["title","Inappropriate Comment Style"],["url","https://cwe.mitre.org/data/definitions/1113.html"],["type","child"],["description","The source code uses comment styles or formats that are\n\t\t\t\t\tinconsistent or do not follow expected standards for the\n\t\t\t\t\tproduct."],["extended_description",null]]},{"type":"map","entries":[["id",1114],["title","Inappropriate Whitespace Style"],["url","https://cwe.mitre.org/data/definitions/1114.html"],["type","child"],["description","The source code contains whitespace that is inconsistent across\n\t\t\t\t\tthe code or does not follow expected standards for the\n\t\t\t\t\tproduct."],["extended_description",null]]},{"type":"map","entries":[["id",1115],["title","Source Code Element without Standard Prologue"],["url","https://cwe.mitre.org/data/definitions/1115.html"],["type","child"],["description","The source code contains elements such as source files \n\t\t\t\t\tthat do not consistently provide a prologue or header that has been\n\t\t\t\t\tstandardized for the project."],["extended_description","Standard prologues or headers may contain information such as module name, version number, author, date, purpose, function, assumptions, limitations, accuracy considerations, etc."]]},{"type":"map","entries":[["id",1116],["title","Inaccurate Source Code Comments"],["url","https://cwe.mitre.org/data/definitions/1116.html"],["type","child"],["description","The source code contains comments that do not accurately\n\t\t\t\t\tdescribe or explain aspects of the portion of the code with which the comment is\n\t\t\t\t\tassociated."],["extended_description",""]]},{"type":"map","entries":[["id",1117],["title","Callable with Insufficient Behavioral Summary"],["url","https://cwe.mitre.org/data/definitions/1117.html"],["type","child"],["description","The code contains a function or method whose signature and/or associated\n\t\t\t\t\tinline documentation does not sufficiently describe the callable's inputs, outputs,\n\t\t\t\t\tside effects, assumptions, or return codes."],["extended_description",null]]},{"type":"map","entries":[["id",1126],["title","Declaration of Variable with Unnecessarily Wide Scope"],["url","https://cwe.mitre.org/data/definitions/1126.html"],["type","child"],["description","The source code declares a variable in one scope, but the\n\t\t\t\t\tvariable is only used within a narrower scope."],["extended_description",null]]},{"type":"map","entries":[["id",1127],["title","Compilation with Insufficient Warnings or Errors"],["url","https://cwe.mitre.org/data/definitions/1127.html"],["type","child"],["description","The code is compiled without sufficient warnings enabled, which\n\t\t\t\t\tmay prevent the detection of subtle bugs or quality\n\t\t\t\t\tissues."],["extended_description",null]]},{"type":"map","entries":[["id",1235],["title","Incorrect Use of Autoboxing and Unboxing for Performance Critical Operations"],["url","https://cwe.mitre.org/data/definitions/1235.html"],["type","child"],["description","The code uses boxed primitives, which may introduce inefficiencies into performance-critical operations."],["extended_description",null]]},{"type":"map","entries":[["id",438],["title","Behavioral Problems"],["url","https://cwe.mitre.org/data/definitions/438.html"],["children",{"type":"map","entries":[["115",{"type":"map","entries":[["id",115],["title","Misinterpretation of Input"],["url","https://cwe.mitre.org/data/definitions/115.html"],["type","child"],["description","The product misinterprets an input, whether from an attacker or another product, in a security-relevant fashion."],["extended_description",null]]}],["179",{"type":"map","entries":[["id",179],["title","Incorrect Behavior Order: Early Validation"],["url","https://cwe.mitre.org/data/definitions/179.html"],["type","child"],["description","The product validates input before applying protection mechanisms that modify the input, which could allow an attacker to bypass the validation via dangerous inputs that only arise after the modification."],["extended_description","Product needs to validate data at the proper time, after data has been canonicalized and cleansed. Early validation is susceptible to various manipulations that result in dangerous inputs that are produced by canonicalization and cleansing."]]}],["408",{"type":"map","entries":[["id",408],["title","Incorrect Behavior Order: Early Amplification"],["url","https://cwe.mitre.org/data/definitions/408.html"],["type","child"],["description","The product allows an entity to perform a legitimate but expensive operation before authentication or authorization has taken place."],["extended_description",null]]}],["437",{"type":"map","entries":[["id",437],["title","Incomplete Model of Endpoint Features"],["url","https://cwe.mitre.org/data/definitions/437.html"],["type","child"],["description","A product acts as an intermediary or monitor between two or more endpoints, but it does not have a complete model of an endpoint's features, behaviors, or state, potentially causing the product to perform incorrect actions based on this incomplete model."],["extended_description",null]]}],["439",{"type":"map","entries":[["id",439],["title","Behavioral Change in New Version or Environment"],["url","https://cwe.mitre.org/data/definitions/439.html"],["type","child"],["description","A's behavior or functionality changes with a new version of A, or a new environment, which is not known (or manageable) by B."],["extended_description",null]]}],["440",{"type":"map","entries":[["id",440],["title","Expected Behavior Violation"],["url","https://cwe.mitre.org/data/definitions/440.html"],["type","child"],["description","A feature, API, or function does not perform according to its specification."],["extended_description",null]]}],["444",{"type":"map","entries":[["id",444],["title","Inconsistent Interpretation of HTTP Requests ('HTTP Request/Response Smuggling')"],["url","https://cwe.mitre.org/data/definitions/444.html"],["type","child"],["description","The product acts as an intermediary HTTP agent\n         (such as a proxy or firewall) in the data flow between two\n         entities such as a client and server, but it does not\n         interpret malformed HTTP requests or responses in ways that\n         are consistent with how the messages will be processed by\n         those entities that are at the ultimate destination."],["extended_description","HTTP requests or responses (\"messages\") can be\n\t   malformed or unexpected in ways that cause web servers or\n\t   clients to interpret the messages in different ways than\n\t   intermediary HTTP agents such as load balancers, reverse\n\t   proxies, web caching proxies, application firewalls,\n\t   etc. For example, an adversary may be able to add duplicate\n\t   or different header fields that a client or server might\n\t   interpret as one set of messages, whereas the intermediary\n\t   might interpret the same sequence of bytes as a different\n\t   set of messages. For example, discrepancies can arise in\n\t   how to handle duplicate headers like two Transfer-encoding\n\t   (TE) or two Content-length (CL), or the malicious HTTP\n\t   message will have different headers for TE and\n\t   CL.\nThe inconsistent parsing and interpretation of messages\n\t   can allow the adversary to \"smuggle\" a message to the\n\t   client/server without the intermediary being aware of it.\nThis weakness is usually the result of the usage\n\t   of outdated or incompatible HTTP protocol versions in the\n\t   HTTP agents."]]}],["480",{"type":"map","entries":[["id",480],["title","Use of Incorrect Operator"],["url","https://cwe.mitre.org/data/definitions/480.html"],["type","child"],["description","The product accidentally uses the wrong operator, which changes the logic in security-relevant ways."],["extended_description","These types of errors are generally the result of a typo by the programmer."]]}],["483",{"type":"map","entries":[["id",483],["title","Incorrect Block Delimitation"],["url","https://cwe.mitre.org/data/definitions/483.html"],["type","child"],["description","The code does not explicitly delimit a block that is intended to contain 2 or more statements, creating a logic error."],["extended_description","In some languages, braces (or other delimiters) are optional for blocks. When the delimiter is omitted, it is possible to insert a logic error in which a statement is thought to be in a block but is not. In some cases, the logic error can have security implications."]]}],["484",{"type":"map","entries":[["id",484],["title","Omitted Break Statement in Switch"],["url","https://cwe.mitre.org/data/definitions/484.html"],["type","child"],["description","The product omits a break statement within a switch or similar construct, causing code associated with multiple conditions to execute. This can cause problems when the programmer only intended to execute code associated with one condition."],["extended_description","This can lead to critical code executing in situations where it should not."]]}],["551",{"type":"map","entries":[["id",551],["title","Incorrect Behavior Order: Authorization Before Parsing and Canonicalization"],["url","https://cwe.mitre.org/data/definitions/551.html"],["type","child"],["description","If a web server does not fully parse requested URLs before it examines them for authorization, it may be possible for an attacker to bypass authorization protection."],["extended_description","For instance, the character strings /./ and / both mean current directory. If /SomeDirectory is a protected directory and an attacker requests /./SomeDirectory, the attacker may be able to gain access to the resource if /./ is not converted to / before the authorization check is performed."]]}],["698",{"type":"map","entries":[["id",698],["title","Execution After Redirect (EAR)"],["url","https://cwe.mitre.org/data/definitions/698.html"],["type","child"],["description","The web application sends a redirect to another location, but instead of exiting, it executes additional code."],["extended_description",null]]}],["733",{"type":"map","entries":[["id",733],["title","Compiler Optimization Removal or Modification of Security-critical Code"],["url","https://cwe.mitre.org/data/definitions/733.html"],["type","child"],["description","The developer builds a security-critical protection mechanism into the software, but the compiler optimizes the program such that the mechanism is removed or modified."],["extended_description",null]]}],["783",{"type":"map","entries":[["id",783],["title","Operator Precedence Logic Error"],["url","https://cwe.mitre.org/data/definitions/783.html"],["type","child"],["description","The product uses an expression in which operator precedence causes incorrect logic to be used."],["extended_description","While often just a bug, operator precedence logic errors can have serious consequences if they are used in security-critical code, such as making an authentication decision."]]}],["835",{"type":"map","entries":[["id",835],["title","Loop with Unreachable Exit Condition ('Infinite Loop')"],["url","https://cwe.mitre.org/data/definitions/835.html"],["type","child"],["description","The product contains an iteration or loop with an exit condition that cannot be reached, i.e., an infinite loop."],["extended_description",null]]}],["837",{"type":"map","entries":[["id",837],["title","Improper Enforcement of a Single, Unique Action"],["url","https://cwe.mitre.org/data/definitions/837.html"],["type","child"],["description","The product requires that an actor should only be able to perform an action once, or to have only one unique action, but the product does not enforce or improperly enforces this restriction."],["extended_description","In various applications, a user is only expected to perform a certain action once, such as voting, requesting a refund, or making a purchase. When this restriction is not enforced, sometimes this can have security implications. For example, in a voting application, an attacker could attempt to \"stuff the ballot box\" by voting multiple times. If these votes are counted separately, then the attacker could directly affect who wins the vote. This could have significant business impact depending on the purpose of the product."]]}],["841",{"type":"map","entries":[["id",841],["title","Improper Enforcement of Behavioral Workflow"],["url","https://cwe.mitre.org/data/definitions/841.html"],["type","child"],["description","The product supports a session in which more than one behavior must be performed by an actor, but it does not properly ensure that the actor performs the behaviors in the required sequence."],["extended_description","By performing actions in an unexpected order, or by omitting steps, an attacker could manipulate the business logic of the product or cause it to enter an invalid state. In some cases, this can also expose resultant weaknesses.\nFor example, a file-sharing protocol might require that an actor perform separate steps to provide a username, then a password, before being able to transfer files. If the file-sharing server accepts a password command followed by a transfer command, without any username being provided, the product might still perform the transfer.\nNote that this is different than CWE-696, which focuses on when the product performs actions in the wrong sequence; this entry is closely related, but it is focused on ensuring that the actor performs actions in the correct sequence.\nWorkflow-related behaviors include:\n\nSteps are performed in the expected order.\nRequired steps are not omitted.\nSteps are not interrupted.\nSteps are performed in a timely fashion."]]}],["1025",{"type":"map","entries":[["id",1025],["title","Comparison Using Wrong Factors"],["url","https://cwe.mitre.org/data/definitions/1025.html"],["type","child"],["description","The code performs a comparison between two entities, but the comparison examines the wrong factors or characteristics of the entities, which can lead to incorrect results and resultant weaknesses."],["extended_description",null]]}],["1037",{"type":"map","entries":[["id",1037],["title","Processor Optimization Removal or Modification of Security-critical Code"],["url","https://cwe.mitre.org/data/definitions/1037.html"],["type","child"],["description","The developer builds a security-critical protection mechanism into the software, but the processor optimizes the execution of the program such that the mechanism is removed or modified."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to unexpected behaviors from code that an application uses."]]},{"type":"map","entries":[["id",115],["title","Misinterpretation of Input"],["url","https://cwe.mitre.org/data/definitions/115.html"],["type","child"],["description","The product misinterprets an input, whether from an attacker or another product, in a security-relevant fashion."],["extended_description",null]]},{"type":"map","entries":[["id",179],["title","Incorrect Behavior Order: Early Validation"],["url","https://cwe.mitre.org/data/definitions/179.html"],["type","child"],["description","The product validates input before applying protection mechanisms that modify the input, which could allow an attacker to bypass the validation via dangerous inputs that only arise after the modification."],["extended_description","Product needs to validate data at the proper time, after data has been canonicalized and cleansed. Early validation is susceptible to various manipulations that result in dangerous inputs that are produced by canonicalization and cleansing."]]},{"type":"map","entries":[["id",408],["title","Incorrect Behavior Order: Early Amplification"],["url","https://cwe.mitre.org/data/definitions/408.html"],["type","child"],["description","The product allows an entity to perform a legitimate but expensive operation before authentication or authorization has taken place."],["extended_description",null]]},{"type":"map","entries":[["id",437],["title","Incomplete Model of Endpoint Features"],["url","https://cwe.mitre.org/data/defin ent or server might\n\t   interpret as one set of messages, whereas the intermediary\n\t   might interpret the same sequence of bytes as a different\n\t   set of messages. For example, discrepancies can arise in\n\t   how to handle duplicate headers like two Transfer-encoding\n\t   (TE) or two Content-length (CL), or the malicious HTTP\n\t   message will have different headers for TE and\n\t   CL.\nThe inconsistent parsing and interpretation of messages\n\t   can allow the adversary to \"smuggle\" a message to the\n\t   client/server without the intermediary being aware of it.\nThis weakness is usually the result of the usage\n\t   of outdated or incompatible HTTP protocol versions in the\n\t   HTTP agents."]]},{"type":"map","entries":[["id",480],["title","Use of Incorrect Operator"],["url","https://cwe.mitre.org/data/definitions/480.html"],["type","child"],["description","The product accidentally uses the wrong operator, which changes the logic in security-relevant ways."],["extended_description","These types of errors are generally the result of a typo by the programmer."]]},{"type":"map","entries":[["id",483],["title","Incorrect Block Delimitation"],["url","https://cwe.mitre.org/data/definitions/483.html"],["type","child"],["description","The code does not explicitly delimit a block that is intended to contain 2 or more statements, creating a logic error."],["extended_description","In some languages, braces (or other delimiters) are optional for blocks. When the delimiter is omitted, it is possible to insert a logic error in which a statement is thought to be in a block but is not. In some cases, the logic error can have security implications."]]},{"type":"map","entries":[["id",484],["title","Omitted Break Statement in Switch"],["url","https://cwe.mitre.org/data/definitions/484.html"],["type","child"],["description","The product omits a break statement within a switch or similar construct, causing code associated with multiple conditions to execute. This can cause problems when the programmer only intended to execute code associated with one condition."],["extended_description","This can lead to critical code executing in situations where it should not."]]},{"type":"map","entries":[["id",698],["title","Execution After Redirect (EAR)"],["url","https://cwe.mitre.org/data/definitions/698.html"],["type","child"],["description","The web application sends a redirect to another location, but instead of exiting, it executes additional code."],["extended_description",null]]},{"type":"map","entries":[["id",733],["title","Compiler Optimization Removal or Modification of Security-critical Code"],["url","https://cwe.mitre.org/data/definitions/733.html"],["type","child"],["description","The developer builds a security-critical protection mechanism into the software, but the compiler optimizes the program such that the mechanism is removed or modified."],["extended_description",null]]},{"type":"map","entries":[["id",783],["title","Operator Precedence Logic Error"],["url","https://cwe.mitre.org/data/definitions/783.html"],["type","child"],["description","The product uses an expression in which operator precedence causes incorrect logic to be used."],["extended_description","While often just a bug, operator precedence logic errors can have serious consequences if they are used in security-critical code, such as making an authentication decision."]]},{"type":"map","entries":[["id",835],["title","Loop with Unreachable Exit Condition ('Infinite Loop')"],["url","https://cwe.mitre.org/data/definitions/835.html"],["type","child"],["description","The product contains an iteration or loop with an exit condition that cannot be reached, i.e., an infinite loop."],["extended_description",null]]},{"type":"map","entries":[["id",837],["title","Improper Enforcement of a Single, Unique Action"],["url","https://cwe.mitre.org/data/definitions/837.html"],["type","child"],["description","The product requires that an actor should only be able to perform an action once, or to have only one unique action, but the product does not enforce or improperly enforces this restriction."],["extended_description","In various applications, a user is only expected to perform a certain action once, such as voting, requesting a refund, or making a purchase. When this restriction is not enforced, sometimes this can have security implications. For example, in a voting application, an attacker could attempt to \"stuff the ballot box\" by voting multiple times. If these votes are counted separately, then the attacker could directly affect who wins the vote. This could have significant business impact depending on the purpose of the product."]]},{"type":"map","entries":[["id",841],["title","Improper Enforcement of Behavioral Workflow"],["url","https://cwe.mitre.org/data/definitions/841.html"],["type","child"],["description","The product supports a session in which more than one behavior must be performed by an actor, but it does not properly ensure that the actor performs the behaviors in the required sequence."],["extended_description","By performing actions in an unexpected order, or by omitting steps, an attacker could manipulate the business logic of the product or cause it to enter an invalid state. In some cases, this can also expose resultant weaknesses.\nFor example, a file-sharing protocol might require that an actor perform separate steps to provide a username, then a password, before being able to transfer files. If the file-sharing server accepts a password command followed by a transfer command, without any username being provided, the product might still perform the transfer.\nNote that this is different than CWE-696, which focuses on when the product performs actions in the wrong sequence; this entry is closely related, but it is focused on ensuring that the actor performs actions in the correct sequence.\nWorkflow-related behaviors include:\n\nSteps are performed in the expected order.\nRequired steps are not omitted.\nSteps are not interrupted.\nSteps are performed in a timely fashion."]]},{"type":"map","entries":[["id",1025],["title","Comparison Using Wrong Factors"],["url","https://cwe.mitre.org/data/definitions/1025.html"],["type","child"],["description","The code performs a comparison between two entities, but the comparison examines the wrong factors or characteristics of the entities, which can lead to incorrect results and resultant weaknesses."],["extended_description",null]]},{"type":"map","entries":[["id",1037],["title","Processor Optimization Removal or Modification of Security-critical Code"],["url","https://cwe.mitre.org/data/definitions/1037.html"],["type","child"],["description","The developer builds a security-critical protection mechanism into the software, but the processor optimizes the execution of the program such that the mechanism is removed or modified."],["extended_description",null]]},{"type":"map","entries":[["id",840],["title","Business Logic Errors"],["url","https://cwe.mitre.org/data/definitions/840.html"],["children",{"type":"map","entries":[["283",{"type":"map","entries":[["id",283],["title","Unverified Ownership"],["url","https://cwe.mitre.org/data/definitions/283.html"],["type","child"],["description","The product does not properly verify that a critical resource is owned by the proper entity."],["extended_description",null]]}],["639",{"type":"map","entries":[["id",639],["title","Authorization Bypass Through User-Controlled Key"],["url","https://cwe.mitre.org/data/definitions/639.html"],["type","child"],["description","The system's authorization functionality does not prevent one user from gaining access to another user's data or record by modifying the key value identifying the data."],["extended_description","Retrieval of a user record occurs in the system based on some key value that is under user control. The key would typically identify a user-related record stored in the system and would be used to lookup that record for presentation to the user. It is likely that an attacker would have to be an authenticated user in the system. However, the authorization process would not properly check the data access operation to ensure that the authenticated user performing the operation has sufficient entitlements to perform the requested data access, hence bypassing any other authorization checks present in the system.\nFor example, attackers can look at places where user specific data is retrieved (e.g. search screens) and determine whether the key for the item being looked up is controllable externally. The key may be a hidden field in the HTML form field, might be passed as a URL parameter or as an unencrypted cookie variable, then in each of these cases it will be possible to tamper with the key value.\nOne manifestation of this weakness is when a system uses sequential or otherwise easily-guessable session IDs that would allow one user to easily switch to another user's session and read/modify their data."]]}],["640",{"type":"map","entries":[["id",640],["title","Weak Password Recovery Mechanism for Forgotten Password"],["url","https://cwe.mitre.org/data/definitions/640.html"],["type","child"],["description","The product contains a mechanism for users to recover or change their passwords without knowing the original password, but the mechanism is weak."],["extended_description","It is common for an application to have a mechanism that provides a means for a user to gain access to their account in the event they forget their password. Very often the password recovery mechanism is weak, which has the effect of making it more likely that it would be possible for a person other than the legitimate system user to gain access to that user's account. Weak password recovery schemes completely undermine a strong password authentication scheme.\nThis weakness may be that the security question is too easy to guess or find an answer to (e.g. because the question is too common, or the answers can be found using social media). Or there might be an implementation weakness in the password recovery mechanism code that may for instance trick the system into e-mailing the new password to an e-mail account other than that of the user. There might be no throttling done on the rate of password resets so that a legitimate user can be denied service by an attacker if an attacker tries to recover their password in a rapid succession. The system may send the original password to the user rather than generating a new temporary password. In summary, password recovery functionality, if not carefully designed and implemented can often become the system's weakest link that can be misused in a way that would allow an attacker to gain unauthorized access to the system."]]}],["708",{"type":"map","entries":[["id",708],["title","Incorrect Ownership Assignment"],["url","https://cwe.mitre.org/data/definitions/708.html"],["type","child"],["description","The product assigns an owner to a resource, but the owner is outside of the intended control sphere."],["extended_description","This may allow the resource to be manipulated by actors outside of the intended control sphere."]]}],["770",{"type":"map","entries":[["id",770],["title","Allocation of Resources Without Limits or Throttling"],["url","https://cwe.mitre.org/data/definitions/770.html"],["type","child"],["description","The product allocates a reusable resource or group of resources on behalf of an actor without imposing any intended restrictions on the size or number of resources that can be allocated."],["extended_description",null]]}],["826",{"type":"map","entries":[["id",826],["title","Premature Release of Resource During Expected Lifetime"],["url","https://cwe.mitre.org/data/definitions/826.html"],["type","child"],["description","The product releases a resource that is still intended to be used by itself or another actor."],["extended_description","This weakness focuses on errors in which the product should not release a resource, but performs the release anyway. This is different than a weakness in which the product releases a resource at the appropriate time, but it maintains a reference to the resource, which it later accesses. For this weakness, the resource should still be valid upon the subsequent access.\nWhen a product releases a resource that is still being used, it is possible that operations will still be taken on this resource, which may have been repurposed in the meantime, leading to issues similar to CWE-825. Consequences may include denial of service, information exposure, or code execution."]]}],["837",{"type":"map","entries":[["id",837],["title","Improper Enforcement of a Single, Unique Action"],["url","https://cwe.mitre.org/data/definitions/837.html"],["type","child"],["description","The product requires that an actor should only be able to perform an action once, or to have only one unique action, but the product does not enforce or improperly enforces this restriction."],["extended_description","In various applications, a user is only expected to perform a certain action once, such as voting, requesting a refund, or making a purchase. When this restriction is not enforced, sometimes this can have security implications. For example, in a voting application, an attacker could attempt to \"stuff the ballot box\" by voting multiple times. If these votes are counted separately, then the attacker could directly affect who wins the vote. This could have significant business impact depending on the purpose of the product."]]}],["841",{"type":"map","entries":[["id",841],["title","Improper Enforcement of Behavioral Workflow"],["url","https://cwe.mitre.org/data/definitions/841.html"],["type","child"],["description","The product supports a session in which more than one behavior must be performed by an actor, but it does not properly ensure that the actor performs the behaviors in the required sequence."],["extended_description","By performing actions in an unexpected order, or by omitting steps, an attacker could manipulate the business logic of the product or cause it to enter an invalid state. In some cases, this can also expose resultant weaknesses.\nFor example, a file-sharing protocol might require that an actor perform separate steps to provide a username, then a password, before being able to transfer files. If the file-sharing server accepts a password command followed by a transfer command, without any username being provided, the product might still perform the transfer.\nNote that this is different than CWE-696, which focuses on when the product performs actions in the wrong sequence; this entry is closely related, but it is focused on ensuring that the actor performs actions in the correct sequence.\nWorkflow-related behaviors include:\n\nSteps are performed in the expected order.\nRequired steps are not omitted.\nSteps are not interrupted.\nSteps are performed in a timely fashion."]]}]]}],["type","category"],["summary","Weaknesses in this category identify some of the underlying problems that commonly allow attackers to manipulate the business logic of an application. Errors in business logic can be devastating to an entire application. They can be difficult to find automatically, since they typically involve legitimate use of the application's functionality. However, many business logic errors can exhibit patterns that are similar to well-understood implementation and design weaknesses."]]},{"type":"map","entries":[["id",283],["title","Unverified Ownership"],["url","https://cwe.mitre.org/data/definitions/283.html"],["type","child"],["description","The product does not properly verify that a critical resource is owned by the proper entity."],["extended_description",null]]},{"type":"map","entries":[["id",640],["title","Weak Password Recovery Mechanism for Forgotten Password"],["url","https://cwe.mitre.org/data/definitions/640.html"],["type","child"],["description","The product contains a mechanism for users to recover or change their passwords without knowing the original password, but the mechanism is weak."],["extended_description","It is common for an application to have a mechanism that provides a means for a user to gain access to their account in the event they forget their password. Very often the password recovery mechanism is weak, which has the effect of making it more likely that it would be possible for a person other than the legitimate system user to gain access to that user's account. Weak password recovery schemes completely undermine a strong password authentication scheme.\nThis weakness may be that the security question is too easy to guess or find an answer to (e.g. because the question is too common, or the answers can be found using social media). Or there might be an implementation weakness in the password recovery mechanism code that may for instance trick the system into e-mailing the new password to an e-mail account other than that of the user. There might be no throttling done on the rate of password resets so that a legitimate user can be denied service by an attacker if an attacker tries to recover their password in a rapid succession. The system may send the original password to the user rather than generating a new temporary password. In summary, password recovery functionality, if not carefully designed and implemented can often become the system's weakest link that can be misused in a way that would allow an attacker to gain unauthorized access to the system."]]},{"type":"map","entries":[["id",708],["title","Incorrect Ownership Assignment"],["url","https://cwe.mitre.org/data/definitions/708.html"],["type","child"],["description","The product assigns an owner to a resource, but the owner is outside of the intended control sphere."],["extended_description","This may allow the resource to be manipulated by actors outside of the intended control sphere."]]},{"type":"map","entries":[["id",770],["title","Allocation of Resources Without Limits or Throttling"],["url","https://cwe.mitre.org/data/definitions/770.html"],["type","child"],["description","The product allocates a reusable resource or group of resources on behalf of an actor without imposing any intended restrictions on the size or number of resources that can be allocated."],["extended_description",null]]},{"type":"map","entries":[["id",826],["title","Premature Release of Resource During Expected Lifetime"],["url","https://cwe.mitre.org/data/definitions/826.html"],["type","child"],["description","The product releases a resource that is still intended to be used by itself or another actor."],["extended_description","This weakness focuses on errors in which the product should not release a resource, but performs the release anyway. This is different than a weakness in which the product releases a resource at the appropriate time, but it maintains a reference to the resource, which it later accesses. For this weakness, the resource should still be valid upon the subsequent access.\nWhen a product releases a resource that is still being used, it is possible that operations will still be taken on this resource, which may have been repurposed in the meantime, leading to issues similar to CWE-825. Consequences may include denial of service, information exposure, or code execution."]]},{"type":"map","entries":[["id",417],["title","Communication Channel Errors"],["url","https://cwe.mitre.org/data/definitions/417.html"],["children",{"type":"map","entries":[["322",{"type":"map","entries":[["id",322],["title","Key Exchange without Entity Authentication"],["url","https://cwe.mitre.org/data/definitions/322.html"],["type","child"],["description","The product performs a key exchange with an actor without verifying the identity of that actor."],["extended_description","Performing a key exchange will preserve the integrity of the information sent between two entities, but this will not guarantee that the entities are who they claim they are. This may enable an attacker to impersonate an actor by modifying traffic between the two entities.  Typically, this involves a victim client that contacts a malicious server that is impersonating a trusted server. If the client skips authentication or ignores an authentication failure, the malicious server may request authentication information from the user. The malicious server can then use this authentication information to log in to the trusted server using the victim's credentials, sniff traffic between the victim and trusted server, etc."]]}],["346",{"type":"map","entries":[["id",346],["title","Origin Validation Error"],["url","https://cwe.mitre.org/data/definitions/346.html"],["type","child"],["description","The product does not properly verify that the source of data or communication is valid."],["extended_description",null]]}],["385",{"type":"map","entries":[["id",385],["title","Covert Timing Channel"],["url","https://cwe.mitre.org/data/definitions/385.html"],["type","child"],["description","Covert timing channels convey information by modulating some aspect of system behavior over time, so that the program receiving the information can observe system behavior and infer protected information."],["extended_description","In some instances, knowing when data is transmitted between parties can provide a malicious user with privileged information. Also, externally monitoring the timing of operations can potentially reveal sensitive data. For example, a cryptographic operation can expose its internal state if the time it takes to perform the operation varies, based on the state.\nCovert channels are frequently classified as either storage or timing channels. Some examples of covert timing channels are the system's paging rate, the time a certain transaction requires to execute, and the time it takes to gain access to a shared bus."]]}],["419",{"type":"map","entries":[["id",419],["title","Unprotected Primary Channel"],["url","https://cwe.mitre.org/data/definitions/419.html"],["type","child"],["description","The product uses a primary channel for administration or restricted functionality, but it does not properly protect the channel."],["extended_description",null]]}],["420",{"type":"map","entries":[["id",420],["title","Unprotected Alternate Channel"],["url","https://cwe.mitre.org/data/definitions/420.html"],["type","child"],["description","The product protects a primary channel, but it does not use the same level of protection for an alternate channel."],["extended_description",null]]}],["425",{"type":"map","entries":[["id",425],["title","Direct Request ('Forced Browsing')"],["url","https://cwe.mitre.org/data/definitions/425.html"],["type","child"],["description","The web application does not adequately enforce appropriate authorization on all restricted URLs, scripts, or files."],["extended_description",null]]}],["515",{"type":"map","entries":[["id",515],["title","Covert Storage Channel"],["url","https://cwe.mitre.org/data/definitions/515.html"],["type","child"],["description","A covert storage channel transfers information through the setting of bits by one program and the reading of those bits by another. What distinguishes this case from that of ordinary operation is that the bits are used to convey encoded information."],["extended_description","Covert storage channels occur when out-of-band data is stored in messages for the purpose of memory reuse. Covert channels are frequently classified as either storage or timing channels. Examples would include using a file intended to hold only audit information to convey user passwords--using the name of a file or perhaps status bits associated with it that can be read by all users to signal the contents of the file. Steganography, concealing information in such a manner that no one but the intended recipient knows of the existence of the message, is a good example of a covert storage channel."]]}],["918",{"type":"map","entries":[["id",918],["title","Server-Side Request Forgery (SSRF)"],["url","https://cwe.mitre.org/data/definitions/918.html"],["type","child"],["description","The web server receives a URL or similar request from an upstream component and retrieves the contents of this URL, but it does not sufficiently ensure that the request is being sent to the expected destination."],["extended_description",null]]}],["924",{"type":"map","entries":[["id",924],["title","Improper Enforcement of Message Integrity During Transmission in a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/924.html"],["type","child"],["description","The product establishes a communication channel with an endpoint and receives a message from that endpoint, but it does not sufficiently ensure that the message was not modified during transmission."],["extended_description","Attackers might be able to modify the message and spoof the endpoint by interfering with the data as it crosses the network or by redirecting the connection to a system under their control."]]}],["940",{"type":"map","entries":[["id",940],["title","Improper Verification of Source of a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/940.html"],["type","child"],["description","The product establishes a communication channel to handle an incoming request that has been initiated by an actor, but it does not properly verify that the request is coming from the expected origin."],["extended_description","When an attacker can successfully establish a communication channel from an untrusted origin, the attacker may be able to gain privileges and access unexpected functionality."]]}],["941",{"type":"map","entries":[["id",941],["title","Incorrectly Specified Destination in a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/941.html"],["type","child"],["description","The product creates a communication channel to initiate an outgoing request to an actor, but it does not correctly specify the intended destination for that actor."],["extended_description","Attackers at the destination may be able to spoof trusted servers to steal data or cause a denial of service.\nThere are at least two distinct weaknesses that can cause the product to communicate with an unintended destination:\n\nIf the product allows an attacker to control which destination is specified, then the attacker can cause it to connect to an untrusted or malicious destination. For example, because UDP is a connectionless protocol, UDP packets can be spoofed by specifying a false source address in the packet; when the server receives the packet and sends a reply, it will specify a destination by using the source of the incoming packet - i.e., the false source. The server can then be tricked into sending traffic to the wrong host, which is effective for hiding the real source of an attack and for conducting a distributed denial of service (DDoS). As another example, server-side request forgery (SSRF) and XML External Entity (XXE) can be used to trick a server into making outgoing requests to hosts that cannot be directly accessed by the attacker due to firewall restrictions.\nIf the product incorrectly specifies the destination, then an attacker who can control this destination might be able to spoof trusted servers. While the most common occurrence is likely due to misconfiguration by an administrator, this can be resultant from other weaknesses. For example, the product might incorrectly parse an e-mail or IP address and send sensitive data to an unintended destination. As another example, an Android application may use a \"sticky broadcast\" to communicate with a receiver for a particular application, but since sticky broadcasts can be processed by *any* receiver, this can allow a malicious application to access restricted data that was only intended for a different application."]]}],["1327",{"type":"map","entries":[["id",1327],["title","Binding to an Unrestricted IP Address"],["url","https://cwe.mitre.org/data/definitions/1327.html"],["type","child"],["description","The product assigns the address 0.0.0.0 for a database server, a cloud service/instance, or any computing resource that communicates remotely."],["extended_description","When a server binds to the address 0.0.0.0, it allows connections from every IP address on the local machine, effectively exposing the server to every possible network. This might be much broader access than intended by the developer or administrator, who might only be expecting the server to be reachable from a single interface/network."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper handling of communication channels and access paths. These weaknesses include problems in creating, managing, or removing alternate channels and alternate paths. Some of these can overlap virtual file problems and are commonly used in \"bypass\" attacks, such as those that exploit authentication errors."]]},{"type":"map","entries":[["id",346],["title","Origin Validation Error"],["url","https://cwe.mitre.org/data/definitions/346.html"],["type","child"],["description","The product does not properly verify that the source of data or communication is valid."],["extended_description",null]]},{"type":"map","entries":[["id",385],["title","Covert Timing Channel"],["url","https://cwe.mitre.org/data/definitions/385.html"],["type","child"],["description","Covert timing channels convey information by modulating some aspect of system behavior over time, so that the program receiving the information can observe system behavior and infer protected information."],["extended_description","In some instances, knowing when data is transmitted between parties can provide a malicious user with privileged information. Also, externally monitoring the timing of operations can potentially reveal sensitive data. For example, a cryptographic operation can expose its internal state if the time it takes to perform the operation varies, based on the state.\nCovert channels are frequently classified as either storage or timing channels. Some examples of covert timing channels are the system's paging rate, the time a certain transaction requires to execute, and the time it takes to gain access to a shared bus."]]},{"type":"map","entries":[["id",419],["title","Unprotected Primary Channel"],["url","https://cwe.mitre.org/data/definitions/419.html"],["type","child"],["description","The product uses a primary channel for administration or restricted functionality, but it does not properly protect the channel."],["extended_description",null]]},{"type":"map","entries":[["id",420],["title","Unprotected Alternate Channel"],["url","https://cwe.mitre.org/data/definitions/420.html"],["type","child"],["description","The product protects a primary channel, but it does not use the same level of protection for an alternate channel."],["extended_description",null]]},{"type":"map","entries":[["id",515],["title","Covert Storage Channel"],["url","https://cwe.mitre.org/data/definitions/515.html"],["type","child"],["description","A covert storage channel transfers information through the setting of bits by one program and the reading of those bits by another. What distinguishes this case from that of ordinary operation is that the bits are used to convey encoded information."],["extended_description","Covert storage channels occur when out-of-band data is stored in messages for the purpose of memory reuse. Covert channels are frequently classified as either storage or timing channels. Examples would include using a file intended to hold only audit information to convey user passwords--using the name of a file or perhaps status bits associated with it that can be read by all users to signal the contents of the file. Steganography, concealing information in such a manner that no one but the intended recipient knows of the existence of the message, is a good example of a covert storage channel."]]},{"type":"map","entries":[["id",918],["title","Server-Side Request Forgery (SSRF)"],["url","https://cwe.mitre.org/data/definitions/918.ht
