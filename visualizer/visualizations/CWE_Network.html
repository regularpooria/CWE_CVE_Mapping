ll Space of Random Values"],["url","https://cwe.mitre.org/data/definitions/334.html"],["type","child"],["description","The number of possible random values is smaller than needed by the product, making it more susceptible to brute force attacks."],["extended_description",null]]},{"type":"map","entries":[["id",335],["title","Incorrect Usage of Seeds in Pseudo-Random Number Generator (PRNG)"],["url","https://cwe.mitre.org/data/definitions/335.html"],["type","child"],["description","The product uses a Pseudo-Random Number Generator (PRNG) but does not correctly manage seeds."],["extended_description","PRNGs are deterministic and, while their output appears\n\t\t   random, they cannot actually create entropy. They rely on\n\t\t   cryptographically secure and unique seeds for entropy so\n\t\t   proper seeding is critical to the secure operation of the\n\t\t   PRNG.\n\n\t\t   Management of seeds could be broken down into two main areas:\n\t\t   \n\n\n\t\t   (1) protecting seeds as cryptographic material (such as a cryptographic key);\n\t\t\t \n\n\t\t   (2) whenever possible, using a uniquely generated seed from\n\t\t   a cryptographically secure source\n\t\t\t \n\n\n\t\t\t   PRNGs require a seed as input to generate a stream of\n\t\t\t   numbers that are functionally indistinguishable from\n\t\t\t   random numbers.  While the output is, in many cases,\n\t\t\t   sufficient for cryptographic uses, the output of any\n\t\t\t   PRNG is directly determined by the seed provided as\n\t\t\t   input. If the seed can be ascertained by a third party,\n\t\t\t   the entire output of the PRNG can be made known to\n\t\t\t   them. As such, the seed should be kept secret and\n\t\t\t   should ideally not be able to be guessed. For example,\n\t\t\t   the current time may be a poor seed. Knowing the\n\t\t\t   approximate time the PRNG was seeded greatly reduces\n\t\t\t   the possible key space.\n\t\t\t \n\n\t\t\t   Seeds do not necessarily need to be unique, but reusing seeds may open up attacks if the seed is discovered."]]},{"type":"map","entries":[["id",338],["title","Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"],["url","https://cwe.mitre.org/data/definitions/338.html"],["type","child"],["description","The product uses a Pseudo-Random Number Generator (PRNG) in a security context, but the PRNG's algorithm is not cryptographically strong."],["extended_description","When a non-cryptographic PRNG is used in a cryptographic context, it can expose the cryptography to certain types of attacks.\nOften a pseudo-random number generator (PRNG) is not designed for cryptography. Sometimes a mediocre source of randomness is sufficient or preferable for algorithms that use random numbers. Weak generators generally take less processing power and/or do not use the precious, finite, entropy sources on a system. While such PRNGs might have very useful features, these same features could be used to break the cryptography."]]},{"type":"map","entries":[["id",347],["title","Improper Verification of Cryptographic Signature"],["url","https://cwe.mitre.org/data/definitions/347.html"],["type","child"],["description","The product does not verify, or incorrectly verifies, the cryptographic signature for data."],["extended_description",null]]},{"type":"map","entries":[["id",1204],["title","Generation of Weak Initialization Vector (IV)"],["url","https://cwe.mitre.org/data/definitions/1204.html"],["type","child"],["description","The product uses a cryptographic primitive that uses an Initialization\n\t\t\tVector (IV), but the product does not generate IVs that are\n\t\t\tsufficiently unpredictable or unique according to the expected\n\t\t\tcryptographic requirements for that primitive."],["extended_description","By design, some cryptographic primitives\n\t\t\t  (such as block ciphers) require that IVs\n\t\t\t  must have certain properties for the\n\t\t\t  uniqueness and/or unpredictability of an\n\t\t\t  IV. Primitives may vary in how important\n\t\t\t  these properties are. If these properties\n\t\t\t  are not maintained, e.g. by a bug in the\n\t\t\t  code, then the cryptography may be weakened\n\t\t\t  or broken by attacking the IVs themselves."]]},{"type":"map","entries":[["id",1240],["title","Use of a Cryptographic Primitive with a Risky Implementation"],["url","https://cwe.mitre.org/data/definitions/1240.html"],["type","child"],["description","To fulfill the need for a cryptographic primitive, the product implements a cryptographic algorithm using a non-standard, unproven, or disallowed/non-compliant cryptographic implementation."],["extended_description","Cryptographic protocols and systems depend on cryptographic primitives (and associated algorithms) as their basic building blocks. Some common examples of primitives are digital signatures, one-way hash functions, ciphers, and public key cryptography; however, the notion of \"primitive\" can vary depending on point of view. See \"Terminology Notes\" for further explanation of some concepts.\nCryptographic primitives are defined to accomplish one very specific task in a precisely defined and mathematically reliable fashion. For example, suppose that for a specific cryptographic primitive (such as an encryption routine), the consensus is that the primitive can only be broken after trying out N different inputs (where the larger the value of N, the stronger the cryptography). For an encryption scheme like AES-256, one would expect N to be so large as to be infeasible to execute in a reasonable amount of time.\nIf a vulnerability is ever found that shows that one can break a cryptographic primitive in significantly less than the expected number of attempts, then that primitive is considered weakened (or sometimes in extreme cases, colloquially it is \"broken\"). As a result, anything using this cryptographic primitive would now be considered insecure or risky. Thus, even breaking or weakening a seemingly small cryptographic primitive has the potential to render the whole system vulnerable, due to its reliance on the primitive. A historical example can be found in TLS when using DES. One would colloquially call DES the cryptographic primitive for transport encryption in this version of TLS. In the past, DES was considered strong, because no weaknesses were found in it; importantly, DES has a key length of 56 bits. Trying N=2^56 keys was considered impractical for most actors. Unfortunately, attacking a system with 56-bit keys is now practical via brute force, which makes defeating DES encryption practical. It is now practical for an adversary to read any information sent under this version of TLS and use this information to attack the system. As a result, it can be claimed that this use of TLS is weak, and that any system depending on TLS with DES could potentially render the entire system vulnerable to attack.\nCryptographic primitives and associated algorithms are only considered safe after extensive research and review from experienced cryptographers from academia, industry, and government entities looking for any possible flaws. Furthermore, cryptographic primitives and associated algorithms are frequently reevaluated for safety when new mathematical and attack techniques are discovered.  As a result and over time, even well-known cryptographic primitives can lose their compliance status with the discovery of novel attacks that might either defeat the algorithm or reduce its robustness significantly.\nIf ad-hoc cryptographic primitives are implemented, it is almost certain that the implementation will be vulnerable to attacks that are well understood by cryptographers, resulting in the exposure of sensitive information and other consequences.\nThis weakness is even more difficult to manage for hardware-implemented deployment of cryptographic algorithms. First, because hardware is not patchable as easily as software, any flaw discovered after release and production typically cannot be fixed without a recall of the product. Secondly, the hardware product is often expected to work for years, during which time computation power available to the attacker only increases. Therefore, for hardware implementations of cryptographic primitives, it is absolutely essential that only strong, proven cryptographic primitives are used."]]},{"type":"map","entries":[["id",320],["title","Key Management Errors"],["url","https://cwe.mitre.org/data/definitions/320.html"],["children",{"type":"map","entries":[["322",{"type":"map","entries":[["id",322],["title","Key Exchange without Entity Authentication"],["url","https://cwe.mitre.org/data/definitions/322.html"],["type","child"],["description","The product performs a key exchange with an actor without verifying the identity of that actor."],["extended_description","Performing a key exchange will preserve the integrity of the information sent between two entities, but this will not guarantee that the entities are who they claim they are. This may enable an attacker to impersonate an actor by modifying traffic between the two entities.  Typically, this involves a victim client that contacts a malicious server that is impersonating a trusted server. If the client skips authentication or ignores an authentication failure, the malicious server may request authentication information from the user. The malicious server can then use this authentication information to log in to the trusted server using the victim's credentials, sniff traffic between the victim and trusted server, etc."]]}],["323",{"type":"map","entries":[["id",323],["title","Reusing a Nonce, Key Pair in Encryption"],["url","https://cwe.mitre.org/data/definitions/323.html"],["type","child"],["description","Nonces should be used for the present occasion and only once."],["extended_description",null]]}],["324",{"type":"map","entries":[["id",324],["title","Use of a Key Past its Expiration Date"],["url","https://cwe.mitre.org/data/definitions/324.html"],["type","child"],["description","The product uses a cryptographic key or password past its expiration date, which diminishes its safety significantly by increasing the timing window for cracking attacks against that key."],["extended_description","While the expiration of keys does not necessarily ensure that they are compromised, it is a significant concern that keys which remain in use for prolonged periods of time have a decreasing probability of integrity. For this reason, it is important to replace keys within a period of time proportional to their strength."]]}],["798",{"type":"map","entries":[["id",798],["title","Use of Hard-coded Credentials"],["url","https://cwe.mitre.org/data/definitions/798.html"],["type","child"],["description","The product contains hard-coded credentials, such as a password or cryptographic key."],["extended_description","There are two main variations:\n\nInbound: the product contains an authentication mechanism that checks the input credentials against a hard-coded set of credentials. In this variant, a default administration account is created, and a simple password is hard-coded into the product and associated with that account. This hard-coded password is the same for each installation of the product, and it usually cannot be changed or disabled by system administrators without manually modifying the program, or otherwise patching the product. It can also be difficult for the administrator to detect.\nOutbound: the product connects to another system or component, and it contains hard-coded credentials for connecting to that component. This variant applies to front-end systems that authenticate with a back-end service. The back-end service may require a fixed password that can be easily discovered. The programmer may simply hard-code those back-end credentials into the front-end product."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to errors in the management of cryptographic keys."]]},{"type":"map","entries":[["id",323],["title","Reusing a Nonce, Key Pair in Encryption"],["url","https://cwe.mitre.org/data/definitions/323.html"],["type","child"],["description","Nonces should be used for the present occasion and only once."],["extended_description",null]]},{"type":"map","entries":[["id",1214],["title","Data Integrity Issues"],["url","https://cwe.mitre.org/data/definitions/1214.html"],["children",{"type":"map","entries":[["322",{"type":"map","entries":[["id",322],["title","Key Exchange without Entity Authentication"],["url","https://cwe.mitre.org/data/definitions/322.html"],["type","child"],["description","The product performs a key exchange with an actor without verifying the identity of that actor."],["extended_description","Performing a key exchange will preserve the integrity of the information sent between two entities, but this will not guarantee that the entities are who they claim they are. This may enable an attacker to impersonate an actor by modifying traffic between the two entities.  Typically, this involves a victim client that contacts a malicious server that is impersonating a trusted server. If the client skips authentication or ignores an authentication failure, the malicious server may request authentication information from the user. The malicious server can then use this authentication information to log in to the trusted server using the victim's credentials, sniff traffic between the victim and trusted server, etc."]]}],["346",{"type":"map","entries":[["id",346],["title","Origin Validation Error"],["url","https://cwe.mitre.org/data/definitions/346.html"],["type","child"],["description","The product does not properly verify that the source of data or communication is valid."],["extended_description",null]]}],["347",{"type":"map","entries":[["id",347],["title","Improper Verification of Cryptographic Signature"],["url","https://cwe.mitre.org/data/definitions/347.html"],["type","child"],["description","The product does not verify, or incorrectly verifies, the cryptographic signature for data."],["extended_description",null]]}],["348",{"type":"map","entries":[["id",348],["title","Use of Less Trusted Source"],["url","https://cwe.mitre.org/data/definitions/348.html"],["type","child"],["description","The product has two different sources of the same data or information, but it uses the source that has less support for verification, is less trusted, or is less resistant to attack."],["extended_description",null]]}],["349",{"type":"map","entries":[["id",349],["title","Acceptance of Extraneous Untrusted Data With Trusted Data"],["url","https://cwe.mitre.org/data/definitions/349.html"],["type","child"],["description","The product, when processing trusted data, accepts any untrusted data that is also included with the trusted data, treating the untrusted data as if it were trusted."],["extended_description",null]]}],["351",{"type":"map","entries":[["id",351],["title","Insufficient Type Distinction"],["url","https://cwe.mitre.org/data/definitions/351.html"],["type","child"],["description","The product does not properly distinguish between different types of elements in a way that leads to insecure behavior."],["extended_description",null]]}],["353",{"type":"map","entries":[["id",353],["title","Missing Support for Integrity Check"],["url","https://cwe.mitre.org/data/definitions/353.html"],["type","child"],["description","The product uses a transmission protocol that does not include a mechanism for verifying the integrity of the data during transmission, such as a checksum."],["extended_description","If integrity check values or \"checksums\" are omitted from a protocol, there is no way of determining if data has been corrupted in transmission. The lack of checksum functionality in a protocol removes the first application-level check of data that can be used. The end-to-end philosophy of checks states that integrity checks should be performed at the lowest level that they can be completely implemented. Excluding further sanity checks and input validation performed by applications, the protocol's checksum is the most important level of checksum, since it can be performed more completely than at any previous level and takes into account entire messages, as opposed to single packets."]]}],["354",{"type":"map","entries":[["id",354],["title","Improper Validation of Integrity Check Value"],["url","https://cwe.mitre.org/data/definitions/354.html"],["type","child"],["description","The product does not validate or incorrectly validates the integrity check values or \"checksums\" of a message. This may prevent it from detecting if the data has been modified or corrupted in transmission."],["extended_description","Improper validation of checksums before use results in an unnecessary risk that can easily be mitigated. The protocol specification describes the algorithm used for calculating the checksum. It is then a simple matter of implementing the calculation and verifying that the calculated checksum and the received checksum match. Improper verification of the calculated checksum and the received checksum can lead to far greater consequences."]]}],["494",{"type":"map","entries":[["id",494],["title","Download of Code Without Integrity Check"],["url","https://cwe.mitre.org/data/definitions/494.html"],["type","child"],["description","The product downloads source code or an executable from a remote location and executes the code without sufficiently verifying the origin and integrity of the code."],["extended_description","An attacker can execute malicious code by compromising the host server, performing DNS spoofing, or modifying the code in transit."]]}],["565",{"type":"map","entries":[["id",565],["title","Reliance on Cookies without Validation and Integrity Checking"],["url","https://cwe.mitre.org/data/definitions/565.html"],["type","child"],["description","The product relies on the existence or values of cookies when performing security-critical operations, but it does not properly ensure that the setting is valid for the associated user."],["extended_description",null]]}],["649",{"type":"map","entries":[["id",649],["title","Reliance on Obfuscation or Encryption of Security-Relevant Inputs without Integrity Checking"],["url","https://cwe.mitre.org/data/definitions/649.html"],["type","child"],["description","The product uses obfuscation or encryption of inputs that should not be mutable by an external actor, but the product does not use integrity checks to detect if those inputs have been modified."],["extended_description","When an application relies on obfuscation or incorrectly applied / weak encryption to protect client-controllable tokens or parameters, that may have an effect on the user state, system state, or some decision made on the server. Without protecting the tokens/parameters for integrity, the application is vulnerable to an attack where an adversary traverses the space of possible values of the said token/parameter in order to attempt to gain an advantage. The goal of the attacker is to find another admissible value that will somehow elevate their privileges in the system, disclose information or change the behavior of the system in some way beneficial to the attacker. If the application does not protect these critical tokens/parameters for integrity, it will not be able to determine that these values have been tampered with. Measures that are used to protect data for confidentiality should not be relied upon to provide the integrity service."]]}],["829",{"type":"map","entries":[["id",829],["title","Inclusion of Functionality from Untrusted Control Sphere"],["url","https://cwe.mitre.org/data/definitions/829.html"],["type","child"],["description","The product imports, requires, or includes executable functionality (such as a library) from a source that is outside of the intended control sphere."],["extended_description",null]]}],["924",{"type":"map","entries":[["id",924],["title","Improper Enforcement of Message Integrity During Transmission in a Communication Channel"],["url","https://cwe.mitre.org/data/definitions/924.html"],["type","child"],["description","The product establishes a communication channel with an endpoint and receives a message from that endpoint, but it does not sufficiently ensure that the message was not modified during transmission."],["extended_description","Attackers might be able to modify the message and spoof the endpoint by interfering with the data as it crosses the network or by redirecting the connection to a system under their control."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to a software system's data integrity components. Frequently these deal with the ability to ensure the integrity of data, such as messages, resource files, deployment files, and configuration files. The weaknesses in this category could lead to a degradation of data integrity quality if they are not addressed."]]},{"type":"map","entries":[["id",348],["title","Use of Less Trusted Source"],["url","https://cwe.mitre.org/data/definitions/348.html"],["type","child"],["description","The product has two different sources of the same data or information, but it uses the source that has less support for verification, is less trusted, or is less resistant to attack."],["extended_description",null]]},{"type":"map","entries":[["id",349],["title","Acceptance of Extraneous Untrusted Data With Trusted Data"],["url","https://cwe.mitre.org/data/definitions/349.html"],["type","child"],["description","The product, when processing trusted data, accepts any untrusted data that is also included with the trusted data, treating the untrusted data as if it were trusted."],["extended_description",null]]},{"type":"map","entries":[["id",351],["title","Insufficient Type Distinction"],["url","https://cwe.mitre.org/data/definitions/351.html"],["type","child"],["description","The product does not properly distinguish between different types of elements in a way that leads to insecure behavior."],["extended_description",null]]},{"type":"map","entries":[["id",353],["title","Missing Support for Integrity Check"],["url","https://cwe.mitre.org/data/definitions/353.html"],["type","child"],["description","The product uses a transmission protocol that does not include a mechanism for verifying the integrity of the data during transmission, such as a checksum."],["extended_description","If integrity check values or \"checksums\" are omitted from a protocol, there is no way of determining if data has been corrupted in transmission. The lack of checksum functionality in a protocol removes the first application-level check of data that can be used. The end-to-end philosophy of checks states that integrity checks should be performed at the lowest level that they can be completely implemented. Excluding further sanity checks and input validation performed by applications, the protocol's checksum is the most important level of checksum, since it can be performed more completely than at any previous level and takes into account entire messages, as opposed to single packets."]]},{"type":"map","entries":[["id",354],["title","Improper Validation of Integrity Check Value"],["url","https://cwe.mitre.org/data/definitions/354.html"],["type","child"],["description","The product does not validate or incorrectly validates the integrity check values or \"checksums\" of a message. This may prevent it from detecting if the data has been modified or corrupted in transmission."],["extended_description","Improper validation of checksums before use results in an unnecessary risk that can easily be mitigated. The protocol specification describes the algorithm used for calculating the checksum. It is then a simple matter of implementing the calculation and verifying that the calculated checksum and the received checksum match. Improper verification of the calculated checksum and the received checksum can lead to far greater consequences."]]},{"type":"map","entries":[["id",494],["title","Download of Code Without Integrity Check"],["url","https://cwe.mitre.org/data/definitions/494.html"],["type","child"],["description","The product downloads source code or an executable from a remote location and executes the code without sufficiently verifying the origin and integrity of the code."],["extended_description","An attacker can execute malicious code by compromising the host server, performing DNS spoofing, or modifying the code in transit."]]},{"type":"map","entries":[["id",565],["title","Reliance on Cookies without Validation and Integrity Checking"],["url","https://cwe.mitre.org/data/definitions/565.html"],["type","child"],["description","The product relies on the existence or values of cookies when performing security-critical operations, but it does not properly ensure that the setting is valid for the associated user."],["extended_description",null]]},{"type":"map","entries":[["id",649],["title","Reliance on Obfuscation or Encryption of Security-Relevant Inputs without Integrity Checking"],["url","https://cwe.mitre.org/data/definitions/649.html"],["type","child"],["description","The product uses obfuscation or encryption of inputs that should not be mutable by an external actor, but the product does not use integrity checks to detect if those inputs have been modified."],["extended_description","When an application relies on obfuscation or incorrectly applied / weak encryption to protect client-controllable tokens or parameters, that may have an effect on the user state, system state, or some decision made on the server. Without protecting the tokens/parameters for integrity, the application is vulnerable to an attack where an adversary traverses the space of possible values of the said token/parameter in order to attempt to gain an advantage. The goal of the attacker is to find another admissible value that will somehow elevate their privileges in the system, disclose information or change the behavior of the system in some way beneficial to the attacker. If the application does not protect these critical tokens/parameters for integrity, it will not be able to determine that these values have been tampered with. Measures that are used to protect data for confidentiality should not be relied upon to provide the integrity service."]]},{"type":"map","entries":[["id",829],["title","Inclusion of Functionality from Untrusted Control Sphere"],["url","https://cwe.mitre.org/data/definitions/829.html"],["type","child"],["description","The product imports, requires, or includes executable functionality (such as a library) from a source that is outside of the intended control sphere."],["extended_description",null]]},{"type":"map","entries":[["id",19],["title","Data Processing Errors"],["url","https://cwe.mitre.org/data/definitions/19.html"],["children",{"type":"map","entries":[["130",{"type":"map","entries":[["id",130],["title","Improper Handling of Length Parameter Inconsistency"],["url","https://cwe.mitre.org/data/definitions/130.html"],["type","child"],["description","The product parses a formatted message or structure, but it does not handle or incorrectly handles a length field that is inconsistent with the actual length of the associated data."],["extended_description","If an attacker can manipulate the length parameter associated with an input such that it is inconsistent with the actual length of the input, this can be leveraged to cause the target application to behave in unexpected, and possibly, malicious ways. One of the possible motives for doing so is to pass in arbitrarily large input to the application. Another possible motivation is the modification of application state by including invalid data for subsequent properties of the application. Such weaknesses commonly lead to attacks such as buffer overflows and execution of arbitrary code."]]}],["166",{"type":"map","entries":[["id",166],["title","Improper Handling of Missing Special Element"],["url","https://cwe.mitre.org/data/definitions/166.html"],["type","child"],["description","The product receives input from an upstream component, but it does not handle or incorrectly handles when an expected special element is missing."],["extended_description",null]]}],["167",{"type":"map","entries":[["id",167],["title","Improper Handling of Additional Special Element"],["url","https://cwe.mitre.org/data/definitions/167.html"],["type","child"],["description","The product receives input from an upstream component, but it does not handle or incorrectly handles when an additional unexpected special element is provided."],["extended_description",null]]}],["168",{"type":"map","entries":[["id",168],["title","Improper Handling of Inconsistent Special Elements"],["url","https://cwe.mitre.org/data/definitions/168.html"],["type","child"],["description","The product does not properly handle input in which an inconsistency exists between two or more special characters or reserved words."],["extended_description","An example of this problem would be if paired characters appear in the wrong order, or if the special characters are not properly nested."]]}],["178",{"type":"map","entries":[["id",178],["title","Improper Handling of Case Sensitivity"],["url","https://cwe.mitre.org/data/definitions/178.html"],["type","child"],["description","The product does not properly account for differences in case sensitivity when accessing or determining the properties of a resource, leading to inconsistent results."],["extended_description","Improperly handled case sensitive data can lead to several possible consequences, including:\n\ncase-insensitive passwords reducing the size of the key space, making brute force attacks easier\nbypassing filters or access controls using alternate names\nmultiple interpretation errors using alternate names."]]}],["182",{"type":"map","entries":[["id",182],["title","Collapse of Data into Unsafe Value"],["url","https://cwe.mitre.org/data/definitions/182.html"],["type","child"],["description","The product filters data in a way that causes it to be reduced or \"collapsed\" into an unsafe value that violates an expected security property."],["extended_description",null]]}],["186",{"type":"map","entries":[["id",186],["title","Overly Restrictive Regular Expression"],["url","https://cwe.mitre.org/data/definitions/186.html"],["type","child"],["description","A regular expression is overly restrictive, which prevents dangerous values from being detected."],["extended_description","This weakness is not about regular expression complexity. Rather, it is about a regular expression that does not match all values that are intended. Consider the use of a regexp to identify acceptable values or to spot unwanted terms. An overly restrictive regexp misses some potentially security-relevant values leading to either false positives *or* false negatives, depending on how the regexp is being used within the code. Consider the expression /[0-8]/ where the intention was /[0-9]/.  This expression is not \"complex\" but the value \"9\" is not matched when maybe the programmer planned to check for it."]]}],["229",{"type":"map","entries":[["id",229],["title","Improper Handling of Values"],["url","https://cwe.mitre.org/data/definitions/229.html"],["type","child"],["description","The product does not properly handle when the expected number of values for parameters, fields, or arguments is not provided in input, or if those values are undefined."],["extended_description",null]]}],["233",{"type":"map","entries":[["id",233],["title","Improper Handling of Parameters"],["url","https://cwe.mitre.org/data/definitions/233.html"],["type","child"],["description","The product does not properly handle when the expected number of parameters, fields, or arguments is not provided in input, or if those parameters are undefined."],["extended_description",null]]}],["237",{"type":"map","entries":[["id",237],["title","Improper Handling of Structural Elements"],["url","https://cwe.mitre.org/data/definitions/237.html"],["type","child"],["description","The product does not handle or incorrectly handles inputs that are related to complex structures."],["extended_description",null]]}],["241",{"type":"map","entries":[["id",241],["title","Improper Handling of Unexpected Data Type"],["url","https://cwe.mitre.org/data/definitions/241.html"],["type","child"],["description","The product does not handle or incorrectly handles when a particular element is not the expected type, e.g. it expects a digit (0-9) but is provided with a letter (A-Z)."],["extended_description",null]]}],["409",{"type":"map","entries":[["id",409],["title","Improper Handling of Highly Compressed Data (Data Amplification)"],["url","https://cwe.mitre.org/data/definitions/409.html"],["type","child"],["description","The product does not handle or incorrectly handles a compressed input with a very high compression ratio that produces a large output."],["extended_description","An example of data amplification is a \"decompression bomb,\" a small ZIP file that can produce a large amount of data when it is decompressed."]]}],["472",{"type":"map","entries":[["id",472],["title","External Control of Assumed-Immutable Web Parameter"],["url","https://cwe.mitre.org/data/definitions/472.html"],["type","child"],["description","The web application does not sufficiently verify inputs that are assumed to be immutable but are actually externally controllable, such as hidden form fields."],["extended_description","If a web product does not properly protect assumed-immutable values from modification in hidden form fields, parameters, cookies, or URLs, this can lead to modification of critical data. Web applications often mistakenly make the assumption that data passed to the client in hidden fields or cookies is not susceptible to tampering. Improper validation of data that are user-controllable can lead to the application processing incorrect, and often malicious, input.\nFor example, custom cookies commonly store session data or persistent data across sessions. This kind of session data is normally involved in security related decisions on the server side, such as user authentication and access control. Thus, the cookies might contain sensitive data such as user credentials and privileges. This is a dangerous practice, as it can often lead to improper reliance on the value of the client-provided cookie by the server side application."]]}],["601",{"type":"map","entries":[["id",601],["title","URL Redirection to Untrusted Site ('Open Redirect')"],["url","https://cwe.mitre.org/data/definitions/601.html"],["type","child"],["description","The web application accepts a user-controlled input that specifies a link to an external site, and uses that link in a redirect."],["extended_description",null]]}],["611",{"type":"map","entries":[["id",611],["title","Improper Restriction of XML External Entity Reference"],["url","https://cwe.mitre.org/data/definitions/611.html"],["type","child"],["description","The product processes an XML document that can contain XML entities with URIs that resolve to documents outside of the intended sphere of control, causing the product to embed incorrect documents into its output."],["extended_description",null]]}],["624",{"type":"map","entries":[["id",624],["title","Executable Regular Expression Error"],["url","https://cwe.mitre.org/data/definitions/624.html"],["type","child"],["description","The product uses a regular expression that either (1) contains an executable component with user-controlled inputs, or (2) allows a user to enable execution by inserting pattern modifiers."],["extended_description","Case (2) is possible in the PHP preg_replace() function, and possibly in other languages when a user-controlled input is inserted into a string that is later parsed as a regular expression."]]}],["625",{"type":"map","entries":[["id",625],["title","Permissive Regular Expression"],["url","https://cwe.mitre.org/data/definitions/625.html"],["type","child"],["description","The product uses a regular expression that does not sufficiently restrict the set of allowed values."],["extended_description","This effectively causes the regexp to accept substrings that match the pattern, which produces a partial comparison to the target. In some cases, this can lead to other weaknesses. Common errors include:\n\nnot identifying the beginning and end of the target string\nusing wildcards instead of acceptable character ranges\nothers"]]}],["776",{"type":"map","entries":[["id",776],["title","Improper Restriction of Recursive Entity References in DTDs ('XML Entity Expansion')"],["url","https://cwe.mitre.org/data/definitions/776.html"],["type","child"],["description","The product uses XML documents and allows their structure to be defined with a Document Type Definition (DTD), but it does not properly control the number of recursive definitions of entities."],["extended_description","If the DTD contains a large number of nested or recursive entities, this can lead to explosive growth of data when parsed, causing a denial of service."]]}],["1024",{"type":"map","entries":[["id",1024],["title","Comparison of Incompatible Types"],["url","https://cwe.mitre.org/data/definitions/1024.html"],["type","child"],["description","The product performs a comparison between two entities, but the entities are of different, incompatible types that cannot be guaranteed to provide correct results when they are directly compared."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are typically found in functionality that processes data. Data processing is the manipulation of input to retrieve or save information."]]},{"type":"map","entries":[["id",130],["title","Improper Handling of Length Parameter Inconsistency"],["url","https://cwe.mitre.org/data/definitions/130.html"],["type","child"],["description","The product parses a formatted message or structure, but it does not handle or incorrectly handles a length field that is inconsistent with the actual length of the associated data."],["extended_description","If an attacker can manipulate the length parameter associated with an input such that it is inconsistent with the actual length of the input, this can be leveraged to cause the target application to behave in unexpected, and possibly, malicious ways. One of the possible motives for doing so is to pass in arbitrarily large input to the application. Another possible motivation is the modification of application state by including invalid data for subsequent properties of the application. Such weaknesses commonly lead to attacks such as buffer overflows and execution of arbitrary code."]]},{"type":"map","entries":[["id",166],["title","Improper Handling of Missing Special Element"],["url","https://cwe.mitre.org/data/definitions/166.html"],["type","child"],["description","The product receives input from an upstream component, but it does not handle or incorrectly handles when an expected special element is missing."],["extended_description",null]]},{"type":"map","entries":[["id",167],["title","Improper Handling of Additional Special Element"],["url","https://cwe.mitre.org/data/definitions/167.html"],["type","child"],["description","The product receives input from an upstream component, but it does not handle or incorrectly handles when an additional unexpected special element is provided."],["extended_description",null]]},{"type":"map","entries":[["id",168],["title","Improper Handling of Inconsistent Special Elements"],["url","https://cwe.mitre.org/data/definitions/168.html"],["type","child"],["description","The product does not properly handle input in which an inconsistency exists between two or more special characters or reserved words."],["extended_description","An example of this problem would be if paired characters appear in the wrong order, or if the special characters are not properly nested."]]},{"type":"map","entries":[["id",178],["title","Improper Handling of Case Sensitivity"],["url","https://cwe.mitre.org/data/definitions/178.html"],["type","child"],["description","The product does not properly account for differences in case sensitivity when accessing or determining the properties of a resource, leading to inconsistent results."],["extended_description","Improperly handled case sensitive data can lead to several possible consequences, including:\n\ncase-insensitive passwords reducing the size of the key space, making brute force attacks easier\nbypassing filters or access controls using alternate names\nmultiple interpretation errors using alternate names."]]},{"type":"map","entries":[["id",182],["title","Collapse of Data into Unsafe Value"],["url","https://cwe.mitre.org/data/definitions/182.html"],["type","child"],["description","The product filters data in a way that causes it to be reduced or \"collapsed\" into an unsafe value that violates an expected security property."],["extended_description",null]]},{"type":"map","entries":[["id",186],["title","Overly Restrictive Regular Expression"],["url","https://cwe.mitre.org/data/definitions/186.html"],["type","child"],["description","A regular expression is overly restrictive, which prevents dangerous values from being detected."],["extended_description","This weakness is not about regular expression complexity. Rather, it is about a regular expression that does not match all values that are intended. Consider the use of a regexp to identify acceptable values or to spot unwanted terms. An overly restrictive regexp misses some potentially security-relevant values leading to either false positives *or* false negatives, depending on how the regexp is being used within the code. Consider the expression /[0-8]/ where the intention was /[0-9]/.  This expression is not \"complex\" but the value \"9\" is not matched when maybe the programmer planned to check for it."]]},{"type":"map","entries":[["id",229],["title","Improper Handling of Values"],["url","https://cwe.mitre.org/data/definitions/229.html"],["type","child"],["description","The product does not properly handle when the expected number of values for parameters, fields, or arguments is not provided in input, or if those values are undefined."],["extended_description",null]]},{"type":"map","entries":[["id",233],["title","Improper Handling of Parameters"],["url","https://cwe.mitre.org/data/definitions/233.html"],["type","child"],["description","The product does not properly handle when the expected number of parameters, fields, or arguments is not provided in input, or if those parameters are undefined."],["extended_description",null]]},{"type":"map","entries":[["id",237],["title","Improper Handling of Structural Elements"],["url","https://cwe.mitre.org/data/definitions/237.html"],["type","child"],["description","The product does not handle or incorrectly handles inputs that are related to complex structures."],["extended_description",null]]},{"type":"map","entries":[["id",241],["title","Improper Handling of Unexpected Data Type"],["url","https://cwe.mitre.org/data/definitions/241.html"],["type","child"],["description","The product does not handle or incorrectly handles when a particular element is not the expected type, e.g. it expects a digit (0-9) but is provided with a letter (A-Z)."],["extended_description",null]]},{"type":"map","entries":[["id",409],["title","Improper Handling of Highly Compressed Data (Data Amplification)"],["url","https://cwe.mitre.org/data/definitions/409.html"],["type","child"],["description","The product does not handle or incorrectly handles a compressed input with a very high compression ratio that produces a large output."],["extended_description","An example of data amplification is a \"decompression bomb,\" a small ZIP file that can produce a large amount of data when it is decompressed."]]},{"type":"map","entries":[["id",472],["title","External Control of Assumed-Immutable Web Parameter"],["url","https://cwe.mitre.org/data/definitions/472.html"],["type","child"],["description","The web application does not sufficiently verify inputs that are assumed to be immutable but are actually externally controllable, such as hidden form fields."],["extended_description","If a web product does not properly protect assumed-immutable values from modification in hidden form fields, parameters, cookies, or URLs, this can lead to modification of critical data. Web applications often mistakenly make the assumption that data passed to the client in hidden fields or cookies is not susceptible to tampering. Improper validation of data that are user-controllable can lead to the application processing incorrect, and often malicious, input.\nFor example, custom cookies commonly store session data or persistent data across sessions. This kind of session data is normally involved in security related decisions on the server side, such as user authentication and access control. Thus, the cookies might contain sensitive data such as user credentials and privileges. This is a dangerous practice, as it can often lead to improper reliance on the value of the client-provided cookie by the server side application."]]},{"type":"map","entries":[["id",601],["title","URL Redirection to Untrusted Site ('Open Redirect')"],["url","https://cwe.mitre.org/data/definitions/601.html"],["type","child"],["description","The web application accepts a user-controlled input that specifies a link to an external site, and uses that link in a redirect."],["extended_description",null]]},{"type":"map","entries":[["id",611],["title","Improper Restriction of XML External Entity Reference"],["url","https://cwe.mitre.org/data/definitions/611.html"],["type","child"],["description","The product processes an XML document that can contain XML entities with URIs that resolve to documents outside of the intended sphere of control, causing the product to embed incorrect documents into its output."],["extended_description",null]]},{"type":"map","entries":[["id",624],["title","Executable Regular Expression Error"],["url","https://cwe.mitre.org/data/definitions/624.html"],["type","child"],["description","The product uses a regular expression that either (1) contains an executable component with user-controlled inputs, or (2) allows a user to enable execution by inserting pattern modifiers."],["extended_description","Case (2) is possible in the PHP preg_replace() function, and possibly in other languages when a user-controlled input is inserted into a string that is later parsed as a regular expression."]]},{"type":"map","entries":[["id",625],["title","Permissive Regular Expression"],["url","https://cwe.mitre.org/data/definitions/625.html"],["type","child"],["description","The product uses a regular expression that does not sufficiently restrict the set of allowed values."],["extended_description","This effectively causes the regexp to accept substrings that match the pattern, which produces a partial comparison to the target. In some cases, this can lead to other weaknesses. Common errors include:\n\nnot identifying the beginning and end of the target string\nusing wildcards instead of acceptable character ranges\nothers"]]},{"type":"map","entries":[["id",776],["title","Improper Restriction of Recursive Entity References in DTDs ('XML Entity Expansion')"],["url","https://cwe.mitre.org/data/definitions/776.html"],["type","child"],["description","The product uses XML documents and allows their structure to be defined with a Document Type Definition (DTD), but it does not properly control the number of recursive definitions of entities."],["extended_description","If the DTD contains a large number of nested or recursive entities, this can lead to explosive growth of data when parsed, causing a denial of service."]]},{"type":"map","entries":[["id",1024],["title","Comparison of Incompatible Types"],["url","https://cwe.mitre.org/data/definitions/1024.html"],["type","child"],["description","The product performs a comparison between two entities, but the entities are of different, incompatible types that cannot be guaranteed to provide correct results when they are directly compared."],["extended_description",null]]},{"type":"map","entries":[["id",137],["title","Data Neutralization Issues"],["url","https://cwe.mitre.org/data/definitions/137.html"],["children",{"type":"map","entries":[["76",{"type":"map","entries":[["id",76],["title","Improper Neutralization of Equivalent Special Elements"],["url","https://cwe.mitre.org/data/definitions/76.html"],["type","child"],["description","The product correctly neutralizes certain special elements, but it improperly neutralizes equivalent special elements."],["extended_description","The product may have a fixed list of special characters it believes is complete. However, there may be alternate encodings, or representations that also have the same meaning. For example, the product may filter out a leading slash (/) to prevent absolute path names, but does not account for a tilde (~) followed by a user name, which on some *nix systems could be expanded to an absolute pathname. Alternately, the product might filter a dangerous \"-e\" command-line switch when calling an external program, but it might not account for \"--exec\" or other switches that have the same semantics."]]}],["78",{"type":"map","entries":[["id",78],["title","Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"],["url","https://cwe.mitre.org/data/definitions/78.html"],["type","child"],["description","The product constructs all or part of an OS command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended OS command when it is sent to a downstream component."],["extended_description","This weakness can lead to a vulnerability in environments in which the attacker does not have direct access to the operating system, such as in web applications. Alternately, if the weakness occurs in a privileged program, it could allow the attacker to specify commands that normally would not be accessible, or to call alternate commands with privileges that the attacker does not have. The problem is exacerbated if the compromised process does not follow the principle of least privilege, because the attacker-controlled commands may run with special system privileges that increases the amount of damage.\nThere are at least two subtypes of OS command injection:\n\nThe application intends to execute a single, fixed program that is under its own control. It intends to use externally-supplied inputs as arguments to that program. For example, the program might use system(\"nslookup [HOSTNAME]\") to run nslookup and allow the user to supply a HOSTNAME, which is used as an argument. Attackers cannot prevent nslookup from executing. However, if the program does not remove command separators from the HOSTNAME argument, attackers could place the separators into the arguments, which allows them to execute their own program after nslookup has finished executing.\nThe application accepts an input that it uses to fully select which program to run, as well as which commands to use. The application simply redirects this entire command to the operating system. For example, the program might use \"exec([COMMAND])\" to execute the [COMMAND] that was supplied by the user. If the COMMAND is under attacker control, then the attacker can execute arbitrary commands or programs. If the command is being executed using functions like exec() and CreateProcess(), the attacker might not be able to combine multiple commands together in the same line.\n\nFrom a weakness standpoint, these variants represent distinct programmer errors. In the first variant, the programmer clearly intends that input from untrusted parties will be part of the arguments in the command to be executed. In the second variant, the programmer does not intend for the command to be accessible to any untrusted party, but the programmer probably has not accounted for alternate ways in which malicious attackers can provide input."]]}],["79",{"type":"map","entries":[["id",79],["title","Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"],["url","https://cwe.mitre.org/data/definitions/79.html"],["type","child"],["description","The product does not neutralize or incorrectly neutralizes user-controllable input before it is placed in output that is used as a web page that is served to other users."],["extended_description","There are many variants of cross-site scripting, characterized by a variety of terms or involving different attack topologies. However, they all indicate the same fundamental weakness: improper neutralization of dangerous input between the adversary and a victim."]]}],["88",{"type":"map","entries":[["id",88],["title","Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"],["url","https://cwe.mitre.org/data/definitions/88.html"],["type","child"],["description","The product constructs a string for a command to be executed by a separate component\nin another control sphere, but it does not properly delimit the\nintended arguments, options, or switches within that command string."],["extended_description","When creating commands using interpolation into a string, developers may assume that only the arguments/options that they specify will be processed.  This assumption may be even stronger when the programmer has encoded the command in a way that prevents separate commands from being provided maliciously, e.g. in the case of shell metacharacters.  When constructing the command, the developer may use whitespace or other delimiters that are required to separate arguments when the command. However, if an attacker can provide an untrusted input that contains argument-separating delimiters, then the resulting command will have more arguments than intended by the developer.  The attacker may then be able to change the behavior of the command.  Depending on the functionality supported by the extraneous arguments, this may have security-relevant consequences."]]}],["89",{"type":"map","entries":[["id",89],["title","Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"],["url","https://cwe.mitre.org/data/definitions/89.html"],["type","child"],["description","The product constructs all or part of an SQL command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended SQL command when it is sent to a downstream component. Without sufficient removal or quoting of SQL syntax in user-controllable inputs, the generated SQL query can cause those inputs to be interpreted as SQL instead of ordinary user data."],["extended_description",null]]}],["90",{"type":"map","entries":[["id",90],["title","Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"],["url","https://cwe.mitre.org/data/definitions/90.html"],["type","child"],["description","The product constructs all or part of an LDAP query using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended LDAP query when it is sent to a downstream component."],["extended_description",null]]}],["91",{"type":"map","entries":[["id",91],["title","XML Injection (aka Blind XPath Injection)"],["url","https://cwe.mitre.org/data/definitions/91.html"],["type","child"],["description","The product does not properly neutralize special elements that are used in XML, allowing attackers to modify the syntax, content, or commands of the XML before it is processed by an end system."],["extended_description","Within XML, special elements could include reserved words or characters such as \"&lt;\", \"&gt;\", \"\"\", and \"&amp;\", which could then be used to add new data or modify XML syntax."]]}],["93",{"type":"map","entries":[["id",93],["title","Improper Neutralization of CRLF Sequences ('CRLF Injection')"],["url","https://cwe.mitre.org/data/definitions/93.html"],["type","child"],["description","The product uses CRLF (carriage return line feeds) as a special element, e.g. to separate lines or records, but it does not neutralize or incorrectly neutralizes CRLF sequences from inputs."],["extended_description",null]]}],["94",{"type":"map","entries":[["id",94],["title","Improper Control of Generation of Code ('Code Injection')"],["url","https://cwe.mitre.org/data/definitions/94.html"],["type","child"],["description","The product constructs all or part of a code segment using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the syntax or behavior of the intended code segment."],["extended_description",null]]}],["117",{"type":"map","entries":[["id",117],["title","Improper Output Neutralization for Logs"],["url","https://cwe.mitre.org/data/definitions/117.html"],["type","child"],["description","The product constructs a log message from external input, but it does not neutralize or incorrectly neutralizes special elements when the message is written to a log file."],["extended_description",null]]}],["140",{"type":"map","entries":[["id",140],["title","Improper Neutralization of Delimiters"],["url","https://cwe.mitre.org/data/definitions/140.html"],["type","child"],["description","The product does not neutralize or incorrectly neutralizes delimiters."],["extended_description",null]]}],["170",{"type":"map","entries":[["id",170],["title","Improper Null Termination"],["url","https://cwe.mitre.org/data/definitions/170.html"],["type","child"],["description","The product does not terminate or incorrectly terminates a string or array with a null character or equivalent terminator."],["extended_description","Null termination errors frequently occur in two different ways. An off-by-one error could cause a null to be written out of bounds, leading to an overflow. Or, a program could use a strncpy() function call incorrectly, which prevents a null terminator from being added at all. Other scenarios are possible."]]}],["463",{"type":"map","entries":[["id",463],["title","Deletion of Data Structure Sentinel"],["url","https://cwe.mitre.org/data/definitions/463.html"],["type","child"],["description","The accidental deletion of a data-structure sentinel can cause serious programming logic problems."],["extended_description","Often times data-structure sentinels are used to mark structure of the data structure. A common example of this is the null character at the end of strings. Another common example is linked lists which may contain a sentinel to mark the end of the list. It is dangerous to allow this type of control data to be easily accessible. Therefore, it is important to protect from the deletion or modification outside of some wrapper interface which provides safety."]]}],["464",{"type":"map","entries":[["id",464],["title","Addition of Data Structure Sentinel"],["url","https://cwe.mitre.org/data/definitions/464.html"],["type","child"],["description","The accidental addition of a data-structure sentinel can cause serious programming logic problems."],["extended_description","Data-structure sentinels are often used to mark the structure of data. A common example of this is the null character at the end of strings or a special sentinel to mark the end of a linked list. It is dangerous to allow this type of control data to be easily accessible. Therefore, it is important to protect from the addition or modification of sentinels."]]}],["641",{"type":"map","entries":[["id",641],["title","Improper Restriction of Names for Files and Other Resources"],["url","https://cwe.mitre.org/data/definitions/641.html"],["type","child"],["description","The product constructs the name of a file or other resource using input from an upstream component, but it does not restrict or incorrectly restricts the resulting name."],["extended_description","This may produce resultant weaknesses. For instance, if the names of these resources contain scripting characters, it is possible that a script may get executed in the client's browser if the application ever displays the name of the resource on a dynamically generated web page. Alternately, if the resources are consumed by some application parser, a specially crafted name can exploit some vulnerability internal to the parser, potentially resulting in execution of arbitrary code on the server machine. The problems will vary based on the context of usage of such malformed resource names and whether vulnerabilities are present in or assumptions are made by the targeted technology that would make code execution possible."]]}],["694",{"type":"map","entries":[["id",694],["title","Use of Multiple Resources with Duplicate Identifier"],["url","https://cwe.mitre.org/data/definitions/694.html"],["type","child"],["description","The product uses multiple resources that can have the same identifier, in a context in which unique identifiers are required."],["extended_description","If the product assumes that each resource has a unique identifier, the product could operate on the wrong resource if attackers can cause multiple resources to be associated with the same identifier."]]}],["791",{"type":"map","entries":[["id",791],["title","Incomplete Filtering of Special Elements"],["url","https://cwe.mitre.org/data/definitions/791.html"],["type","child"],["description","The product receives data from an upstream component, but does not completely filter special elements before sending it to a downstream component."],["extended_description",null]]}],["838",{"type":"map","entries":[["id",838],["title","Inappropriate Encoding for Output Context"],["url","https://cwe.mitre.org/data/definitions/838.html"],["type","child"],["description","The product uses or specifies an encoding when generating output to a downstream component, but the specified encoding is not the same as the encoding that is expected by the downstream component."],["extended_description","This weakness can cause the downstream component to use a decoding method that produces different data than what the product intended to send. When the wrong encoding is used - even if closely related - the downstream component could decode the data incorrectly. This can have security consequences when the provided boundaries between control and data are inadvertently broken, because the resulting data could introduce control characters or special elements that were not sent by the product. The resulting data could then be used to bypass protection mechanisms such as input validation, and enable injection attacks.\nWhile using output encoding is essential for ensuring that communications between components are accurate, the use of the wrong encoding - even if closely related - could cause the downstream component to misinterpret the output.\nFor example, HTML entity encoding is used for elements in the HTML body of a web page. However, a programmer might use entity encoding when generating output for that is used within an attribute of an HTML tag, which could contain functional Javascript that is not affected by the HTML encoding.\nWhile web applications have received the most attention for this problem, this weakness could potentially apply to any type of product that uses a communications stream that could support multiple encodings."]]}],["917",{"type":"map","entries":[["id",917],["title","Improper Neutralization of Special Elements used in an Expression Language Statement ('Expression Language Injection')"],["url","https://cwe.mitre.org/data/definitions/917.html"],["type","child"],["description","The product constructs all or part of an expression language (EL) statement in a framework such as a Java Server Page (JSP) using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended EL statement before it is executed."],["extended_description","Frameworks such as Java Server Page (JSP) allow a developer to insert executable expressions within otherwise-static content. When the developer is not aware of the executable nature of these expressions and/or does not disable them, then if an attacker can inject expressions, this could lead to code execution or other unexpected behaviors."]]}],["1236",{"type":"map","entries":[["id",1236],["title","Improper Neutralization of Formula Elements in a CSV File"],["url","https://cwe.mitre.org/data/definitions/1236.html"],["type","child"],["description","The product saves user-provided information into a Comma-Separated Value (CSV) file, but it does not neutralize or incorrectly neutralizes special elements that could be interpreted as a command when the file is opened by a spreadsheet product."],["extended_description",null]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the creation or neutralization of data using an incorrect format."]]},{"type":"map","entries":[["id",76],["title","Improper Neutralization of Equivalent Special Elements"],["url","https://cwe.mitre.org/data/definitions/76.html"],["type","child"],["description","The product correctly neutralizes certain special elements, but it improperly neutralizes equivalent special elements."],["extended_description","The product may have a fixed list of special characters it believes is complete. However, there may be alternate encodings, or representations that also have the same meaning. For example, the product may filter out a leading slash (/) to prevent absolute path names, but does not account for a tilde (~) followed by a user name, which on some *nix systems could be expanded to an absolute pathname. Alternately, the product might filter a dangerous \"-e\" command-line switch when calling an external program, but it might not account for \"--exec\" or other switches that have the same semantics."]]},{"type":"map","entries":[["id",78],["title","Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"],["url","https://cwe.mitre.org/data/definitions/78.html"],["type","child"],["description","The product constructs all or part of an OS command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended OS command when it is sent to a downstream component."],["extended_description","This weakness can lead to a vulnerability in environments in which the attacker does not have direct access to the operating system, such as in web applications. Alternately, if the weakness occurs in a privileged program, it could allow the attacker to specify commands that normally would not be accessible, or to call alternate commands with privileges that the attacker does not have. The problem is exacerbated if the compromised process does not follow the principle of least privilege, because the attacker-controlled commands may run with special system privileges that increases the amount of damage.\nThere are at least two subtypes of OS command injection:\n\nThe application intends to execute a single, fixed program that is under its own control. It intends to use externally-supplied inputs as arguments to that program. For example, the program might use system(\"nslookup [HOSTNAME]\") to run nslookup and allow the user to supply a HOSTNAME, which is used as an argument. Attackers cannot prevent nslookup from executing. However, if the program does not remove command separators from the HOSTNAME argument, attackers could place the separators into the arguments, which allows them to execute their own program after nslookup has finished executing.\nThe application accepts an input that it uses to fully select which program to run, as well as which commands to use. The application simply redirects this entire command to the operating system. For example, the program might use \"exec([COMMAND])\" to execute the [COMMAND] that was supplied by the user. If the COMMAND is under attacker control, then the attacker can execute arbitrary commands or programs. If the command is being executed using functions like exec() and CreateProcess(), the attacker might not be able to combine multiple commands together in the same line.\n\nFrom a weakness standpoint, these variants represent distinct programmer errors. In the first variant, the programmer clearly intends that input from untrusted parties will be part of the arguments in the command to be executed. In the second variant, the programmer does not intend for the command to be accessible to any untrusted party, but the programmer probably has not accounted for alternate ways in which malicious attackers can provide input."]]},{"type":"map","entries":[["id",79],["title","Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"],["url","https://cwe.mitre.org/data/definitions/79.html"],["type","child"],["description","The product does not neutralize or incorrectly neutralizes user-controllable input before it is placed in output that is used as a web page that is served to other users."],["extended_description","There are many variants of cross-site scripting, characterized by a variety of terms or involving different attack topologies. However, they all indicate the same fundamental weakness: improper neutralization of dangerous input between the adversary and a victim."]]},{"type":"map","entries":[["id",88],["title","Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"],["url","https://cwe.mitre.org/data/definitions/88.html"],["type","child"],["description","The product constructs a string for a command to be executed by a separate component\nin another control sphere, but it does not properly delimit the\nintended arguments, options, or switches within that command string."],["extended_description","When creating /cwe.mitre.org/data/definitions/1111.html"],["type","child"],["description","The product's documentation does not adequately define inputs,\n\t\t\t\t\toutputs, or system/software interfaces."],["extended_description",null]]}],["1112",{"type":"map","entries":[["id",1112],["title","Incomplete Documentation of Program Execution"],["url","https://cwe.mitre.org/data/definitions/1112.html"],["type","child"],["description","The document does not fully define all mechanisms that are used\n\t\t\t\t\tto control or influence how product-specific programs are\n\t\t\t\t\texecuted."],["extended_description","This includes environmental variables, configuration files, registry keys, command-line switches or options, or system settings."]]}],["1118",{"type":"map","entries":[["id",1118],["title","Insufficient Documentation of Error Handling Techniques"],["url","https://cwe.mitre.org/data/definitions/1118.html"],["type","child"],["description","The documentation does not sufficiently describe the techniques\n\t\t\t\t\tthat are used for error handling, exception processing, or similar\n\t\t\t\t\tmechanisms."],["extended_description","Documentation may need to cover error handling techniques at multiple layers, such as module, executable, compilable code unit, or callable."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the documentation provided to support, create, or analyze a product."]]},{"type":"map","entries":[["id",1053],["title","Missing Documentation for Design"],["url","https://cwe.mitre.org/data/definitions/1053.html"],["type","child"],["description","The product does not have documentation that represents how it is designed."],["extended_description",null]]},{"type":"map","entries":[["id",1068],["title","Inconsistency Between Implementation and Documented Design"],["url","https://cwe.mitre.org/data/definitions/1068.html"],["type","child"],["description","The implementation of the product is not consistent with the\n\t\t\t\t\tdesign as described within the relevant documentation."],["extended_description",null]]},{"type":"map","entries":[["id",1110],["title","Incomplete Design Documentation"],["url","https://cwe.mitre.org/data/definitions/1110.html"],["type","child"],["description","The product's design documentation does not adequately describe\n\t\t\t\t\tcontrol flow, data flow, system initialization, relationships between tasks,\n\t\t\t\t\tcomponents, rationales, or other important aspects of the\n\t\t\t\t\tdesign."],["extended_description",null]]},{"type":"map","entries":[["id",1111],["title","Incomplete I/O Documentation"],["url","https://cwe.mitre.org/data/definitions/1111.html"],["type","child"],["description","The product's documentation does not adequately define inputs,\n\t\t\t\t\toutputs, or system/software interfaces."],["extended_description",null]]},{"type":"map","entries":[["id",1112],["title","Incomplete Documentation of Program Execution"],["url","https://cwe.mitre.org/data/definitions/1112.html"],["type","child"],["description","The document does not fully define all mechanisms that are used\n\t\t\t\t\tto control or influence how product-specific programs are\n\t\t\t\t\texecuted."],["extended_description","This includes environmental variables, configuration files, registry keys, command-line switches or options, or system settings."]]},{"type":"map","entries":[["id",1118],["title","Insufficient Documentation of Error Handling Techniques"],["url","https://cwe.mitre.org/data/definitions/1118.html"],["type","child"],["description","The documentation does not sufficiently describe the techniques\n\t\t\t\t\tthat are used for error handling, exception processing, or similar\n\t\t\t\t\tmechanisms."],["extended_description","Documentation may need to cover error handling techniques at multiple layers, such as module, executable, compilable code unit, or callable."]]},{"type":"map","entries":[["id",1219],["title","File Handling Issues"],["url","https://cwe.mitre.org/data/definitions/1219.html"],["children",{"type":"map","entries":[["22",{"type":"map","entries":[["id",22],["title","Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"],["url","https://cwe.mitre.org/data/definitions/22.html"],["type","child"],["description","The product uses external input to construct a pathname that is intended to identify a file or directory that is located underneath a restricted parent directory, but the product does not properly neutralize special elements within the pathname that can cause the pathname to resolve to a location that is outside of the restricted directory."],["extended_description","Many file operations are intended to take place within a restricted directory. By using special elements such as \"..\" and \"/\" separators, attackers can escape outside of the restricted location to access files or directories that are elsewhere on the system. One of the most common special elements is the \"../\" sequence, which in most modern operating systems is interpreted as the parent directory of the current location. This is referred to as relative path traversal. Path traversal also covers the use of absolute pathnames such as \"/usr/local/bin\" to access unexpected files. This is referred to as absolute path traversal."]]}],["41",{"type":"map","entries":[["id",41],["title","Improper Resolution of Path Equivalence"],["url","https://cwe.mitre.org/data/definitions/41.html"],["type","child"],["description","The product is vulnerable to file system contents disclosure through path equivalence. Path equivalence involves the use of special characters in file and directory names. The associated manipulations are intended to generate multiple names for the same object."],["extended_description","Path equivalence is usually employed in order to circumvent access controls expressed using an incomplete set of file name or file path representations. This is different from path traversal, wherein the manipulations are performed to generate a name for a different object."]]}],["59",{"type":"map","entries":[["id",59],["title","Improper Link Resolution Before File Access ('Link Following')"],["url","https://cwe.mitre.org/data/definitions/59.html"],["type","child"],["description","The product attempts to access a file based on the filename, but it does not properly prevent that filename from identifying a link or shortcut that resolves to an unintended resource."],["extended_description",null]]}],["66",{"type":"map","entries":[["id",66],["title","Improper Handling of File Names that Identify Virtual Resources"],["url","https://cwe.mitre.org/data/definitions/66.html"],["type","child"],["description","The product does not handle or incorrectly handles a file name that identifies a \"virtual\" resource that is not directly specified within the directory that is associated with the file name, causing the product to perform file-based operations on a resource that is not a file."],["extended_description","Virtual file names are represented like normal file names, but they are effectively aliases for other resources that do not behave like normal files. Depending on their functionality, they could be alternate entities. They are not necessarily listed in directories."]]}],["378",{"type":"map","entries":[["id",378],["title","Creation of Temporary File With Insecure Permissions"],["url","https://cwe.mitre.org/data/definitions/378.html"],["type","child"],["description","Opening temporary files without appropriate measures or controls can leave the file, its contents and any function that it impacts vulnerable to attack."],["extended_description",null]]}],["379",{"type":"map","entries":[["id",379],["title","Creation of Temporary File in Directory with Insecure Permissions"],["url","https://cwe.mitre.org/data/definitions/379.html"],["type","child"],["description","The product creates a temporary file in a directory whose permissions allow unintended actors to determine the file's existence or otherwise access that file."],["extended_description","On some operating systems, the fact that the temporary file exists may be apparent to any user with sufficient privileges to access that directory. Since the file is visible, the application that is using the temporary file could be known. If one has access to list the processes on the system, the attacker has gained information about what the user is doing at that time. By correlating this with the applications the user is running, an attacker could potentially discover what a user's actions are. From this, higher levels of security could be breached."]]}],["426",{"type":"map","entries":[["id",426],["title","Untrusted Search Path"],["url","https://cwe.mitre.org/data/definitions/426.html"],["type","child"],["description","The product searches for critical resources using an externally-supplied search path that can point to resources that are not under the product's direct control."],["extended_description","This might allow attackers to execute their own programs, access unauthorized data files, or modify configuration in unexpected ways. If the product uses a search path to locate critical resources such as programs, then an attacker could modify that search path to point to a malicious program, which the targeted product would then execute. The problem extends to any type of critical resource that the product trusts.\nSome of the most common variants of untrusted search path are:\n\nIn various UNIX and Linux-based systems, the PATH environment variable may be consulted to locate executable programs, and LD_PRELOAD may be used to locate a separate library.\nIn various Microsoft-based systems, the PATH environment variable is consulted to locate a DLL, if the DLL is not found in other paths that appear earlier in the search order."]]}],["427",{"type":"map","entries":[["id",427],["title","Uncontrolled Search Path Element"],["url","https://cwe.mitre.org/data/definitions/427.html"],["type","child"],["description","The product uses a fixed or co
