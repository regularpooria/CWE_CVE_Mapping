actions to take place, or exploit latent vulnerabilities that would not be possible if the input conformed with the expected type.\nThis weakness can appear in type-unsafe programming languages, or in programming languages that support casting or conversion of an input to another type."]]}],["1288",{"type":"map","entries":[["id",1288],["title","Improper Validation of Consistency within Input"],["url","https://cwe.mitre.org/data/definitions/1288.html"],["type","child"],["description","The product receives a complex input with multiple elements or fields that must be consistent with each other, but it does not validate or incorrectly validates that the input is actually consistent."],["extended_description","Some input data can be structured with multiple elements or fields that must be consistent with each other, e.g. a number-of-items field that is followed by the expected number of elements.  When such complex inputs are inconsistent, attackers could trigger unexpected errors, cause incorrect actions to take place, or exploit latent vulnerabilities."]]}],["1289",{"type":"map","entries":[["id",1289],["title","Improper Validation of Unsafe Equivalence in Input"],["url","https://cwe.mitre.org/data/definitions/1289.html"],["type","child"],["description","The product receives an input value that is used as a resource identifier or other type of reference, but it does not validate or incorrectly validates that the input is equivalent to a potentially-unsafe value."],["extended_description","Attackers can sometimes bypass input validation schemes by finding inputs that appear to be safe, but will be dangerous when processed at a lower layer or by a downstream component.  For example, a simple XSS protection mechanism might try to validate that an input has no \"&lt;script&gt;\" tags using case-sensitive matching, but since HTML is case-insensitive when processed by web browsers, an attacker could inject \"&lt;ScrIpT&gt;\" and trigger XSS."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to a software system's components for input validation, output validation, or other kinds of validation. Validation is a frequently-used technique for ensuring that data conforms to expectations before it is further processed as input or output.  There are many varieties of validation (see CWE-20, which is just for input validation). Validation is distinct from other techniques that attempt to modify data before processing it, although developers may consider all attempts to product \"safe\" inputs or outputs as some kind of validation.  Regardless, validation is a powerful tool that is often used to minimize malformed data from entering the system, or indirectly avoid code injection or other potentially-malicious patterns when generating output. The weaknesses in this category could lead to a degradation of the quality of data flow in a system if they are not addressed."]]},{"type":"map","entries":[["id",112],["title","Missing XML Validation"],["url","https://cwe.mitre.org/data/definitions/112.html"],["type","child"],["description","The product accepts XML from an untrusted source but does not validate the XML against the proper schema."],["extended_description","Most successful attacks begin with a violation of the programmer's assumptions. By accepting an XML document without validating it against a DTD or XML schema, the programmer leaves a door open for attackers to provide unexpected, unreasonable, or malicious input."]]},{"type":"map","entries":[["id",183],["title","Permissive List of Allowed Inputs"],["url","https://cwe.mitre.org/data/definitions/183.html"],["type","child"],["description","The product implements a protection mechanism that relies on a list of inputs (or properties of inputs) that are explicitly allowed by policy because the inputs are assumed to be safe, but the list is too permissive - that is, it allows an input that is unsafe, leading to resultant weaknesses."],["extended_description",null]]},{"type":"map","entries":[["id",184],["title","Incomplete List of Disallowed Inputs"],["url","https://cwe.mitre.org/data/definitions/184.html"],["type","child"],["description","The product implements a protection mechanism that relies on a list of inputs (or properties of inputs) that are not allowed by policy or otherwise require other action to neutralize before additional processing takes place, but the list is incomplete."],["extended_description",null]]},{"type":"map","entries":[["id",606],["title","Unchecked Input for Loop Condition"],["url","https://cwe.mitre.org/data/definitions/606.html"],["type","child"],["description","The product does not properly check inputs that are used for loop conditions, potentially leading to a denial of service or other consequences because of excessive looping."],["extended_description",null]]},{"type":"map","entries":[["id",1173],["title","Improper Use of Validation Framework"],["url","https://cwe.mitre.org/data/definitions/1173.html"],["type","child"],["description","The product does not use, or incorrectly uses, an input validation framework that is provided by the source language or an independent library."],["extended_description","Many modern coding languages provide developers with input validation frameworks to make the task of input validation easier and less error-prone. These frameworks will automatically check all input against specified criteria and direct execution to error handlers when invalid input is received. The improper use (i.e., an incorrect implementation or missing altogether) of these frameworks is not directly exploitable, but can lead to an exploitable condition if proper input validation is not performed later in the product. Not using provided input validation frameworks can also hurt the maintainability of code as future developers may not recognize the downstream input validation being used in the place of the validation framework."]]},{"type":"map","entries":[["id",1284],["title","Improper Validation of Specified Quantity in Input"],["url","https://cwe.mitre.org/data/definitions/1284.html"],["type","child"],["description","The product receives input that is expected to specify a quantity (such as size or length), but it does not validate or incorrectly validates that the quantity has the required properties."],["extended_description","Specified quantities include size, length, frequency, price, rate, number of operations, time, and others. Code may rely on specified quantities to allocate resources, perform calculations, control iteration, etc."]]},{"type":"map","entries":[["id",1285],["title","Improper Validation of Specified Index, Position, or Offset in Input"],["url","https://cwe.mitre.org/data/definitions/1285.html"],["type","child"],["description","The product receives input that is expected to specify an index, position, or offset into an indexable resource such as a buffer or file, but it does not validate or incorrectly validates that the specified index/position/offset has the required properties."],["extended_description","Often, indexable resources such as memory buffers or files can be accessed using a specific position, index, or offset, such as an index for an array or a position for a file.  When untrusted input is not properly validated before it is used as an index, attackers could access (or attempt to access) unauthorized portions of these resources.  This could be used to cause buffer overflows, excessive resource allocation, or trigger unexpected failures."]]},{"type":"map","entries":[["id",1286],["title","Improper Validation of Syntactic Correctness of Input"],["url","https://cwe.mitre.org/data/definitions/1286.html"],["type","child"],["description","The product receives input that is expected to be well-formed - i.e., to comply with a certain syntax - but it does not validate or incorrectly validates that the input complies with the syntax."],["extended_description","Often, complex inputs are expected to follow a particular syntax, which is either assumed by the input itself, or declared within metadata such as headers. The syntax could be for data exchange formats, markup languages, or even programming languages.  When untrusted input is not properly validated for the expected syntax, attackers could cause parsing failures, trigger unexpected errors, or expose latent vulnerabilities that might not be directly exploitable if the input had conformed to the syntax."]]},{"type":"map","entries":[["id",1287],["title","Improper Validation of Specified Type of Input"],["url","https://cwe.mitre.org/data/definitions/1287.html"],["type","child"],["description","The product receives input that is expected to be of a certain type, but it does not validate or incorrectly validates that the input is actually of the expected type."],["extended_description","When input does not comply with the expected type, attackers could trigger unexpected errors, cause incorrect actions to take place, or exploit latent vulnerabilities that would not be possible if the input conformed with the expected type.\nThis weakness can appear in type-unsafe programming languages, or in programming languages that support casting or conversion of an input to another type."]]},{"type":"map","entries":[["id",1288],["title","Improper Validation of Consistency within Input"],["url","https://cwe.mitre.org/data/definitions/1288.html"],["type","child"],["description","The product receives a complex input with multiple elements or fields that must be consistent with each other, but it does not validate or incorrectly validates that the input is actually consistent."],["extended_description","Some input data can be structured with multiple elements or fields that must be consistent with each other, e.g. a number-of-items field that is followed by the expected number of elements.  When such complex inputs are inconsistent, attackers could trigger unexpected errors, cause incorrect actions to take place, or exploit latent vulnerabilities."]]},{"type":"map","entries":[["id",1289],["title","Improper Validation of Unsafe Equivalence in Input"],["url","https://cwe.mitre.org/data/definitions/1289.html"],["type","child"],["description","The product receives an input value that is used as a resource identifier or other type of reference, but it does not validate or incorrectly validates that the input is equivalent to a potentially-unsafe value."],["extended_description","Attackers can sometimes bypass input validation schemes by finding inputs that appear to be safe, but will be dangerous when processed at a lower layer or by a downstream component.  For example, a simple XSS protection mechanism might try to validate that an input has no \"&lt;script&gt;\" tags using case-sensitive matching, but since HTML is case-insensitive when processed by web browsers, an attacker could inject \"&lt;ScrIpT&gt;\" and trigger XSS."]]},{"type":"map","entries":[["id",1216],["title","Lockout Mechanism Errors"],["url","https://cwe.mitre.org/data/definitions/1216.html"],["children",{"type":"map","entries":[["645",{"type":"map","entries":[["id",645],["title","Overly Restrictive Account Lockout Mechanism"],["url","https://cwe.mitre.org/data/definitions/645.html"],["type","child"],["description","The product contains an account lockout protection mechanism, but the mechanism is too restrictive and can be triggered too easily, which allows attackers to deny service to legitimate users by causing their accounts to be locked out."],["extended_description","Account lockout is a security feature often present in applications as a countermeasure to the brute force attack on the password based authentication mechanism of the system. After a certain number of failed login attempts, the users' account may be disabled for a certain period of time or until it is unlocked by an administrator. Other security events may also possibly trigger account lockout. However, an attacker may use this very security feature to deny service to legitimate system users. It is therefore important to ensure that the account lockout security mechanism is not overly restrictive."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to a software system's lockout mechanism. Frequently these deal with scenarios that take effect in case of multiple failed attempts to access a given resource. The weaknesses in this category could lead to a degradation of access to system assets if they are not addressed."]]},{"type":"map","entries":[["id",1218],["title","Memory Buffer Errors"],["url","https://cwe.mitre.org/data/definitions/1218.html"],["children",{"type":"map","entries":[["120",{"type":"map","entries":[["id",120],["title","Buffer Copy without Checking Size of Input ('Classic Buffer Overflow')"],["url","https://cwe.mitre.org/data/definitions/120.html"],["type","child"],["description","The product copies an input buffer to an output buffer without verifying that the size of the input buffer is less than the size of the output buffer."],["extended_description",null]]}],["124",{"type":"map","entries":[["id",124],["title","Buffer Underwrite ('Buffer Underflow')"],["url","https://cwe.mitre.org/data/definitions/124.html"],["type","child"],["description","The product writes to a buffer using an index or pointer that references a memory location prior to the beginning of the buffer."],["extended_description",null]]}],["125",{"type":"map","entries":[["id",125],["title","Out-of-bounds Read"],["url","https://cwe.mitre.org/data/definitions/125.html"],["type","child"],["description","The product reads data past the end, or before the beginning, of the intended buffer."],["extended_description",null]]}],["131",{"type":"map","entries":[["id",131],["title","Incorrect Calculation of Buffer Size"],["url","https://cwe.mitre.org/data/definitions/131.html"],["type","child"],["description","The product does not correctly calculate the size to be used when allocating a buffer, which could lead to a buffer overflow."],["extended_description",null]]}],["786",{"type":"map","entries":[["id",786],["title","Access of Memory Location Before Start of Buffer"],["url","https://cwe.mitre.org/data/definitions/786.html"],["type","child"],["description","The product reads or writes to a buffer using an index or pointer that references a memory location prior to the beginning of the buffer."],["extended_description","This typically occurs when a pointer or its index is decremented to a position before the buffer, when pointer arithmetic results in a position before the beginning of the valid memory location, or when a negative index is used."]]}],["787",{"type":"map","entries":[["id",787],["title","Out-of-bounds Write"],["url","https://cwe.mitre.org/data/definitions/787.html"],["type","child"],["description","The product writes data past the end, or before the beginning, of the intended buffer."],["extended_description",null]]}],["788",{"type":"map","entries":[["id",788],["title","Access of Memory Location After End of Buffer"],["url","https://cwe.mitre.org/data/definitions/788.html"],["type","child"],["description","The product reads or writes to a buffer using an index or pointer that references a memory location after the end of the buffer."],["extended_description","This typically occurs when a pointer or its index is incremented to a position after the buffer; or when pointer arithmetic results in a position after the buffer."]]}],["805",{"type":"map","entries":[["id",805],["title","Buffer Access with Incorrect Length Value"],["url","https://cwe.mitre.org/data/definitions/805.html"],["type","child"],["description","The product uses a sequential operation to read or write a buffer, but it uses an incorrect length value that causes it to access memory that is outside of the bounds of the buffer."],["extended_description","When the length value exceeds the size of the destination, a buffer overflow could occur."]]}],["1284",{"type":"map","entries":[["id",1284],["title","Improper Validation of Specified Quantity in Input"],["url","https://cwe.mitre.org/data/definitions/1284.html"],["type","child"],["description","The product receives input that is expected to specify a quantity (such as size or length), but it does not validate or incorrectly validates that the quantity has the required properties."],["extended_description","Specified quantities include size, length, frequency, price, rate, number of operations, time, and others. Code may rely on specified quantities to allocate resources, perform calculations, control iteration, etc."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to the handling of memory buffers within a software system."]]},{"type":"map","entries":[["id",120],["title","Buffer Copy without Checking Size of Input ('Classic Buffer Overflow')"],["url","https://cwe.mitre.org/data/definitions/120.html"],["type","child"],["description","The product copies an input buffer to an output buffer without verifying that the size of the input buffer is less than the size of the output buffer."],["extended_description",null]]},{"type":"map","entries":[["id",124],["title","Buffer Underwrite ('Buffer Underflow')"],["url","https://cwe.mitre.org/data/definitions/124.html"],["type","child"],["description","The product writes to a buffer using an index or pointer that references a memory location prior to the beginning of the buffer."],["extended_description",null]]},{"type":"map","entries":[["id",125],["title","Out-of-bounds Read"],["url","https://cwe.mitre.org/data/definitions/125.html"],["type","child"],["description","The product reads data past the end, or before the beginning, of the intended buffer."],["extended_description",null]]},{"type":"map","entries":[["id",131],["title","Incorrect Calculation of Buffer Size"],["url","https://cwe.mitre.org/data/definitions/131.html"],["type","child"],["description","The product does not correctly calculate the size to be used when allocating a buffer, which could lead to a buffer overflow."],["extended_description",null]]},{"type":"map","entries":[["id",786],["title","Access of Memory Location Before Start of Buffer"],["url","https://cwe.mitre.org/data/definitions/786.html"],["type","child"],["description","The product reads or writes to a buffer using an index or pointer that references a memory location prior to the beginning of the buffer."],["extended_description","This typically occurs when a pointer or its index is decremented to a position before the buffer, when pointer arithmetic results in a position before the beginning of the valid memory location, or when a negative index is used."]]},{"type":"map","entries":[["id",787],["title","Out-of-bounds Write"],["url","https://cwe.mitre.org/data/definitions/787.html"],["type","child"],["description","The product writes data past the end, or before the beginning, of the intended buffer."],["extended_description",null]]},{"type":"map","entries":[["id",788],["title","Access of Memory Location After End of Buffer"],["url","https://cwe.mitre.org/data/definitions/788.html"],["type","child"],["description","The product reads or writes to a buffer using an index or pointer that references a memory location after the end of the buffer."],["extended_description","This typically occurs when a pointer or its index is incremented to a position after the buffer; or when pointer arithmetic results in a position after the buffer."]]},{"type":"map","entries":[["id",805],["title","Buffer Access with Incorrect Length Value"],["url","https://cwe.mitre.org/data/definitions/805.html"],["type","child"],["description","The product uses a sequential operation to read or write a buffer, but it uses an incorrect length value that causes it to access memory that is outside of the bounds of the buffer."],["extended_description","When the length value exceeds the size of the destination, a buffer overflow could occur."]]},{"type":"map","entries":[["id",189],["title","Numeric Errors"],["url","https://cwe.mitre.org/data/definitions/189.html"],["children",{"type":"map","entries":[["128",{"type":"map","entries":[["id",128],["title","Wrap-around Error"],["url","https://cwe.mitre.org/data/definitions/128.html"],["type","child"],["description","Wrap around errors occur whenever a value is incremented past the maximum value for its type and therefore \"wraps around\" to a very small, negative, or undefined value."],["extended_description",null]]}],["190",{"type":"map","entries":[["id",190],["title","Integer Overflow or Wraparound"],["url","https://cwe.mitre.org/data/definitions/190.html"],["type","child"],["description","The product performs a calculation that can\n         produce an integer overflow or wraparound when the logic\n         assumes that the resulting value will always be larger than\n         the original value. This occurs when an integer value is\n         incremented to a value that is too large to store in the\n         associated representation. When this occurs, the value may\n         become a very small or negative number."],["extended_description",null]]}],["191",{"type":"map","entries":[["id",191],["title","Integer Underflow (Wrap or Wraparound)"],["url","https://cwe.mitre.org/data/definitions/191.html"],["type","child"],["description","The product subtracts one value from another, such that the result is less than the minimum allowable integer value, which produces a value that is not equal to the correct result."],["extended_description","This can happen in signed and unsigned cases."]]}],["193",{"type":"map","entries":[["id",193],["title","Off-by-one Error"],["url","https://cwe.mitre.org/data/definitions/193.html"],["type","child"],["description","A product calculates or uses an incorrect maximum or minimum value that is 1 more, or 1 less, than the correct value."],["extended_description",null]]}],["369",{"type":"map","entries":[["id",369],["title","Divide By Zero"],["url","https://cwe.mitre.org/data/definitions/369.html"],["type","child"],["description","The product divides a value by zero."],["extended_description","This weakness typically occurs when an unexpected value is provided to the product, or if an error occurs that is not properly detected. It frequently occurs in calculations involving physical dimensions such as size, length, width, and height."]]}],["681",{"type":"map","entries":[["id",681],["title","Incorrect Conversion between Numeric Types"],["url","https://cwe.mitre.org/data/definitions/681.html"],["type","child"],["description","When converting from one data type to another, such as long to integer, data can be omitted or translated in a way that produces unexpected values. If the resulting values are used in a sensitive context, then dangerous behaviors may occur."],["extended_description",null]]}],["839",{"type":"map","entries":[["id",839],["title","Numeric Range Comparison Without Minimum Check"],["url","https://cwe.mitre.org/data/definitions/839.html"],["type","child"],["description","The product checks a value to ensure that it is less than or equal to a maximum, but it does not also verify that the value is greater than or equal to the minimum."],["extended_description","Some products use signed integers or floats even when their values are only expected to be positive or 0. An input validation check might assume that the value is positive, and only check for the maximum value. If the value is negative, but the code assumes that the value is positive, this can produce an error. The error may have security consequences if the negative value is used for memory allocation, array access, buffer access, etc. Ultimately, the error could lead to a buffer overflow or other type of memory corruption.\nThe use of a negative number in a positive-only context could have security implications for other types of resources. For example, a shopping cart might check that the user is not requesting more than 10 items, but a request for -3 items could cause the application to calculate a negative price and credit the attacker's account."]]}],["1335",{"type":"map","entries":[["id",1335],["title","Incorrect Bitwise Shift of Integer"],["url","https://cwe.mitre.org/data/definitions/1335.html"],["type","child"],["description","An integer value is specified to be shifted by a negative amount or an amount greater than or equal to the number of bits contained in the value causing an unexpected or indeterminate result."],["extended_description","Specifying a value to be shifted by a negative amount is undefined in various languages. Various computer architectures implement this action in different ways. The compilers and interpreters when generating code to accomplish a shift generally do not do a check for this issue.\nSpecifying an over-shift, a shift greater than or equal to the number of bits contained in a value to be shifted, produces a result which varies by architecture and compiler. In some languages, this action is specifically listed as producing an undefined result."]]}],["1339",{"type":"map","entries":[["id",1339],["title","Insufficient Precision or Accuracy of a Real Number"],["url","https://cwe.mitre.org/data/definitions/1339.html"],["type","child"],["description","The product processes a real number with an implementation in which the number's representation does not preserve required accuracy and precision in its fractional part, causing an incorrect result."],["extended_description","When a security decision or calculation requires highly precise, accurate numbers such as financial calculations or prices, then small variations in the number could be exploited by an attacker.\n            There are multiple ways to store the fractional part of a real number in a computer. In all of these cases, there is a limit to the accuracy of recording a fraction. If the fraction can be represented in a fixed number of digits (binary or decimal), there might not be enough digits assigned to represent the number. In other cases the number cannot be represented in a fixed number of digits due to repeating in decimal or binary notation (e.g. 0.333333...) or due to a transcendental number such as \u03a0 or \u221a2. Rounding of numbers can lead to situations where the computer results do not adequately match the result of sufficiently accurate math."]]}],["1389",{"type":"map","entries":[["id",1389],["title","Incorrect Parsing of Numbers with Different Radices"],["url","https://cwe.mitre.org/data/definitions/1389.html"],["type","child"],["description","The product parses numeric input assuming base 10 (decimal) values, but it does not account for inputs that use a different base number (radix)."],["extended_description","Frequently, a numeric input that begins with \"0\" is treated as octal, or \"0x\" causes it to be treated as hexadecimal, e.g. by the inet_addr() function. For example, \"023\" (octal) is 35 decimal, or \"0x31\" is 49 decimal. Other bases may be used as well. If the developer assumes decimal-only inputs, the code could produce incorrect numbers when the inputs are parsed using a different base. This can result in unexpected and/or dangerous behavior. For example, a \"0127.0.0.1\" IP address is parsed as octal due to the leading \"0\", whose numeric value would be the same as 87.0.0.1 (decimal), where the developer likely expected to use 127.0.0.1.\nThe consequences vary depending on the surrounding code in which this weakness occurs, but they can include bypassing network-based access control using unexpected IP addresses or netmasks, or causing apparently-symbolic identifiers to be processed as if they are numbers. In web applications, this can enable bypassing of SSRF restrictions."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper calculation or conversion of numbers."]]},{"type":"map","entries":[["id",128],["title","Wrap-around Error"],["url","https://cwe.mitre.org/data/definitions/128.html"],["type","child"],["description","Wrap around errors occur whenever a value is incremented past the maximum value for its type and therefore \"wraps around\" to a very small, negative, or undefined value."],["extended_description",null]]},{"type":"map","entries":[["id",190],["title","Integer Overflow or Wraparound"],["url","https://cwe.mitre.org/data/definitions/190.html"],["type","child"],["description","The product performs a calculation that can\n         produce an integer overflow or wraparound when the logic\n         assumes that the resulting value will always be larger than\n         the original value. This occurs when an integer value is\n         incremented to a value that is too large to store in the\n         associated representation. When this occurs, the value may\n         become a very small or negative number."],["extended_description",null]]},{"type":"map","entries":[["id",191],["title","Integer Underflow (Wrap or Wraparound)"],["url","https://cwe.mitre.org/data/definitions/191.html"],["type","child"],["description","The product subtracts one value from another, such that the result is less than the minimum allowable integer value, which produces a value that is not equal to the correct result."],["extended_description","This can happen in signed and unsigned cases."]]},{"type":"map","entries":[["id",193],["title","Off-by-one Error"],["url","https://cwe.mitre.org/data/definitions/193.html"],["type","child"],["description","A product calculates or uses an incorrect maximum or minimum value that is 1 more, or 1 less, than the correct value."],["extended_description",null]]},{"type":"map","entries":[["id",369],["title","Divide By Zero"],["url","https://cwe.mitre.org/data/definitions/369.html"],["type","child"],["description","The product divides a value by zero."],["extended_description","This weakness typically occurs when an unexpected value is provided to the product, or if an error occurs that is not properly detected. It frequently occurs in calculations involving physical dimensions such as size, length, width, and height."]]},{"type":"map","entries":[["id",681],["title","Incorrect Conversion between Numeric Types"],["url","https://cwe.mitre.org/data/definitions/681.html"],["type","child"],["description","When converting from one data type to another, such as long to integer, data can be omitted or translated in a way that produces unexpected values. If the resulting values are used in a sensitive context, then dangerous behaviors may occur."],["extended_description",null]]},{"type":"map","entries":[["id",839],["title","Numeric Range Comparison Without Minimum Check"],["url","https://cwe.mitre.org/data/definitions/839.html"],["type","child"],["description","The product checks a value to ensure that it is less than or equal to a maximum, but it does not also verify that the value is greater than or equal to the minimum."],["extended_description","Some products use signed integers or floats even when their values are only expected to be positive or 0. An input validation check might assume that the value is positive, and only check for the maximum value. If the value is negative, but the code assumes that the value is positive, this can produce an error. The error may have security consequences if the negative value is used for memory allocation, array access, buffer access, etc. Ultimately, the error could lead to a buffer overflow or other type of memory corruption.\nThe use of a negative number in a positive-only context could have security implications for other types of resources. For example, a shopping cart might check that the user is not requesting more than 10 items, but a request for -3 items could cause the application to calculate a negative price and credit the attacker's account."]]},{"type":"map","entries":[["id",1335],["title","Incorrect Bitwise Shift of Integer"],["url","https://cwe.mitre.org/data/definitions/1335.html"],["type","child"],["description","An integer value is specified to be shifted by a negative amount or an amount greater than or equal to the number of bits contained in the value causing an unexpected or indeterminate result."],["extended_description","Specifying a value to be shifted by a negative amount is undefined in various languages. Various computer architectures implement this action in different ways. The compilers and interpreters when generating code to accomplish a shift generally do not do a check for this issue.\nSpecifying an over-shift, a shift greater than or equal to the number of bits contained in a value to be shifted, produces a result which varies by architecture and compiler. In some languages, this action is specifically listed as producing an undefined result."]]},{"type":"map","entries":[["id",1339],["title","Insufficient Precision or Accuracy of a Real Number"],["url","https://cwe.mitre.org/data/definitions/1339.html"],["type","child"],["description","The product processes a real number with an implementation in which the number's representation does not preserve required accuracy and precision in its fractional part, causing an incorrect result."],["extended_description","When a security decision or calculation requires highly precise, accurate numbers such as financial calculations or prices, then small variations in the number could be exploited by an attacker.\n            There are multiple ways to store the fractional part of a real number in a computer. In all of these cases, there is a limit to the accuracy of recording a fraction. If the fraction can be represented in a fixed number of digits (binary or decimal), there might not be enough digits assigned to represent the number. In other cases the number cannot be represented in a fixed number of digits due to repeating in decimal or binary notation (e.g. 0.333333...) or due to a transcendental number such as \u03a0 or \u221a2. Rounding of numbers can lead to situations where the computer results do not adequately match the result of sufficiently accurate math."]]},{"type":"map","entries":[["id",1389],["title","Incorrect Parsing of Numbers with Different Radices"],["url","https://cwe.mitre.org/data/definitions/1389.html"],["type","child"],["description","The product parses numeric input assuming base 10 (decimal) values, but it does not account for inputs that use a different base number (radix)."],["extended_description","Frequently, a numeric input that begins with \"0\" is treated as octal, or \"0x\" causes it to be treated as hexadecimal, e.g. by the inet_addr() function. For example, \"023\" (octal) is 35 decimal, or \"0x31\" is 49 decimal. Other bases may be used as well. If the developer assumes decimal-only inputs, the code could produce incorrect numbers when the inputs are parsed using a different base. This can result in unexpected and/or dangerous behavior. For example, a \"0127.0.0.1\" IP address is parsed as octal due to the leading \"0\", whose numeric value would be the same as 87.0.0.1 (decimal), where the developer likely expected to use 127.0.0.1.\nThe consequences vary depending on the surrounding code in which this weakness occurs, but they can include bypassing network-based access control using unexpected IP addresses or netmasks, or causing apparently-symbolic identifiers to be processed as if they are numbers. In web applications, this can enable bypassing of SSRF restrictions."]]},{"type":"map","entries":[["id",275],["title","Permission Issues"],["url","https://cwe.mitre.org/data/definitions/275.html"],["children",{"type":"map","entries":[["276",{"type":"map","entries":[["id",276],["title","Incorrect Default Permissions"],["url","https://cwe.mitre.org/data/definitions/276.html"],["type","child"],["description","During installation, installed file permissions are set to allow anyone to modify those files."],["extended_description",null]]}],["277",{"type":"map","entries":[["id",277],["title","Insecure Inherited Permissions"],["url","https://cwe.mitre.org/data/definitions/277.html"],["type","child"],["description","A product defines a set of insecure permissions that are inherited by objects that are created by the program."],["extended_description",null]]}],["278",{"type":"map","entries":[["id",278],["title","Insecure Preserved Inherited Permissions"],["url","https://cwe.mitre.org/data/definitions/278.html"],["type","child"],["description","A product inherits a set of insecure permissions for an object, e.g. when copying from an archive file, without user awareness or involvement."],["extended_description",null]]}],["279",{"type":"map","entries":[["id",279],["title","Incorrect Execution-Assigned Permissions"],["url","https://cwe.mitre.org/data/definitions/279.html"],["type","child"],["description","While it is executing, the product sets the permissions of an object in a way that violates the intended permissions that have been specified by the user."],["extended_description",null]]}],["280",{"type":"map","entries":[["id",280],["title","Improper Handling of Insufficient Permissions or Privileges"],["url","https://cwe.mitre.org/data/definitions/280.html"],["type","child"],["description","The product does not handle or incorrectly handles when it has insufficient privileges to access resources or functionality as specified by their permissions. This may cause it to follow unexpected code paths that may leave the product in an invalid state."],["extended_description",null]]}],["281",{"type":"map","entries":[["id",281],["title","Improper Preservation of Permissions"],["url","https://cwe.mitre.org/data/definitions/281.html"],["type","child"],["description","The product does not preserve permissions or incorrectly preserves permissions when copying, restoring, or sharing objects, which can cause them to have less restrictive permissions than intended."],["extended_description",null]]}],["618",{"type":"map","entries":[["id",618],["title","Exposed Unsafe ActiveX Method"],["url","https://cwe.mitre.org/data/definitions/618.html"],["type","child"],["description","An ActiveX control is intended for use in a web browser, but it exposes dangerous methods that perform actions that are outside of the browser's security model (e.g. the zone or domain)."],["extended_description","ActiveX controls can exercise far greater control over the operating system than typical Java or javascript. Exposed methods can be subject to various vulnerabilities, depending on the implemented behaviors of those methods, and whether input validation is performed on the provided arguments. If there is no integrity checking or origin validation, this method could be invoked by attackers."]]}],["766",{"type":"map","entries":[["id",766],["title","Critical Data Element Declared Public"],["url","https://cwe.mitre.org/data/definitions/766.html"],["type","child"],["description","The product declares a critical variable, field, or member to be public when intended security policy requires it to be private."],["extended_description","This issue makes it more difficult to maintain the product, which indirectly affects security by making it more difficult or time-consuming to find and/or fix vulnerabilities.  It also might make it easier to introduce vulnerabilities."]]}],["767",{"type":"map","entries":[["id",767],["title","Access to Critical Private Variable via Public Method"],["url","https://cwe.mitre.org/data/definitions/767.html"],["type","child"],["description","The product defines a public method that reads or modifies a private variable."],["extended_description","If an attacker modifies the variable to contain unexpected values, this could violate assumptions from other parts of the code. Additionally, if an attacker can read the private variable, it may expose sensitive information or make it easier to launch further attacks."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper assignment or handling of permissions."]]},{"type":"map","entries":[["id",276],["title","Incorrect Default Permissions"],["url","https://cwe.mitre.org/data/definitions/276.html"],["type","child"],["description","During installation, installed file permissions are set to allow anyone to modify those files."],["extended_description",null]]},{"type":"map","entries":[["id",277],["title","Insecure Inherited Permissions"],["url","https://cwe.mitre.org/data/definitions/277.html"],["type","child"],["description","A product defines a set of insecure permissions that are inherited by objects that are created by the program."],["extended_description",null]]},{"type":"map","entries":[["id",278],["title","Insecure Preserved Inherited Permissions"],["url","https://cwe.mitre.org/data/definitions/278.html"],["type","child"],["description","A product inherits a set of insecure permissions for an object, e.g. when copying from an archive file, without user awareness or involvement."],["extended_description",null]]},{"type":"map","entries":[["id",279],["title","Incorrect Execution-Assigned Permissions"],["url","https://cwe.mitre.org/data/definitions/279.html"],["type","child"],["description","While it is executing, the product sets the permissions of an object in a way that violates the intended permissions that have been specified by the user."],["extended_description",null]]},{"type":"map","entries":[["id",280],["title","Improper Handling of Insufficient Permissions or Privileges"],["url","https://cwe.mitre.org/data/definitions/280.html"],["type","child"],["description","The product does not handle or incorrectly handles when it has insufficient privileges to access resources or functionality as specified by their permissions. This may cause it to follow unexpected code paths that may leave the product in an invalid state."],["extended_description",null]]},{"type":"map","entries":[["id",281],["title","Improper Preservation of Permissions"],["url","https://cwe.mitre.org/data/definitions/281.html"],["type","child"],["description","The product does not preserve permissions or incorrectly preserves permissions when copying, restoring, or sharing objects, which can cause them to have less restrictive permissions than intended."],["extended_description",null]]},{"type":"map","entries":[["id",618],["title","Exposed Unsafe ActiveX Method"],["url","https://cwe.mitre.org/data/definitions/618.html"],["type","child"],["description","An ActiveX control is intended for use in a web browser, but it exposes dangerous methods that perform actions that are outside of the browser's security model (e.g. the zone or domain)."],["extended_description","ActiveX controls can exercise far greater control over the operating system than typical Java or javascript. Exposed methods can be subject to various vulnerabilities, depending on the implemented behaviors of those methods, and whether input validation is performed on the provided arguments. If there is no integrity checking or origin validation, this method could be invoked by attackers."]]},{"type":"map","entries":[["id",766],["title","Critical Data Element Declared Public"],["url","https://cwe.mitre.org/data/definitions/766.html"],["type","child"],["description","The product declares a critical variable, field, or member to be public when intended security policy requires it to be private."],["extended_description","This issue makes it more difficult to maintain the product, which indirectly affects security by making it more difficult or time-consuming to find and/or fix vulnerabilities.  It also might make it easier to introduce vulnerabilities."]]},{"type":"map","entries":[["id",767],["title","Access to Critical Private Variable via Public Method"],["url","https://cwe.mitre.org/data/definitions/767.html"],["type","child"],["description","The product defines a public method that reads or modifies a private variable."],["extended_description","If an attacker modifies the variable to contain unexpected values, this could violate assumptions from other parts of the code. Additionally, if an attacker can read the private variable, it may expose sensitive information or make it easier to launch further attacks."]]},{"type":"map","entries":[["id",465],["title","Pointer Issues"],["url","https://cwe.mitre.org/data/definitions/465.html"],["children",{"type":"map","entries":[["466",{"type":"map","entries":[["id",466],["title","Return of Pointer Value Outside of Expected Range"],["url","https://cwe.mitre.org/data/definitions/466.html"],["type","child"],["description","A function can return a pointer to memory that is outside of the buffer that the pointer is expected to reference."],["extended_description",null]]}],["468",{"type":"map","entries":[["id",468],["title","Incorrect Pointer Scaling"],["url","https://cwe.mitre.org/data/definitions/468.html"],["type","child"],["description","In C and C++, one may often accidentally refer to the wrong memory due to the semantics of when math operations are implicitly scaled."],["extended_description",null]]}],["469",{"type":"map","entries":[["id",469],["title","Use of Pointer Subtraction to Determine Size"],["url","https://cwe.mitre.org/data/definitions/469.html"],["type","child"],["description","The product subtracts one pointer from another in order to determine size, but this calculation can be incorrect if the pointers do not exist in the same memory chunk."],["extended_description",null]]}],["476",{"type":"map","entries":[["id",476],["title","NULL Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/476.html"],["type","child"],["description","The product dereferences a pointer that it expects to be valid but is NULL."],["extended_description",null]]}],["587",{"type":"map","entries":[["id",587],["title","Assignment of a Fixed Address to a Pointer"],["url","https://cwe.mitre.org/data/definitions/587.html"],["type","child"],["description","The product sets a pointer to a specific address other than NULL or 0."],["extended_description","Using a fixed address is not portable, because that address will probably not be valid in all environments or platforms."]]}],["763",{"type":"map","entries":[["id",763],["title","Release of Invalid Pointer or Reference"],["url","https://cwe.mitre.org/data/definitions/763.html"],["type","child"],["description","The product attempts to return a memory resource to the system, but it calls the wrong release function or calls the appropriate release function incorrectly."],["extended_description","This weakness can take several forms, such as:\n\nThe memory was allocated, explicitly or implicitly, via one memory management method and deallocated using a different, non-compatible function (CWE-762).\nThe function calls or memory management routines chosen are appropriate, however they are used incorrectly, such as in CWE-761."]]}],["822",{"type":"map","entries":[["id",822],["title","Untrusted Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/822.html"],["type","child"],["description","The product obtains a value from an untrusted source, converts this value to a pointer, and dereferences the resulting pointer."],["extended_description","An attacker can supply a pointer for memory locations that the product is not expecting. If the pointer is dereferenced for a write operation, the attack might allow modification of critical state variables, cause a crash, or execute code. If the dereferencing operation is for a read, then the attack might allow reading of sensitive data, cause a crash, or set a variable to an unexpected value (since the value will be read from an unexpected memory location).\nThere are several variants of this weakness, including but not necessarily limited to:\n\nThe untrusted value is directly invoked as a function call.\nIn OS kernels or drivers where there is a boundary between \"userland\" and privileged memory spaces, an untrusted pointer might enter through an API or system call (see CWE-781 for one such example).\nInadvertently accepting the value from an untrusted control sphere when it did not have to be accepted as input at all. This might occur when the code was originally developed to be run by a single user in a non-networked environment, and the code is then ported to or otherwise exposed to a networked environment."]]}],["823",{"type":"map","entries":[["id",823],["title","Use of Out-of-range Pointer Offset"],["url","https://cwe.mitre.org/data/definitions/823.html"],["type","child"],["description","The product performs pointer arithmetic on a valid pointer, but it uses an offset that can point outside of the intended range of valid memory locations for the resulting pointer."],["extended_description","While a pointer can contain a reference to any arbitrary memory location, a program typically only intends to use the pointer to access limited portions of memory, such as contiguous memory used to access an individual array.\nPrograms may use offsets in order to access fields or sub-elements stored within structured data. The offset might be out-of-range if it comes from an untrusted source, is the result of an incorrect calculation, or occurs because of another error.\nIf an attacker can control or influence the offset so that it points outside of the intended boundaries of the structure, then the attacker may be able to read or write to memory locations that are used elsewhere in the product. As a result, the attack might change the state of the product as accessed through program variables, cause a crash or instable behavior, and possibly lead to code execution."]]}],["824",{"type":"map","entries":[["id",824],["title","Access of Uninitialized Pointer"],["url","https://cwe.mitre.org/data/definitions/824.html"],["type","child"],["description","The product accesses or uses a pointer that has not been initialized."],["extended_description","If the pointer contains an uninitialized value, then the value might not point to a valid memory location. This could cause the product to read from or write to unexpected memory locations, leading to a denial of service. If the uninitialized pointer is used as a function call, then arbitrary functions could be invoked. If an attacker can influence the portion of uninitialized memory that is contained in the pointer, this weakness could be leveraged to execute code or perform other attacks.\nDepending on memory layout, associated memory management behaviors, and product operation, the attacker might be able to influence the contents of the uninitialized pointer, thus gaining more fine-grained control of the memory location to be accessed."]]}],["825",{"type":"map","entries":[["id",825],["title","Expired Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/825.html"],["type","child"],["description","The product dereferences a pointer that contains a location for memory that was previously valid, but is no longer valid."],["extended_description","When a product releases memory, but it maintains a pointer to that memory, then the memory might be re-allocated at a later time. If the original pointer is accessed to read or write data, then this could cause the product to read or modify data that is in use by a different function or process. Depending on how the newly-allocated memory is used, this could lead to a denial of service, information exposure, or code execution."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to improper handling of pointers."]]},{"type":"map","entries":[["id",466],["title","Return of Pointer Value Outside of Expected Range"],["url","https://cwe.mitre.org/data/definitions/466.html"],["type","child"],["description","A function can return a pointer to memory that is outside of the buffer that the pointer is expected to reference."],["extended_description",null]]},{"type":"map","entries":[["id",468],["title","Incorrect Pointer Scaling"],["url","https://cwe.mitre.org/data/definitions/468.html"],["type","child"],["description","In C and C++, one may often accidentally refer to the wrong memory due to the semantics of when math operations are implicitly scaled."],["extended_description",null]]},{"type":"map","entries":[["id",469],["title","Use of Pointer Subtraction to Determine Size"],["url","https://cwe.mitre.org/data/definitions/469.html"],["type","child"],["description","The product subtracts one pointer from another in order to determine size, but this calculation can be incorrect if the pointers do not exist in the same memory chunk."],["extended_description",null]]},{"type":"map","entries":[["id",476],["title","NULL Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/476.html"],["type","child"],["description","The product dereferences a pointer that it expects to be valid but is NULL."],["extended_description",null]]},{"type":"map","entries":[["id",587],["title","Assignment of a Fixed Address to a Pointer"],["url","https://cwe.mitre.org/data/definitions/587.html"],["type","child"],["description","The product sets a pointer to a specific address other than NULL or 0."],["extended_description","Using a fixed address is not portable, because that address will probably not be valid in all environments or platforms."]]},{"type":"map","entries":[["id",763],["title","Release of Invalid Pointer or Reference"],["url","https://cwe.mitre.org/data/definitions/763.html"],["type","child"],["description","The product attempts to return a memory resource to the system, but it calls the wrong release function or calls the appropriate release function incorrectly."],["extended_description","This weakness can take several forms, such as:\n\nThe memory was allocated, explicitly or implicitly, via one memory management method and deallocated using a different, non-compatible function (CWE-762).\nThe function calls or memory management routines chosen are appropriate, however they are used incorrectly, such as in CWE-761."]]},{"type":"map","entries":[["id",822],["title","Untrusted Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/822.html"],["type","child"],["description","The product obtains a value from an untrusted source, converts this value to a pointer, and dereferences the resulting pointer."],["extended_description","An attacker can supply a pointer for memory locations that the product is not expecting. If the pointer is dereferenced for a write operation, the attack might allow modification of critical state variables, cause a crash, or execute code. If the dereferencing operation is for a read, then the attack might allow reading of sensitive data, cause a crash, or set a variable to an unexpected value (since the value will be read from an unexpected memory location).\nThere are several variants of this weakness, including but not necessarily limited to:\n\nThe untrusted value is directly invoked as a function call.\nIn OS kernels or drivers where there is a boundary between \"userland\" and privileged memory spaces, an untrusted pointer might enter through an API or system call (see CWE-781 for one such example).\nInadvertently accepting the value from an untrusted control sphere when it did not have to be accepted as input at all. This might occur when the code was originally developed to be run by a single user in a non-networked environment, and the code is then ported to or otherwise exposed to a networked environment."]]},{"type":"map","entries":[["id",823],["title","Use of Out-of-range Pointer Offset"],["url","https://cwe.mitre.org/data/definitions/823.html"],["type","child"],["description","The product performs pointer arithmetic on a valid pointer, but it uses an offset that can point outside of the intended range of valid memory locations for the resulting pointer."],["extended_description","While a pointer can contain a reference to any arbitrary memory location, a program typically only intends to use the pointer to access limited portions of memory, such as contiguous memory used to access an individual array.\nPrograms may use offsets in order to access fields or sub-elements stored within structured data. The offset might be out-of-range if it comes from an untrusted source, is the result of an incorrect calculation, or occurs because of another error.\nIf an attacker can control or influence the offset so that it points outside of the intended boundaries of the structure, then the attacker may be able to read or write to memory locations that are used elsewhere in the product. As a result, the attack might change the state of the product as accessed through program variables, cause a crash or instable behavior, and possibly lead to code execution."]]},{"type":"map","entries":[["id",824],["title","Access of Uninitialized Pointer"],["url","https://cwe.mitre.org/data/definitions/824.html"],["type","child"],["description","The product accesses or uses a pointer that has not been initialized."],["extended_description","If the pointer contains an uninitialized value, then the value might not point to a valid memory location. This could cause the product to read from or write to unexpected memory locations, leading to a denial of service. If the uninitialized pointer is used as a function call, then arbitrary functions could be invoked. If an attacker can influence the portion of uninitialized memory that is contained in the pointer, this weakness could be leveraged to execute code or perform other attacks.\nDepending on memory layout, associated memory management behaviors, and product operation, the attacker might be able to influence the contents of the uninitialized pointer, thus gaining more fine-grained control of the memory location to be accessed."]]},{"type":"map","entries":[["id",825],["title","Expired Pointer Dereference"],["url","https://cwe.mitre.org/data/definitions/825.html"],["type","child"],["description","The product dereferences a pointer that contains a location for memory that was previously valid, but is no longer valid."],["extended_description","When a product releases memory, but it maintains a pointer to that memory, then the memory might be re-allocated at a later time. If the original pointer is accessed to read or write data, then this could cause the product to read or modify data that is in use by a different function or process. Depending on how the newly-allocated memory is used, this could lead to a denial of service, information exposure, or code execution."]]},{"type":"map","entries":[["id",265],["title","Privilege Issues"],["url","https://cwe.mitre.org/data/definitions/265.html"],["children",{"type":"map","entries":[["243",{"type":"map","entries":[["id",243],["title","Creation of chroot Jail Without Changing Working Directory"],["url","https://cwe.mitre.org/data/definitions/243.html"],["type","child"],["description","The product uses the chroot() system call to create a jail, but does not change the working directory afterward. This does not prevent access to files outside of the jail."],["extended_description","Improper use of chroot() may allow attackers to escape from the chroot jail. The chroot() function call does not change the process's current working directory, so relative paths may still refer to file system resources outside of the chroot jail after chroot() has been called."]]}],["250",{"type":"map","entries":[["id",250],["title","Execution with Unnecessary Privileges"],["url","https://cwe.mitre.org/data/definitions/250.html"],["type","child"],["description","The product performs an operation at a privilege level that is higher than the minimum level required, which creates new weaknesses or amplifies the consequences of other weaknesses."],["extended_description",null]]}],["266",{"type":"map","entries":[["id",266],["title","Incorrect Privilege Assignment"],["url","https://cwe.mitre.org/data/definitions/266.html"],["type","child"],["description","A product incorrectly assigns a privilege to a particular actor, creating an unintended sphere of control for that actor."],["extended_description",null]]}],["267",{"type":"map","entries":[["id",267],["title","Privilege Defined With Unsafe Actions"],["url","https://cwe.mitre.org/data/definitions/267.html"],["type","child"],["description","A particular privilege, role, capability, or right can be used to perform unsafe actions that were not intended, even when it is assigned to the correct entity."],["extended_description",null]]}],["268",{"type":"map","entries":[["id",268],["title","Privilege Chaining"],["url","https://cwe.mitre.org/data/definitions/268.html"],["type","child"],["description","Two distinct privileges, roles, capabilities, or rights can be combined in a way that allows an entity to perform unsafe actions that would not be allowed without that combination."],["extended_description",null]]}],["270",{"type":"map","entries":[["id",270],["title","Privilege Context Switching Error"],["url","https://cwe.mitre.org/data/definitions/270.html"],["type","child"],["description","The product does not properly manage privileges while it is switching between different contexts that have different privileges or spheres of control."],["extended_description",null]]}],["272",{"type":"map","entries":[["id",272],["title","Least Privilege Violation"],["url","https://cwe.mitre.org/data/definitions/272.html"],["type","child"],["description","The elevated privilege level required to perform operations such as chroot() should be dropped immediately after the operation is performed."],["extended_description",null]]}],["273",{"type":"map","entries":[["id",273],["title","Improper Check for Dropped Privileges"],["url","https://cwe.mitre.org/data/definitions/273.html"],["type","child"],["description","The product attempts to drop privileges but does not check or incorrectly checks to see if the drop succeeded."],["extended_description","If the drop fails, the product will continue to run with the raised privileges, which might provide additional access to unprivileged users."]]}],["274",{"type":"map","entries":[["id",274],["title","Improper Handling of Insufficient Privileges"],["url","https://cwe.mitre.org/data/definitions/274.html"],["type","child"],["description","The product does not handle or incorrectly handles when it has insufficient privileges to perform an operation, leading to resultant weaknesses."],["extended_description",null]]}],["280",{"type":"map","entries":[["id",280],["title","Improper Handling of Insufficient Permissions or Privileges"],["url","https://cwe.mitre.org/data/definitions/280.html"],["type","child"],["description","The product does not handle or incorrectly handles when it has insufficient privileges to access resources or functionality as specified by their permissions. This may cause it to follow unexpected code paths that may leave the product in an invalid state."],["extended_description",null]]}],["501",{"type":"map","entries":[["id",501],["title","Trust Boundary Violation"],["url","https://cwe.mitre.org/data/definitions/501.html"],["type","child"],["description","The product mixes trusted and untrusted data in the same data structure or structured message."],["extended_description","A trust boundary can be thought of as line drawn through a program. On one side of the line, data is untrusted. On the other side of the line, data is assumed to be trustworthy. The purpose of validation logic is to allow data to safely cross the trust boundary - to move from untrusted to trusted. A trust boundary violation occurs when a program blurs the line between what is trusted and what is untrusted. By combining trusted and untrusted data in the same data structure, it becomes easier for programmers to mistakenly trust unvalidated data."]]}],["580",{"type":"map","entries":[["id",580],["title","clone() Method Without super.clone()"],["url","https://cwe.mitre.org/data/definitions/580.html"],["type","child"],["description","The product contains a clone() method that does not call super.clone() to obtain the new object."],["extended_description","All implementations of clone() should obtain the new object by calling super.clone(). If a class does not follow this convention, a subclass's clone() method will return an object of the wrong type."]]}],["648",{"type":"map","entries":[["id",648],["title","Incorrect Use of Privileged APIs"],["url","https://cwe.mitre.org/data/definitions/648.html"],["type","child"],["description","The product does not conform to the API requirements for a function call that requires extra privileges. This could allow attackers to gain privileges by causing the function to be called incorrectly."],["extended_description","When a product contains certain functions that perform operations requiring an elevated level of privilege, the caller of a privileged API must be careful to:\n\nensure that assumptions made by the APIs are valid, such as validity of arguments\naccount for known weaknesses in the design/implementation of the API\ncall the API from a safe context\n\nIf the caller of the API does not follow these requirements, then it may allow a malicious user or process to elevate their privilege, hijack the process, or steal sensitive data.\nFor instance, it is important to know if privileged APIs do not shed their privileges before returning to the caller or if the privileged function might make certain assumptions about the data, context or state information passed to it by the caller. It is important to always know when and how privileged APIs can be called in order to ensure that their elevated level of privilege cannot be exploited."]]}]]}],["type","category"],["summary","Weaknesses in this category occur with improper handling, assignment, or management of privileges. A privilege is a property of an agent, such as a user. It lets the agent do things that are not ordinarily allowed. For example, there are privileges which allow an agent to perform maintenance functions such as restart a computer."]]},{"type":"map","entries":[["id",243],["title","Creation of chroot Jail Without Changing Working Directory"],["url","https://cwe.mitre.org/data/definitions/243.html"],["type","child"],["description","The product uses the chroot() system call to create a jail, but does not change the working directory afterward. This does not prevent access to files outside of the jail."],["extended_description","Improper use of chroot() may allow attackers to escape from the chroot jail. The chroot() function call does not change the process's current working directory, so relative paths may still refer to file system resources outside of the chroot jail after chroot() has been called."]]},{"type":"map","entries":[["id",250],["title","Execution with Unnecessary Privileges"],["url","https://cwe.mitre.org/data/definitions/250.html"],["type","child"],["description","The product performs an operation at a privilege level that is higher than the minimum level required, which creates new weaknesses or amplifies the consequences of other weaknesses."],["extended_description",null]]},{"type":"map","entries":[["id",266],["title","Incorrect Privilege Assignment"],["url","https://cwe.mitre.org/data/definitions/266.html"],["type","child"],["description","A product incorrectly assigns a privilege to a particular actor, creating an unintended sphere of control for that actor."],["extended_description",null]]},{"type":"map","entries":[["id",267],["title","Privilege Defined With Unsafe Actions"],["url","https://cwe.mitre.org/data/definitions/267.html"],["type","child"],["description","A particular privilege, role, capability, or right can be used to perform unsafe actions that were not intended, even when it is assigned to the correct entity."],["extended_description",null]]},{"type":"map","entries":[["id",268],["title","Privilege Chaining"],["url","https://cwe.mitre.org/data/definitions/268.html"],["type","child"],["description","Two distinct privileges, roles, capabilities, or rights can be combined in a way that allows an entity to perform unsafe actions that would not be allowed without that combination."],["extended_description",null]]},{"type":"map","entries":[["id",270],["title","Privilege Context Switching Error"],["url","https://cwe.mitre.org/data/definitions/270.html"],["type","child"],["description","The product does not properly manage privileges while it is switching between different contexts that have different privileges or spheres of control."],["extended_description",null]]},{"type":"map","entries":[["id",272],["title","Least Privilege Violation"],["url","https://cwe.mitre.org/data/definitions/272.html"],["type","child"],["description","The elevated privilege level required to perform operations such as chroot() should be dropped immediately after the operation is performed."],["extended_description",null]]},{"type":"map","entries":[["id",273],["title","Improper Check for Dropped Privileges"],["url","https://cwe.mitre.org/data/definitions/273.html"],["type","child"],["description","The product attempts to drop privileges but does not check or incorrectly checks to see if the drop succeeded."],["extended_description","If the drop fails, the product will continue to run with the raised privileges, which might provide additional access to unprivileged users."]]},{"type":"map","entries":[["id",274],["title","Improper Handling of Insufficient Privileges"],["url","https://cwe.mitre.org/data/definitions/274.html"],["type","child"],["description","The product does not handle or incorrectly handles when it has insufficient privileges to perform an operation, leading to resultant weaknesses."],["extended_description",null]]},{"type":"map","entries":[["id",501],["title","Trust Boundary Violation"],["url","https://cwe.mitre.org/data/definitions/501.html"],["type","child"],["description","The product mixes trusted and untrusted data in the same data structure or structured message."],["extended_description","A trust boundary can be thought of as line drawn through a program. On one side of the line, data is untrusted. On the other side of the line, data is assumed to be trustworthy. The purpose of validation logic is to allow data to safely cross the trust boundary - to move from untrusted to trusted. A trust boundary violation occurs when a program blurs the line between what is trusted and what is untrusted. By combining trusted and untrusted data in the same data structure, it becomes easier for programmers to mistakenly trust unvalidated data."]]},{"type":"map","entries":[["id",580],["title","clone() Method Without super.clone()"],["url","https://cwe.mitre.org/data/definitions/580.html"],["type","child"],["description","The product contains a clone() method that does not call super.clone() to obtain the new object."],["extended_description","All implementations of clone() should obtain the new object by calling super.clone(). If a class does not follow this convention, a subclass's clone() method will return an object of the wrong type."]]},{"type":"map","entries":[["id",648],["title","Incorrect Use of Privileged APIs"],["url","https://cwe.mitre.org/data/definitions/648.html"],["type","child"],["description","The product does not conform to the API requirements for a function call that requires extra privileges. This could allow attackers to gain privileges by causing the function to be called incorrectly."],["extended_description","When a product contains certain functions that perform operations requiring an elevated level of privilege, the caller of a privileged API must be careful to:\n\nensure that assumptions made by the APIs are valid, such as validity of arguments\naccount for known weaknesses in the design/implementation of the API\ncall the API from a safe context\n\nIf the caller of the API does not follow these requirements, then it may allow a malicious user or process to elevate their privilege, hijack the process, or steal sensitive data.\nFor instance, it is important to know if privileged APIs do not shed their privileges before returning to the caller or if the privileged function might make certain assumptions about the data, context or state information passed to it by the caller. It is important to always know when and how privileged APIs can be called in order to ensure that their elevated level of privilege cannot be exploited."]]},{"type":"map","entries":[["id",1213],["title","Random Number Issues"],["url","https://cwe.mitre.org/data/definitions/1213.html"],["children",{"type":"map","entries":[["331",{"type":"map","entries":[["id",331],["title","Insufficient Entropy"],["url","https://cwe.mitre.org/data/definitions/331.html"],["type","child"],["description","The product uses an algorithm or scheme that produces insufficient entropy, leaving patterns or clusters of values that are more likely to occur than others."],["extended_description",null]]}],["334",{"type":"map","entries":[["id",334],["title","Small Space of Random Values"],["url","https://cwe.mitre.org/data/definitions/334.html"],["type","child"],["description","The number of possible random values is smaller than needed by the product, making it more susceptible to brute force attacks."],["extended_description",null]]}],["335",{"type":"map","entries":[["id",335],["title","Incorrect Usage of Seeds in Pseudo-Random Number Generator (PRNG)"],["url","https://cwe.mitre.org/data/definitions/335.html"],["type","child"],["description","The product uses a Pseudo-Random Number Generator (PRNG) but does not correctly manage seeds."],["extended_description","PRNGs are deterministic and, while their output appears\n\t\t   random, they cannot actually create entropy. They rely on\n\t\t   cryptographically secure and unique seeds for entropy so\n\t\t   proper seeding is critical to the secure operation of the\n\t\t   PRNG.\n\n\t\t   Management of seeds could be broken down into two main areas:\n\t\t   \n\n\n\t\t   (1) protecting seeds as cryptographic material (such as a cryptographic key);\n\t\t\t \n\n\t\t   (2) whenever possible, using a uniquely generated seed from\n\t\t   a cryptographically secure source\n\t\t\t \n\n\n\t\t\t   PRNGs require a seed as input to generate a stream of\n\t\t\t   numbers that are functionally indistinguishable from\n\t\t\t   random numbers.  While the output is, in many cases,\n\t\t\t   sufficient for cryptographic uses, the output of any\n\t\t\t   PRNG is directly determined by the seed provided as\n\t\t\t   input. If the seed can be ascertained by a third party,\n\t\t\t   the entire output of the PRNG can be made known to\n\t\t\t   them. As such, the seed should be kept secret and\n\t\t\t   should ideally not be able to be guessed. For example,\n\t\t\t   the current time may be a poor seed. Knowing the\n\t\t\t   approximate time the PRNG was seeded greatly reduces\n\t\t\t   the possible key space.\n\t\t\t \n\n\t\t\t   Seeds do not necessarily need to be unique, but reusing seeds may open up attacks if the seed is discovered."]]}],["338",{"type":"map","entries":[["id",338],["title","Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"],["url","https://cwe.mitre.org/data/definitions/338.html"],["type","child"],["description","The product uses a Pseudo-Random Number Generator (PRNG) in a security context, but the PRNG's algorithm is not cryptographically strong."],["extended_description","When a non-cryptographic PRNG is used in a cryptographic context, it can expose the cryptography to certain types of attacks.\nOften a pseudo-random number generator (PRNG) is not designed for cryptography. Sometimes a mediocre source of randomness is sufficient or preferable for algorithms that use random numbers. Weak generators generally take less processing power and/or do not use the precious, finite, entropy sources on a system. While such PRNGs might have very useful features, these same features could be used to break the cryptography."]]}],["341",{"type":"map","entries":[["id",341],["title","Predictable from Observable State"],["url","https://cwe.mitre.org/data/definitions/341.html"],["type","child"],["description","A number or object is predictable based on observations that the attacker can make about the state of the system or network, such as time, process ID, etc."],["extended_description",null]]}],["342",{"type":"map","entries":[["id",342],["title","Predictable Exact Value from Previous Values"],["url","https://cwe.mitre.org/data/definitions/342.html"],["type","child"],["description","An exact value or random number can be precisely predicted by observing previous values."],["extended_description",null]]}],["343",{"type":"map","entries":[["id",343],["title","Predictable Value Range from Previous Values"],["url","https://cwe.mitre.org/data/definitions/343.html"],["type","child"],["description","The product's random number generator produces a series of values which, when observed, can be used to infer a relatively small range of possibilities for the next value that could be generated."],["extended_description","The output of a random number generator should not be predictable based on observations of previous values. In some cases, an attacker cannot predict the exact value that will be produced next, but can narrow down the possibilities significantly. This reduces the amount of effort to perform a brute force attack. For example, suppose the product generates random numbers between 1 and 100, but it always produces a larger value until it reaches 100. If the generator produces an 80, then the attacker knows that the next value will be somewhere between 81 and 100. Instead of 100 possibilities, the attacker only needs to consider 20."]]}],["344",{"type":"map","entries":[["id",344],["title","Use of Invariant Value in Dynamically Changing Context"],["url","https://cwe.mitre.org/data/definitions/344.html"],["type","child"],["description","The product uses a constant value, name, or reference, but this value can (or should) vary across different environments."],["extended_description",null]]}],["1241",{"type":"map","entries":[["id",1241],["title","Use of Predictable Algorithm in Random Number Generator"],["url","https://cwe.mitre.org/data/definitions/1241.html"],["type","child"],["description","The device uses an algorithm that is predictable and generates a pseudo-random number."],["extended_description","Pseudo-random number generator algorithms are predictable because their registers have a finite number of possible states, which eventually lead to repeating patterns. As a result, pseudo-random number generators (PRNGs) can compromise their randomness or expose their internal state to various attacks, such as reverse engineering or tampering."]]}]]}],["type","category"],["summary","Weaknesses in this category are related to a software system's random number generation."]]},{"type":"map","entries":[["id",341],["title","Predictable from Observable State"],["url","https://cwe.mitre.org/data/definitions/341.html"],["type","child"],["description","A number or object is predictable based on observations that the attacker can make about the state of the system or network, such as time, process ID, etc."],["extended_description",null]]},{"type":"map","entries":[["id",342],["title","Predictable Exact Value from Previous Values"],["url","https://cwe.mitre.org/data/definitions/342.html"],["type","child"],["description","An exact value or random number can be precisely predicted by observing previous values."],["extended_description",null]]},{"type":"map","entries":[["id",343],["title","Predictable Value Range from Previous Values"],["url","https://cwe.mitre.org/data/definitions/343.html"],["type","child"],["description","The product's random number generator produces a series of values which, when observed, can be used to infer a relatively small range of possibilities for the next value that could be generated."],["extended_description","The output of a random number generator should not be predictable based on observations of previous values. In some cases, an attacker cannot predict the exact value that will be produced next, but can narrow down the possibilities significantly. This reduces the amount of effort to perform a brute force attack. For example, suppose the product generates random numbers between 1 and 100, but it always produces a larger value until it reaches
